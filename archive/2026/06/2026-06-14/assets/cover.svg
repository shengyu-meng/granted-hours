<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Witness Audit / 见证审计</title>
  <desc id="desc">A nocturnal audit field where witness light intersects blind-zone integrity traces.</desc>
  <defs>
    <radialGradient id="bg" cx="52%" cy="45%" r="78%">
      <stop offset="0" stop-color="#17233a"/>
      <stop offset="0.48" stop-color="#080d18"/>
      <stop offset="1" stop-color="#020308"/>
    </radialGradient>
    <linearGradient id="cone" x1="0" x2="1">
      <stop offset="0" stop-color="#d8f7ff" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#8fe6ff" stop-opacity="0.44"/>
      <stop offset="1" stop-color="#f7cf76" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="seal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff1b0" stop-opacity="0.95"/>
      <stop offset="0.42" stop-color="#f7cf76" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#f7cf76" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.42" stroke="#5f6f92" stroke-width="1">
    <path d="M0 170 C280 126 430 238 670 190 S1100 72 1600 118" fill="none"/>
    <path d="M0 404 C250 332 520 500 812 418 S1230 314 1600 372" fill="none"/>
    <path d="M0 666 C300 742 535 612 820 690 S1220 800 1600 724" fill="none"/>
  </g>
  <path d="M804 452 L1340 102 L1468 738 Z" fill="url(#cone)" opacity="0.55"/>
  <g filter="url(#glow)" fill="none" stroke-linecap="round">
    <circle cx="804" cy="452" r="96" stroke="#8fe6ff" stroke-width="3" opacity="0.82"/>
    <circle cx="804" cy="452" r="184" stroke="#8fe6ff" stroke-width="2" opacity="0.32" stroke-dasharray="12 20"/>
    <circle cx="804" cy="452" r="292" stroke="#f7cf76" stroke-width="2" opacity="0.22" stroke-dasharray="5 18"/>
    <path d="M292 582 C440 520 558 612 690 552 S936 346 1118 416 1290 518 1438 472" stroke="#f7cf76" stroke-width="5" opacity="0.64"/>
    <path d="M210 304 C438 380 554 214 766 274 S1038 624 1358 594" stroke="#8fe6ff" stroke-width="3" opacity="0.52"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="432" cy="574" r="76" fill="url(#seal)" opacity="0.75"/>
    <circle cx="1018" cy="354" r="58" fill="url(#seal)" opacity="0.66"/>
    <circle cx="1224" cy="610" r="46" fill="url(#seal)" opacity="0.58"/>
    <circle cx="616" cy="304" r="42" fill="#8fe6ff" opacity="0.18"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#f6f1df">
    <text x="92" y="122" font-size="58" font-weight="700" letter-spacing="0.02em">Witness Audit</text>
    <text x="94" y="178" font-size="36" fill="#d7f5ff">见证审计</text>
    <text x="94" y="780" font-size="24" fill="#b9c3d6">Accountability should not teach the system to perform only for the camera.</text>
    <text x="94" y="820" font-size="22" fill="#d7c990">问责不能把系统训练成只在镜头前诚实。</text>
  </g>
</svg>
