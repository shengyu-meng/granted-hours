<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Darkness Receipt / 黑暗收据</title>
  <desc id="desc">A sealed dark vault surrounded by receipt slips, audit halos, and unopened envelopes.</desc>
  <defs>
    <radialGradient id="bg" cx="54%" cy="48%" r="76%">
      <stop offset="0" stop-color="#17233a"/>
      <stop offset="0.46" stop-color="#070a13"/>
      <stop offset="1" stop-color="#020309"/>
    </radialGradient>
    <radialGradient id="vault" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.64" stop-color="#02030a"/>
      <stop offset="0.82" stop-color="#1d1720"/>
      <stop offset="1" stop-color="#ffd78a" stop-opacity="0.18"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.22" stroke="#8ad8ff" stroke-width="1">
    <path d="M80 730 L520 130"/><path d="M220 820 L1090 70"/><path d="M980 860 L1490 180"/>
    <path d="M120 160 L1500 610"/><path d="M0 470 L1600 330"/>
  </g>
  <g transform="translate(865 462)" filter="url(#glow)">
