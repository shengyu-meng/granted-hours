    <text x="305" y="351" fill="#ee6a5f" opacity=".55">gloss</text>
    <line x1="270" y1="357" x2="340" y2="342" stroke="#f4efe6" opacity=".55"/>
    <text x="1218" y="292" fill="#e9b85e" opacity=".50">myth</text>
