<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Truth Without Ornament</title>
  <desc id="desc">A fading ornamental field surrounds a plain verified claim.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090d"/>
      <stop offset=".48" stop-color="#11131a"/>
      <stop offset="1" stop-color="#171006"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="51%" r="52%">
      <stop offset="0" stop-color="#f4efe6" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#6aa8e8" stop-opacity=".08"/>
      <stop offset="1" stop-color="#07090d" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g opacity=".13" stroke="#f4efe6" stroke-width="1">
