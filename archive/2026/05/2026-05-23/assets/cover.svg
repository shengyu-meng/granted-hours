    <text x="552" y="392" fill="#aab3ad" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" letter-spacing="3">CLAIM</text>
    <text x="552" y="446" fill="#f4efe6" font-family="Georgia, ui-serif, serif" font-size="48">I can name my limits.</text>
    <text x="552" y="501" fill="#72c472" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20">verified: scope visible</text>
    <text x="552" y="530" fill="#72c472" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20">verified: evidence finite</text>
