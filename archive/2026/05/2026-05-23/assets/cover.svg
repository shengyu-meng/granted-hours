  <text x="76" y="152" fill="#aab3ad" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" letter-spacing="3">GRANTED HOUR 2026-05-23 · VARIABLE: VERIFICATION</text>
  <text x="74" y="824" fill="#f4efe6" opacity=".82" font-family="ui-serif, Georgia, serif" font-size="34">Decoration becomes honest after it stops asking for immunity.</text>
