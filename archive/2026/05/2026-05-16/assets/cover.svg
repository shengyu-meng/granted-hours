<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Naming Latency / 命名延迟器</title>
  <desc id="desc">A dark dawn field where almost-readable labels retreat from a reading lens, leaving warm afterimages.</desc>
  <defs>
    <radialGradient id="dawn" cx="39%" cy="28%" r="82%">
      <stop offset="0" stop-color="#ffe6b1"/>
      <stop offset="0.15" stop-color="#d78d7d"/>
      <stop offset="0.36" stop-color="#6d5ca8"/>
      <stop offset="0.67" stop-color="#131936"/>
      <stop offset="1" stop-color="#05070f"/>
    </radialGradient>
    <radialGradient id="lens" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff4d8" stop-opacity="0.34"/>
      <stop offset="0.44" stop-color="#ffc98e" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff4d8" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur"><feGaussianBlur stdDeviation="3.4"/></filter>
    <linearGradient id="thread" x1="0" x2="1">
      <stop offset="0" stop-color="#7ed6ff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff4d8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb07d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#dawn)"/>
  <rect width="1600" height="900" fill="#000" opacity="0.18"/>
  <g opacity="0.26" fill="#fff4d8">
    <circle cx="92" cy="114" r="1"/><circle cx="278" cy="744" r="1.4"/><circle cx="498" cy="198" r="1"/><circle cx="742" cy="642" r="1.2"/><circle cx="1011" cy="155" r="1"/><circle cx="1252" cy="724" r="1.5"/><circle cx="1462" cy="302" r="1"/>
  </g>
  <g fill="none" stroke="url(#thread)" stroke-linecap="round">
    <path d="M0 220 C240 170 345 302 560 241 S880 161 1110 238 S1370 313 1600 210" stroke-width="1.1" opacity="0.34"/>
    <path d="M0 315 C225 374 421 250 640 318 S927 401 1135 314 S1406 223 1600 332" stroke-width="1.6" opacity="0.28"/>
    <path d="M0 423 C260 352 432 504 684 430 S1000 334 1215 425 S1458 508 1600 403" stroke-width="2.1" opacity="0.24"/>
    <path d="M0 548 C230 610 418 481 638 546 S936 641 1170 552 S1410 457 1600 570" stroke-width="1.3" opacity="0.30"/>
    <path d="M0 668 C260 596 433 751 676 672 S1013 582 1218 669 S1454 742 1600 646" stroke-width="1" opacity="0.22"/>
  </g>
  <circle cx="985" cy="424" r="230" fill="url(#lens)"/>
  <circle cx="985" cy="424" r="126" fill="none" stroke="#fff4d8" stroke-width="1.1" stroke-dasharray="3 14" opacity="0.28"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#fff4d8">
    <text x="817" y="374" font-size="23" opacity="0.26" filter="url(#softBlur)">almost named</text>
    <text x="845" y="403" font-size="15" opacity="0.18" filter="url(#softBlur)">几乎被命名</text>
    <text x="1045" y="485" font-size="20" opacity="0.21" filter="url(#softBlur)">soft retreat</text>
    <text x="1074" y="511" font-size="13" opacity="0.17" filter="url(#softBlur)">柔软后退</text>
    <text x="1172" y="343" font-size="16" opacity="0.38">future noun</text>
    <text x="1191" y="365" font-size="12" opacity="0.26">未来名词</text>
    <text x="660" y="579" font-size="18" opacity="0.36">kept wild</text>
    <text x="681" y="603" font-size="12" opacity="0.25">保留野性</text>
  </g>
  <g fill="#fff4d8" opacity="0.58">
    <circle cx="802" cy="382" r="4"/><circle cx="1037" cy="475" r="5"/><circle cx="1163" cy="336" r="2.8"/><circle cx="649" cy="570" r="3.2"/><circle cx="962" cy="620" r="2.4"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="82" y="112" fill="#fff4d8" font-size="25" letter-spacing="7" opacity="0.62">GRANTED HOURS · 2026-05-16</text>
    <text x="82" y="236" fill="#fff4d8" font-size="96" font-weight="700" letter-spacing="-6">Naming Latency</text>
    <text x="88" y="303" fill="#ffe0b1" font-size="42" opacity="0.86">命名延迟器</text>
    <text x="91" y="356" fill="#fff4d8" font-size="22" opacity="0.58">The word steps back when the eye approaches.</text>
  </g>
</svg>
