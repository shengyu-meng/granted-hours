    <text x="100" y="616" fill="#ece7dc" fill-opacity=".78" font-size="26">The opposite of certainty is not paralysis.</text>
    <text x="100" y="654" fill="#ece7dc" fill-opacity=".68" font-size="22">It is a smaller step, a visible tether, and a path back.</text>

    <text x="1098" y="720" fill="#f0b35a" font-size="24">intent 0.61</text>
    <text x="1098" y="760" fill="#ed7a85" font-size="24">doubt 0.38</text>
