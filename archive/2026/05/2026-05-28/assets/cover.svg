<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Doubt That Still Acts</title>
  <desc id="desc">A geometric poster about reversible action under uncertainty.</desc>
  <defs>
