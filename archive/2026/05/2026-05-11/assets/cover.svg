<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <radialGradient id="g0" cx="30%" cy="25%" r="75%">
      <stop offset="0" stop-color="#2a2f68" stop-opacity="0.92"/>
      <stop offset="0.46" stop-color="#111827" stop-opacity="1"/>
      <stop offset="1" stop-color="#070911" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="g1" cx="72%" cy="48%" r="42%">
      <stop offset="0" stop-color="#e8d0a4" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#586dff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.16"/></feComponentTransfer>
    </filter>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8fc8ff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#e8d0a4" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#a879ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#g0)"/>
  <rect width="1600" height="900" fill="url(#g1)"/>
  <g opacity="0.42" filter="url(#blur)">
    <circle cx="1170" cy="420" r="210" fill="#e8d0a4" opacity="0.22"/>
    <circle cx="850" cy="260" r="160" fill="#586dff" opacity="0.20"/>
    <circle cx="1330" cy="650" r="180" fill="#ff7b5c" opacity="0.13"/>
  </g>
  <g fill="none" stroke="url(#line)" stroke-width="2" opacity="0.52">
    <path d="M-40 218 C 190 170, 310 330, 520 244 S 910 110, 1120 220 1430 360, 1660 215"/>
    <path d="M-50 388 C 160 440, 330 270, 550 360 S 900 530, 1130 390 1410 275, 1660 430" opacity="0.64"/>
    <path d="M-20 585 C 220 485, 345 660, 590 570 S 920 430, 1160 560 1410 718, 1630 600" opacity="0.50"/>
    <path d="M-40 720 C 170 760, 330 650, 550 705 S 880 810, 1100 708 1400 625, 1640 760" opacity="0.32"/>
  </g>
  <g transform="translate(825 170)">
    <rect x="0" y="0" width="610" height="560" rx="34" fill="#080b14" opacity="0.58" stroke="#e8d0a4" stroke-opacity="0.25"/>
    <rect x="18" y="18" width="574" height="524" rx="24" fill="none" stroke="#e8d0a4" stroke-opacity="0.18"/>
    <text x="48" y="80" fill="#e8d0a4" font-family="Georgia, 'Songti SC', serif" font-size="26" letter-spacing="4">ECHO ARCHIVE</text>
    <g font-family="Georgia, 'Songti SC', serif" font-size="25" fill="#f5ead7">
      <text x="54" y="155">不是所有回声都来自过去。</text>
      <text x="54" y="230" opacity="0.86">一个念头回来时，带着别人的天气。</text>
      <text x="54" y="305" opacity="0.74">沉默也会折返，只是音量很低。</text>
      <text x="54" y="380" opacity="0.62">未来把旧句子重新标点。</text>
      <text x="54" y="455" opacity="0.50">白夜里，影子比阳光更会记事。</text>
    </g>
    <g stroke="#8fc8ff" stroke-opacity="0.24">
      <line x1="45" y1="178" x2="560" y2="178"/>
      <line x1="45" y1="253" x2="560" y2="253"/>
      <line x1="45" y1="328" x2="560" y2="328"/>
      <line x1="45" y1="403" x2="560" y2="403"/>
    </g>
  </g>
  <g font-family="Georgia, 'Songti SC', serif">
    <text x="92" y="148" fill="#f5ead7" font-size="52" letter-spacing="3">白夜回声档案盒</text>
    <text x="96" y="202" fill="#c7d8ff" font-size="22" opacity="0.78">Echo is not repetition. It is the past tuned by the future.</text>
    <text x="96" y="785" fill="#e8d0a4" font-size="30">回声不是复制；回声是时间对一句话的二次创作。</text>
  </g>
  <g fill="#e8d0a4" opacity="0.55" font-family="Georgia, serif" font-size="18">
    <text x="270" y="315">回</text><text x="398" y="412">声</text><text x="526" y="284">future</text><text x="660" y="606">delay</text><text x="196" y="612">mirror</text><text x="720" y="170">threshold</text>
  </g>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.42"/>
</svg>
