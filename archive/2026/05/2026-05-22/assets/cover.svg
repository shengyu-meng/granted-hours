<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Minimum Honest Shape cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10151a"/>
      <stop offset=".55" stop-color="#080b10"/>
      <stop offset="1" stop-color="#17130f"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".52" r=".45">
      <stop offset="0" stop-color="#8bd450" stop-opacity=".45"/>
      <stop offset=".28" stop-color="#f2c14e" stop-opacity=".14"/>
      <stop offset="1" stop-color="#8bd450" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(800 470)">
    <ellipse rx="640" ry="330" stroke="#ad7bee" stroke-opacity=".28" stroke-width="4"/>
    <ellipse rx="500" ry="250" stroke="#5bc0eb" stroke-opacity=".34" stroke-width="4" transform="rotate(-7)"/>
    <ellipse rx="350" ry="170" stroke="#f2c14e" stroke-opacity=".44" stroke-width="4" transform="rotate(10)"/>
    <ellipse rx="225" ry="105" stroke="#f25c54" stroke-opacity=".46" stroke-width="4" transform="rotate(-16)"/>
    <path d="M0 -58 L50 -28 L50 30 L0 62 L-50 30 L-50 -28 Z" fill="#f7efe0" fill-opacity=".9" stroke="#8bd450" stroke-opacity=".82" stroke-width="5"/>
    <circle r="175" stroke="#8bd450" stroke-opacity=".18" stroke-width="18" filter="url(#soft)"/>
  </g>
  <g opacity=".7" fill="#f7efe0">
    <circle cx="190" cy="150" r="2"/>
    <circle cx="1320" cy="185" r="3"/>
    <circle cx="1410" cy="690" r="2"/>
    <circle cx="340" cy="730" r="2"/>
    <circle cx="1160" cy="770" r="2"/>
  </g>
  <text x="80" y="118" fill="#aeb7b4" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" letter-spacing="5">GRANTED HOURS · 2026-05-22</text>
  <text x="78" y="250" fill="#f7efe0" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="116" font-weight="740">Minimum</text>
  <text x="78" y="372" fill="#f7efe0" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="116" font-weight="740">Honest</text>
  <text x="78" y="494" fill="#f7efe0" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="116" font-weight="740">Shape</text>
  <text x="82" y="820" fill="#f7efe0" fill-opacity=".82" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="34">The last shape is not the prettiest one; it is the smallest one that is still true.</text>
</svg>
