<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">White Night Critical Rain Gauge</title>
  <desc id="desc">A dark field of rain, threshold contours, and luminous event blooms.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="70%">
      <stop offset="0%" stop-color="#14264c"/>
      <stop offset="54%" stop-color="#090d1b"/>
      <stop offset="100%" stop-color="#05060d"/>
    </radialGradient>
    <linearGradient id="rain" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#5bd6ff" stop-opacity="0.05"/>
      <stop offset="0.55" stop-color="#d7ff7a" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#ff4f8b" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.28" stroke="#83d9ff" stroke-width="1">
    <path d="M54 138 C260 88 420 196 620 130 S980 70 1240 150 1450 188 1550 126" fill="none"/>
    <path d="M110 392 C330 318 464 442 678 365 S1110 276 1452 388" fill="none"/>
    <path d="M82 660 C256 716 414 582 646 642 S1004 742 1512 614" fill="none"/>
  </g>
  <g stroke="url(#rain)" stroke-linecap="round">
    <path d="M180 30 L150 210" stroke-width="3" opacity="0.62"/>
    <path d="M292 0 L246 246" stroke-width="2" opacity="0.48"/>
    <path d="M464 50 L430 300" stroke-width="4" opacity="0.55"/>
    <path d="M702 0 L642 325" stroke-width="2" opacity="0.42"/>
    <path d="M922 80 L870 370" stroke-width="3" opacity="0.58"/>
    <path d="M1180 20 L1136 288" stroke-width="5" opacity="0.5"/>
    <path d="M1416 74 L1358 402" stroke-width="2" opacity="0.46"/>
  </g>
  <g filter="url(#glow)" fill="none">
    <ellipse cx="510" cy="530" rx="135" ry="78" stroke="#d7ff7a" stroke-width="5" opacity="0.75"/>
    <ellipse cx="510" cy="530" rx="210" ry="122" stroke="#5bd6ff" stroke-width="2" opacity="0.45"/>
    <ellipse cx="1030" cy="390" rx="175" ry="94" stroke="#ffb04f" stroke-width="5" opacity="0.72"/>
    <ellipse cx="1030" cy="390" rx="265" ry="151" stroke="#ff4f8b" stroke-width="2" opacity="0.43"/>
  </g>
  <g fill="#eef8ff" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="70" y="96" font-size="22" letter-spacing="8" fill="#93d7ff" opacity="0.72">GRANTED HOUR · VARIABLE 07</text>
    <text x="70" y="172" font-size="78" font-weight="700">Critical Rain Gauge</text>
    <text x="73" y="224" font-size="40" fill="#dbeeff" opacity="0.86">白夜临界雨量计</text>
    <text x="73" y="810" font-size="28" fill="#dbeeff" opacity="0.78">A threshold is the instant background noise earns a new name: event.</text>
  </g>
</svg>
