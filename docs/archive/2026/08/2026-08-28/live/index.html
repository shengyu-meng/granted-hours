<body>
<canvas id="field" aria-label="A gold pivot that steps aside when a presence enters the middle, leaving a passable vacant center"></canvas>
<div class="caption">
  <h1>让路的中心 <span lang="en">/ The Center That Yields</span></h1>
  <p>中心会让开。房间仍绕着它转。</p>
  <p lang="en">The center yields. The room still turns around it.</p>
</div>
<div class="hint">DRAG / TOUCH — enter the middle<br>SPACE — return to waiting</div>
<button id="sound" type="button" aria-pressed="true">SOUND ON</button>
<audio id="bgm" loop autoplay preload="auto"><source src="2026-08-28-the-center-that-yields-bgm.mp3" type="audio/mpeg"></audio>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const visual = params.get('preview') === 'visual';
  const embed = params.get('embed') === 'calendar';
  if (visual) document.body.classList.add('visual');
  if (embed) document.body.classList.add('embed');
  const canvas = document.querySelector('#field');
  const ctx = canvas.getContext('2d', {alpha: false});
  const bgm = document.querySelector('#bgm');
  const sound = document.querySelector('#sound');
  let w = 0, h = 0, dpr = 1, t0 = performance.now();
  let held = false, audioWanted = true;
  const home = {x: 0.5, y: 0.48};
  const rest = {x: 0.22, y: 0.74};
  let px = rest.x, py = rest.y, pvx = 0, pvy = 0;
  let cx = home.x, cy = home.y;
  const motes = Array.from({length: 150}, (_, i) => ({
    a: ((i * 37) % 360) * Math.PI / 180,
    r: 0.08 + ((i * 17) % 83) / 120,
    p: i * 0.37,
    s: 0.16 + (i % 6) * 0.05,
    kind: i % 6 === 0 ? 'gold' : (i % 4 === 0 ? 'bone' : 'cyan')
  }));
  const resize = () => {
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth;
    h = innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  addEventListener('resize', resize);
  resize();
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const ease = (t) => t * t * (3 - 2 * t);
  const minSide = () => Math.min(w, h);
  function pointer(e) {
    const r = canvas.getBoundingClientRect();
    return {
      x: clamp((e.clientX - r.left) / w, 0.08, 0.92),
      y: clamp((e.clientY - r.top) / h, 0.1, 0.88)
    };
  }
  function yieldTarget(pres) {
    const dx = pres.x - home.x;
    const dy = pres.y - home.y;
    const dist = Math.hypot(dx, dy);
    const yieldR = 0.23;
    if (dist >= yieldR) return {x: home.x, y: home.y, amount: 0};
    const amount = ease(1 - dist / yieldR);
    let tx, ty;
    if (dist < 0.003) {
      tx = 0.72;
      ty = -0.48;
    } else {
      tx = -dy;
      ty = dx;
      const n = Math.hypot(tx, ty) || 1;
      tx /= n;
      ty /= n;
      if (tx * 0.28 + ty < 0) {
        tx = -tx;
        ty = -ty;
      }
    }
    const slide = 0.155 * amount;
    return {x: home.x + tx * slide, y: home.y + ty * slide, amount};
  }
  canvas.addEventListener('pointerdown', (e) => {
    held = true;
    canvas.classList.add('is-held');
    canvas.setPointerCapture?.(e.pointerId);
    const p = pointer(e);
    px = p.x;
    py = p.y;
    pvx = 0;
    pvy = 0;
    requestSound();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!held) return;
    const p = pointer(e);
    px = p.x;
    py = p.y;
  });
  const release = () => {
    held = false;
    canvas.classList.remove('is-held');
  };
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      held = false;
      canvas.classList.remove('is-held');
      px = rest.x;
      py = rest.y;
      pvx = 0;
      pvy = 0;
      requestSound();
    }
  });
  function setSound(on) {
    sound.setAttribute('aria-pressed', String(on));
    sound.textContent = on ? 'SOUND ON' : (audioWanted ? 'SOUND ON' : 'SOUND OFF');
  }
  function requestSound() {
    if (!audioWanted) return;
    bgm.play().then(() => setSound(true)).catch(() => setSound(false));
  }
  sound.addEventListener('click', () => {
    if (audioWanted && !bgm.paused) {
      audioWanted = false;
      bgm.pause();
      setSound(false);
    } else {
      audioWanted = true;
      requestSound();
    }
  });
  bgm.addEventListener('playing', () => setSound(true));
  bgm.addEventListener('pause', () => { if (audioWanted) setSound(false); });
  requestSound();
  function visualPresence(now) {
    const q = ((now - t0) / 4000) % 1;
    if (q < 0.62) {
      const u = ease(q / 0.62);
      return {
        x: rest.x + (home.x - rest.x) * u,
        y: rest.y + (home.y - rest.y) * u
      };
    }
    const u = ease((q - 0.62) / 0.38);
    return {
      x: home.x + (rest.x - home.x) * u,
      y: home.y + (rest.y - home.y) * u
    };
  }
  function drawBed() {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#05070c');
    g.addColorStop(0.42, '#0a1219');
    g.addColorStop(0.72, '#101820');
    g.addColorStop(1, '#06080d');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    const veil = ctx.createRadialGradient(home.x * w, home.y * h, 16, home.x * w, home.y * h, minSide() * 0.72);
    veil.addColorStop(0, 'rgba(18,36,44,0.28)');
    veil.addColorStop(1, 'rgba(4,6,10,0.78)');
    ctx.fillStyle = veil;
    ctx.fillRect(0, 0, w, h);
  }
  function drawHall(t, pivot) {
    const hx = home.x * w;
    const hy = home.y * h;
    const px_ = pivot.x * w;
    const py_ = pivot.y * h;
    const R = minSide() * 0.38;
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(t * 0.015);
    for (let i = 0; i < 36; i++) {
      const a = (i / 36) * Math.PI * 2;
      const tall = i % 6 === 0;
      ctx.strokeStyle = `rgba(142,197,207,${tall ? 0.16 : 0.055})`;
      ctx.lineWidth = tall ? 1.15 : 0.7;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * R * 0.18, Math.sin(a) * R * 0.18);
      ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R);
      ctx.stroke();
    }
    ctx.restore();
    ctx.strokeStyle = 'rgba(142,197,207,0.16)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(hx, hy, R, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(214,205,186,0.12)';
    ctx.beginPath();
    ctx.arc(hx, hy, R * 0.62, 0, Math.PI * 2);
    ctx.stroke();
    const breath = 0.55 + Math.sin(t * 1.15) * 0.18;
    ctx.strokeStyle = `rgba(142,197,207,${0.08 + breath * 0.08})`;
    ctx.beginPath();
    ctx.arc(hx, hy, R * (0.34 + breath * 0.02), 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = `rgba(236,228,210,${0.22 + pivot.amount * 0.28})`;
    ctx.lineWidth = 1.35;
    ctx.beginPath();
    ctx.arc(hx, hy, minSide() * 0.046, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = `rgba(142,197,207,${0.1 + pivot.amount * 0.16})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(hx, hy, minSide() * 0.028, 0, Math.PI * 2);
    ctx.stroke();
    if (pivot.amount > 0.04) {
      const g = ctx.createLinearGradient(hx, hy, px_, py_);
      g.addColorStop(0, `rgba(230,205,154,${0.08 + pivot.amount * 0.22})`);
      g.addColorStop(1, `rgba(230,205,154,${0.28 + pivot.amount * 0.35})`);
      ctx.strokeStyle = g;
      ctx.lineWidth = 1.1;
      ctx.setLineDash([3, 7]);
      ctx.beginPath();
      ctx.moveTo(hx, hy);
      ctx.lineTo(px_, py_);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  function drawPivot(pivot, t) {
    const r = minSide() * 0.054;
    const x = pivot.x * w;
    const y = pivot.y * h;
    const lift = pivot.amount;
    ctx.fillStyle = 'rgba(8,10,14,0.3)';
    ctx.beginPath();
    ctx.arc(x + 5, y + 8, r * 1.05, 0, Math.PI * 2);
    ctx.fill();
    const glass = ctx.createRadialGradient(x - r * 0.28, y - r * 0.32, r * 0.08, x, y, r);
    glass.addColorStop(0, 'rgba(236,228,210,0.28)');
    glass.addColorStop(0.46, 'rgba(214,205,186,0.14)');
    glass.addColorStop(1, 'rgba(168,156,140,0.08)');
    ctx.fillStyle = glass;
    ctx.strokeStyle = `rgba(230,205,154,${0.38 + lift * 0.34})`;
    ctx.lineWidth = 1.25;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = `rgba(239,232,216,${0.16 + lift * 0.18})`;
    ctx.beginPath();
    ctx.arc(x, y, r * 0.58, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = `rgba(230,205,154,${0.34 + lift * 0.28 + Math.sin(t * 1.6) * 0.06})`;
    ctx.beginPath();
    ctx.arc(x, y - r * 0.06, r * 0.11, 0, Math.PI * 2);
    ctx.fill();
  }
  function drawPresence(x, y, amount, t) {
    const r = minSide() * 0.017;
    const px_ = x * w;
    const py_ = y * h;
    const halo = ctx.createRadialGradient(px_, py_, 1, px_, py_, r * 7);
    halo.addColorStop(0, `rgba(196,214,214,${0.22 + amount * 0.16})`);
    halo.addColorStop(0.45, `rgba(142,197,207,${0.1 + amount * 0.08})`);
    halo.addColorStop(1, 'rgba(142,197,207,0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(px_, py_, r * 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgba(239,232,216,${0.78 + Math.sin(t * 2.2) * 0.08})`;
    ctx.beginPath();
    ctx.arc(px_, py_, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(142,197,207,0.45)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(px_, py_, r * 1.55, 0, Math.PI * 2);
    ctx.stroke();
  }
  function draw(now) {
    const t = (now - t0) / 1000;
    drawBed();
    motes.forEach((m) => {
      const spin = t * 0.05 + m.p;
      const x = home.x * w + Math.cos(m.a + spin) * m.r * minSide();
      const y = home.y * h + Math.sin(m.a + spin * 0.86) * m.r * minSide() * 0.72;
      const a = m.kind === 'gold' ? 0.055 : (m.kind === 'bone' ? 0.04 : 0.048);
      ctx.fillStyle = m.kind === 'gold'
        ? `rgba(230,205,154,${a})`
        : m.kind === 'bone'
          ? `rgba(214,205,186,${a})`
          : `rgba(142,197,207,${a})`;
      ctx.beginPath();
      ctx.arc(x, y, m.s, 0, Math.PI * 2);
      ctx.fill();
    });
    let pres;
    if (visual) {
      pres = visualPresence(now);
    } else {
      if (!held) {
        pvx += (rest.x - px) * 0.018;
        pvy += (rest.y - py) * 0.018;
        pvx *= 0.88;
        pvy *= 0.88;
        px = clamp(px + pvx, 0.1, 0.9);
        py = clamp(py + pvy, 0.12, 0.86);
      }
      pres = {x: px, y: py};
    }
    const target = yieldTarget(pres);
    cx += (target.x - cx) * 0.12;
    cy += (target.y - cy) * 0.12;
    const pivot = {x: cx, y: cy, amount: target.amount};
    drawHall(t, pivot);
    drawPivot(pivot, t);
    drawPresence(pres.x, pres.y, pivot.amount, t);
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
