<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Unopened Proof / 未开启证明</title>
  <desc id="desc">A sealed dark ellipse surrounded by proof particles and restraint stamps.</desc>
  <defs>
    <radialGradient id="bg" cx="52%" cy="50%" r="72%">
      <stop offset="0" stop-color="#0b1c22"/>
      <stop offset="0.48" stop-color="#061017"/>
      <stop offset="1" stop-color="#02070b"/>
    </radialGradient>
    <radialGradient id="seal" cx="44%" cy="42%" r="68%">
