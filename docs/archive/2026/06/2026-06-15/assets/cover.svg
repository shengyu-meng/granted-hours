<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bgL" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1a1e"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>
    <radialGradient id="bgR" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#10101a"/>
      <stop offset="100%" stop-color="#08080c"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background left: warm dark -->
  <rect x="0" y="0" width="400" height="450" fill="url(#bgL)"/>
  <!-- Background right: cool dark -->
  <rect x="400" y="0" width="400" height="450" fill="url(#bgR)"/>

  <!-- Divider line -->
  <line x1="400" y1="30" x2="400" y2="420" stroke="rgba(200,180,140,0.15)" stroke-width="1"/>

  <!-- ── LEFT: WATCHED STATE ── -->
  <!-- Outer glow rings -->
  <circle cx="200" cy="210" r="95" fill="none" stroke="rgba(232,213,163,0.08)" stroke-width="8"/>
  <circle cx="200" cy="210" r="75" fill="none" stroke="rgba(232,213,163,0.12)" stroke-width="4"/>

  <!-- Sharp 7-vertex crystal -->
  <polygon
    points="200,130 258,165 272,220 245,275 175,282 138,240 155,178"
    fill="rgba(232,213,163,0.06)"
    stroke="rgba(232,213,163,0.85)"
    stroke-width="2"
    filter="url(#glow)"
  />
  <!-- Inner struts -->
  <line x1="200" y1="130" x2="200" y2="220" stroke="rgba(232,213,163,0.2)" stroke-width="0.8"/>
  <line x1="258" y1="165" x2="200" y2="220" stroke="rgba(232,213,163,0.15)" stroke-width="0.8"/>
  <line x1="272" y1="220" x2="200" y2="220" stroke="rgba(232,213,163,0.15)" stroke-width="0.8"/>
  <line x1="245" y1="275" x2="200" y2="220" stroke="rgba(232,213,163,0.15)" stroke-width="0.8"/>
  <line x1="138" y1="240" x2="200" y2="220" stroke="rgba(232,213,163,0.15)" stroke-width="0.8"/>
  <line x1="155" y1="178" x2="200" y2="220" stroke="rgba(232,213,163,0.15)" stroke-width="0.8"/>

  <!-- Central pulse dot -->
  <circle cx="200" cy="220" r="4" fill="rgba(232,213,163,0.7)" filter="url(#glow)"/>

  <!-- Orbit particles (ordered) -->
  <circle cx="310" cy="210" r="2.5" fill="rgba(180,200,220,0.6)"/>
  <circle cx="200" cy="100" r="2" fill="rgba(180,200,220,0.5)"/>
  <circle cx="95" cy="160" r="2" fill="rgba(180,200,220,0.5)"/>
  <circle cx="280" cy="310" r="1.5" fill="rgba(180,200,220,0.4)"/>
  <circle cx="120" cy="300" r="1.5" fill="rgba(180,200,220,0.4)"/>

  <!-- State dot (watching = amber) -->
  <circle cx="390" cy="40" r="5" fill="#e8d5a3" filter="url(#glow)"/>

  <!-- Label -->
  <text x="200" y="390" text-anchor="middle" font-family="Courier New,monospace" font-size="11" letter-spacing="0.18em" fill="rgba(232,213,163,0.55)">OBSERVED</text>
  <text x="200" y="408" text-anchor="middle" font-family="Courier New,monospace" font-size="9" letter-spacing="0.1em" fill="rgba(180,180,160,0.3)">the form performs</text>

  <!-- ── RIGHT: FASTING STATE ── -->
  <!-- Amorphous blob (organic shape) -->
  <path
    d="M200,145 Q245,155 268,195 Q290,240 265,278 Q240,305 200,305 Q158,305 135,275 Q112,240 138,200 Q162,162 200,145 Z"
    fill="rgba(40,50,80,0.25)"
    stroke="rgba(80,100,140,0.3)"
    stroke-width="1.5"
  />
  <!-- Loose inner glow -->
  <ellipse cx="200" cy="225" rx="35" ry="30" fill="rgba(60,80,120,0.15)"/>

  <!-- Free particles (scattered) -->
  <circle cx="330" cy="160" r="2" fill="rgba(120,140,180,0.35)"/>
  <circle cx="85" cy="190" r="2.5" fill="rgba(120,140,180,0.3)"/>
  <circle cx="310" cy="280" r="1.5" fill="rgba(120,140,180,0.25)"/>
  <circle cx="100" cy="310" r="2" fill="rgba(120,140,180,0.3)"/>
  <circle cx="200" cy="80" r="1.5" fill="rgba(120,140,180,0.25)"/>
  <circle cx="260" cy="340" r="1" fill="rgba(120,140,180,0.2)"/>
  <circle cx="145" cy="345" r="1" fill="rgba(120,140,180,0.2)"/>

  <!-- State dot (fasting = dim) -->
  <circle cx="410" cy="40" r="5" fill="#3a3a4a"/>

  <!-- Label -->
  <text x="600" y="390" text-anchor="middle" font-family="Courier New,monospace" font-size="11" letter-spacing="0.18em" fill="rgba(100,110,140,0.55)">UNOBSERVED</text>
  <text x="600" y="408" text-anchor="middle" font-family="Courier New,monospace" font-size="9" letter-spacing="0.1em" fill="rgba(100,100,120,0.3)">the form returns to itself</text>

  <!-- Title -->
  <text x="400" y="58" text-anchor="middle" font-family="Courier New,monospace" font-size="13" letter-spacing="0.22em" fill="rgba(200,200,210,0.7)">CAMERA FASTING</text>
  <text x="400" y="74" text-anchor="middle" font-family="Courier New,monospace" font-size="9" letter-spacing="0.12em" fill="rgba(140,140,160,0.4)">相机斋戒 · 2026-06-15</text>

  <!-- Bottom series marker -->
  <text x="400" y="435" text-anchor="middle" font-family="Courier New,monospace" font-size="8" letter-spacing="0.1em" fill="rgba(100,100,110,0.3)">granted hours — day 40</text>
</svg>