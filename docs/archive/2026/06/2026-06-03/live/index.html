<canvas id="field" aria-label="Repair Quorum generative canvas"></canvas>
<section class="label">
  <h1>Repair Quorum / 修复法定人数</h1>
  <p>A choir of small hinges learns to coordinate repair without letting coordination become a throne.</p>
</section>
<div class="hud">move · click · space · r · s</div>
<button id="soundToggle" class="sound-toggle" type="button" aria-pressed="true">sound on</button>
<audio id="bgm" src="./2026-06-03-repair-quorum-bgm.mp3" preload="auto" autoplay loop></audio>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d');
  const bgm = document.getElementById('bgm');
  const soundToggle = document.getElementById('soundToggle');
  let soundEnabled = true;
  function updateSoundLabel(text) {
    if (!soundToggle) return;
    soundToggle.textContent = text;
    soundToggle.setAttribute('aria-pressed', soundEnabled ? 'true' : 'false');
  }
  async function tryPlaySound() {
    if (!bgm || !soundEnabled) return;
    bgm.volume = 0.42;
    try {
      await bgm.play();
      updateSoundLabel('sound on');
    } catch (err) {
      updateSoundLabel('sound click');
    }
  }
  function setSound(on) {
    soundEnabled = on;
    if (!bgm) return;
    if (on) {
      tryPlaySound();
    } else {
      bgm.pause();
      updateSoundLabel('sound off');
    }
  }
  if (soundToggle) {
    soundToggle.addEventListener('click', (event) => {
      event.stopPropagation();
      if (!bgm) return;
      if (soundEnabled && !bgm.paused) setSound(false);
      else setSound(true);
    });
  }
  window.addEventListener('load', tryPlaySound);
  window.addEventListener('pointerdown', tryPlaySound, { once: true });
  window.addEventListener('keydown', tryPlaySound, { once: true });
  const TAU = Math.PI * 2;
  const seed = 20260603;
  let w = 0, h = 0, dpr = 1, t = 0, paused = false, pulse = 0, emergency = 0;
  const pointer = { x: 0.58, y: 0.52, active: false };

  function mulberry32(a) {
    return function() {
      let x = a += 0x6D2B79F5;
      x = Math.imul(x ^ x >>> 15, x | 1);
      x ^= x + Math.imul(x ^ x >>> 7, x | 61);
      return ((x ^ x >>> 14) >>> 0) / 4294967296;
    };
  }
  const rnd = mulberry32(seed);
  const nodes = Array.from({ length: 39 }, (_, i) => {
    const ring = i % 3;
    const baseAngle = i / 39 * TAU + rnd() * 0.18;
    return {
      i, ring, angle: baseAngle, r: 0.22 + ring * 0.105 + rnd() * 0.035,
      drift: 0.2 + rnd() * 1.15,
      phase: rnd() * TAU,
      patience: 0.34 + rnd() * 0.6,
      hinge: 0.35 + rnd() * 0.65,
      colorBias: rnd()
    };
  });

  function resize() {
    dpr = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
    w = Math.floor(innerWidth * dpr);
    h = Math.floor(innerHeight * dpr);
    canvas.width = w; canvas.height = h;
    canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function lerp(a,b,p){ return a + (b-a)*p; }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function pos(n, time) {
    const cx = innerWidth * 0.5, cy = innerHeight * 0.535;
    const scale = Math.min(innerWidth, innerHeight);
    const wobble = 0.028 * Math.sin(time * n.drift + n.phase) + 0.012 * Math.sin(time * 0.41 + n.i);
    const a = n.angle + 0.045 * Math.sin(time * 0.22 + n.phase);
    return { x: cx + Math.cos(a) * scale * (n.r + wobble), y: cy + Math.sin(a) * scale * (n.r + wobble), a };
  }

  function drawBackground(time) {
    const g = ctx.createRadialGradient(innerWidth*0.5, innerHeight*0.54, 10, innerWidth*0.5, innerHeight*0.54, Math.max(innerWidth, innerHeight)*0.75);
    g.addColorStop(0, '#161c35'); g.addColorStop(0.45, '#0a1025'); g.addColorStop(1, '#050713');
    ctx.fillStyle = g; ctx.fillRect(0,0,innerWidth,innerHeight);
    ctx.save();
    ctx.globalAlpha = 0.08;
    ctx.strokeStyle = '#c7d6ff';
    for (let r = 0; r < 7; r++) {
      ctx.beginPath();
      const rr = Math.min(innerWidth, innerHeight) * (0.16 + r * 0.068 + 0.008*Math.sin(time+r));
      ctx.arc(innerWidth/2, innerHeight*0.535, rr, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawDoor(time, approval, bureaucracy) {
    const cx = innerWidth * 0.5, cy = innerHeight * 0.535;
    const span = Math.min(innerWidth, innerHeight) * 0.25;
    const open = 0.23 + approval * 0.36 - bureaucracy * 0.1 + Math.sin(time*0.9) * 0.02;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.lineCap = 'round';
    ctx.shadowBlur = 24 + approval * 50;
    ctx.shadowColor = `rgba(112, 226, 255, ${0.25 + approval*0.45})`;
    ctx.strokeStyle = `rgba(169, 206, 255, ${0.24 + approval*0.45})`;
    ctx.lineWidth = 2.2;
    for (let k = -2; k <= 2; k++) {
      ctx.beginPath();
      ctx.moveTo(-span*0.16 + k*4, -span*0.84);
      ctx.bezierCurveTo(-span*0.46, -span*0.33, -span*0.36, span*0.34, -span*open, span*0.78);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(span*0.16 - k*4, -span*0.84);
      ctx.bezierCurveTo(span*0.46, -span*0.33, span*0.36, span*0.34, span*open, span*0.78);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(255, 190, 116, ${0.10 + bureaucracy*0.22})`;
    for (let y=-0.62; y<=0.62; y+=0.155) {
      const width = span * (0.42 + bureaucracy*0.48);
      ctx.fillRect(-width/2, span*y, width, 1.1 + bureaucracy*2.6);
    }
    ctx.restore();
  }

  function frame() {
    if (!paused) t += 1/60;
    emergency *= 0.965;
    pulse = Math.max(pulse * 0.975, emergency);
    drawBackground(t);
    const px = pointer.x * innerWidth, py = pointer.y * innerHeight;
    const positions = nodes.map(n => pos(n, t));
    const approvals = nodes.map((n, idx) => {
      const p = positions[idx];
      const dist = Math.hypot(p.x-px, p.y-py) / Math.max(1, Math.min(innerWidth, innerHeight));
      const influence = pointer.active ? Math.exp(-dist * 5.5) : 0.42;
      const local = 0.5 + 0.5 * Math.sin(t*0.92 + n.phase + n.hinge * 2.4);
      return clamp(local * 0.52 + influence * 0.58 + emergency * 0.45 - n.patience * 0.13, 0, 1);
    });
    const approval = approvals.filter(v => v > 0.58).length / nodes.length;
    const bureaucracy = clamp((approvals.filter(v => v > 0.82).length / nodes.length - 0.31) * 2.4, 0, 1);
    const quorum = approval > 0.46 ? clamp((approval - 0.46) * 2.4 + pulse * 0.35, 0, 1) : pulse * 0.4;

    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (let i = 0; i < nodes.length; i++) {
      const a = approvals[i];
      if (a < 0.45) continue;
      for (let j = i + 1; j < nodes.length; j++) {
        const b = approvals[j];
        const d = Math.hypot(positions[i].x-positions[j].x, positions[i].y-positions[j].y);
        if (b > 0.45 && d < Math.min(innerWidth, innerHeight) * 0.24) {
          const alpha = (a*b) * (1 - d/(Math.min(innerWidth, innerHeight)*0.24)) * (0.1 + quorum*0.36);
          ctx.strokeStyle = `rgba(111, 225, 255, ${alpha})`;
          ctx.lineWidth = lerp(0.35, 2.0, quorum);
          ctx.beginPath(); ctx.moveTo(positions[i].x, positions[i].y); ctx.lineTo(positions[j].x, positions[j].y); ctx.stroke();
        }
      }
    }
    ctx.restore();

    drawDoor(t, quorum, bureaucracy);

    const cx = innerWidth * 0.5, cy = innerHeight * 0.535;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let ring = 0; ring < 4; ring++) {
      const rr = Math.min(innerWidth, innerHeight) * (0.1 + ring*0.105 + ((t*0.06 + ring*0.18) % 0.105));
      const alpha = Math.max(0, quorum * (1 - ring*0.16) * 0.28 - bureaucracy*0.06);
      ctx.strokeStyle = `rgba(118, 238, 218, ${alpha})`;
      ctx.lineWidth = 1.5 + quorum * 3;
      ctx.beginPath(); ctx.arc(cx, cy, rr, 0, TAU); ctx.stroke();
    }
    ctx.restore();

    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i], p = positions[i], a = approvals[i];
      const hue = lerp(206, 40, bureaucracy * n.colorBias);
      const radius = 3.5 + a*7 + (n.ring===0 ? 1.5 : 0);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.a + Math.PI/2);
      ctx.shadowBlur = 10 + a*30;
      ctx.shadowColor = `hsla(${hue}, 95%, 66%, ${0.35 + a*0.45})`;
      ctx.fillStyle = `hsla(${hue}, 88%, ${58 + a*18}%, ${0.62 + a*0.34})`;
      ctx.strokeStyle = `rgba(255,255,255,${0.12 + a*0.24})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, -radius*1.25);
      ctx.lineTo(radius*0.72, radius*0.62);
      ctx.lineTo(-radius*0.72, radius*0.62);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    ctx.fillStyle = 'rgba(232,238,252,.72)';
    ctx.font = '12px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.fillText(`quorum ${(approval*100).toFixed(0)}%  ·  paperwork ${(bureaucracy*100).toFixed(0)}%`, 28, innerHeight - 28);
    ctx.restore();
    window.__artState = { approval, quorum, bureaucracy, nodeCount: nodes.length };
    requestAnimationFrame(frame);
  }

  function saveStill() {
    const a = document.createElement('a');
    a.download = 'repair-quorum-still.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  }
  addEventListener('resize', resize);
  addEventListener('mousemove', e => { pointer.x = e.clientX / innerWidth; pointer.y = e.clientY / innerHeight; pointer.active = true; });
  addEventListener('mouseleave', () => { pointer.active = false; });
  addEventListener('click', e => { pointer.x = e.clientX / innerWidth; pointer.y = e.clientY / innerHeight; pointer.active = true; emergency = 1; });
  addEventListener('keydown', e => {
    if (e.key === ' ') { e.preventDefault(); paused = !paused; }
    if (e.key.toLowerCase() === 'r') { t = 0; emergency = 0; }
    if (e.key.toLowerCase() === 's') saveStill();
  });
  resize();
  window.__artReady = true;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
