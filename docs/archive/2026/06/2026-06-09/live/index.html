      const grd = ctx.createRadialGradient(x+Math.cos(a)*12,y+Math.sin(a)*9,0,x,y,rr);
      grd.addColorStop(0, `rgba(120,215,223,${0.020 + (i%5)*.004})`);
      grd.addColorStop(1, 'rgba(120,215,223,0)');
      ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(x,y,rr,0,TAU); ctx.fill();
    }
    ctx.restore();
  }

  function orbitPoint(n) {
    const t = tick * .006;
    const cx = w * (.50 + (pointer.x-.5) * .045 * visibleSchedule);
    const cy = h * (.54 + (pointer.y-.5) * .055 * visibleSchedule);
    const aspect = Math.min(w,h);
    const breathing = Math.sin(t*.41 + n.phase) * .018 + Math.sin(t*.17 + n.ring) * .011;
    const a = n.baseA + Math.sin(t*.19 + n.phase) * .18 * (1 - n.paid) + (pointer.x-.5)*.14;
    const r = aspect * (n.baseR + breathing + interest*.035*(1-n.paid));
    return { x: cx + Math.cos(a)*r*1.18, y: cy + Math.sin(a)*r*.76, a, r };
  }

  function drawLedgerLines() {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.globalCompositeOperation = 'lighter';
    const center = { x: w*(.5 + (pointer.x-.5)*.04), y: h*(.54 + (pointer.y-.5)*.05) };
    for (const n of nodes) {
      const p = orbitPoint(n);
      const alpha = .018 + visibleSchedule*.050 + n.heat*.045;
      ctx.strokeStyle = `hsla(${n.hue}, 82%, ${58 + n.paid*20}%, ${alpha})`;
      ctx.lineWidth = .35 + n.weight*.18;
      ctx.beginPath();
      ctx.moveTo(center.x, center.y);
      const cx1 = lerp(center.x, p.x, .38) + Math.sin(n.phase + tick*.007)*42*(1-n.paid);
      const cy1 = lerp(center.y, p.y, .38) + Math.cos(n.phase + tick*.005)*31*(1-n.paid);
      ctx.quadraticCurveTo(cx1, cy1, p.x, p.y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawNodes() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const n of nodes) {
      const p = orbitPoint(n);
      const unpaid = 1 - n.paid;
      const radius = (2.2 + n.weight*1.9) * (1 + unpaid*.85 + n.heat*.8);
      const hue = lerp(n.hue, 350, n.heat*.65);
      const glow = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,radius*6.5);
      glow.addColorStop(0, `hsla(${hue}, 90%, 70%, ${.24 + n.heat*.20})`);
      glow.addColorStop(.35, `hsla(${hue}, 80%, 52%, ${.055 + unpaid*.045})`);
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(p.x,p.y,radius*6.5,0,TAU); ctx.fill();
      ctx.fillStyle = `hsla(${hue}, 86%, ${65 + n.paid*20}%, ${.52 + visibleSchedule*.28})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,radius,0,TAU); ctx.fill();
      if (visibleSchedule > .54) {
        ctx.strokeStyle = `hsla(43, 90%, 76%, ${(.12 + visibleSchedule*.22) * n.paid})`;
        ctx.lineWidth = .75;
        ctx.beginPath(); ctx.arc(p.x,p.y,radius*2.3, -Math.PI/2, -Math.PI/2 + TAU*n.paid); ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawRepayments() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const cx = w*(.5 + (pointer.x-.5)*.045), cy = h*(.54 + (pointer.y-.5)*.055);
    const aspect = Math.min(w,h);
    for (const p of repayments) {
      const rr = aspect*p.r;
      const a = p.a + tick*.0025*(p.kind === 'principal' ? 1 : -1);
      const x = cx + Math.cos(a)*rr*1.18;
      const y = cy + Math.sin(a)*rr*.76;
      const pulse = Math.sin(p.life*TAU);
      ctx.fillStyle = p.kind === 'principal' ? `rgba(120,215,223,${.18 + visibleSchedule*.32})` : `rgba(231,189,115,${.16 + visibleSchedule*.26})`;
      ctx.beginPath(); ctx.arc(x,y,p.size*(1+pulse*.28),0,TAU); ctx.fill();
      ctx.strokeStyle = `rgba(244,234,215,${.05 + visibleSchedule*.08})`;
      ctx.lineWidth = .6; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(lerp(x,cx,.085), lerp(y,cy,.085)); ctx.stroke();
    }
    ctx.restore();
  }

  function drawShocks() {
    ctx.save(); ctx.globalCompositeOperation = 'screen';
    for (const s of shocks) {
      const x = s.x*w, y = s.y*h;
      const r = ease(s.t) * Math.min(w,h) * .34;
      ctx.strokeStyle = `hsla(${s.hue}, 96%, 68%, ${.55*(1-s.t/1.2)})`;
      ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.stroke();
      ctx.strokeStyle = `rgba(244,234,215,${.16*(1-s.t/1.2)})`;
      ctx.lineWidth = .6; ctx.beginPath(); ctx.arc(x,y,r*.57,0,TAU); ctx.stroke();
    }
    ctx.restore();
  }

  function drawScheduleRings() {
    ctx.save();
    ctx.translate(w*(.5 + (pointer.x-.5)*.04), h*(.54 + (pointer.y-.5)*.05));
    ctx.scale(1.18,.76);
    ctx.rotate(Math.sin(tick*.002)*.025);
    for (let i=0;i<9;i++) {
      const r = Math.min(w,h) * (.08 + i*.043 + Math.sin(tick*.006+i)*.002);
      const start = -Math.PI/2 + i*.19 + tick*.0009;
      const span = TAU*(.18 + visibleSchedule*.55) - i*.045;
      ctx.strokeStyle = `rgba(${i%2?231:120}, ${i%2?189:215}, ${i%2?115:223}, ${.035 + visibleSchedule*.045})`;
      ctx.lineWidth = i%3===0 ? 1.2 : .55;
      ctx.beginPath(); ctx.arc(0,0,r,start,start+span); ctx.stroke();
    }
    ctx.restore();
  }

  function drawGrain() {
    ctx.save();
    ctx.globalAlpha = .055;
    ctx.fillStyle = '#ffffff';
    for (let i=0;i<900;i++) {
      const x = (i*37 + tick*5) % w;
      const y = (i*83 + tick*3) % h;
      if (((i + tick) % 7) < 2) ctx.fillRect(x,y,1,1);
    }
    ctx.restore();
  }

  function updateHud() {
    trustFill.style.width = `${Math.round(trust*100)}%`;
    interestFill.style.width = `${Math.round(interest*100)}%`;
    trustText.textContent = trust.toFixed(2);
    interestText.textContent = interest.toFixed(2);
    stateLabel.textContent = paused ? 'visible schedule: paused' : (visibleSchedule > .64 ? 'visible schedule: disclosed' : 'visible schedule: drifting');
    ledgerEl.classList.toggle('hidden', !ledgerVisible);
    const payment = (visibleSchedule * 100).toFixed(1);
    const unpaid = ((1-trust)*100).toFixed(1);
    ledgerEl.innerHTML = `<strong>AMORTIZATION LEDGER</strong><br>`+
      `principal_visibility = ${payment}%<br>`+
      `trust_remaining = ${(trust*100).toFixed(1)}%<br>`+
      `interest_pressure = ${(interest*100).toFixed(1)}%<br>`+
      `unpriced_exceptions = ${unpaid}%<br>`+
      `rule: no exception is free; only hidden from the invoice.`;
  }

  function render() {
    drawBackground(); drawScheduleRings(); drawLedgerLines(); drawRepayments(); drawNodes(); drawShocks(); drawGrain(); updateHud();
  }
  function frame() { step(1); render(); window._artReady = true; window._drawHeartbeat = tick; requestAnimationFrame(frame); }

  function pointerFromEvent(e) { const r = canvas.getBoundingClientRect(); pointer.x = clamp((e.clientX-r.left)/r.width,0,1); pointer.y = clamp((e.clientY-r.top)/r.height,0,1); pointer.active = true; }
  window.addEventListener('resize', () => { resize(); render(); });
  window.addEventListener('pointermove', pointerFromEvent);
  window.addEventListener('pointerdown', e => { pointerFromEvent(e); admitException(); if (soundEnabled) playMusic(); });
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === ' ') { paused = !paused; e.preventDefault(); }
    if (k === 'v' || k === 'd') ledgerVisible = !ledgerVisible;
    if (k === 'r') init();
    if (k === 'm') toggleSound();
    if (k === 's') saveStill();
  });
  async function playMusic() { if (!soundEnabled) return; try { bgm.volume = 0.42; await bgm.play(); soundToggle.textContent = 'BGM: on'; soundToggle.setAttribute('aria-pressed','true'); } catch (err) { soundToggle.textContent = 'BGM: click'; } }
  function toggleSound() { soundEnabled = !soundEnabled; if (!soundEnabled) { bgm.pause(); soundToggle.textContent = 'BGM: off'; soundToggle.setAttribute('aria-pressed','false'); } else playMusic(); }
  soundToggle.addEventListener('click', toggleSound);
  window.addEventListener('load', playMusic);
  function saveStill() { const a = document.createElement('a'); a.download = '2026-06-09-trust-amortization.png'; a.href = canvas.toDataURL('image/png'); a.click(); }

  window.__advanceArt = function(frames = 60) { step(frames); render(); return window.__getArtStats(); };
  window.__getArtStats = function() {
    const sample = ctx.getImageData(0,0,canvas.width,canvas.height).data;
    let bright = 0, colored = 0, count = 0;
    const cols = 16, rows = 9;
    for (let gy=0; gy<rows; gy++) for (let gx=0; gx<cols; gx++) {
      const x = Math.floor((gx+.5)*canvas.width/cols), y = Math.floor((gy+.5)*canvas.height/rows);
      const idx = 4*(y*canvas.width + x); const r=sample[idx], g=sample[idx+1], b=sample[idx+2];
      const max = Math.max(r,g,b), min = Math.min(r,g,b); if (max > 34) bright++; if (max-min > 12) colored++; count++;
    }
    return { ready: !!window._artReady, tick, canvas: [canvas.width, canvas.height], brightRatio: bright/count, coloredRatio: colored/count, trust, interest, visibleSchedule, nodes: nodes.length, shocks: shocks.length, bgmSrc: bgm.getAttribute('src'), soundButton: soundToggle.textContent };
  };
  resize(); init(); render(); window._artReady = true; setTimeout(() => { if (!window._drawHeartbeat) { step(30); render(); window._drawHeartbeat = tick; } }, 600); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
