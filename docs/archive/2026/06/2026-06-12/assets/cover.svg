<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Forgiveness Latency / 宽恕延迟</title>
  <desc id="desc">A dark generative-art cover with repair doors, delayed packets, and bilingual title text.</desc>
  <defs>
    <radialGradient id="bg" cx="52%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#183055"/>
      <stop offset="48%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
    <linearGradient id="door" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#9edcff" stop-opacity="0.58"/>
      <stop offset="0.55" stop-color="#ffd49a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#a7f0c9" stop-opacity="0.52"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g fill="none" opacity="0.55">
    <path d="M148 420 C340 260 510 590 710 370 S1040 290 1110 505" stroke="#9edcff" stroke-opacity="0.33"/>
    <path d="M90 528 C270 386 480 632 700 490 S955 328 1130 425" stroke="#ffd49a" stroke-opacity="0.25"/>
    <path d="M170 330 C360 510 490 260 690 425 S930 610 1090 300" stroke="#a7f0c9" stroke-opacity="0.22"/>
  </g>
  <g transform="translate(600 420)" fill="none" stroke-linecap="round" opacity="0.82">
    <ellipse rx="110" ry="66" stroke="#9edcff" stroke-opacity="0.34"/>
    <ellipse rx="190" ry="116" stroke="#ffd49a" stroke-opacity="0.24"/>
    <ellipse rx="280" ry="171" stroke="#9edcff" stroke-opacity="0.22"/>
    <ellipse rx="372" ry="228" stroke="#a7f0c9" stroke-opacity="0.16"/>
  </g>
  <g filter="url(#glow)">
    <g transform="translate(330 365) rotate(-4)">
      <rect x="-54" y="-96" width="108" height="192" rx="16" fill="url(#door)" opacity="0.36" stroke="#d8f4ff" stroke-opacity="0.42"/>
      <rect x="-9" y="-78" width="18" height="156" rx="9" fill="#ffffff" opacity="0.15"/>
      <text y="122" text-anchor="middle" fill="#9edcff" font-family="ui-monospace, monospace" font-size="24" opacity="0.8">18s</text>
    </g>
    <g transform="translate(595 420) rotate(2)">
      <rect x="-70" y="-126" width="140" height="252" rx="20" fill="url(#door)" opacity="0.48" stroke="#d8f4ff" stroke-opacity="0.52"/>
      <rect x="-13" y="-102" width="26" height="204" rx="13" fill="#ffffff" opacity="0.18"/>
      <text y="154" text-anchor="middle" fill="#a7f0c9" font-family="ui-monospace, monospace" font-size="26" opacity="0.82">wait</text>
    </g>
    <g transform="translate(850 345) rotate(6)">
      <rect x="-48" y="-88" width="96" height="176" rx="15" fill="url(#door)" opacity="0.31" stroke="#d8f4ff" stroke-opacity="0.36"/>
      <rect x="-8" y="-70" width="16" height="140" rx="8" fill="#ffffff" opacity="0.12"/>
      <text y="112" text-anchor="middle" fill="#ffd49a" font-family="ui-monospace, monospace" font-size="22" opacity="0.75">34s</text>
    </g>
  </g>
  <g fill="none" stroke="#ffd49a" stroke-opacity="0.55" filter="url(#glow)">
    <rect x="746" y="520" width="46" height="28" rx="8"/>
    <path d="M750 526 L769 539 L789 526"/>
    <rect x="442" y="252" width="42" height="26" rx="8" opacity="0.75"/>
    <path d="M446 258 L463 270 L480 258" opacity="0.75"/>
    <rect x="690" y="232" width="38" height="24" rx="7" opacity="0.55"/>
    <path d="M694 237 L709 248 L724 237" opacity="0.55"/>
  </g>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif">
    <text x="72" y="102" fill="#f3fbff" font-size="62" font-weight="760" letter-spacing="-3">Forgiveness Latency</text>
    <text x="76" y="157" fill="#d2e3ed" font-size="38" font-weight="650">宽恕延迟</text>
    <text x="76" y="712" fill="#a7bbcb" font-size="22">repair needs a delay / 修复需要一小段不被催促的时间</text>
  </g>
