    soundBtn.setAttribute('aria-pressed', String(soundOn));
    soundBtn.textContent = soundOn ? 'BGM on · 背景音乐开' : 'BGM off · 背景音乐关';
    if(soundOn) audio.play().catch(()=>{ soundBtn.textContent='click for BGM · 点击开音乐'; }); else audio.pause();
  }
  soundBtn.addEventListener('click', toggleSound);
  pauseBtn.addEventListener('click', ()=>{ paused=!paused; pauseBtn.textContent = paused ? 'resume' : 'pause'; });
  function saveStill(){
    const a=document.createElement('a');
    a.download='after-fasting-memory-still.png';
    a.href=canvas.toDataURL('image/png');
    a.click();
  }
  function background(){
    const g = ctx.createRadialGradient(innerWidth*.5, innerHeight*.45, 0, innerWidth*.5, innerHeight*.45, Math.max(innerWidth, innerHeight)*.75);
    g.addColorStop(0, `rgb(${18+residue*18},${12+residue*10},${10+residue*18})`);
    g.addColorStop(.45, '#08070a');
    g.addColorStop(1, '#020204');
    ctx.fillStyle=g; ctx.fillRect(0,0,innerWidth,innerHeight);
  }
  function drawRing(cx,cy,r,alpha, color, w=1){
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.strokeStyle=color.replace('ALPHA', alpha.toFixed(3)); ctx.lineWidth=w; ctx.stroke();
  }
  function drawMemoryVessel(cx,cy){
    const R = Math.min(innerWidth, innerHeight) * (.22 + residue*.05);
    const pullX = (pointer.x-.5)*70*gaze;
    const pullY = (pointer.y-.5)*54*gaze;
    ctx.save(); ctx.translate(cx+pullX*.22, cy+pullY*.18);
    ctx.rotate(Math.sin(t*.004)*.06 + (pointer.x-.5)*.08);
    for(let layer=0; layer<5; layer++){
      const rr = R * (1 + layer*.15 + Math.sin(t*.006+layer)*.018);
      const a = .22 - layer*.028 + residue*.08;
      ctx.beginPath();
      for(let i=0;i<=240;i++){
        const th = i/240*Math.PI*2;
        const fastingDent = Math.sin(th*3 + t*.011) * 18 * residue;
        const gazeSharp = Math.cos(th*8 + t*.007 + layer) * 9 * gaze;
        const memoryScar = Math.sin(th*13 + residue*9) * 6 * residue;
        const rad = rr + fastingDent + gazeSharp + memoryScar;
        const x = Math.cos(th)*rad;
        const y = Math.sin(th)*rad*(.72 + residue*.18);
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.closePath();
      ctx.strokeStyle = `rgba(${160+layer*16},${132+residue*100},${255-layer*24},${a})`;
      ctx.lineWidth = 1.2 + layer*.35;
      ctx.shadowColor = `rgba(255,190,84,${.07 + residue*.08})`; ctx.shadowBlur = 18;
      ctx.stroke();
    }
    const grd = ctx.createRadialGradient(0,0,R*.05,0,0,R*.8);
    grd.addColorStop(0, `rgba(255,242,184,${.28 + gaze*.18})`);
    grd.addColorStop(.38, `rgba(118,92,255,${.08 + residue*.13})`);
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(0,0,R*.82,0,Math.PI*2); ctx.fill();
    for(let k=0;k<10;k++){
      const th = k/10*Math.PI*2 + t*.002*(k%2?1:-1);
      const a = .16 + .2*Math.sin(t*.004+k);
      ctx.beginPath();
      ctx.moveTo(Math.cos(th)*R*.25, Math.sin(th)*R*.17);
      ctx.lineTo(Math.cos(th+residue*.5)*R*(.78+.08*Math.sin(k+t*.01)), Math.sin(th+residue*.5)*R*.58);
      ctx.strokeStyle = `rgba(255,213,137,${Math.max(0,a)*gaze*.65})`; ctx.lineWidth=.8; ctx.stroke();
    }
    ctx.restore();
  }
  function drawParticles(cx,cy){
    for(const p of grains){
      const th = p.a + t*.0007*p.s + Math.sin(t*.002+p.phase)*.05*p.wob;
      const orbit = Math.min(innerWidth, innerHeight) * p.r * (1 + residue*.32);
      const x = cx + Math.cos(th)*orbit + (pointer.x-.5)*80*p.z*gaze;
      const y = cy + Math.sin(th)*orbit*(.54+.22*p.z) + (pointer.y-.5)*60*p.z*gaze;
      const pulse = .5 + .5*Math.sin(t*.008+p.phase);
      const alpha = .08 + pulse*.24*(.4+p.z) + residue*.09;
      ctx.fillStyle = p.hue>.58 ? `rgba(255,190,84,${alpha})` : `rgba(147,128,255,${alpha*.72})`;
      ctx.beginPath(); ctx.arc(x,y, .6 + p.z*1.8 + residue*.8, 0, Math.PI*2); ctx.fill();
    }
  }
  function drawApertures(){
    for(let i=apertures.length-1;i>=0;i--){
      const a = apertures[i]; a.age++;
      const q = a.age/a.life;
      if(q>=1){ apertures.splice(i,1); continue; }
      const alpha = Math.sin(q*Math.PI)*(.45+.3*residue);
      drawRing(a.x,a.y,18+q*180,alpha,'rgba(255,220,150,ALPHA)',1.3);
      drawRing(a.x,a.y,8+q*84,alpha*.7,'rgba(135,112,255,ALPHA)',1);
      ctx.save(); ctx.translate(a.x,a.y); ctx.rotate(a.spin + q*2.2);
      ctx.strokeStyle=`rgba(255,246,214,${alpha*.8})`; ctx.lineWidth=1;
      for(let k=0;k<6;k++){
        ctx.rotate(Math.PI/3);
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(36+q*82,0); ctx.stroke();
      }
      ctx.restore();
    }
  }
  function draw(){
    if(!paused) t += 1;
    gaze += ((watched?1:0) - gaze) * .035;
    residue += ((watched ? .38 + (pointer.active ? .18 : 0) : .96) - residue) * (watched ? .006 : .018);
    flash *= .94;
    background();
    const cx=innerWidth*.5, cy=innerHeight*.5;
    drawParticles(cx,cy);
    for(let r=0;r<7;r++) drawRing(cx,cy, Math.min(innerWidth,innerHeight)*(.12+r*.075)+Math.sin(t*.004+r)*7, (.045+r*.007)*(1+residue), 'rgba(255,243,208,ALPHA)', .7);
    drawMemoryVessel(cx,cy);
    drawApertures();
    if(flash>.01){ ctx.fillStyle=`rgba(255,230,160,${flash*.08})`; ctx.fillRect(0,0,innerWidth,innerHeight); }
    residueBar.style.width = `${Math.round(residue*100)}%`;
    watchedLabel.textContent = watched ? 'watched · 被看' : 'fasting · 斋戒';
    scoreLabel.textContent = residue.toFixed(2);
    requestAnimationFrame(draw);
  }
  audio.volume = .55;
  audio.play().catch(()=>{ soundBtn.textContent='click for BGM · 点击开音乐'; });
  draw();
})();
</script>
