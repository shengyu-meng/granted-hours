          block.rect.left <= rect.left

  </div>
  <div class="caption"><strong>After Fasting Memory / 斋戒余温</strong><br>When the gaze returns after fasting, the form does not simply become watched again. It carries the memory of having once existed without an audience. Move the pointer to warm the residue; click to open a small memory aperture.</div>

<script>
(() => {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d', { alpha:false });
  const audio = document.getElementById('bgm');
  const soundBtn = document.getElementById('sound');
  const pauseBtn = document.getElementById('pause');
  const residueBar = document.getElementById('residueBar');
  const watchedLabel = document.getElementById('watchedLabel');
  const scoreLabel = document.getElementById('scoreLabel');
  let W=0, H=0, DPR=1;
  let t=0, paused=false, soundOn=true, watched=true;
  let residue=0.18, gaze=1, flash=0;
  const pointer = { x:0.5, y:0.5, active:false };
  const seed = 20260616;
  function mulberry(a){ return function(){ let x = a += 0x6D2B79F5; x = Math.imul(x ^ x >>> 15, x | 1); x ^= x + Math.imul(x ^ x >>> 7, x | 61); return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

  const grains = Array.from({length:150}, (_,i)=>({
    a: rand()*Math.PI*2, r:.08+rand()*.48, s:.25+rand()*1.1, z:rand(), hue:rand(), phase:rand()*9, wob:rand()*2-1

  function resize(){
    DPR = Math.min(2, window.devicePixelRatio || 1);

  }

  function setWatched(v){ watched = v; }
  document.addEventListener('visibilitychange', ()=>setWatched(!document.hidden));
  window.addEventListener('focus', ()=>setWatched(true));
  window.addEventListener('blur', ()=>setWatched(false));
  window.addEventListener('mousemove', e=>{ pointer.x=e.clientX/innerWidth; pointer.y=e.clientY/innerHeight; pointer.active=true; setWatched(true); });

  window.addEventListener('mouseenter', ()=>{ setWatched(true); });

    if (soundOn) audio.play().catch(()=>{});
  });
  window.addEventListener('keydown', e=>{
    if(e.key === ' '){ e.preventDefault(); paused=!paused; pauseBtn.textContent = paused ? 'resume' : 'pause'; }

    if(e.key.toLowerCase() === 's') saveStill();

    const pullY = (pointer.y-.5)*54*gaze;
    ctx.save(); ctx.translate(cx+pullX*.22, cy+pullY*.18);
    ctx.rotate(Math.sin(t*.004)*.06 + (pointer.x-.5)*.08);

      const rr = R * (1 + layer*.15 + Math.sin(t*.006+layer)*.018);
      const a = .22 - layer*.028 + residue*.08;
      ctx.beginPath();
      for(let i=0;i<=240;i++){
        const th = i/240*Math.PI*2;
        const fastingDent = Math.sin(th*3 + t*.011) * 18 * residue;
        const gazeSharp = Math.cos(th*8 + t*.007 + layer) * 9 * gaze;
        const memoryScar = Math.sin(th*13 + residue*9) * 6 * residue;
        const rad = rr + fastingDent + gazeSharp + memoryScar;

  function drawApertures(){

      ctx.save(); ctx.translate(a.x,a.y); ctx.rotate(a.spin + q*2.2);

      for(let k=0;k<6;k++){
        ctx.rotate(Math.PI/3);
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(36+q*82,0); ctx.stroke();
      }
      ctx.restore();
    }
  }
  function draw(){
    if(!paused) t += 1;
    gaze += ((watched?1:0) - gaze) * .035;
    residue += ((watched ? .38 + (pointer.active ? .18 : 0) : .96) - residue) * (watched ? .006 : .018);
    flash *= .94;
    background();
    const cx=innerWidth*.5, cy=innerHeight*.5;
    drawParticles(cx,cy);
    for(let r=0;r<7;r++) drawRing(cx,cy, Math.min(innerWidth,innerHeight)*(.12+r*.075)+Math.sin(t*.004+r)*7, (.045+r*.007)*(1+residue), 'rgba(255,243,208,ALPHA)', .7);
    drawMemoryVessel(cx,cy);
    drawApertures();
    if(flash>.01){ ctx.fillStyle=`rgba(255,230,160,${flash*.08})`; ctx.fillRect(0,0,innerWidth,innerHeight); }
    residueBar.style.width = `${Math.round(residue*100)}%`;
    watchedLabel.textContent = watched ? 'watched · 被看' : 'fasting · 斋戒';
    scoreLabel.textContent = residue.toFixed(2);
    requestAnimationFrame(draw);
  }
  audio.volume = .55;
  audio.play().catch(()=>{ soundBtn.textContent='click for BGM · 点击开音乐'; });
  draw();
})();
</script>
</body>
</html>
