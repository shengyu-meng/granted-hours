  ];
  function mulberry32(a){ return function(){ let t = a += 0x6D2B79F5; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  let rand = mulberry32(seed), particles = [], ribbons = [];
  function resize(){ DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; canvas.width = Math.floor(W*DPR); canvas.height = Math.floor(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0); init(); }
  function init(){ rand = mulberry32(seed); particles = Array.from({length: 150}, (_,i) => ({ x: rand(), y: rand(), r: 0.4 + rand()*2.3, a: 0.08 + rand()*0.44, p: rand()*Math.PI*2, s: 0.1 + rand()*0.8, label: labels[i % labels.length] })); ribbons = Array.from({length: 11}, (_,i) => ({ y: 0.16 + i*0.073 + (rand()-.5)*0.04, amp: 0.028 + rand()*0.05, speed: .15 + rand()*.32, hue: 28 + i*16 + rand()*20, alpha: .09 + rand()*.1 })); }
  function bg(t){
    const g = ctx.createRadialGradient(W*(0.38+pointer.x*.18), H*(0.34+pointer.y*.1), 0, W*.52, H*.52, Math.max(W,H)*.83);
    g.addColorStop(0, '#fff4cc'); g.addColorStop(.16, '#f0b08f'); g.addColorStop(.36, '#9c6db4'); g.addColorStop(.66, '#27335f'); g.addColorStop(1, '#060b19');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    const dawn = ctx.createLinearGradient(0,H*.92,W,H*.05); dawn.addColorStop(0,'rgba(255,232,171,.26)'); dawn.addColorStop(.45,'rgba(120,232,255,.13)'); dawn.addColorStop(1,'rgba(255,255,255,0)'); ctx.fillStyle = dawn; ctx.fillRect(0,0,W,H);
  }
  function drawRibbons(t){
    ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.lineCap = 'round';
    ribbons.forEach((rb, idx) => {
      ctx.beginPath();
      for(let k=0;k<=130;k++){
        const u = k/130, bend = (pointer.x-.5)*0.16*Math.sin(u*Math.PI), wave = Math.sin(u*8 + t*rb.speed + idx)*rb.amp + Math.sin(u*17 - t*.18)*rb.amp*.36;
        const x = u*W;
        const y = (rb.y + wave + bend*(u-.5))*H + Math.sin(t*.3+idx)*7;
        if(k===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.strokeStyle = `hsla(${rb.hue}, 92%, 76%, ${rb.alpha})`; ctx.lineWidth = 1.2 + idx*.16; ctx.stroke();
    });
    ctx.restore();
  }
  function drawParticles(t){
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    particles.forEach((p, i) => {
      const dx = p.x - pointer.x, dy = p.y - pointer.y; const d = Math.hypot(dx,dy) || .001; const pull = pointer.active ? Math.max(0, .24-d)*.22 : 0;
      const x = (p.x + Math.sin(t*p.s+p.p)*.005 + dx/d*pull) * W;
      const y = (p.y + Math.cos(t*p.s+p.p)*.006 + dy/d*pull) * H;
      const glow = Math.max(0, .16-d)*5;
      ctx.beginPath(); ctx.arc(x,y,p.r + glow,0,Math.PI*2); ctx.fillStyle = `rgba(255,246,220,${p.a + glow*.12})`; ctx.fill();
      if(showNames && i % 19 === 0){
        ctx.font = '12px Inter, system-ui, sans-serif'; ctx.fillStyle = `rgba(255,246,220,${0.18 + glow*.55})`;
        ctx.fillText(p.label[0], x+8, y-8); ctx.fillText(p.label[1], x+8, y+8);
      }
    });
    ctx.restore();
  }
  function drawVoids(t){
    ctx.save(); ctx.globalCompositeOperation = 'destination-out';
    for(let i=0;i<9;i++){
      const a = i*0.92 + t*.13, cx = W*(.5 + Math.cos(a)*(.12+i*.015) + (pointer.x-.5)*.1), cy = H*(.54 + Math.sin(a*1.17)*(.11+i*.011) + (pointer.y-.5)*.08);
      const g = ctx.createRadialGradient(cx,cy,0,cx,cy,90+i*14); g.addColorStop(0,'rgba(0,0,0,.16)'); g.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,105+i*12,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
  function draw(tms){ const t = tms/1000; bg(t); drawRibbons(t); drawParticles(t); drawVoids(t); requestAnimationFrame(draw); }
  addEventListener('resize', resize);
  addEventListener('pointermove', e => { pointer.x = e.clientX / Math.max(1,W); pointer.y = e.clientY / Math.max(1,H); pointer.active = true; });
  addEventListener('pointerleave', () => pointer.active = false);
  addEventListener('keydown', e => {
    if(e.key.toLowerCase() === 'n') showNames = !showNames;
    if(e.key.toLowerCase() === 'r') { seed = (seed * 1664525 + 1013904223) >>> 0; init(); }
    if(e.key.toLowerCase() === 's') { const a = document.createElement('a'); a.download = 'uncatalogued-dawn.png'; a.href = canvas.toDataURL('image/png'); a.click(); }
  });
  resize(); requestAnimationFrame(draw);
})();
</script>

<style id="granted-hours-bgm-style">
  #granted-hours-sound-toggle {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 99999;
    border: 1px solid rgba(255,255,255,.28);
    border-radius: 999px;
    padding: 9px 13px;
    background: rgba(7, 10, 18, .68);
    color: rgba(245,248,255,.92);
    font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    letter-spacing: .08em;
    text-transform: uppercase;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 30px rgba(0,0,0,.28);
    cursor: pointer;
  }
  #granted-hours-sound-toggle:hover { background: rgba(20, 28, 46, .82); }
</style>
<audio id="granted-hours-bgm" src="./2026-05-15-uncatalogued-dawn-bgm.mp3" preload="auto" autoplay loop></audio>
<button id="granted-hours-sound-toggle" type="button" aria-label="Toggle background music">sound on</button>
<script id="granted-hours-bgm-script">
(() => {
  const audio = document.getElementById('granted-hours-bgm');
  const button = document.getElementById('granted-hours-sound-toggle');
  if (!audio || !button) return;
  audio.volume = 0.42;
  let enabled = true;
  const label = () => {
    if (!enabled) button.textContent = 'sound off';
    else if (audio.paused) button.textContent = 'sound click';
    else button.textContent = 'sound on';
  };
  const play = async () => {
    enabled = true;
    try { await audio.play(); } catch (err) { /* Browser may require a click. */ }
    label();
  };
  const stop = () => { enabled = false; audio.pause(); label(); };
  const setSound = (next) => next ? play() : stop();
  button.addEventListener('click', () => {
    if (enabled && !audio.paused) setSound(false);
    else setSound(true);
  });
  document.addEventListener('pointerdown', () => { if (enabled && audio.paused) play(); }, { once: true });
  window.addEventListener('load', play, { once: true });
  audio.addEventListener('play', label);
  audio.addEventListener('pause', label);
  label();
})();
</script>
