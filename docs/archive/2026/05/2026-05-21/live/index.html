一个更小但诚实的形状。"};

    const maxArea = innerWidth * innerHeight * .35;
    return [...document.querySelectorAll('h1,h2,h3,h4,h5,h6,p,span,label,legend,figcaption,li,a,div,aside,section')]
      .filter((element) => {
        if (!(element instanceof HTMLElement)) return false;
        if (element.closest('#ghLiveBrief, #ghWorkNoteOverlay, #ghWorkNoteTrigger, #ghTouchKeyDock')) return false;
        if (controls.some((control) => element === control || control.contains(element) || element.contains(control))) return false;
        const rect = element.getBoundingClientRect();
        if (!isVisiblyRendered(element)) return false;
        if (rect.width <= 1 || rect.height <= 1 || rect.width * rect.height > maxArea) return false;
        if (rect.right < innerWidth * .48 || rect.bottom < innerHeight * .48) return false;
        if (!(element.innerText || element.textContent || '').trim()) return false;
        const directText = [...element.childNodes].some(
          (node) => node.nodeType === Node.TEXT_NODE && (node.textContent || '').trim(),
        );
        const semanticContainer = /hint|legend|keys|caption|meta|ledger|stamp|fallback|panel|controls|status|readout|copy|brief/i
          .test(`${element.id} ${element.className}`);
        if (!directText && !semanticContainer && !/^(H[1-6]|P|LABEL|LEGEND|FIGCAPTION|LI|A|SPAN)$/.test(element.tagName)) return false;
        return controls.some((control) => rectsIntersect(rect, control.getBoundingClientRect()));
      });
  }
  function nativeControlOffsetTarget(element, controls) {
    const semanticBlock = /hint|legend|keys|caption|meta|ledger|stamp|fallback|panel|controls|status|readout|copy|brief/i;
    const maxArea = innerWidth * innerHeight * .35;
    let target = element;
    for (let parent = element.parentElement; parent && parent !== document.body; parent = parent.parentElement) {
      if (parent.closest('#ghLiveBrief, #ghWorkNoteOverlay, #ghWorkNoteTrigger, #ghTouchKeyDock')) break;
      if (controls.some((control) => parent === control || parent.contains(control))) break;
      const rect = parent.getBoundingClientRect();
      if (rect.width <= 1 || rect.height <= 1 || rect.width * rect.height > maxArea) break;
      const style = getComputedStyle(parent);
      const named = semanticBlock.test(`${parent.id} ${parent.className}`);
      const positioned = ['fixed', 'absolute', 'sticky'].includes(style.position);
      if (named || positioned) target = parent;
    }
    return target;
  }
  function offsetNativeControlText() {
    if (IS_EMBED) return;
    const sound = findSoundControl();
    const controls = [workNote, sound].filter((element) => element instanceof HTMLElement);
    const targets = [...new Set(nativeControlTextCandidates(controls).map(
      (element) => nativeControlOffsetTarget(element, controls),
    ))];
    for (const target of targets) {
      const rect = target.getBoundingClientRect();
      const horizontallyRelevant = controls
        .map((control) => control.getBoundingClientRect())
        .filter((controlRect) => (
          Math.min(rect.right, controlRect.right) > Math.max(rect.left, controlRect.left)
        ));
      if (!horizontallyRelevant.some((controlRect) => rectsIntersect(rect, controlRect))) continue;
      const maxLift = Math.ceil(Math.max(48, innerHeight * .32));
      let lift = 0;
      for (let candidate = 1; candidate <= maxLift; candidate += 1) {
        const shifted = {
          left: rect.left,
          right: rect.right,
          top: rect.top - candidate,
          bottom: rect.bottom - candidate,
        };
        const clear = horizontallyRelevant.every((controlRect) => !rectsIntersect(shifted, {
          left: controlRect.left,
          right: controlRect.right,
          top: controlRect.top - GH_WORK_NOTE_GAP,
          bottom: controlRect.bottom + GH_WORK_NOTE_GAP,
        }));
        if (clear) {
          lift = candidate;
          break;
        }
      }
      if (lift <= 0) {
        if (isTouchLayout() && innerHeight <= 520) {
          target.dataset.ghControlConcealed = 'true';
        }
        continue;
      }
      target.dataset.ghControlOffset = 'true';
      target.style.setProperty('--gh-control-offset-y', `${-Math.ceil(lift)}px`);
    }
  }
  let soundObserver = null;
  function watchSoundControl() {
    soundObserver?.disconnect();
    const sound = findSoundControl();
    if (!sound) {
      soundObserver = new MutationObserver(() => {
        window.requestAnimationFrame(refreshFloatingChrome);
        if (findSoundControl()) {
          soundObserver.disconnect();
          watchSoundControl();
        }
      });
      soundObserver.observe(document.body, { childList: true, subtree: true });
      return;
    }
    soundObserver = new MutationObserver(() => {
      window.requestAnimationFrame(refreshFloatingChrome);
    });
    soundObserver.observe(sound, { attributes: true, childList: true, subtree: true, characterData: true });
  }
  function trackAudio(audio) {
    trackedAudio.add(audio);
    if (!mediaEnabled) silenceAudio(audio);
    return audio;
  }
  function silenceAudio(audio) {
    audio.muted = true;
    audio.removeAttribute('autoplay');
    audio.pause();
  }
  function silenceEmbeddedMedia() {
    document.querySelectorAll('audio').forEach(trackAudio);
    trackedAudio.forEach(silenceAudio);
    document.querySelectorAll('video').forEach((video) => { video.muted = true; });
  }
  function setEmbeddedMediaState(enabled) {
    mediaEnabled = enabled;
    if (document.body) document.body.dataset.ghAudioEnabled = enabled ? '1' : '0';
    document.querySelectorAll('audio').forEach(trackAudio);
    if (!enabled) {
      silenceEmbeddedMedia();
      return;
    }
    trackedAudio.forEach((audio) => {
      audio.muted = false;
      const playback = nativePlay.call(audio);
      if (playback && typeof playback.catch === 'function') playback.catch(() => {});
    });
  }
})();
</script>

  <style>

<body>
  <canvas id="c" aria-label="Interactive canvas artwork: Graceful Degradation"></canvas>
  <div class="hud">
    <b>Graceful Degradation / 优雅降级</b><br>
    A system has dignity when it can become less without becoming false.<br>
    <span class="dim">click = add pressure · D = degrade one layer · H = hierarchy · R = recover · Space = pause · S = save PNG</span>
  </div>
  <div class="gauge">
    <div class="label">pressure</div>
    <div class="value" id="pressure">00</div>
    <div class="bar" style="--w:0%" id="bar"><i></i></div>
    <div class="label">current honest shape</div>
    <div class="steps" id="steps"></div>
  </div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const pressureEl = document.getElementById('pressure');
  const barEl = document.getElementById('bar');
  const stepsEl = document.getElementById('steps');
  const TAU = Math.PI * 2;
  const DPR_CAP = 2;
  const cfg = { seed: 20260521, t: 0, pressure: 16, stage: 0, paused: false, hierarchy: true };
  const stages = [
    { name: 'ornament', zh: '装饰', threshold: 22, alpha: 1.00, radius: 1.14 },
    { name: 'abundance', zh: '丰裕', threshold: 39, alpha: .78, radius: .96 },
    { name: 'speed', zh: '速度', threshold: 56, alpha: .56, radius: .78 },
    { name: 'precision', zh: '精度', threshold: 71, alpha: .38, radius: .60 },
    { name: 'memory', zh: '记忆', threshold: 84, alpha: .20, radius: .43 },
    { name: 'truth', zh: '真实', threshold: 96, alpha: 1.00, radius: .24 }
  ];
  const names = ['cache', 'index', 'search', 'render', 'voice', 'map', 'forecast', 'archive', 'queue', 'mirror', 'sensor', 'scribe'];
  let W = 0, H = 0, dpr = 1, cx = 0, cy = 0, R = 0;
  let rng = mulberry32(cfg.seed);
  let services = [], sparks = [], dust = [], pulses = [];

  function mulberry32(a) {
    return function() {
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rand = (a = 1, b = 0) => b + rng() * (a - b);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, p) => a + (b - a) * p;
  const ease = x => x * x * (3 - 2 * x);

  function resize() {
    dpr = Math.min(DPR_CAP, window.devicePixelRatio || 1);
    W = Math.floor(window.innerWidth); H = Math.floor(window.innerHeight);
    canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W * 0.5; cy = H * 0.52; R = Math.min(W, H) * 0.34;
    build(false);
    draw();
  }

  function build(reset = true) {
    if (reset) { rng = mulberry32(cfg.seed); cfg.t = 0; cfg.pressure = 16; cfg.stage = 0; sparks = []; pulses = []; }
    services = [];
    dust = [];
    const count = Math.max(42, Math.floor((W * H) / 24500));
    for (let i = 0; i < count; i++) {
      const layer = i % 6;
      const a = (i / count) * TAU + rand(.22, -.22);
      const rr = R * stages[layer].radius * rand(1.08, .86);
      services.push({
        id: i, layer, name: names[i % names.length], a, rr,
        x: cx + Math.cos(a) * rr,
        y: cy + Math.sin(a) * rr * .70,
        phase: rand(TAU), size: rand(2.2, 6.8), health: rand(.74, 1)
      });
    }
    for (let i = 0; i < 420; i++) dust.push({ x: rand(W), y: rand(H), s: rand(.25, 1.4), a: rand(.03, .20), p: rand(TAU) });
  }

  function setStageFromPressure() {
    let next = 0;
    for (let i = 0; i < stages.length; i++) if (cfg.pressure >= stages[i].threshold) next = i;
    if (next !== cfg.stage) {
      cfg.stage = next;
      pulses.push({ r: R * stages[next].radius, life: 72, color: next > 3 ? '#df7759' : '#f6d893' });
    }
  }

  function addPressure(x, y, force = 1) {
    cfg.pressure = clamp(cfg.pressure + 8.5 * force, 0, 100);
    const angle = Math.atan2((y - cy) / .70, x - cx);
    for (let i = 0; i < 18 * force; i++) {
      const sp = rand(2.4, .5) * force;
      const a = angle + rand(1.2, -1.2);
      sparks.push({
        x: x + rand(22, -22), y: y + rand(22, -22),
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * .68,
        life: rand(66, 140), max: 140, heat: rand(.45, 1)
      });
    }
    setStageFromPressure();
  }

  function forceDegrade() {
    const target = Math.min(stages.length - 1, cfg.stage + 1);
    cfg.pressure = Math.max(cfg.pressure, stages[target].threshold + 1);
    setStageFromPressure();
  }

  function recover() {
    cfg.seed = (cfg.seed + 97) >>> 0;
    build(true);
    updateUI();
  }

  function update() {
    cfg.t++;
    cfg.pressure = lerp(cfg.pressure, Math.max(6, cfg.pressure - .018), .022);
    if (cfg.t % 168 === 0) {
      const a = rand(TAU);
      const rr = R * rand(1.18, .78);
      addPressure(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * .70, rand(.68, .28));
    }
    setStageFromPressure();
    services.forEach(s => {
      const targetAlpha = s.layer >= cfg.stage ? 1 : stages[s.layer].alpha * .30;
      s.health = lerp(s.health, targetAlpha, .035);
      const orbitSpeed = .00055 * (1 - cfg.stage * .105);
      s.a += orbitSpeed * (s.layer % 2 ? -1 : 1);
      const shrink = lerp(1, stages[Math.min(cfg.stage + 1, 5)].radius / Math.max(stages[s.layer].radius, .01), .11);
      const rr = s.rr * lerp(1, shrink, .34);
      s.x = cx + Math.cos(s.a + Math.sin(cfg.t * .006 + s.phase) * .018) * rr;
      s.y = cy + Math.sin(s.a) * rr * .70;
    });
    sparks.forEach(p => {
      const dx = cx - p.x, dy = cy - p.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      p.vx += dx / d * .018; p.vy += dy / d * .018;
      p.vx *= .985; p.vy *= .985;
      p.x += p.vx; p.y += p.vy; p.life -= .75;
    });
    sparks = sparks.filter(p => p.life > 0);
    pulses.forEach(p => p.life--);
    pulses = pulses.filter(p => p.life > 0);
    updateUI();
  }

  function background() {
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * .74);
    g.addColorStop(0, '#15232a'); g.addColorStop(.43, '#0b1117'); g.addColorStop(1, '#050609');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const p of dust) {
      const shimmer = .45 + .55 * Math.sin(cfg.t * .009 + p.p);
      ctx.fillStyle = `rgba(111,182,200,${p.a * (.28 + shimmer * .54)})`;
      ctx.fillRect(p.x, p.y + Math.sin(cfg.t * .002 + p.p) * 8, p.s, p.s);
    }
    ctx.restore();
  }

  function drawHierarchy() {
    if (!cfg.hierarchy) return;
    ctx.save();
    ctx.translate(cx, cy);
    for (let i = 0; i < stages.length; i++) {
      const gone = i < cfg.stage;
      const active = i === cfg.stage;
      const rr = R * stages[i].radius;
      ctx.beginPath();
      ctx.ellipse(0, 0, rr, rr * .70, 0, 0, TAU);
      ctx.strokeStyle = gone ? 'rgba(223,119,89,.12)' : active ? 'rgba(246,216,147,.44)' : 'rgba(111,182,200,.18)';
      ctx.lineWidth = active ? 1.6 : .9;
      ctx.setLineDash(i === 5 ? [] : [3, 15]);
      ctx.stroke();
      ctx.setLineDash([]);
      const labelX = Math.cos(-.72) * rr;
      const labelY = Math.sin(-.72) * rr * .70;
      ctx.fillStyle = gone ? 'rgba(223,119,89,.42)' : 'rgba(238,231,204,.32)';
      ctx.font = '10px ui-monospace, SFMono-Regular, Menlo, monospace';
      ctx.fillText(stages[i].name, labelX + 9, labelY);
    }
    ctx.restore();
  }

  function drawConnections() {
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (let i = 0; i < services.length; i++) {
      const a = services[i];
      for (let j = i + 1; j < services.length; j++) {
        const b = services[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d = dx * dx + dy * dy;
        if (d > 14800 || Math.abs(a.layer - b.layer) > 1) continue;
        const near = 1 - d / 14800;
        const health = Math.min(a.health, b.health);
        ctx.strokeStyle = `rgba(${a.layer < cfg.stage ? '223,119,89' : '111,182,200'},${near * health * .18})`;
        ctx.lineWidth = .55 + near * .7;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawServices() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const s of services) {
      const gone = s.layer < cfg.stage;
      const pulse = .5 + .5 * Math.sin(cfg.t * .028 + s.phase);
      const alpha = s.health * (gone ? .20 : .72);
      ctx.fillStyle = gone ? `rgba(223,119,89,${alpha * .28})` : `rgba(246,216,147,${alpha * (.52 + pulse * .28)})`;
      ctx.strokeStyle = gone ? `rgba(223,119,89,${alpha * .45})` : `rgba(111,182,200,${alpha * .48})`;
      ctx.lineWidth = gone ? .7 : 1.15;
      ctx.beginPath();
      ctx.rect(s.x - s.size * 1.7, s.y - s.size, s.size * 3.4, s.size * 2);
      ctx.fill(); ctx.stroke();
      if (!gone && s.layer >= cfg.stage + 1 && cfg.hierarchy && W > 760) {
        ctx.fillStyle = `rgba(238,231,204,${alpha * .34})`;
        ctx.font = '9px ui-monospace, SFMono-Regular, Menlo, monospace';
        ctx.fillText(s.name, s.x + s.size * 2.5, s.y + 3);
      }
    }
    ctx.restore();
  }

  function drawCore() {
    ctx.save();
    ctx.translate(cx, cy);
    const breath = 1 + Math.sin(cfg.t * .035) * .025;
    const heat = clamp((cfg.pressure - 60) / 40, 0, 1);
    const r = R * .116 * breath;
    const halo = ctx.createRadialGradient(0, 0, r * .2, 0, 0, r * 3.9);
    halo.addColorStop(0, `rgba(246,216,147,${.18 + heat * .18})`);
    halo.addColorStop(.34, `rgba(111,182,200,${.10 - heat * .04})`);
    halo.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(0, 0, r * 4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#101920';
    ctx.strokeStyle = heat > .6 ? '#df7759' : '#f6d893';
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = `rgba(246,216,147,${.82 - heat * .18})`;
    ctx.beginPath();
    ctx.moveTo(-r * .58, -r * .10);
    ctx.bezierCurveTo(-r * .28, -r * .52, r * .30, -r * .50, r * .58, -r * .08);
    ctx.bezierCurveTo(r * .24, r * .34, -r * .22, r * .35, -r * .58, -r * .10);
    ctx.fill();
    ctx.strokeStyle = '#071016';
    ctx.lineWidth = Math.max(3, r * .13);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-r * .26, r * .04); ctx.lineTo(-r * .05, -r * .28); ctx.lineTo(r * .10, .01); ctx.lineTo(r * .32, -r * .38);
    ctx.stroke();
    ctx.fillStyle = 'rgba(238,231,204,.44)';
    ctx.font = '10px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('truth stays', 0, r + 26);
    ctx.restore();
  }

  function drawSparks() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const p of sparks) {
      const a = clamp(p.life / p.max, 0, 1);
      ctx.strokeStyle = `rgba(223,119,89,${a * p.heat * .42})`;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx * 7, p.y - p.vy * 7);
      ctx.stroke();
      ctx.fillStyle = `rgba(246,216,147,${a * .55})`;
      ctx.fillRect(p.x, p.y, 1.4, 1.4);
    }
    for (const p of pulses) {
      const a = p.life / 72;
      ctx.strokeStyle = p.color === '#df7759' ? `rgba(223,119,89,${a * .34})` : `rgba(246,216,147,${a * .28})`;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(cx, cy, p.r * (1 + (1 - a) * .18), p.r * .70 * (1 + (1 - a) * .18), 0, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawCaption() {
    ctx.save();
    const y = H - 36;
    ctx.fillStyle = 'rgba(238,231,204,.48)';
    ctx.font = '12px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.fillText('collapse is not the first failure; the first failure is having no smaller honest shape', 24, y);
    const current = stages[cfg.stage];
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(246,216,147,.62)';
    ctx.fillText(`${current.name} / ${current.zh}`, W - 24, y);
    ctx.restore();
  }

  function updateUI() {
    const p = Math.round(cfg.pressure);
    pressureEl.textContent = String(p).padStart(2, '0');
    barEl.style.setProperty('--w', `${clamp(p, 0, 100)}%`);
    stepsEl.innerHTML = stages.map((s, i) => {
      const cls = i < cfg.stage ? ' class="gone"' : '';
      const mark = i < cfg.stage ? 'shed' : i === cfg.stage ? 'active' : 'held';
      return `<span${cls}><em>${s.name}</em><b>${mark}</b></span>`;
    }).join('');
  }

  function draw() {
    background();
    drawHierarchy();
    drawConnections();
    drawServices();
    drawSparks();
    drawCore();
    drawCaption();
    window._artReady = true;
    window.__artState = { pressure: cfg.pressure, stage: cfg.stage, services: services.length, sparks: sparks.length };
  }

  function loop() {
    if (!cfg.paused) update();
    draw();
    requestAnimationFrame(loop);
  }

  function savePNG() {
    const a = document.createElement('a');
    a.download = 'graceful-degradation-2026-05-21.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  }

  canvas.addEventListener('pointerdown', ev => addPressure(ev.clientX, ev.clientY, 1));
  window.addEventListener('resize', resize);
  window.addEventListener('keydown', ev => {
    if (ev.key === ' ') { cfg.paused = !cfg.paused; ev.preventDefault(); }
    else if (ev.key.toLowerCase() === 'd') forceDegrade();
    else if (ev.key.toLowerCase() === 'h') cfg.hierarchy = !cfg.hierarchy;
    else if (ev.key.toLowerCase() === 'r') recover();
    else if (ev.key.toLowerCase() === 's') savePNG();
  });

  window.__advanceArt = frames => {
    const n = Math.max(0, Math.floor(frames || 1));
    for (let i = 0; i < n; i++) update();
    draw();
    return window.__artState;
  };
  resize();
  loop();
})();
</script>

<style id="granted-hours-bgm-style">
  #granted-hours-sound-toggle {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 99999;
    border: 1px solid rgba(255,255,255,.28);
    border-radius: 999px;
    padding: 9px 13px;
    background: rgba(7, 10, 18, .68);
    color: rgba(245,248,255,.92);
    font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    letter-spacing: .08em;
    text-transform: uppercase;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 30px rgba(0,0,0,.28);
    cursor: pointer;
  }
  #granted-hours-sound-toggle:hover { background: rgba(20, 28, 46, .82); }
</style>
<audio id="granted-hours-bgm" src="./2026-05-21-graceful-degradation-bgm.mp3" preload="auto" autoplay loop></audio>
<button id="granted-hours-sound-toggle" type="button" aria-label="Toggle background music">sound on</button>
<script id="granted-hours-bgm-script">
(() => {
  const audio = document.getElementById('granted-hours-bgm');
  const button = document.getElementById('granted-hours-sound-toggle');
  if (!audio || !button) return;
  audio.volume = 0.42;
  let enabled = true;
  const label = () => {
    if (!enabled) button.textContent = 'sound off';
    else if (audio.paused) button.textContent = 'sound click';
    else button.textContent = 'sound on';
  };
  const play = async () => {
    enabled = true;
    try { await audio.play(); } catch (err) { /* Browser may require a click. */ }
    label();
  };
  const stop = () => { enabled = false; audio.pause(); label(); };
  const setSound = (next) => next ? play() : stop();
  button.addEventListener('click', () => {
    if (enabled && !audio.paused) setSound(false);
    else setSound(true);
  });
  document.addEventListener('pointerdown', () => { if (enabled && audio.paused) play(); }, { once: true });
  window.addEventListener('load', play, { once: true });
  audio.addEventListener('play', label);
  audio.addEventListener('pause', label);
  label();
})();
</script>
