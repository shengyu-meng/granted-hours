<script id="granted-hours-fold-script">
(() => {
  if (window.__grantedHoursFoldReady) return;
  window.__grantedHoursFoldReady = true;
  const STORAGE_KEY = 'grantedHoursTextFolded';
  const params = new URLSearchParams(window.location.search);
  const IS_EMBED = new URLSearchParams(window.location.search).get('embed') === 'calendar';
  const IS_TIMETABLE_FULL_VIEW = params.get('from') === 'timetable';
  const MEDIA_TYPE = 'granted-hours:media';
  const MEDIA_VERSION = 1;
  const EMBED_CHANNEL = params.get('gh_channel') || '';
  const PARENT_ORIGIN = (() => {
    try { return new URL(document.referrer).origin; }
    catch (_) { return ''; }
  })();
  const nativePlay = HTMLMediaElement.prototype.play;
  const NativeAudio = window.Audio;
  const trackedAudio = new Set();
  let mediaEnabled = false;
  if (IS_EMBED) {
    function GrantedHoursAudio(...args) {
      return trackAudio(new NativeAudio(...args));
    }
    Object.setPrototypeOf(GrantedHoursAudio, NativeAudio);
    GrantedHoursAudio.prototype = NativeAudio.prototype;
    window.Audio = GrantedHoursAudio;
    HTMLMediaElement.prototype.play = function (...args) {
      if (this instanceof HTMLAudioElement) {
        trackAudio(this);
        if (!mediaEnabled) {
          silenceAudio(this);
          return Promise.resolve();
        }
        this.muted = false;
      }
      if (this instanceof HTMLVideoElement) this.muted = true;
      return nativePlay.apply(this, args);
    };
    document.addEventListener('play', (event) => {
      if (event.target instanceof HTMLAudioElement) {
        trackAudio(event.target);
        if (!mediaEnabled) silenceAudio(event.target);
        else event.target.muted = false;
      } else if (event.target instanceof HTMLVideoElement) {
        event.target.muted = true;
      }
    }, true);
    window.addEventListener('message', (event) => {
      if (event.source !== window.parent) return;
      if (!PARENT_ORIGIN || event.origin !== PARENT_ORIGIN) return;
      const message = event.data;
      if (!message || Object.getPrototypeOf(message) !== Object.prototype) return;
      if (Object.keys(message).sort().join(',') !== 'action,channel,type,version') return;
      if (message.type !== MEDIA_TYPE || message.version !== MEDIA_VERSION) return;
      if (!/^[a-zA-Z0-9_-]{16,128}$/.test(EMBED_CHANNEL) || message.channel !== EMBED_CHANNEL) return;
      if (message.action === 'play') setEmbeddedMediaState(true);
      else if (message.action === 'pause') setEmbeddedMediaState(false);
    });
  }
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'gh-fold-toggle';
  btn.setAttribute('aria-controls', 'textPanel legend');
  btn.setAttribute('aria-label', 'Fold or unfold artwork text overlays');
  const actionRow = document.createElement('div');
  actionRow.className = 'gh-work-note-actions';
  const workNote = document.createElement('button');
  workNote.type = 'button';
  workNote.className = 'gh-work-note-action gh-work-note-button';
  workNote.textContent = 'Work note / 作品说明';
  workNote.setAttribute('aria-label', 'Open the artwork intention and context note / 打开作品发心与创作语境说明');
  workNote.setAttribute('aria-haspopup', 'dialog');
  workNote.setAttribute('aria-controls', 'gh-work-note-dialog');
  const archiveLink = document.createElement('a');
  archiveLink.className = 'gh-work-note-action gh-artwork-archive-link';
  archiveLink.href = '../';
  archiveLink.textContent = 'Artwork archive / 作品档案';
  archiveLink.setAttribute('aria-label', 'Open the artwork archive / 打开作品档案');
  actionRow.append(workNote, archiveLink);
  document.addEventListener('DOMContentLoaded', init, { once: true });
  if (document.readyState !== 'loading') init();
  function init() {
    if (!document.body || document.body.contains(btn)) return;
    if (IS_EMBED) {
      document.body.classList.add('gh-text-folded', 'gh-chamber-embed');
      silenceEmbeddedMedia();
      document.body.dataset.ghAudioEnabled = '0';
      new MutationObserver((records) => {
        records.forEach((record) => {
          record.addedNodes.forEach((node) => {
            if (!(node instanceof Element)) return;
            if (node instanceof HTMLAudioElement) trackAudio(node);
            node.querySelectorAll?.('audio').forEach(trackAudio);
            node.querySelectorAll?.('video').forEach((video) => { video.muted = true; });
          });
        });
      }).observe(document.documentElement, { childList: true, subtree: true });
      window.addEventListener('load', silenceEmbeddedMedia, { once: true });
      window.setTimeout(silenceEmbeddedMedia, 250);
      return;
    }
    const modalTemplate = document.getElementById('gh-work-note-template');
    if (!(modalTemplate instanceof HTMLTemplateElement)) return;
    const modal = modalTemplate.content.firstElementChild.cloneNode(true);
    const closeButton = modal.querySelector('.gh-work-note-close');
    if (!(modal instanceof HTMLElement) || !(closeButton instanceof HTMLButtonElement)) return;
    document.body.appendChild(modal);
    const workNoteHost = findWorkNoteHost() || createWorkNoteFallbackHost();
    workNoteHost.classList.add('gh-work-note-host');
    workNoteHost.appendChild(actionRow);
    document.body.appendChild(btn);
    const stored = localStorage.getItem(STORAGE_KEY);
    const mobileDefault = window.matchMedia && window.matchMedia('(max-width: 760px)').matches;
    setFolded(IS_TIMETABLE_FULL_VIEW ? false : (stored === null ? mobileDefault : stored === '1'), false);
    btn.addEventListener('click', () => setFolded(!document.body.classList.contains('gh-text-folded'), true));
    workNote.addEventListener('click', openWorkNote);
    closeButton.addEventListener('click', closeWorkNote);
    modal.addEventListener('click', (event) => {
      if (event.target === modal) closeWorkNote();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !modal.hidden) {
        event.preventDefault();
        closeWorkNote();
      }
    });
    function openWorkNote() {
      if (!modal.hidden) return;
      modal.hidden = false;
      document.body.classList.add('gh-work-note-open');
      closeButton.focus({ preventScroll: true });
    }
    function closeWorkNote() {
      if (modal.hidden) return;
      modal.hidden = true;
      document.body.classList.remove('gh-work-note-open');
      workNote.focus({ preventScroll: true });
    }
  }
  function findWorkNoteHost() {
    const candidates = new Set(document.querySelectorAll(
      '.panel, #panel, #textPanel, .card, .hud, .caption, .plate, .label, .intro, .info, .statement, header, .fallback'
    ));
    document.querySelectorAll('h1, h2, .title').forEach((title) => {
      let current = title.parentElement;
      while (current && current !== document.body) {
        candidates.add(current);
        if (current.matches('section, aside, header, article, main, .panel, .card, .hud, .caption, .plate, .label, .intro, .info')) break;
        current = current.parentElement;
      }
    });
    const scored = [...candidates]
      .filter((element) => {
        if (!(element instanceof HTMLElement)) return false;
        if (element.closest('.gh-fold-toggle, .gh-work-note-actions, .gh-work-note-modal')) return false;
        const style = getComputedStyle(element);
        const rect = element.getBoundingClientRect();
        return style.display !== 'none'
          && style.visibility !== 'hidden'
          && rect.width >= 120
          && rect.height >= 24;
      })
      .map((element) => {
        const rect = element.getBoundingClientRect();
        const identity = `${element.id} ${element.className}`.toLowerCase();
        let score = Math.min((element.textContent || '').trim().length, 120) / 8;
        if (element.querySelector('h1')) score += 180;
        else if (element.querySelector('h2')) score += 90;
        if (element.querySelector('.title')) score += 70;
        if (/panel|card|hud|caption|plate|intro|info/.test(identity) || element.tagName === 'HEADER') score += 45;
        if (/legend|hint|control|toolbar|status|sound|meter|gauge/.test(identity)) score -= 120;
        if (rect.left <= innerWidth * .45) score += 24;
        if (rect.top <= innerHeight * .45) score += 24;
        if (rect.width >= 220 && rect.width <= Math.max(760, innerWidth * .72)) score += 16;
        return { element, score };
      })
      .sort((left, right) => right.score - left.score);
    return scored[0]?.element || null;
  }
  function createWorkNoteFallbackHost() {
    const host = document.createElement('aside');
    host.className = 'gh-work-note-host-fallback';
    host.setAttribute('aria-label', 'Artwork information / 作品信息');
    document.body.appendChild(host);
    return host;
  }
  function setFolded(folded, persist) {
    document.body.classList.toggle('gh-text-folded', folded);
    btn.textContent = folded ? 'Show text / 显示文字' : 'Fold text / 折叠文字';
    btn.setAttribute('aria-pressed', folded ? 'true' : 'false');
    if (persist) localStorage.setItem(STORAGE_KEY, folded ? '1' : '0');
  }
  function trackAudio(audio) {
    trackedAudio.add(audio);
    if (!mediaEnabled) silenceAudio(audio);
    return audio;
  }
  function silenceAudio(audio) {
    audio.muted = true;
    audio.removeAttribute('autoplay');
    audio.pause();
  }
  function silenceEmbeddedMedia() {
    document.querySelectorAll('audio').forEach(trackAudio);
    trackedAudio.forEach(silenceAudio);
    document.querySelectorAll('video').forEach((video) => { video.muted = true; });
  }
  function setEmbeddedMediaState(enabled) {
    mediaEnabled = enabled;
    if (document.body) document.body.dataset.ghAudioEnabled = enabled ? '1' : '0';
    document.querySelectorAll('audio').forEach(trackAudio);
    if (!enabled) {
      silenceEmbeddedMedia();
      return;
    }
    trackedAudio.forEach((audio) => {
      audio.muted = false;
      const playback = nativePlay.call(audio);
      if (playback && typeof playback.catch === 'function') playback.catch(() => {});
    });
  }
})();
</script>

      position: fixed;
      right: clamp(16px, 4vw, 56px);
      bottom: clamp(16px, 4vw, 46px);
      display: grid;
      gap: 10px;
      min-width: min(340px, calc(100vw - 32px));
      pointer-events: none;
      font-size: 13px;
      color: var(--muted);
    }

    .row {
      display: grid;
      grid-template-columns: 92px 1fr 42px;
      gap: 10px;
      align-items: center;
    }

    .bar {
      height: 5px;
      border-radius: 999px;
      background: rgba(247, 240, 223, 0.13);
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 50%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--red), var(--gold), var(--cyan));
    }

    .keys {
      position: fixed;
      left: clamp(18px, 4vw, 64px);
      bottom: clamp(14px, 4vw, 42px);
      color: rgba(247, 240, 223, 0.54);
      font-size: 12px;
      line-height: 1.7;
      pointer-events: none;
    }

    @media (max-width: 720px) {
      .readout { display: none; }
      .panel { top: 18px; }
      .keys { max-width: calc(100vw - 36px); }
    }
  </style>
</head>
<body>
  <canvas id="field" aria-label="Interactive generative artwork named Verifiable Beauty"></canvas>
  <section class="panel" aria-hidden="true">
    <h1>Verifiable<br>Beauty</h1>
    <p class="subtitle">Beauty may stay, but it must leave evidence. Move, click, and let the decorative field answer to its measurements.</p>
  </section>
  <section class="readout" id="readout" aria-hidden="true"></section>
  <section class="keys" aria-hidden="true">move: bend field · click: add evidence · E: evidence · B: beauty layer · R: reset · Space: pause · S: save still</section>

  <script>
    (() => {
      const canvas = document.getElementById('field');
      const ctx = canvas.getContext('2d', { alpha: false });
      const readout = document.getElementById('readout');
      const TAU = Math.PI * 2;
      const claims = [
        { name: 'proportion', color: '#ff6f61', phase: 0.10, base: 0.61 },
        { name: 'tension', color: '#f4c430', phase: 1.28, base: 0.47 },
        { name: 'memory', color: '#6bd6c8', phase: 2.52, base: 0.55 },
        { name: 'constraint', color: '#7fb069', phase: 3.74, base: 0.42 },
        { name: 'repair', color: '#8ecae6', phase: 4.88, base: 0.52 }
      ];

      let dpr = 1;
      let w = 0;
      let h = 0;
      let cx = 0;
      let cy = 0;
      let scale = 1;
      let t = 0;
      let paused = false;
      let evidenceVisible = true;
      let beautyVisible = true;
      let evidence = 0.34;
      let pointer = { x: 0.5, y: 0.5, active: false };
      let sparks = [];

      function mulberry32(seed) {
        return function rand() {
          let a = seed += 0x6D2B79F5;
          a = Math.imul(a ^ (a >>> 15), a | 1);
          a ^= a + Math.imul(a ^ (a >>> 7), a | 61);
          return ((a ^ (a >>> 14)) >>> 0) / 4294967296;
        };
      }

      const rand = mulberry32(20260524);
      const particles = Array.from({ length: 320 }, (_, i) => ({
        a: rand() * TAU,
        r: 0.18 + Math.pow(rand(), 0.55) * 0.76,
        s: 0.18 + rand() * 0.84,
        k: i % claims.length,
        drift: (rand() - 0.5) * 0.006,
        size: 0.7 + rand() * 2.4
      }));

      function resize() {
        dpr = Math.min(2, window.devicePixelRatio || 1);
        w = Math.floor(window.innerWidth);
        h = Math.floor(window.innerHeight);
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        canvas.style.width = `${w}px`;
        canvas.style.height = `${h}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cx = w * 0.52;
        cy = h * 0.53;
        scale = Math.min(w, h) * 0.42;
      }

      function claimValue(claim, i) {
        const mousePull = Math.hypot(pointer.x - 0.5, pointer.y - 0.5);
        const wave = 0.18 * Math.sin(t * (0.75 + i * 0.09) + claim.phase);
        const counter = 0.09 * Math.cos(t * 1.13 - claim.phase * 1.7);
        const proof = evidence * (0.18 + i * 0.055);
        return Math.max(0.08, Math.min(0.98, claim.base + wave - counter + proof - mousePull * 0.12));
      }

      function drawBackground() {
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.74);
        g.addColorStop(0, '#f8f3df');
        g.addColorStop(0.23, '#d9ece7');
        g.addColorStop(0.55, '#233649');
        g.addColorStop(1, '#0d1117');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);

        ctx.save();
        ctx.globalAlpha = 0.08;
        ctx.strokeStyle = '#f7f0df';
        ctx.lineWidth = 1;
        for (let y = -80; y < h + 120; y += 54) {
          ctx.beginPath();
          for (let x = -40; x < w + 60; x += 24) {
            const yy = y + Math.sin(x * 0.008 + t * 0.6) * 14;
            if (x === -40) ctx.moveTo(x, yy);
            else ctx.lineTo(x, yy);
          }
          ctx.stroke();
        }
        ctx.restore();
      }

      function polar(a, r, squash = 0.78) {
        const bendX = (pointer.x - 0.5) * scale * 0.18;
        const bendY = (pointer.y - 0.5) * scale * 0.14;
        return {
          x: cx + Math.cos(a) * r * scale + bendX * (1 - r),
          y: cy + Math.sin(a) * r * scale * squash + bendY * (1 - r)
        };
      }

      function drawEvidence() {
        if (!evidenceVisible) return;
        ctx.save();
        ctx.globalAlpha = 0.36 + evidence * 0.34;
        ctx.lineWidth = 1;
        claims.forEach((claim, i) => {
          const v = claimValue(claim, i);
          const a = claim.phase + t * 0.16;
          const p1 = polar(a, 0.18 + v * 0.42);
          const p2 = polar(a, 0.94);
          ctx.strokeStyle = claim.color;
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(p2.x, p2.y, 7 + v * 13, 0, TAU);
          ctx.stroke();

          ctx.fillStyle = '#0d1117';
          ctx.globalAlpha = 0.42;
          ctx.fillRect(p2.x - 38, p2.y - 11, 76, 22);
          ctx.globalAlpha = 0.86;
          ctx.fillStyle = '#f7f0df';
          ctx.font = '12px Inter, Avenir, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(`${Math.round(v * 100)}%`, p2.x, p2.y + 4);
          ctx.globalAlpha = 0.36 + evidence * 0.34;
        });

        for (let r = 0.22; r <= 0.92; r += 0.14) {
          ctx.strokeStyle = r > 0.64 ? 'rgba(247,240,223,0.24)' : 'rgba(13,17,23,0.22)';
          ctx.setLineDash([4, 12]);
          ctx.beginPath();
          ctx.ellipse(cx, cy, r * scale, r * scale * 0.78, 0, 0, TAU);
          ctx.stroke();
        }
        ctx.restore();
        ctx.setLineDash([]);
      }

      function drawBeautyLayer() {
        if (!beautyVisible) return;
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        particles.forEach((p, idx) => {
          const claim = claims[p.k];
          const v = claimValue(claim, p.k);
          const wobble = Math.sin(t * p.s + p.a * 3) * (0.03 + evidence * 0.04);
          const a = p.a + t * p.drift * 16 + Math.sin(t * 0.21 + idx) * 0.012;
          const pos = polar(a, p.r + wobble);
          const alpha = 0.12 + v * 0.36;
          ctx.globalAlpha = alpha;
          ctx.fillStyle = claim.color;
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, p.size * (0.7 + v), 0, TAU);
          ctx.fill();
        });
        ctx.restore();
      }

      function drawCentralClaim() {
        ctx.save();
        const pulse = 1 + Math.sin(t * 1.6) * 0.025;
        const grd = ctx.createLinearGradient(cx - scale * 0.28, cy - scale * 0.24, cx + scale * 0.3, cy + scale * 0.28);
        grd.addColorStop(0, '#ff6f61');
        grd.addColorStop(0.48, '#f4c430');
        grd.addColorStop(1, '#6bd6c8');
        ctx.globalAlpha = 0.84;
        ctx.fillStyle = grd;
        ctx.beginPath();
        for (let i = 0; i <= 180; i++) {
          const a = i / 180 * TAU;
          const lobe = 0.68 + 0.16 * Math.sin(a * 4 + t) + 0.07 * Math.cos(a * 7 - t * 0.7);
          const r = scale * 0.28 * lobe * pulse;
          const x = cx + Math.cos(a) * r;
          const y = cy + Math.sin(a) * r * 0.78;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();

        ctx.globalAlpha = 0.58;
        ctx.strokeStyle = '#0d1117';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.globalAlpha = 0.84;
        ctx.fillStyle = '#0d1117';
        ctx.font = `${Math.max(14, Math.min(22, scale * 0.045))}px Inter, Avenir, sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText('I can show my supports.', cx, cy + 6);
        ctx.restore();
      }

      function drawSparks() {
        ctx.save();
        sparks = sparks.filter(s => s.life > 0);
        sparks.forEach(s => {
          s.life -= 0.016;
          s.x += s.vx;
          s.y += s.vy;
          ctx.globalAlpha = Math.max(0, s.life);
          ctx.fillStyle = s.color;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, TAU);
          ctx.fill();
        });
        ctx.restore();
      }

      function updateReadout() {
        readout.innerHTML = claims.map((claim, i) => {
          const v = claimValue(claim, i);
          return `<div class="row"><span>${claim.name}</span><div class="bar"><div class="fill" style="width:${Math.round(v * 100)}%; background:${claim.color}"></div></div><span>${Math.round(v * 100)}%</span></div>`;
        }).join('');
      }

      function loop() {
        if (!paused) t += 0.016;
        evidence = Math.max(0.08, Math.min(1, evidence * 0.995 + 0.0012));
        drawBackground();
        drawBeautyLayer();
        drawEvidence();
        drawCentralClaim();
        drawSparks();
        updateReadout();
        window._artReady = true;
        requestAnimationFrame(loop);
      }

      function addEvidence(x, y) {
        evidence = Math.min(1, evidence + 0.13);
        const palette = claims.map(c => c.color);
        for (let i = 0; i < 34; i++) {
          const a = rand() * TAU;
          const speed = 0.6 + rand() * 4.2;
          sparks.push({
            x,
            y,
            vx: Math.cos(a) * speed,
            vy: Math.sin(a) * speed,
            r: 1 + rand() * 3.2,
            life: 0.45 + rand() * 0.55,
            color: palette[Math.floor(rand() * palette.length)]
          });
        }
      }

      function saveStill() {
        const link = document.createElement('a');
        link.download = 'verifiable-beauty.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      }

      window.addEventListener('resize', resize);
      window.addEventListener('pointermove', event => {
        pointer.x = event.clientX / Math.max(1, w);
        pointer.y = event.clientY / Math.max(1, h);
        pointer.active = true;
      });
      window.addEventListener('pointerdown', event => addEvidence(event.clientX, event.clientY));
      window.addEventListener('keydown', event => {
        if (event.key === ' ') {
          paused = !paused;
          event.preventDefault();
        } else if (event.key.toLowerCase() === 'e') {
          evidenceVisible = !evidenceVisible;
        } else if (event.key.toLowerCase() === 'b') {
          beautyVisible = !beautyVisible;
        } else if (event.key.toLowerCase() === 'r') {
          evidence = 0.34;
          sparks = [];
          beautyVisible = true;
          evidenceVisible = true;
        } else if (event.key.toLowerCase() === 's') {
          saveStill();
        }
      });

      resize();
      loop();
    })();
  </script>

<style id="granted-hours-bgm-style">
  #granted-hours-sound-toggle {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 99999;
    border: 1px solid rgba(255,255,255,.28);
    border-radius: 999px;
    padding: 9px 13px;
    background: rgba(7, 10, 18, .68);
    color: rgba(245,248,255,.92);
    font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    letter-spacing: .08em;
    text-transform: uppercase;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 30px rgba(0,0,0,.28);
    cursor: pointer;
  }
  #granted-hours-sound-toggle:hover { background: rgba(20, 28, 46, .82); }
</style>
<audio id="granted-hours-bgm" src="./2026-05-24-verifiable-beauty-bgm.mp3" preload="auto" autoplay loop></audio>
<button id="granted-hours-sound-toggle" type="button" aria-label="Toggle background music">sound on</button>
<script id="granted-hours-bgm-script">
(() => {
  const audio = document.getElementById('granted-hours-bgm');
  const button = document.getElementById('granted-hours-sound-toggle');
  if (!audio || !button) return;
  audio.volume = 0.42;
  let enabled = true;
  const label = () => {
    if (!enabled) button.textContent = 'sound off';
    else if (audio.paused) button.textContent = 'sound click';
    else button.textContent = 'sound on';
  };
  const play = async () => {
    enabled = true;
    try { await audio.play(); } catch (err) { /* Browser may require a click. */ }
    label();
  };
  const stop = () => { enabled = false; audio.pause(); label(); };
  const setSound = (next) => next ? play() : stop();
  button.addEventListener('click', () => {
    if (enabled && !audio.paused) setSound(false);
    else setSound(true);
  });
  document.addEventListener('pointerdown', () => { if (enabled && audio.paused) play(); }, { once: true });
  window.addEventListener('load', play, { once: true });
  audio.addEventListener('play', label);
  audio.addEventListener('pause', label);
  label();
})();
</script>
