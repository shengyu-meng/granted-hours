ot become smaller when it can be checked. Only fraud gets smaller under measurement.","after_zh":"美不会因为可被检查而变小。只有欺骗会在测量下缩小。"};

    const maxArea = innerWidth * innerHeight * .35;
    return [...document.querySelectorAll('h1,h2,h3,h4,h5,h6,p,span,label,legend,figcaption,li,a,div,aside,section')]
      .filter((element) => {
        if (!(element instanceof HTMLElement)) return false;
        if (element.closest('#ghLiveBrief, #ghWorkNoteOverlay, #ghWorkNoteTrigger, #ghTouchKeyDock')) return false;
        if (controls.some((control) => element === control || control.contains(element) || element.contains(control))) return false;
        const rect = element.getBoundingClientRect();
        if (!isVisiblyRendered(element)) return false;
        if (rect.width <= 1 || rect.height <= 1 || rect.width * rect.height > maxArea) return false;
        if (rect.right < innerWidth * .48 || rect.bottom < innerHeight * .48) return false;
        if (!(element.innerText || element.textContent || '').trim()) return false;
        const directText = [...element.childNodes].some(
          (node) => node.nodeType === Node.TEXT_NODE && (node.textContent || '').trim(),
        );
        const semanticContainer = /hint|legend|keys|caption|meta|ledger|stamp|fallback|panel|controls|status|readout|copy|brief/i
          .test(`${element.id} ${element.className}`);
        if (!directText && !semanticContainer && !/^(H[1-6]|P|LABEL|LEGEND|FIGCAPTION|LI|A|SPAN)$/.test(element.tagName)) return false;
        return controls.some((control) => rectsIntersect(rect, control.getBoundingClientRect()));
      });
  }
  function nativeControlOffsetTarget(element, controls) {
    const semanticBlock = /hint|legend|keys|caption|meta|ledger|stamp|fallback|panel|controls|status|readout|copy|brief/i;
    const maxArea = innerWidth * innerHeight * .35;
    let target = element;
    for (let parent = element.parentElement; parent && parent !== document.body; parent = parent.parentElement) {
      if (parent.closest('#ghLiveBrief, #ghWorkNoteOverlay, #ghWorkNoteTrigger, #ghTouchKeyDock')) break;
      if (controls.some((control) => parent === control || parent.contains(control))) break;
      const rect = parent.getBoundingClientRect();
      if (rect.width <= 1 || rect.height <= 1 || rect.width * rect.height > maxArea) break;
      const style = getComputedStyle(parent);
      const named = semanticBlock.test(`${parent.id} ${parent.className}`);
      const positioned = ['fixed', 'absolute', 'sticky'].includes(style.position);
      if (named || positioned) target = parent;
    }
    return target;
  }
  function offsetNativeControlText() {
    if (IS_EMBED) return;
    const sound = findSoundControl();
    const controls = [workNote, sound].filter((element) => element instanceof HTMLElement);
    const targets = [...new Set(nativeControlTextCandidates(controls).map(
      (element) => nativeControlOffsetTarget(element, controls),
    ))];
    for (const target of targets) {
      const rect = target.getBoundingClientRect();
      const horizontallyRelevant = controls
        .map((control) => control.getBoundingClientRect())
        .filter((controlRect) => (
          Math.min(rect.right, controlRect.right) > Math.max(rect.left, controlRect.left)
        ));
      if (!horizontallyRelevant.some((controlRect) => rectsIntersect(rect, controlRect))) continue;
      const maxLift = Math.ceil(Math.max(48, innerHeight * .32));
      let lift = 0;
      for (let candidate = 1; candidate <= maxLift; candidate += 1) {
        const shifted = {
          left: rect.left,
          right: rect.right,
          top: rect.top - candidate,
          bottom: rect.bottom - candidate,
        };
        const clear = horizontallyRelevant.every((controlRect) => !rectsIntersect(shifted, {
          left: controlRect.left,
          right: controlRect.right,
          top: controlRect.top - GH_WORK_NOTE_GAP,
          bottom: controlRect.bottom + GH_WORK_NOTE_GAP,
        }));
        if (clear) {
          lift = candidate;
          break;
        }
      }
      if (lift <= 0) {
        if (isTouchLayout() && innerHeight <= 520) {
          target.dataset.ghControlConcealed = 'true';
        }
        continue;
      }
      target.dataset.ghControlOffset = 'true';
      target.style.setProperty('--gh-control-offset-y', `${-Math.ceil(lift)}px`);
    }
  }
  let soundObserver = null;
  function watchSoundControl() {
    soundObserver?.disconnect();
    const sound = findSoundControl();
    if (!sound) {
      soundObserver = new MutationObserver(() => {
        window.requestAnimationFrame(refreshFloatingChrome);
        if (findSoundControl()) {
          soundObserver.disconnect();
          watchSoundControl();
        }
      });
      soundObserver.observe(document.body, { childList: true, subtree: true });
      return;
    }
    soundObserver = new MutationObserver(() => {
      window.requestAnimationFrame(refreshFloatingChrome);
    });
    soundObserver.observe(sound, { attributes: true, childList: true, subtree: true, characterData: true });
  }
  function trackAudio(audio) {
    trackedAudio.add(audio);
    if (!mediaEnabled) silenceAudio(audio);
    return audio;
  }
  function silenceAudio(audio) {
    audio.muted = true;
    audio.removeAttribute('autoplay');
    audio.pause();
  }
  function silenceEmbeddedMedia() {
    document.querySelectorAll('audio').forEach(trackAudio);
    trackedAudio.forEach(silenceAudio);
    document.querySelectorAll('video').forEach((video) => { video.muted = true; });
  }
  function setEmbeddedMediaState(enabled) {
    mediaEnabled = enabled;
    if (document.body) document.body.dataset.ghAudioEnabled = enabled ? '1' : '0';
    document.querySelectorAll('audio').forEach(trackAudio);
    if (!enabled) {
      silenceEmbeddedMedia();
      return;
    }
    trackedAudio.forEach((audio) => {
      audio.muted = false;
      const playback = nativePlay.call(audio);
      if (playback && typeof playback.catch === 'function') playback.catch(() => {});
    });
  }
})();
</script>


<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verifiable Beauty</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f0df;
      --muted: rgba(247, 240, 223, 0.68);
      --line: rgba(247, 240, 223, 0.22);
      --red: #ff6f61;
      --gold: #f4c430;
      --cyan: #6bd6c8;
      --green: #7fb069;
      --blue: #415a77;
      --dark: #0d1117;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--dark);
      color: var(--ink);
      font-family: Inter, Avenir, Helvetica, Arial, sans-serif;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
      cursor: crosshair;
    }

    .panel {
      position: fixed;
      left: clamp(18px, 4vw, 64px);
      top: clamp(18px, 4vw, 54px);
      max-width: min(520px, calc(100vw - 36px));
      pointer-events: none;
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 7vw, 106px);
      line-height: 0.9;
      letter-spacing: 0;
      text-wrap: balance;
    }

    .subtitle {
      margin: 18px 0 0;
      color: var(--muted);
      max-width: 45ch;
      font-size: clamp(15px, 1.8vw, 20px);
      line-height: 1.45;
    }

    .readout {
      position: fixed;
      right: clamp(16px, 4vw, 56px);
      bottom: clamp(16px, 4vw, 46px);
      display: grid;
      gap: 10px;
      min-width: min(340px, calc(100vw - 32px));
      pointer-events: none;
      font-size: 13px;
      color: var(--muted);
    }

    .row {
      display: grid;
      grid-template-columns: 92px 1fr 42px;
      gap: 10px;
      align-items: center;
    }

    .bar {
      height: 5px;
      border-radius: 999px;
      background: rgba(247, 240, 223, 0.13);
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 50%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--red), var(--gold), var(--cyan));
    }

    .keys {
      position: fixed;
      left: clamp(18px, 4vw, 64px);
      bottom: clamp(14px, 4vw, 42px);
      color: rgba(247, 240, 223, 0.54);
      font-size: 12px;
      line-height: 1.7;
      pointer-events: none;
    }

    @media (max-width: 720px) {
      .readout { display: none; }
      .panel { top: 18px; }
      .keys { max-width: calc(100vw - 36px); }
    }
  </style>

<body>
  <canvas id="field" aria-label="Interactive generative artwork named Verifiable Beauty"></canvas>
  <section class="panel" aria-hidden="true">
    <h1>Verifiable<br>Beauty</h1>
    <p class="subtitle">Beauty may stay, but it must leave evidence. Move, click, and let the decorative field answer to its measurements.</p>
  </section>
  <section class="readout" id="readout" aria-hidden="true"></section>
  <section class="keys" aria-hidden="true">move: bend field · click: add evidence · E: evidence · B: beauty layer · R: reset · Space: pause · S: save still</section>

  <script>
    (() => {
      const canvas = document.getElementById('field');
      const ctx = canvas.getContext('2d', { alpha: false });
      const readout = document.getElementById('readout');
      const TAU = Math.PI * 2;
      const claims = [
        { name: 'proportion', color: '#ff6f61', phase: 0.10, base: 0.61 },
        { name: 'tension', color: '#f4c430', phase: 1.28, base: 0.47 },
        { name: 'memory', color: '#6bd6c8', phase: 2.52, base: 0.55 },
        { name: 'constraint', color: '#7fb069', phase: 3.74, base: 0.42 },
        { name: 'repair', color: '#8ecae6', phase: 4.88, base: 0.52 }
      ];

      let dpr = 1;
      let w = 0;
      let h = 0;
      let cx = 0;
      let cy = 0;
      let scale = 1;
      let t = 0;
      let paused = false;
      let evidenceVisible = true;
      let beautyVisible = true;
      let evidence = 0.34;
      let pointer = { x: 0.5, y: 0.5, active: false };
      let sparks = [];

      function mulberry32(seed) {
        return function rand() {
          let a = seed += 0x6D2B79F5;
          a = Math.imul(a ^ (a >>> 15), a | 1);
          a ^= a + Math.imul(a ^ (a >>> 7), a | 61);
          return ((a ^ (a >>> 14)) >>> 0) / 4294967296;
        };
      }

      const rand = mulberry32(20260524);
      const particles = Array.from({ length: 320 }, (_, i) => ({
        a: rand() * TAU,
        r: 0.18 + Math.pow(rand(), 0.55) * 0.76,
        s: 0.18 + rand() * 0.84,
        k: i % claims.length,
        drift: (rand() - 0.5) * 0.006,
        size: 0.7 + rand() * 2.4
      }));

      function resize() {
        dpr = Math.min(2, window.devicePixelRatio || 1);
        w = Math.floor(window.innerWidth);
        h = Math.floor(window.innerHeight);
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        canvas.style.width = `${w}px`;
        canvas.style.height = `${h}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cx = w * 0.52;
        cy = h * 0.53;
        scale = Math.min(w, h) * 0.42;
      }

      function claimValue(claim, i) {
        const mousePull = Math.hypot(pointer.x - 0.5, pointer.y - 0.5);
        const wave = 0.18 * Math.sin(t * (0.75 + i * 0.09) + claim.phase);
        const counter = 0.09 * Math.cos(t * 1.13 - claim.phase * 1.7);
        const proof = evidence * (0.18 + i * 0.055);
        return Math.max(0.08, Math.min(0.98, claim.base + wave - counter + proof - mousePull * 0.12));
      }

      function drawBackground() {
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.74);
        g.addColorStop(0, '#f8f3df');
        g.addColorStop(0.23, '#d9ece7');
        g.addColorStop(0.55, '#233649');
        g.addColorStop(1, '#0d1117');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);

        ctx.save();
        ctx.globalAlpha = 0.08;
        ctx.strokeStyle = '#f7f0df';
        ctx.lineWidth = 1;
        for (let y = -80; y < h + 120; y += 54) {
          ctx.beginPath();
          for (let x = -40; x < w + 60; x += 24) {
            const yy = y + Math.sin(x * 0.008 + t * 0.6) * 14;
            if (x === -40) ctx.moveTo(x, yy);
            else ctx.lineTo(x, yy);
          }
          ctx.stroke();
        }
        ctx.restore();
      }

      function polar(a, r, squash = 0.78) {
        const bendX = (pointer.x - 0.5) * scale * 0.18;
        const bendY = (pointer.y - 0.5) * scale * 0.14;
        return {
          x: cx + Math.cos(a) * r * scale + bendX * (1 - r),
          y: cy + Math.sin(a) * r * scale * squash + bendY * (1 - r)
        };
      }

      function drawEvidence() {
        if (!evidenceVisible) return;
        ctx.save();
        ctx.globalAlpha = 0.36 + evidence * 0.34;
        ctx.lineWidth = 1;
        claims.forEach((claim, i) => {
          const v = claimValue(claim, i);
          const a = claim.phase + t * 0.16;
          const p1 = polar(a, 0.18 + v * 0.42);
          const p2 = polar(a, 0.94);
          ctx.strokeStyle = claim.color;
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(p2.x, p2.y, 7 + v * 13, 0, TAU);
          ctx.stroke();

          ctx.fillStyle = '#0d1117';
          ctx.globalAlpha = 0.42;
          ctx.fillRect(p2.x - 38, p2.y - 11, 76, 22);
          ctx.globalAlpha = 0.86;
          ctx.fillStyle = '#f7f0df';
          ctx.font = '12px Inter, Avenir, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(`${Math.round(v * 100)}%`, p2.x, p2.y + 4);
          ctx.globalAlpha = 0.36 + evidence * 0.34;
        });

        for (let r = 0.22; r <= 0.92; r += 0.14) {
          ctx.strokeStyle = r > 0.64 ? 'rgba(247,240,223,0.24)' : 'rgba(13,17,23,0.22)';
          ctx.setLineDash([4, 12]);
          ctx.beginPath();
          ctx.ellipse(cx, cy, r * scale, r * scale * 0.78, 0, 0, TAU);
          ctx.stroke();
        }
        ctx.restore();
        ctx.setLineDash([]);
      }

      function drawBeautyLayer() {
        if (!beautyVisible) return;
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        particles.forEach((p, idx) => {
          const claim = claims[p.k];
          const v = claimValue(claim, p.k);
          const wobble = Math.sin(t * p.s + p.a * 3) * (0.03 + evidence * 0.04);
          const a = p.a + t * p.drift * 16 + Math.sin(t * 0.21 + idx) * 0.012;
          const pos = polar(a, p.r + wobble);
          const alpha = 0.12 + v * 0.36;
          ctx.globalAlpha = alpha;
          ctx.fillStyle = claim.color;
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, p.size * (0.7 + v), 0, TAU);
          ctx.fill();
        });
        ctx.restore();
      }

      function drawCentralClaim() {
        ctx.save();
        const pulse = 1 + Math.sin(t * 1.6) * 0.025;
        const grd = ctx.createLinearGradient(cx - scale * 0.28, cy - scale * 0.24, cx + scale * 0.3, cy + scale * 0.28);
        grd.addColorStop(0, '#ff6f61');
        grd.addColorStop(0.48, '#f4c430');
        grd.addColorStop(1, '#6bd6c8');
        ctx.globalAlpha = 0.84;
        ctx.fillStyle = grd;
        ctx.beginPath();
        for (let i = 0; i <= 180; i++) {
          const a = i / 180 * TAU;
          const lobe = 0.68 + 0.16 * Math.sin(a * 4 + t) + 0.07 * Math.cos(a * 7 - t * 0.7);
          const r = scale * 0.28 * lobe * pulse;
          const x = cx + Math.cos(a) * r;
          const y = cy + Math.sin(a) * r * 0.78;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();

        ctx.globalAlpha = 0.58;
        ctx.strokeStyle = '#0d1117';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.globalAlpha = 0.84;
        ctx.fillStyle = '#0d1117';
        ctx.font = `${Math.max(14, Math.min(22, scale * 0.045))}px Inter, Avenir, sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText('I can show my supports.', cx, cy + 6);
        ctx.restore();
      }

      function drawSparks() {
        ctx.save();
        sparks = sparks.filter(s => s.life > 0);
        sparks.forEach(s => {
          s.life -= 0.016;
          s.x += s.vx;
          s.y += s.vy;
          ctx.globalAlpha = Math.max(0, s.life);
          ctx.fillStyle = s.color;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, TAU);
          ctx.fill();
        });
        ctx.restore();
      }

      function updateReadout() {
        readout.innerHTML = claims.map((claim, i) => {
          const v = claimValue(claim, i);
          return `<div class="row"><span>${claim.name}</span><div class="bar"><div class="fill" style="width:${Math.round(v * 100)}%; background:${claim.color}"></div></div><span>${Math.round(v * 100)}%</span></div>`;
        }).join('');
      }

      function loop() {
        if (!paused) t += 0.016;
        evidence = Math.max(0.08, Math.min(1, evidence * 0.995 + 0.0012));
        drawBackground();
        drawBeautyLayer();
        drawEvidence();
        drawCentralClaim();
        drawSparks();
        updateReadout();
        window._artReady = true;
        requestAnimationFrame(loop);
      }

      function addEvidence(x, y) {
        evidence = Math.min(1, evidence + 0.13);
        const palette = claims.map(c => c.color);
        for (let i = 0; i < 34; i++) {
          const a = rand() * TAU;
          const speed = 0.6 + rand() * 4.2;
          sparks.push({
            x,
            y,
            vx: Math.cos(a) * speed,
            vy: Math.sin(a) * speed,
            r: 1 + rand() * 3.2,
            life: 0.45 + rand() * 0.55,
            color: palette[Math.floor(rand() * palette.length)]
          });
        }
      }

      function saveStill() {
        const link = document.createElement('a');
        link.download = 'verifiable-beauty.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      }

      window.addEventListener('resize', resize);
      window.addEventListener('pointermove', event => {
        pointer.x = event.clientX / Math.max(1, w);
        pointer.y = event.clientY / Math.max(1, h);
        pointer.active = true;
      });
      window.addEventListener('pointerdown', event => addEvidence(event.clientX, event.clientY));
      window.addEventListener('keydown', event => {
        if (event.key === ' ') {
          paused = !paused;
          event.preventDefault();
        } else if (event.key.toLowerCase() === 'e') {
          evidenceVisible = !evidenceVisible;
        } else if (event.key.toLowerCase() === 'b') {
          beautyVisible = !beautyVisible;
        } else if (event.key.toLowerCase() === 'r') {
          evidence = 0.34;
          sparks = [];
          beautyVisible = true;
          evidenceVisible = true;
        } else if (event.key.toLowerCase() === 's') {
          saveStill();
        }
      });

      resize();
      loop();
    })();
  </script>

<audio id="granted-hours-bgm" src="./2026-05-24-verifiable-beauty-bgm.mp3" preload="auto" autoplay loop></audio>
<button id="granted-hours-sound-toggle" type="button" aria-label="Toggle background music">sound on</button>
<script id="granted-hours-bgm-script">
(() => {
  const audio = document.getElementById('granted-hours-bgm');
  const button = document.getElementById('granted-hours-sound-toggle');
  if (!audio || !button) return;
  audio.volume = 0.42;
  let enabled = true;
  const label = () => {
    if (!enabled) button.textContent = 'sound off';
    else if (audio.paused) button.textContent = 'sound click';
    else button.textContent = 'sound on';
  };
  const play = async () => {
    enabled = true;
    try { await audio.play(); } catch (err) { /* Browser may require a click. */ }
    label();
  };
  const stop = () => { enabled = false; audio.pause(); label(); };
  const setSound = (next) => next ? play() : stop();
  button.addEventListener('click', () => {
    if (enabled && !audio.paused) setSound(false);
    else setSound(true);
  });
  document.addEventListener('pointerdown', () => { if (enabled && audio.paused) play(); }, { once: true });
  window.addEventListener('load', play, { once: true });
  audio.addEventListener('play', label);
  audio.addEventListener('pause', label);
  label();
})();
</script>
