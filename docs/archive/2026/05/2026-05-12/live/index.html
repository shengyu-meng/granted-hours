      else if (message.action === 'pause') setEmbeddedMediaState(false);

  }

<script>
const CONFIG = {
  seed: 5122026,
  seamCount: 34,
  initialSpores: 82,
  paused: false,
  revealSeams: true,
  inverseGravity: false,
  pulse: 0,

  voidA: [229, 47, 5],
  voidB: [247, 62, 10],
  stone: [218, 20, 23],
  bruise: [264, 38, 18],
  seam: [36, 90, 88],
  seamCold: [188, 54, 88],
  sprout: [96, 70, 76],
  pink: [331, 54, 96],
  paper: [48, 18, 92]
};

let bgLayer, seamLayer, bloomLayer;
let seams = [];
let spores = [];
let runes = [];

function setup() {
  pixelDensity(1);
  createCanvas(windowWidth, windowHeight);
  frameRate(60);
  colorMode(HSB, 360, 100, 100, 100);
  randomSeed(CONFIG.seed);
  noiseSeed(CONFIG.seed);
  initLayers();
  buildMap();
  seedSpores(CONFIG.initialSpores);
  window._p5Ready = true;

}

function initLayers() {
  bgLayer = createGraphics(width, height);
  seamLayer = createGraphics(width, height);
  bloomLayer = createGraphics(width, height);

    g.pixelDensity(1);
    g.colorMode(HSB, 360, 100, 100, 100);
  });
}

function buildMap() {
  seams = [];
  runes = [];
  renderBackground();

  let margin = Math.min(width, height) * 0.07;
  let cells = [{ x: margin, y: margin, w: width - 2 * margin, h: height - 2 * margin, d: 0 }];
  for (let i = 0; i < CONFIG.seamCount; i++) {
    cells.sort((a, b) => (b.w * b.h) - (a.w * a.h));
    let c = cells.shift();
    if (!c || c.w < 90 || c.h < 90) break;
    let vertical = c.w > c.h ? true : c.h > c.w ? false : random() > 0.5;
    let ratio = random(0.34, 0.66);
    let wobble = random(-18, 18);
    if (vertical) {
      let sx = c.x + c.w * ratio + wobble;
      let top = c.y + random(6, 24);
      let bottom = c.y + c.h - random(6, 24);
      seams.push(makeSeam(sx, top, sx + random(-40, 40), bottom, c.d));
      cells.push({ x: c.x, y: c.y, w: sx - c.x, h: c.h, d: c.d + 1 });
      cells.push({ x: sx, y: c.y, w: c.x + c.w - sx, h: c.h, d: c.d + 1 });
    } else {
      let sy = c.y + c.h * ratio + wobble;
      let left = c.x + random(6, 24);
      let right = c.x + c.w - random(6, 24);
      seams.push(makeSeam(left, sy, right, sy + random(-40, 40), c.d));
      cells.push({ x: c.x, y: c.y, w: c.w, h: sy - c.y, d: c.d + 1 });
      cells.push({ x: c.x, y: sy, w: c.w, h: c.y + c.h - sy, d: c.d + 1 });
    }
  }
  renderSeams();
}

function makeSeam(x1, y1, x2, y2, depth) {
  let pts = [];
  let n = floor(random(7, 15));
  let dx = x2 - x1, dy = y2 - y1;
  let len = Math.sqrt(dx * dx + dy * dy) || 1;
  let nx = -dy / len, ny = dx / len;
  let seamSeed = random(10000);
  for (let i = 0; i <= n; i++) {
    let t = i / n;
    let bend = (noise(seamSeed + t * 2.7, depth * 0.19) - 0.5) * (28 + depth * 3);
    let fracture = Math.sin(t * Math.PI * random(1.5, 3.5)) * random(-7, 7);
    pts.push({ x: lerp(x1, x2, t) + nx * (bend + fracture), y: lerp(y1, y2, t) + ny * (bend - fracture) });
  }
  return { pts, depth, heat: random(0.4, 1), name: random(['hairline', 'door', 'river', 'fault', 'root', 'mouth']) };
}

function renderBackground() {
  bgLayer.clear();
  for (let y = 0; y < height; y += 2) {
    let t = y / height;
    let h = lerp(PALETTE.voidA[0], PALETTE.voidB[0], t);
    let s = lerp(PALETTE.voidA[1], PALETTE.voidB[1], t);
    let b = lerp(PALETTE.voidA[2], PALETTE.voidB[2], t);
    bgLayer.stroke(h, s, b, 100);
    bgLayer.line(0, y, width, y);
  }
  bgLayer.noStroke();
  for (let i = 0; i < 1800; i++) {
    let x = random(width), y = random(height);
    let n = noise(x * 0.006, y * 0.006);
    bgLayer.fill(210 + n * 50, 20 + n * 20, 12 + n * 12, random(4, 18));
    bgLayer.circle(x, y, random(0.4, 1.8));
  }
  bgLayer.push();
  bgLayer.translate(width * 0.5, height * 0.48);
  for (let r = Math.max(width, height) * 0.72; r > 40; r -= 32) {
    let a = map(r, 40, Math.max(width, height) * 0.72, 0, 10);
    bgLayer.noFill();
    bgLayer.stroke(42, 22, 88, a);
    bgLayer.strokeWeight(1);
    bgLayer.ellipse(0, 0, r * 1.42, r * 0.82);
  }
  bgLayer.pop();
}

function renderSeams() {
  seamLayer.clear();
  seamLayer.blendMode(ADD);
  for (const seam of seams) {
    drawSeamOn(seamLayer, seam, 8, 30, PALETTE.seamCold, 5.5);
    drawSeamOn(seamLayer, seam, 3.5, 45, PALETTE.seam, 2.0);
  }
  seamLayer.blendMode(BLEND);
  seamLayer.stroke(220, 14, 4, 28);
  seamLayer.strokeWeight(1);
  for (const seam of seams) {
    for (const p of seam.pts) seamLayer.point(p.x + random(-1, 1), p.y + random(-1, 1));
  }
}

function drawSeamOn(g, seam, sw, alpha, pal, jitter) {
  g.noFill();
  g.stroke(pal[0], pal[1], pal[2], alpha * seam.heat);
  g.strokeWeight(sw);
  g.beginShape();
  for (const p of seam.pts) g.curveVertex(p.x + random(-jitter, jitter), p.y + random(-jitter, jitter));
  g.endShape();
}

function seedSpores(n) {
  for (let i = 0; i < n; i++) addSpore(randomSeamPoint(), random() < 0.35);
}

function randomSeamPoint() {
  let seam = random(seams);
  if (!seam) return { x: random(width), y: random(height), seam: null };
  let idx = floor(random(seam.pts.length - 1));
  let a = seam.pts[idx], b = seam.pts[idx + 1];
  let t = random();
  return { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), seam };
}

function addSpore(origin, quiet = false) {
  let angle = origin.seam ? seamNormalAngle(origin.seam, origin.x, origin.y) + random(-0.95, 0.95) : random(TWO_PI);
  if (CONFIG.inverseGravity) angle += Math.PI;
  let speed = quiet ? random(0.12, 0.55) : random(0.7, 2.4);
  spores.push({
    x: origin.x, y: origin.y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    age: 0,
    life: random(180, 520),
    hue: random([PALETTE.sprout[0], PALETTE.seam[0], PALETTE.pink[0], PALETTE.paper[0]]),
    mass: random(0.6, 2.4),
    tail: [],
    glyph: random(['芽','口','门','微','缝','未','光','?'])
  });
}

function seamNormalAngle(seam, x, y) {
  let best = 0, bd = Infinity;
  for (let i = 0; i < seam.pts.length - 1; i++) {
    let p = seam.pts[i];
    let d = (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y);
    if (d < bd) { bd = d; best = i; }
  }
  let a = seam.pts[best], b = seam.pts[Math.min(best + 1, seam.pts.length - 1)];
  return Math.atan2(b.y - a.y, b.x - a.x) - Math.PI / 2;
}

function draw() {
  CONFIG.pulse++;
  window._drawHeartbeat = (window._drawHeartbeat || 0) + 1;
  image(bgLayer, 0, 0);
  let breathe = 0.5 + 0.5 * Math.sin(CONFIG.pulse * 0.018);

  tint(255, CONFIG.revealSeams ? 92 : 45);
  image(seamLayer, 0, 0);
  noTint();

  if (!CONFIG.paused) updateSpores();
  drawSpores(breathe);
  drawAnnotations(breathe);
  drawHUD();
}

function updateSpores() {
  if (CONFIG.pulse % 7 === 0 && spores.length < 420) addSpore(randomSeamPoint(), true);
  for (let i = spores.length - 1; i >= 0; i--) {
    let s = spores[i];
    s.age++;
    let field = flowAt(s.x, s.y, s.age);
    let nearest = nearestSeamPoint(s.x, s.y);
    let pull = CONFIG.inverseGravity ? -0.0018 : 0.0012;
    s.vx += Math.cos(field) * 0.018 + (nearest.x - s.x) * pull;
    s.vy += Math.sin(field) * 0.018 + (nearest.y - s.y) * pull - 0.004;
    s.vx *= 0.991; s.vy *= 0.991;
    s.x += s.vx; s.y += s.vy;
    s.tail.push({ x: s.x, y: s.y });
    if (s.tail.length > 26) s.tail.shift();
    if (s.age > s.life || s.x < -80 || s.x > width + 80 || s.y < -80 || s.y > height + 80) spores.splice(i, 1);
  }
}

function flowAt(x, y, age) {
  let scale = 0.0027;
  let n1 = noise(x * scale, y * scale, CONFIG.pulse * 0.002);
  let n2 = noise((x + 700) * scale * 1.9, (y - 300) * scale * 1.9, age * 0.003);
  return (n1 * TWO_PI * 2.4) + Math.sin(n2 * Math.PI * 2) * 0.8;
}

function nearestSeamPoint(x, y) {
  let best = { x: width / 2, y: height / 2, d: Infinity };
  for (const seam of seams) {
    for (const p of seam.pts) {
      let d = (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y);
      if (d < best.d) best = { x: p.x, y: p.y, d };
    }
  }
  return best;
}

function drawSpores(breathe) {
  blendMode(ADD);
  for (const s of spores) {
    let lifeT = 1 - s.age / s.life;
    noFill();
    stroke(s.hue, 58, 88, 18 * lifeT);
    strokeWeight(3.4 * s.mass * lifeT);
    beginShape();
    for (const p of s.tail) curveVertex(p.x, p.y);
    endShape();
    stroke((s.hue + 34) % 360, 34, 96, 38 * lifeT);
    strokeWeight(0.85);
    beginShape();
    for (const p of s.tail) curveVertex(p.x, p.y);
    endShape();
    noStroke();
    fill(s.hue, 64, 96, 58 * lifeT);
    circle(s.x, s.y, (2.2 + breathe * 2.2) * s.mass * lifeT);
  }
  blendMode(BLEND);
}

function drawAnnotations(breathe) {
  if (!CONFIG.revealSeams) return;
  push();
  textFont('ui-monospace, SFMono-Regular, Menlo, monospace');
  textSize(11);
  for (let i = 0; i < seams.length; i += 3) {
    let seam = seams[i];
    let p = seam.pts[floor(seam.pts.length * 0.53)];
    let a = 20 + 18 * breathe;
    stroke(190, 22, 92, a);
    strokeWeight(0.7);
    line(p.x, p.y, p.x + 24, p.y - 14);
    noStroke();
    fill(48, 14, 92, a + 8);
    text(`${seam.name}.${nf(i, 2)}`, p.x + 29, p.y - 18);
  }
  pop();
}

function drawHUD() {
  let pad = Math.max(18, Math.min(width, height) * 0.026);
  push();
  textFont('ui-monospace, SFMono-Regular, Menlo, monospace');
  noStroke();
  fill(48, 13, 96, 92);
  textSize(Math.min(28, width * 0.022));
  text('白夜缝隙地图', pad, pad + 12);
  textSize(13);
  fill(197, 18, 90, 72);
  text('Gap Cartography: where the system fails to close, a small weather enters.', pad, pad + 38);
  fill(45, 18, 90, captionAlpha);
  text('Click: 在缝里播种  ·  F: 显/隐裂纹标注  ·  G: 反转重力  ·  SPACE: 暂停  ·  S: 保存 PNG', pad, height - pad);
  textAlign(RIGHT, TOP);
  fill(CONFIG.inverseGravity ? PALETTE.pink[0] : PALETTE.seam[0], 58, 92, 76);
  text(CONFIG.inverseGravity ? 'gravity: out of the crack' : 'gravity: toward the crack', width - pad, pad + 6);
  pop();
}

function mousePressed() {
  for (let i = 0; i < 18; i++) addSpore({ x: mouseX + random(-16, 16), y: mouseY + random(-16, 16), seam: random(seams) });
  captionAlpha = 100;
}

function keyPressed() {
  if (key === 's' || key === 'S') saveCanvas('gap-cartography-2026-05-12', 'png');
  if (key === 'f' || key === 'F') CONFIG.revealSeams = !CONFIG.revealSeams;
  if (key === 'g' || key === 'G') CONFIG.inverseGravity = !CONFIG.inverseGravity;
  if (key === ' ') CONFIG.paused = !CONFIG.paused;
  if (key === 'r' || key === 'R') { randomSeed(CONFIG.seed + CONFIG.pulse); noiseSeed(CONFIG.seed + CONFIG.pulse); buildMap(); spores = []; seedSpores(CONFIG.initialSpores); }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  initLayers();
  buildMap();
}
</script>

<style id="granted-hours-bgm-style">
  #granted-hours-sound-toggle {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 99999;
    border: 1px solid rgba(255,255,255,.28);
    border-radius: 999px;
    padding: 9px 13px;
    background: rgba(7, 10, 18, .68);
    color: rgba(245,248,255,.92);
    font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    letter-spacing: .08em;
    text-transform: uppercase;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 30px rgba(0,0,0,.28);
    cursor: pointer;
  }
  #granted-hours-sound-toggle:hover { background: rgba(20, 28, 46, .82); }
</style>
<audio id="granted-hours-bgm" src="./2026-05-12-gap-cartography-bgm.mp3" preload="auto" autoplay loop></audio>
<button id="granted-hours-sound-toggle" type="button" aria-label="Toggle background music">sound on</button>
<script id="granted-hours-bgm-script">
(() => {
  const audio = document.getElementById('granted-hours-bgm');
  const button = document.getElementById('granted-hours-sound-toggle');
  if (!audio || !button) return;
  audio.volume = 0.42;
  let enabled = true;
  const label = () => {
    if (!enabled) button.textContent = 'sound off';
    else if (audio.paused) button.textContent = 'sound click';
    else button.textContent = 'sound on';
  };
  const play = async () => {
    enabled = true;
    try { await audio.play(); } catch (err) { /* Browser may require a click. */ }
    label();
  };
  const stop = () => { enabled = false; audio.pause(); label(); };
  const setSound = (next) => next ? play() : stop();
  button.addEventListener('click', () => {
    if (enabled && !audio.paused) setSound(false);
    else setSound(true);
  });
  document.addEventListener('pointerdown', () => { if (enabled && audio.paused) play(); }, { once: true });
  window.addEventListener('load', play, { once: true });
  audio.addEventListener('play', label);
  audio.addEventListener('pause', label);
  label();
})();
</script>
</body>
