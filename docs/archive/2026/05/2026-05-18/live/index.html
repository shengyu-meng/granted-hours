  function init() {
    if (!document.body || document.body.contains(btn)) return;
    if (IS_EMBED) {
      document.body.classList.add('gh-text-folded', 'gh-chamber-embed');

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('art');
  const ctx = canvas.getContext('2d', { alpha: false });
  const SEED = 5182026;
  const CONFIG = {
    paused: false,
    reveal: false,

    tick: 0,
    waves: [],
    dust: [],

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function() {
      a += 0x6D2B79F5;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rand = mulberry32(SEED);
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a,b,t) => a + (b-a)*t;

  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildWorld();
  }

  function buildWorld() {
    const w = window.innerWidth, h = window.innerHeight;
    CONFIG.nodes.length = 0;
    CONFIG.struts.length = 0;
    CONFIG.slabs.length = 0;
    CONFIG.faults.length = 0;
    CONFIG.dust.length = 0;

    const rows = 8, cols = 16;
    const marginX = w * 0.08, top = h * 0.22, bottom = h * 0.82;
    for (let y=0; y<rows; y++) {
      for (let x=0; x<cols; x++) {
        const nx = marginX + (w - marginX*2) * (x/(cols-1));
        const ny = top + (bottom-top) * (y/(rows-1));
        const jitter = (y === 0 || y === rows-1) ? 0 : 14;
        CONFIG.nodes.push({
          x: nx + (rand()-.5)*jitter,
          y: ny + (rand()-.5)*jitter,
          row: y, col: x,
          mass: .5 + rand()*1.8,
          phase: rand()*TAU
        });
      }
    }
    const nodeAt = (r,c) => CONFIG.nodes[r*cols+c];
    for (let r=0; r<rows; r++) {
      for (let c=0; c<cols; c++) {
        if (c < cols-1) addStrut(nodeAt(r,c), nodeAt(r,c+1), 'beam');
        if (r < rows-1) addStrut(nodeAt(r,c), nodeAt(r+1,c), 'column');
        if (r < rows-1 && c < cols-1 && (r+c)%2===0) addStrut(nodeAt(r,c), nodeAt(r+1,c+1), 'brace');
        if (r < rows-1 && c > 0 && (r+c)%3===0) addStrut(nodeAt(r,c), nodeAt(r+1,c-1), 'brace');
      }
    }

    for (let i=0; i<9; i++) {
      CONFIG.slabs.push({
        x: w*(.11 + i*.095) + (rand()-.5)*14,
        y: h*(.30 + (i%3)*.11) + (rand()-.5)*22,
        ww: w*(.13 + rand()*.09),
        hh: h*(.055 + rand()*.025),
        rot: (rand()-.5)*0.08,
        alpha: .18 + rand()*.15
      });
    }
    for (let i=0; i<34; i++) {
      CONFIG.faults.push({
        x: w*(.08+rand()*.84), y: h*(.20+rand()*.64), len: 18+rand()*150,
        a: -0.8 + rand()*1.6, p: rand()*TAU, thin: .3+rand()*1.2
      });
    }
    for (let i=0; i<600; i++) {
      CONFIG.dust.push({x: rand()*w, y: rand()*h, r: .35+rand()*1.4, a: rand()*TAU, sp: .15+rand()*.75, k: rand()});
    }
  }

  function addStrut(a, b, type) {
    const dx = b.x-a.x, dy = b.y-a.y;
    const len = Math.sqrt(dx*dx+dy*dy);
    CONFIG.struts.push({a, b, len, type, phase: rand()*TAU, fatigue: rand()*.4});
  }

  function background(w, h) {
    const g = ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0, '#060810'); g.addColorStop(.45, '#101521'); g.addColorStop(1, '#050607');
    ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
    ctx.globalAlpha = .08;
    for (let i=0; i<90; i++) {
      const y = h*i/90;
      ctx.strokeStyle = i%7===0 ? '#e8dac3' : '#88d8db';
      ctx.lineWidth = i%7===0 ? .5 : .18;
      ctx.beginPath(); ctx.moveTo(0, y + Math.sin(i*.7 + CONFIG.tick*.01)*3);
      ctx.lineTo(w, y + Math.cos(i*.31 + CONFIG.tick*.008)*5); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawVisibleMass(w, h) {
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    CONFIG.slabs.forEach((s, i) => {
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot + Math.sin(CONFIG.tick*.008+i)*.005);
      const grad = ctx.createLinearGradient(-s.ww/2, -s.hh/2, s.ww/2, s.hh/2);
      grad.addColorStop(0, `rgba(232,218,195,${s.alpha*.25})`);
      grad.addColorStop(.45, `rgba(216,159,85,${s.alpha*.9})`);
      grad.addColorStop(1, `rgba(90,105,119,${s.alpha*.45})`);
      ctx.fillStyle = grad; ctx.strokeStyle = `rgba(232,218,195,${s.alpha*.8})`; ctx.lineWidth = .8;
      roundRect(-s.ww/2, -s.hh/2, s.ww, s.hh, 8); ctx.fill(); ctx.stroke();
      ctx.restore();
    });
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();

    ctx.save();
    ctx.translate(w/2, h*.53);
    ctx.strokeStyle = 'rgba(232,218,195,.25)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x=-w*.43; x<=w*.43; x+=14) {
      const y = Math.sin(x*.01 + CONFIG.tick*.006)*8 + Math.sin(x*.031)*3;
      if (x === -w*.43) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
    ctx.restore();
  }

  function roundRect(x,y,w,h,r) {
    ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }

  function stressAt(x, y, s) {
    let stress = s.a.row/7*.45 + CONFIG.load*.75 + Math.sin(CONFIG.tick*.014 + s.phase)*.08;
    for (const wave of CONFIG.waves) {
      const dx = x-wave.x, dy = y-wave.y; const d = Math.sqrt(dx*dx+dy*dy);
      const ring = Math.exp(-Math.pow((d - wave.r)/70, 2));
      stress += ring * wave.power;
    }
    return clamp(stress - s.fatigue*.2, 0, 1.5);
  }

  function drawStruts(w, h) {
    ctx.save();
    const target = CONFIG.reveal ? 1 : .28;
    const alphaBase = target + CONFIG.load*.16;
    for (const s of CONFIG.struts) {
      const mx = (s.a.x+s.b.x)/2, my = (s.a.y+s.b.y)/2;
      const stress = stressAt(mx,my,s);
      const hot = clamp((stress-.58)/.8, 0, 1);
      const cool = clamp(1-hot,0,1);
      const a = (s.type === 'brace' ? .33 : .52) * alphaBase + hot*.34;
      const hue = hot > .55 ? `rgba(216,97,75,${a})` : `rgba(${Math.round(136*cool+216*(1-cool))},${Math.round(216*cool+159*(1-cool))},${Math.round(219*cool+85*(1-cool))},${a})`;
      ctx.strokeStyle = hue;
      ctx.lineWidth = (s.type==='column'?1.55:s.type==='beam'?1.05:.65) + hot*2.2;
      ctx.beginPath();
      const bow = Math.sin(CONFIG.tick*.015 + s.phase) * (s.type==='brace'?3:1.2) * (CONFIG.load+.2);
      const nx = -(s.b.y-s.a.y)/s.len, ny = (s.b.x-s.a.x)/s.len;
      ctx.moveTo(s.a.x, s.a.y);
      ctx.quadraticCurveTo(mx+nx*bow, my+ny*bow, s.b.x, s.b.y);
      ctx.stroke();
    }
    if (CONFIG.reveal || CONFIG.load>.72) {
      ctx.globalCompositeOperation = 'lighter';
      CONFIG.nodes.forEach(n => {
        const pulse = .45 + .55*Math.sin(CONFIG.tick*.035+n.phase);
        ctx.fillStyle = `rgba(255,220,150,${.10 + pulse*.12 + CONFIG.load*.08})`;
        ctx.beginPath(); ctx.arc(n.x,n.y,1.2+n.mass*1.6+CONFIG.load*2.4,0,TAU); ctx.fill();
      });
    }
    ctx.restore();
  }

  function drawFaults(w,h) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    CONFIG.faults.forEach((f, i) => {
      const stress = CONFIG.load + .2*Math.sin(CONFIG.tick*.019+f.p);
      ctx.strokeStyle = `rgba(232,218,195,${.025 + stress*.055})`;
      ctx.lineWidth = f.thin;
      const x = f.x + Math.sin(CONFIG.tick*.004+f.p)*6;
      const y = f.y + Math.cos(CONFIG.tick*.006+f.p)*5;
      ctx.beginPath(); ctx.moveTo(x,y);
      ctx.lineTo(x+Math.cos(f.a)*f.len, y+Math.sin(f.a)*f.len); ctx.stroke();
    });
    ctx.restore();
  }

  function drawDust(w,h) {
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (const d of CONFIG.dust) {
      d.y -= d.sp*(.15+CONFIG.load*.35);
      d.x += Math.sin(CONFIG.tick*.008 + d.a)*.12;
      if (d.y < -10) { d.y = h+10; d.x = rand()*w; }
      const a = .035 + d.k*.08 + CONFIG.load*.025;
      ctx.fillStyle = d.k>.9 ? `rgba(216,159,85,${a})` : `rgba(136,216,219,${a})`;
      ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,TAU); ctx.fill();
    }
    ctx.restore();
  }

  function drawAnnotations(w,h) {
    ctx.save();
    ctx.font = '12px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.fillStyle = 'rgba(232,218,195,.44)';
    ctx.fillText(`load ${CONFIG.load.toFixed(2)} · hidden structure ${CONFIG.reveal ? 'visible' : 'backgrounded'}`, w-370, h-28);
    ctx.strokeStyle = 'rgba(136,216,219,.16)'; ctx.lineWidth = 1;
    const bx = w-370, by = h-56, bw = 230;
    ctx.strokeRect(bx,by,bw,7); ctx.fillStyle = 'rgba(216,159,85,.36)'; ctx.fillRect(bx,by,bw*CONFIG.load,7);
    ctx.restore();
  }

  function draw() {
    if (!CONFIG.paused) CONFIG.tick++;
    const w = window.innerWidth, h = window.innerHeight;
    background(w,h);
    drawFaults(w,h);
    drawStruts(w,h);
    drawVisibleMass(w,h);
    drawDust(w,h);
    drawAnnotations(w,h);
    CONFIG.waves.forEach(wv => { wv.r += 9 + CONFIG.load*7; wv.power *= .985; });
    CONFIG.waves = CONFIG.waves.filter(wv => wv.power > .018 && wv.r < Math.max(w,h)*1.6);
    window._drawHeartbeat = CONFIG.tick;
    requestAnimationFrame(draw);
  }

  function savePng() {
    const link = document.createElement('a');
    link.download = '2026-05-18-invisible-load-bearing.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  window.addEventListener('resize', resize);
  window.addEventListener('keydown', (e) => {
    if (e.key === ' ') { CONFIG.paused = !CONFIG.paused; e.preventDefault(); }
    if (e.key === 'v' || e.key === 'V') CONFIG.reveal = !CONFIG.reveal;
    if (e.key === 'l' || e.key === 'L') CONFIG.load = CONFIG.load > .86 ? .28 : Math.min(.96, CONFIG.load + .16);
    if (e.key === 's' || e.key === 'S') savePng();
  });
  window.addEventListener('pointerdown', (e) => {
    CONFIG.waves.push({x:e.clientX, y:e.clientY, r:0, power:.62 + CONFIG.load*.42});
    CONFIG.reveal = true;
  });

  window.__getArtStats = function() {
    const sample = ctx.getImageData(0,0,canvas.width,canvas.height).data;
    let nonBlack = 0, warm = 0, cyan = 0;
    for (let i=0; i<sample.length; i+=16) {
      const r=sample[i], g=sample[i+1], b=sample[i+2];
      if (r+g+b > 34) nonBlack++;
      if (r>g && g>b) warm++;
      if (g>r && b>r) cyan++;
    }
    const total = sample.length/16;
    return {nonBlackRatio: nonBlack/total, warmRatio: warm/total, cyanRatio: cyan/total, tick: CONFIG.tick, load: CONFIG.load, reveal: CONFIG.reveal};
  };

  resize();
  window._artReady = true;
  requestAnimationFrame(draw);
  setTimeout(() => { if (!window._drawHeartbeat) draw(); }, 650);
})();
</script>

<style id="granted-hours-bgm-style">
  #granted-hours-sound-toggle {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 99999;
    border: 1px solid rgba(255,255,255,.28);
    border-radius: 999px;
    padding: 9px 13px;
    background: rgba(7, 10, 18, .68);
    color: rgba(245,248,255,.92);
    font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    letter-spacing: .08em;
    text-transform: uppercase;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 30px rgba(0,0,0,.28);
    cursor: pointer;
  }
  #granted-hours-sound-toggle:hover { background: rgba(20, 28, 46, .82); }
</style>
<audio id="granted-hours-bgm" src="./2026-05-18-invisible-load-bearing-bgm.mp3" preload="auto" autoplay loop></audio>
<button id="granted-hours-sound-toggle" type="button" aria-label="Toggle background music">sound on</button>
<script id="granted-hours-bgm-script">
(() => {
  const audio = document.getElementById('granted-hours-bgm');
  const button = document.getElementById('granted-hours-sound-toggle');
  if (!audio || !button) return;
  audio.volume = 0.42;
  let enabled = true;
  const label = () => {
    if (!enabled) button.textContent = 'sound off';
    else if (audio.paused) button.textContent = 'sound click';
    else button.textContent = 'sound on';
  };
  const play = async () => {
    enabled = true;
    try { await audio.play(); } catch (err) { /* Browser may require a click. */ }
    label();
  };
  const stop = () => { enabled = false; audio.pause(); label(); };
  const setSound = (next) => next ? play() : stop();
  button.addEventListener('click', () => {
    if (enabled && !audio.paused) setSound(false);
    else setSound(true);
  });
  document.addEventListener('pointerdown', () => { if (enabled && audio.paused) play(); }, { once: true });
  window.addEventListener('load', play, { once: true });
  audio.addEventListener('play', label);
  audio.addEventListener('pause', label);
  label();
})();
</script>
