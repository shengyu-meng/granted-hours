<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Instrument That Learns Humility</title>
  <desc id="desc">A dark field of soft measurement arcs, bias vectors, and a central instrument learning to shrink its own certainty.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0d1111"/>
      <stop offset="0.48" stop-color="#172320"/>
      <stop offset="1" stop-color="#2b241f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#f1d68a" stop-opacity="0.38"/>
      <stop offset="0.36" stop-color="#6ed3c2" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0d1111" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <g opacity="0.22" stroke="#d9c178" stroke-width="1">
    <path d="M160 270 C420 180 570 360 785 300 S1135 180 1430 300" fill="none"/>
    <path d="M120 480 C390 420 560 540 770 470 S1120 380 1490 505" fill="none"/>
    <path d="M180 700 C420 610 620 735 805 670 S1190 565 1450 710" fill="none"/>
    <path d="M330 135 C410 355 360 585 455 850" fill="none"/>
    <path d="M800 90 C770 350 835 570 790 895" fill="none"/>
    <path d="M1235 140 C1130 390 1225 620 1140 865" fill="none"/>
  </g>
  <g transform="translate(800 500)">
    <circle r="250" fill="none" stroke="#e7c86f" stroke-opacity="0.22" stroke-width="2"/>
    <circle r="176" fill="none" stroke="#71d6c4" stroke-opacity="0.28" stroke-width="2"/>
    <circle r="92" fill="none" stroke="#f1ece0" stroke-opacity="0.18" stroke-width="1"/>
    <g stroke-linecap="round">
      <path d="M0 0 L170 -56" stroke="#f1d68a" stroke-width="6" stroke-opacity="0.78"/>
      <path d="M0 0 L-116 138" stroke="#77d7c7" stroke-width="4" stroke-opacity="0.68"/>
      <path d="M0 0 L42 -210" stroke="#f06c5f" stroke-width="3" stroke-opacity="0.48"/>
    </g>
    <circle r="42" fill="#111817" stroke="#f1ece0" stroke-opacity="0.5"/>
    <circle r="13" fill="#f1d68a"/>
  </g>
  <g fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M360 285 q-80 64 -50 162 q30 92 140 91" stroke="#71d6c4" stroke-opacity="0.42"/>
    <path d="M1238 260 q106 70 82 182 q-24 108 -146 128" stroke="#f1d68a" stroke-opacity="0.42"/>
    <path d="M472 786 q250 -112 560 -76 q130 16 282 85" stroke="#f06c5f" stroke-opacity="0.32"/>
  </g>
  <g opacity="0.65">
    <circle cx="378" cy="298" r="9" fill="#71d6c4"/>
    <circle cx="487" cy="536" r="6" fill="#f1d68a"/>
    <circle cx="1242" cy="264" r="8" fill="#f1d68a"/>
    <circle cx="1168" cy="570" r="7" fill="#71d6c4"/>
    <circle cx="1312" cy="796" r="6" fill="#f06c5f"/>
    <circle cx="474" cy="786" r="5" fill="#f06c5f"/>
  </g>
  <g filter="url(#blur)" opacity="0.46">
    <circle cx="800" cy="500" r="190" fill="#71d6c4"/>
    <circle cx="1010" cy="410" r="120" fill="#f1d68a"/>
    <circle cx="575" cy="610" r="120" fill="#f06c5f"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#f4efe2">
    <text x="92" y="118" font-size="44" font-weight="700" letter-spacing="0">Instrument That Learns Humility</text>
    <text x="94" y="164" font-size="24" opacity="0.7" letter-spacing="0">The instrument becomes less certain before the field becomes more obedient.</text>
    <text x="94" y="902" font-size="22" opacity="0.62" letter-spacing="0">Humility is not uselessness; it is accuracy that includes the instrument's own shadow.</text>
  </g>
</svg>
