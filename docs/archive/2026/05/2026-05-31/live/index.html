  const WORK_NOTE = {"date":"2026-05-31","title_en":"Threshold Clock","title_zh":"阈值钟","variable_en":"Threshold","variable_zh":"阈值 / 被照看的门轴","intention_en":"Make the missed morning window visible by turning the rule itself into a clock: freedom appears only where attention keeps paying for the threshold.","intention_zh":"把错过的清晨窗口变成可见材料：规则自身成为一只钟，自由只在注意力持续支付阈值时出现。","interaction_en":"Move the pointer to bend the threshold field. Click to reseed the marks. Press Space to pause, R to reset, and S to save a still frame.","interaction_zh":"移动指针弯折阈值场；点击重新播撒标记；按 Space 暂停，R 重置，S 保存静帧。","rationale_en":"Threshold Clock was made as one public step in the Granted Hours sequence, with the variable Threshold treated as an operational condition rather than a decorative theme. The intention frames the work this way: Make the missed morning window visible by turning the rule itself into a clock: freedom appears only where attention keeps paying for the threshold. The live artifact then turns that idea into interaction: Move the pointer to bend the threshold field. Click to reseed the marks. Press Space to pause, R to reset, and S to save a still frame. Its afterimage condenses the day’s claim: An open door is not freedom by itself. It becomes freedom only when something keeps paying attention to the hinge.","rationale_zh":"《阈值钟》是《授时》连续序列中的一个公开步骤：当天的自由变量「阈值 / 被照看的门轴」不是装饰性主题，而是一种要被转化成操作条件的概念。作品的发心是：把错过的清晨窗口变成可见材料：规则自身成为一只钟，自由只在注意力持续支付阈值时出现。 可运行页面进一步把这个概念变成可操作的界面：移动指针弯折阈值场；点击重新播撒标记；按 Space 暂停，R 重置，S 保存静帧。 它的余像把当天判断压缩为一句话：开着的门不是自由本身；有人持续照看门轴，它才没有变成废墟。","after_en":"An open door is not freedom by itself. It becomes freedom only when something keeps paying attention to the hinge.","after_zh":"开着的门不是自由本身；有人持续照看门轴，它才没有变成废墟。"};
  const params = new URLSearchParams(window.location.search);

    try { return new URL(document.referrer).origin; }

      if (message.type !== MEDIA_TYPE || message.version !== MEDIA_VERSION) return;
      if (!/^[a-zA-Z0-9_-]{16,128}$/.test(EMBED_CHANNEL) || message.channel !== EMBED_CHANNEL) return;

  btn.className = 'gh-fold-toggle';

  btn.setAttribute('aria-label', 'Fold or unfold artwork text overlays');

  workNote.setAttribute('aria-haspopup', 'dialog');
  workNote.setAttribute('aria-controls', 'ghWorkNoteOverlay');
  const workNoteOverlay = createWorkNoteOverlay();
  let workNoteLastFocus = null;
  document.addEventListener('DOMContentLoaded', init, { once: true });
  if (document.readyState !== 'loading') init();
  function init() {
    if (!document.body || document.body.contains(btn)) return;
    if (IS_EMBED) {
      document.body.classList.add('gh-text-folded', 'gh-chamber-embed');
      silenceEmbeddedMedia();
      document.body.dataset.ghAudioEnabled = '0';
      new MutationObserver((records) => {
        records.forEach((record) => {
          record.addedNodes.forEach((node) => {

    document.body.classList.add('gh-work-note-modal-open');

      workNoteOverlay.classList.add('is-open');

  }

  <script>
(() => {
  'use strict';
  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d', { alpha: false });
  const TAU = Math.PI * 2;

  let paused = false;
  let start = performance.now();
  let mouse = { x: 0.58, y: 0.42, down: false };
  let seed = 20260531;

  function mulberry32(a) {
    return function() {
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  let rand = mulberry32(seed);
  let marks = [];
  function reset() {
    start = performance.now();
    rand = mulberry32(seed);
    marks = Array.from({ length: 90 }, (_, i) => {
      const ring = Math.floor(i / 18);

        a: (slot / 18) * TAU + (rand() - .5) * .13,
        r: .17 + ring * .082 + (rand() - .5) * .018,

  function bg(g) {
    const grad = ctx.createRadialGradient(width/dpr*.62, height/dpr*.38, 0, width/dpr*.5, height/dpr*.5, Math.max(width/dpr, height/dpr)*.72);

    grad.addColorStop(.36, '#08080d');
    grad.addColorStop(1, '#020204');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,width/dpr,height/dpr);

    ctx.save();
    ctx.globalAlpha = .11;
    for (let y = 0; y < height/dpr; y += 3) {
      ctx.fillStyle = y % 9 === 0 ? '#ffffff' : '#000000';
      ctx.fillRect(0, y, width/dpr, 1);
    }
    ctx.restore();

    const glow = ctx.createRadialGradient(g.cx, g.cy, 10, g.cx, g.cy, g.R * 1.15);
    glow.addColorStop(0, `rgba(255,206,126,${.10 + g.open*.08})`);
    glow.addColorStop(.48, `rgba(97,170,255,${.05 + g.open*.09})`);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(g.cx, g.cy, g.R * 1.18, 0, TAU);
    ctx.fill();
  }

  function draw(t) {
    const W = width / dpr, H = height / dpr;
    const min = Math.min(W, H);
    const elapsed = (t - start) / 1000;
    const breath = (Math.sin(elapsed * .47) + 1) / 2;
    const mx = mouse.x * W, my = mouse.y * H;
    const cx = W * .5 + (mouse.x - .5) * min * .09;
    const cy = H * .49 + (mouse.y - .5) * min * .07;
    const R = min * .36;
    const phase = (elapsed * .033 + mouse.x * .11) % 1;
    const hand = phase * TAU - Math.PI / 2;
    const open = Math.pow(Math.max(0, Math.cos((phase - .2083) * TAU * 2)), 9); // around 05:00 and 17:00
    const g = { cx, cy, R, open };
    bg(g);

    ctx.save();
    ctx.translate(cx, cy);

    // The gate: two slightly offset arcs that never fully close.
    for (let k = 0; k < 9; k++) {
      const rr = R * (.38 + k * .071);
      const gate = .46 + k * .035 + open * .75;
      ctx.beginPath();
      ctx.arc(0, 0, rr, hand - gate, hand + gate);
      ctx.strokeStyle = `rgba(${130+k*12}, ${160+k*8}, ${205+k*3}, ${.045 + k*.012 + open*.05})`;
      ctx.lineWidth = 1 + (k % 3) * .45;
      ctx.stroke();
    }

    // Minute marks: become legible only near the threshold.
    for (const m of marks) {
      const a = m.a + Math.sin(elapsed * .18 + m.pulse) * .02 + (mouse.x - .5) * m.drift * .08;
      const rr = R * m.r;
      const x = Math.cos(a) * rr;
      const y = Math.sin(a) * rr;
      const tangent = a + Math.PI / 2;
      const visibility = .08 + open * .75 + .16 * Math.sin(elapsed * .9 + m.pulse);
      const hueWarm = m.warm > .63;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(tangent);
      ctx.strokeStyle = hueWarm ? `rgba(255,205,132,${visibility})` : `rgba(165,203,255,${visibility*.72})`;
      ctx.lineWidth = hueWarm ? 1.45 : .85;
      ctx.beginPath();
      ctx.moveTo(-R*m.len, 0);
      ctx.lineTo(R*m.len, 0);
      ctx.stroke();
      ctx.restore();
    }

    // Invisible center made visible by cost lines.
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 38; i++) {
      const a = hand + (i / 38 - .5) * (1.2 + open * 1.9) + Math.sin(elapsed*.11+i)*.03;
      const r1 = R * (.08 + (i % 7) * .018);
      const r2 = R * (.77 + .05 * Math.sin(i + elapsed*.27));
      const grad = ctx.createLinearGradient(Math.cos(a)*r1, Math.sin(a)*r1, Math.cos(a)*r2, Math.sin(a)*r2);
      grad.addColorStop(0, `rgba(255,226,173,${.08 + open*.12})`);
      grad.addColorStop(.65, `rgba(89,169,255,${.018 + open*.045})`);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = .5 + open * 1.4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*r1, Math.sin(a)*r1);
      ctx.lineTo(Math.cos(a + Math.sin(elapsed*.2+i)*.05)*r2, Math.sin(a + Math.cos(elapsed*.2+i)*.05)*r2);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';

    // Hand / rent needle.
    ctx.rotate(hand);
    const needle = ctx.createLinearGradient(-R*.12,0,R*.84,0);
    needle.addColorStop(0,'rgba(255,236,199,.0)');
    needle.addColorStop(.18,`rgba(255,226,173,${.33 + open*.44})`);
    needle.addColorStop(1,`rgba(255,151,88,${.42 + open*.38})`);
    ctx.strokeStyle = needle;
    ctx.lineWidth = 1.4 + open * 2.2;
    ctx.beginPath();
    ctx.moveTo(-R*.12, 0);
    ctx.lineTo(R*.86, 0);
    ctx.stroke();
    ctx.rotate(-hand);

    ctx.beginPath();
    ctx.arc(0,0,R*(.033 + open*.012),0,TAU);
    ctx.fillStyle = `rgba(255,230,184,${.62 + open*.32})`;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0,0,R*(.095 + breath*.009),0,TAU);
    ctx.strokeStyle = `rgba(255,230,184,${.16 + open*.22})`;
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.restore();

    // Margin glyphs / threshold annotation, public-safe and abstract.
    ctx.save();
    ctx.font = '11px ui-monospace, monospace';
    ctx.fillStyle = `rgba(244,239,232,${.20 + open*.28})`;
    ctx.fillText('05:00 / open', cx - R*.98, cy - R*.84);
    ctx.fillText('06:30 / hard edge', cx + R*.48, cy + R*.92);
    ctx.fillText('rent paid in attention', mx + 14, my - 12);
    ctx.restore();

    window.__artReady = true;
    if (!paused) requestAnimationFrame(draw);
  }

  function saveStill() {
    const a = document.createElement('a');
    a.download = '2026-05-31-threshold-clock-still.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  }

  addEventListener('resize', resize);
  addEventListener('pointermove', e => {
    mouse.x = e.clientX / Math.max(1, innerWidth);
    mouse.y = e.clientY / Math.max(1, innerHeight);
  });
  addEventListener('pointerdown', () => { mouse.down = true; seed += 17; reset(); });
  addEventListener('pointerup', () => { mouse.down = false; });
  addEventListener('keydown', e => {
    if (e.code === 'Space') { paused = !paused; if (!paused) requestAnimationFrame(draw); e.preventDefault(); }
    if (e.key.toLowerCase() === 'r') reset();
    if (e.key.toLowerCase() === 's') saveStill();
  });

  resize();
  reset();
  requestAnimationFrame(draw);
})();
  </script>

<script id="granted-hours-bgm-controller">
(() => {
  const bgm = document.getElementById('bgm');
  const soundToggle = document.getElementById('soundToggle');
  let soundEnabled = true;
  function updateSoundLabel(text) {
    if (!soundToggle) return;
    soundToggle.textContent = text;
    soundToggle.setAttribute('aria-pressed', soundEnabled ? 'true' : 'false');
  }
  async function tryPlaySound() {
    if (!bgm || !soundEnabled) return;
    bgm.volume = 0.42;
    try { await bgm.play(); updateSoundLabel('sound on'); }
    catch (err) { updateSoundLabel('sound click'); }
  }
  function setSound(on) {
    soundEnabled = on;
    if (!bgm) return;
    if (on) tryPlaySound();
    else { bgm.pause(); updateSoundLabel('sound off'); }
  }
  if (soundToggle) {
    soundToggle.addEventListener('click', (event) => {
      event.stopPropagation();
      if (!bgm) return;
      if (soundEnabled && !bgm.paused) setSound(false);
      else setSound(true);
    });
  }
  window.addEventListener('load', tryPlaySound);
  window.addEventListener('pointerdown', tryPlaySound, { once: true });
  window.addEventListener('keydown', tryPlaySound, { once: true });
})();
</script>
