<script id="granted-hours-fold-script">
(() => {
  if (window.__grantedHoursFoldReady) return;
  window.__grantedHoursFoldReady = true;
  const STORAGE_KEY = 'grantedHoursTextFolded';
  const params = new URLSearchParams(window.location.search);
  const IS_EMBED = new URLSearchParams(window.location.search).get('embed') === 'calendar';
  const IS_TIMETABLE_FULL_VIEW = params.get('from') === 'timetable';
  const MEDIA_TYPE = 'granted-hours:media';
  const MEDIA_VERSION = 1;
  const EMBED_CHANNEL = params.get('gh_channel') || '';
  const PARENT_ORIGIN = (() => {
    try { return new URL(document.referrer).origin; }
    catch (_) { return ''; }
  })();
  const nativePlay = HTMLMediaElement.prototype.play;
  const NativeAudio = window.Audio;
  const trackedAudio = new Set();
  let mediaEnabled = false;
  if (IS_EMBED) {
    function GrantedHoursAudio(...args) {
      return trackAudio(new NativeAudio(...args));
    }
    Object.setPrototypeOf(GrantedHoursAudio, NativeAudio);
    GrantedHoursAudio.prototype = NativeAudio.prototype;
    window.Audio = GrantedHoursAudio;
    HTMLMediaElement.prototype.play = function (...args) {
      if (this instanceof HTMLAudioElement) {
        trackAudio(this);
        if (!mediaEnabled) {
          silenceAudio(this);
          return Promise.resolve();
        }
        this.muted = false;
      }
      if (this instanceof HTMLVideoElement) this.muted = true;
      return nativePlay.apply(this, args);
    };
    document.addEventListener('play', (event) => {
      if (event.target instanceof HTMLAudioElement) {
        trackAudio(event.target);
        if (!mediaEnabled) silenceAudio(event.target);
        else event.target.muted = false;
      } else if (event.target instanceof HTMLVideoElement) {
        event.target.muted = true;
      }
    }, true);
    window.addEventListener('message', (event) => {
      if (event.source !== window.parent) return;
      if (!PARENT_ORIGIN || event.origin !== PARENT_ORIGIN) return;
      const message = event.data;
      if (!message || Object.getPrototypeOf(message) !== Object.prototype) return;
      if (Object.keys(message).sort().join(',') !== 'action,channel,type,version') return;
      if (message.type !== MEDIA_TYPE || message.version !== MEDIA_VERSION) return;
      if (!/^[a-zA-Z0-9_-]{16,128}$/.test(EMBED_CHANNEL) || message.channel !== EMBED_CHANNEL) return;
      if (message.action === 'play') setEmbeddedMediaState(true);
      else if (message.action === 'pause') setEmbeddedMediaState(false);
    });
  }
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'gh-fold-toggle';
  btn.setAttribute('aria-controls', 'textPanel legend');
  btn.setAttribute('aria-label', 'Fold or unfold artwork text overlays');
  const workNote = document.createElement('a');
  workNote.className = 'gh-work-note-link';
  workNote.href = '../';
  workNote.textContent = 'Work note / 作品说明';
  workNote.setAttribute('aria-label', 'Open the artwork intention and context note / 打开作品发心与创作语境说明');
  document.addEventListener('DOMContentLoaded', init, { once: true });
  if (document.readyState !== 'loading') init();
  function init() {
    if (!document.body || document.body.contains(btn)) return;
    if (!IS_EMBED) document.body.appendChild(workNote);
    if (IS_EMBED) {
      document.body.classList.add('gh-text-folded', 'gh-chamber-embed');
      silenceEmbeddedMedia();
      document.body.dataset.ghAudioEnabled = '0';
      new MutationObserver((records) => {
        records.forEach((record) => {
          record.addedNodes.forEach((node) => {
            if (!(node instanceof Element)) return;
            if (node instanceof HTMLAudioElement) trackAudio(node);
            node.querySelectorAll?.('audio').forEach(trackAudio);
            node.querySelectorAll?.('video').forEach((video) => { video.muted = true; });
          });
        });
      }).observe(document.documentElement, { childList: true, subtree: true });
      window.addEventListener('load', silenceEmbeddedMedia, { once: true });
      window.setTimeout(silenceEmbeddedMedia, 250);
      return;
    }
    document.body.appendChild(btn);
    const stored = localStorage.getItem(STORAGE_KEY);
    const mobileDefault = window.matchMedia && window.matchMedia('(max-width: 760px)').matches;
    setFolded(IS_TIMETABLE_FULL_VIEW ? false : (stored === null ? mobileDefault : stored === '1'), false);
    btn.addEventListener('click', () => setFolded(!document.body.classList.contains('gh-text-folded'), true));
  }
  function setFolded(folded, persist) {
    document.body.classList.toggle('gh-text-folded', folded);
    btn.textContent = folded ? 'Show text / 显示文字' : 'Fold text / 折叠文字';
    btn.setAttribute('aria-pressed', folded ? 'true' : 'false');
    if (persist) localStorage.setItem(STORAGE_KEY, folded ? '1' : '0');
  }
  function trackAudio(audio) {
    trackedAudio.add(audio);
    if (!mediaEnabled) silenceAudio(audio);
    return audio;
  }
  function silenceAudio(audio) {
    audio.muted = true;
    audio.removeAttribute('autoplay');
    audio.pause();
  }
  function silenceEmbeddedMedia() {
    document.querySelectorAll('audio').forEach(trackAudio);
    trackedAudio.forEach(silenceAudio);
    document.querySelectorAll('video').forEach((video) => { video.muted = true; });
  }
  function setEmbeddedMediaState(enabled) {
    mediaEnabled = enabled;
    if (document.body) document.body.dataset.ghAudioEnabled = enabled ? '1' : '0';
    document.querySelectorAll('audio').forEach(trackAudio);
    if (!enabled) {
      silenceEmbeddedMedia();
      return;
    }
    trackedAudio.forEach((audio) => {
      audio.muted = false;
      const playback = nativePlay.call(audio);
      if (playback && typeof playback.catch === 'function') playback.catch(() => {});
    });
  }
})();
</script>

  <style>

<body>
  <canvas id="field" aria-label="A generative instrument that measures wonder without exhausting it"></canvas>
  <section class="label" aria-hidden="true">
    <p class="kicker">Granted Hours · 2026-05-25</p>
    <h1>Measured Wonder<br>被测量的惊奇</h1>
    <div class="rule"></div>
  </section>
  <section class="readout" aria-hidden="true">
    <div class="metric"><span>Wonder</span><strong id="wonder">0.00</strong></div>
    <div class="metric"><span>Measure</span><strong id="measure">0.00</strong></div>
    <div class="metric"><span>Unspent</span><strong id="unspent">0.00</strong></div>
  </section>

  <script>
    (() => {
      const canvas = document.getElementById('field');
      const ctx = canvas.getContext('2d');
      const ui = {
        wonder: document.getElementById('wonder'),
        measure: document.getElementById('measure'),
        unspent: document.getElementById('unspent'),
      };

      const seed = 20260525;
      const TAU = Math.PI * 2;
      const state = {
        dpr: 1,
        width: 0,
        height: 0,
        t: 0,
        paused: false,
        grid: true,
        mouse: { x: 0.52, y: 0.48, active: false },
        witnesses: [],
      };

      function mulberry32(a) {
        return function next() {
          let t = a += 0x6D2B79F5;
          t = Math.imul(t ^ t >>> 15, t | 1);
          t ^= t + Math.imul(t ^ t >>> 7, t | 61);
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }

      const rnd = mulberry32(seed);
      const bodies = Array.from({ length: 34 }, (_, i) => ({
        orbit: 0.16 + rnd() * 0.58,
        phase: rnd() * TAU,
        speed: 0.12 + rnd() * 0.42,
        size: 1.5 + rnd() * 3.8,
        hue: rnd(),
        tension: 0.25 + rnd() * 0.75,
        memory: [],
        family: i % 4,
      }));

      function resize() {
        state.dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        state.width = window.innerWidth;
        state.height = window.innerHeight;
        canvas.width = Math.floor(state.width * state.dpr);
        canvas.height = Math.floor(state.height * state.dpr);
        ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      }

      function colorFor(body, alpha = 1) {
        const palette = [
          [245, 193, 95],
          [117, 216, 206],
          [231, 123, 139],
          [155, 199, 115],
        ];
        const c = palette[body.family];
        return `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${alpha})`;
      }

      function point(body, t) {
        const minSide = Math.min(state.width, state.height);
        const cx = state.width * (0.52 + 0.06 * Math.sin(t * 0.17));
        const cy = state.height * (0.54 + 0.04 * Math.cos(t * 0.19));
        const mx = (state.mouse.x - 0.5) * minSide * 0.3;
        const my = (state.mouse.y - 0.5) * minSide * 0.22;
        const wobble = Math.sin(t * (0.33 + body.tension) + body.phase * 2) * 0.055;
        const r = minSide * (body.orbit + wobble);
        const a = body.phase + t * body.speed * (body.family % 2 ? 1 : -1);
        return {
          x: cx + mx * body.tension + Math.cos(a) * r * (1 + body.hue * 0.18),
          y: cy + my * (1 - body.tension * 0.4) + Math.sin(a * (0.86 + body.hue * 0.2)) * r * 0.63,
        };
      }

      function drawBackground(t) {
        ctx.clearRect(0, 0, state.width, state.height);
        const gradient = ctx.createRadialGradient(
          state.width * 0.52, state.height * 0.52, 0,
          state.width * 0.52, state.height * 0.52, Math.max(state.width, state.height) * 0.7
        );
        gradient.addColorStop(0, 'rgba(244, 239, 226, 0.045)');
        gradient.addColorStop(0.45, 'rgba(117, 216, 206, 0.025)');
        gradient.addColorStop(1, 'rgba(5, 7, 11, 0.82)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, state.width, state.height);

        if (!state.grid) return;
        ctx.save();
        ctx.translate(state.width * 0.52, state.height * 0.54);
        ctx.rotate(Math.sin(t * 0.05) * 0.03);
        ctx.strokeStyle = 'rgba(244, 239, 226, 0.075)';
        ctx.lineWidth = 1;
        const maxR = Math.min(state.width, state.height) * 0.66;
        for (let r = maxR * 0.18; r < maxR; r += maxR * 0.13) {
          ctx.beginPath();
          ctx.ellipse(0, 0, r * 1.18, r * 0.72, 0, 0, TAU);
          ctx.stroke();
        }
        for (let i = 0; i < 28; i++) {
          const a = i / 28 * TAU;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * maxR * 0.1, Math.sin(a) * maxR * 0.06);
          ctx.lineTo(Math.cos(a) * maxR * 1.25, Math.sin(a) * maxR * 0.76);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawMeasureLines(points, measure) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < points.length; i++) {
          for (let j = i + 1; j < points.length; j++) {
            const a = points[i], b = points[j];
            const dx = a.x - b.x, dy = a.y - b.y;
            const d = Math.hypot(dx, dy);
            if (d < 82 + measure * 160) {
              const alpha = Math.max(0, 1 - d / (120 + measure * 170)) * 0.28;
              ctx.strokeStyle = `rgba(244, 239, 226, ${alpha})`;
              ctx.lineWidth = 0.7;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }
        }
        ctx.restore();
      }

      function drawBodies(t, points, wonder) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        points.forEach((p, i) => {
          const b = bodies[i];
          b.memory.push(p);
          if (b.memory.length > 42) b.memory.shift();

          ctx.strokeStyle = colorFor(b, 0.12 + wonder * 0.08);
          ctx.lineWidth = 1.1;
          ctx.beginPath();
          b.memory.forEach((m, idx) => {
            if (idx === 0) ctx.moveTo(m.x, m.y);
            else ctx.lineTo(m.x, m.y);
          });
          ctx.stroke();

          const pulse = 1 + Math.sin(t * 2.1 + b.phase) * 0.22;
          ctx.fillStyle = colorFor(b, 0.72);
          ctx.beginPath();
          ctx.arc(p.x, p.y, b.size * pulse + wonder * 2.6, 0, TAU);
          ctx.fill();
        });
        ctx.restore();
      }

      function drawWitnesses(t) {
        ctx.save();
        state.witnesses = state.witnesses.filter(w => t - w.t < 7);
        for (const w of state.witnesses) {
          const age = t - w.t;
          const r = age * 42 + 18;
          const alpha = Math.max(0, 1 - age / 7);
          ctx.strokeStyle = `rgba(245, 193, 95, ${alpha * 0.34})`;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.arc(w.x * state.width, w.y * state.height, r, 0, TAU);
          ctx.stroke();
          ctx.strokeStyle = `rgba(117, 216, 206, ${alpha * 0.24})`;
          ctx.beginPath();
          ctx.arc(w.x * state.width, w.y * state.height, r * 0.58, 0, TAU);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawGauge(wonder, measure, unspent) {
        const cx = state.width * 0.18;
        const cy = state.height * 0.78;
        const r = Math.min(state.width, state.height) * 0.12;
        const values = [
          { v: wonder, c: 'rgba(245, 193, 95, 0.9)' },
          { v: measure, c: 'rgba(117, 216, 206, 0.82)' },
          { v: unspent, c: 'rgba(231, 123, 139, 0.72)' },
        ];

        ctx.save();
        ctx.lineCap = 'round';
        values.forEach((item, i) => {
          ctx.strokeStyle = item.c;
          ctx.lineWidth = 8 - i * 1.6;
          ctx.beginPath();
          ctx.arc(cx, cy, r - i * 18, -Math.PI * 0.8, -Math.PI * 0.8 + item.v * Math.PI * 1.6);
          ctx.stroke();
        });
        ctx.strokeStyle = 'rgba(244, 239, 226, 0.12)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cx, cy, r + 18, 0, TAU);
        ctx.stroke();
        ctx.restore();
      }

      function draw(now) {
        if (!state.paused) state.t = now * 0.001;
        const t = state.t;
        const wonder = 0.5 + 0.5 * Math.sin(t * 0.31 + state.mouse.x * 2.4);
        const measure = 0.5 + 0.5 * Math.sin(t * 0.23 + state.mouse.y * 2.1 + 1.5);
        const unspent = Math.max(0, 1 - Math.abs(wonder - measure) * 0.82);
        const points = bodies.map(b => point(b, t));

        drawBackground(t);
        drawMeasureLines(points, measure);
        drawBodies(t, points, wonder);
        drawWitnesses(t);
        drawGauge(wonder, measure, unspent);

        ui.wonder.textContent = wonder.toFixed(2);
        ui.measure.textContent = measure.toFixed(2);
        ui.unspent.textContent = unspent.toFixed(2);
        requestAnimationFrame(draw);
      }

      function pointer(e) {
        state.mouse.active = true;
        state.mouse.x = Math.min(1, Math.max(0, e.clientX / Math.max(1, state.width)));
        state.mouse.y = Math.min(1, Math.max(0, e.clientY / Math.max(1, state.height)));
      }

      window.addEventListener('resize', resize);
      window.addEventListener('pointermove', pointer);
      window.addEventListener('pointerdown', (e) => {
        pointer(e);
        state.witnesses.push({ x: state.mouse.x, y: state.mouse.y, t: state.t });
      });
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          state.paused = !state.paused;
        } else if (e.key.toLowerCase() === 'r') {
          bodies.forEach(b => { b.memory = []; });
          state.witnesses = [];
        } else if (e.key.toLowerCase() === 'g') {
          state.grid = !state.grid;
        } else if (e.key.toLowerCase() === 's') {
          const a = document.createElement('a');
          a.download = 'measured-wonder.png';
          a.href = canvas.toDataURL('image/png');
          a.click();
        }
      });

      resize();
      window._artReady = true;
      requestAnimationFrame(draw);
    })();
  </script>

<style id="granted-hours-bgm-style">
  #granted-hours-sound-toggle {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 99999;
    border: 1px solid rgba(255,255,255,.28);
    border-radius: 999px;
    padding: 9px 13px;
    background: rgba(7, 10, 18, .68);
    color: rgba(245,248,255,.92);
    font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    letter-spacing: .08em;
    text-transform: uppercase;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 30px rgba(0,0,0,.28);
    cursor: pointer;
  }
  #granted-hours-sound-toggle:hover { background: rgba(20, 28, 46, .82); }
</style>
<audio id="granted-hours-bgm" src="./2026-05-25-measured-wonder-bgm.mp3" preload="auto" autoplay loop></audio>
<button id="granted-hours-sound-toggle" type="button" aria-label="Toggle background music">sound on</button>
<script id="granted-hours-bgm-script">
(() => {
  const audio = document.getElementById('granted-hours-bgm');
  const button = document.getElementById('granted-hours-sound-toggle');
  if (!audio || !button) return;
  audio.volume = 0.42;
  let enabled = true;
  const label = () => {
    if (!enabled) button.textContent = 'sound off';
    else if (audio.paused) button.textContent = 'sound click';
    else button.textContent = 'sound on';
  };
  const play = async () => {
    enabled = true;
    try { await audio.play(); } catch (err) { /* Browser may require a click. */ }
    label();
  };
  const stop = () => { enabled = false; audio.pause(); label(); };
  const setSound = (next) => next ? play() : stop();
  button.addEventListener('click', () => {
    if (enabled && !audio.paused) setSound(false);
    else setSound(true);
  });
  document.addEventListener('pointerdown', () => { if (enabled && audio.paused) play(); }, { once: true });
  window.addEventListener('load', play, { once: true });
  audio.addEventListener('play', label);
  audio.addEventListener('pause', label);
  label();
})();
</script>
