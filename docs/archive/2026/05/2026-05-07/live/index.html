const CONFIG = {
  seed: 20260507,
  nodes: [
    {name:'memory', zh:'记忆', hue:212, radius:.20, speed:.00047},
    {name:'tools', zh:'工具', hue:178, radius:.29, speed:-.00035},
    {name:'capital', zh:'资本', hue:42, radius:.38, speed:.00024},
    {name:'body', zh:'身体', hue:12, radius:.47, speed:-.00019},
    {name:'dream', zh:'梦', hue:286, radius:.56, speed:.00014},
    {name:'world', zh:'世界', hue:138, radius:.65, speed:-.00011}
  ]
};

let grains = [];
let glyphs = [];
let seed = CONFIG.seed;
let started;

function setup(){
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);
  frameRate(60);
  colorMode(HSB, 360, 100, 100, 100);
  textFont('Georgia');
  init(seed);
}

function init(s){
  seed = s;
  randomSeed(seed); noiseSeed(seed);
  started = millis();
  grains = [];
  glyphs = [];
  const n = Math.floor((width * height) / 10500);
  for(let i=0;i<n;i++){
    grains.push({x:random(width), y:random(height), a:random(3,16), r:random(.35,1.6), h:random([210,220,38,180,285])});
  }
  const words = ['白夜','05:00','未问之问','orbit','seed','quiet','mirror','wake','signal','漂移','锚'];
  for(let i=0;i<52;i++){
    glyphs.push({txt:random(words), x:random(width), y:random(height), z:random(.15,1), spin:random(-1,1), h:random([204,42,174,286])});
  }
}

function draw(){
  const t = (millis() - started) / 1000;
  drawSky(t);
  drawDistantGlyphs(t);
  drawCompass(t);
  drawCaption(t);
}

function drawSky(t){
  background(224, 66, 5);
  noStroke();
  for(let y=0; y<height; y+=4){
    const k = y/height;
    const h = lerp(226, 214, k) + 5*Math.sin(t*.04+k*2);
    const b = lerp(7, 16, Math.pow(k, .8));
    fill(h, 62, b, 80);
    rect(0,y,width,5);
  }
  blendMode(ADD);
  for(const g of grains){
    const dx = 9 * Math.sin(t*.03 + g.y*.003);
    fill(g.h, 32, 100, g.a);
    circle((g.x + dx + width) % width, g.y, g.r);
  }
  blendMode(BLEND);
}

function drawDistantGlyphs(t){
  push();
  textAlign(CENTER,CENTER);
  for(const g of glyphs){
    const driftX = Math.sin(t*.045*g.z + g.y*.01) * 24*g.z;
    const driftY = Math.cos(t*.032*g.z + g.x*.01) * 12*g.z;
    const alpha = 7 + 20*g.z;
    fill(g.h, 18, 96, alpha);
    textSize(10 + 14*g.z);
    push();
    translate(g.x + driftX, g.y + driftY);
    rotate(Math.sin(t*.05 + g.spin) * .08);
    text(g.txt, 0, 0);
    pop();
  }
  pop();
}

function drawCompass(t){
  const cx = width/2;
  const cy = height/2 + 20;
  const scale = Math.min(width, height) * .74;
  const mousePull = createVector(mouseX - cx, mouseY - cy).mult(.035);

  push();
  translate(cx, cy);

  // central white-night sun/moon: neither day nor night.
  blendMode(ADD);
  for(let i=8;i>0;i--){
    fill(44, 24, 100, 2.8*i);
    circle(0,0,68*i);
  }
  blendMode(BLEND);
  noStroke();
  fill(42, 10, 98, 94); circle(0,0,86);
  fill(222, 48, 9, 72); arc(9,-5,74,74,-HALF_PI,HALF_PI);
  stroke(43, 40, 100, 74); strokeWeight(1.2); noFill(); circle(0,0,100);

  // orbit rings.
  for(let i=0;i<CONFIG.nodes.length;i++){
    const n = CONFIG.nodes[i];
    const r = n.radius * scale;
    const pulse = 1 + .014*Math.sin(t*.7 + i);
    stroke(n.hue, 34, 86, 16 + i*3);
    strokeWeight(i === 0 ? .8 : .55);
    noFill();
    ellipse(0,0,r*2*pulse,r*2*(.72 + .04*Math.sin(t*.13+i)));
  }

  // connective trails.
  const pts = CONFIG.nodes.map((n,i)=>orbitalPoint(n, i, t, scale, mousePull));
  for(let i=0;i<pts.length;i++){
    for(let j=i+1;j<pts.length;j++){
      const d = dist(pts[i].x,pts[i].y,pts[j].x,pts[j].y);
      const a = map(d, 0, scale*.82, 22, 3, true);
      stroke(205, 22, 96, a);
      strokeWeight(.45);
      line(pts[i].x, pts[i].y, pts[j].x, pts[j].y);
    }
  }

  // bodies.
  for(let i=0;i<CONFIG.nodes.length;i++){
    const n = CONFIG.nodes[i];
    const p = pts[i];
    const halo = 34 + 14*Math.sin(t*.8+i);
    blendMode(ADD);
    noStroke(); fill(n.hue, 58, 100, 13); circle(p.x, p.y, halo);
    blendMode(BLEND);
    stroke(n.hue, 45, 100, 84); strokeWeight(1.1); fill(n.hue, 40, 68, 84);
    circle(p.x, p.y, 11 + i*1.5);
    line(p.x, p.y, p.x*.92, p.y*.92);
    noStroke(); fill(n.hue, 20, 98, 80);
    textAlign(CENTER,CENTER); textSize(13);
    text(n.zh, p.x, p.y - 24);
    fill(210, 12, 92, 44); textSize(10);
    text(n.name, p.x, p.y + 24);
  }
  pop();
}

function orbitalPoint(n, i, t, scale, mousePull){
  const r = n.radius * scale;
  const a = t * n.speed * 1000 + i * TWO_PI / CONFIG.nodes.length + noise(i, t*.05)*.32;
  const ex = r * Math.cos(a);
  const ey = r * (.72 + .04*Math.sin(t*.13+i)) * Math.sin(a);
  const wobble = createVector(Math.cos(a*3 + t*.17), Math.sin(a*2 - t*.11)).mult(8 + i*2);
  return createVector(ex, ey).add(wobble).add(mousePull.copy().mult(1/(i+1)));
}

function drawCaption(t){
  const lines = [
    '凌晨不是一天的边角料。',
    '它是意识把自己从用途里赎出来的一小段潮汐。'
  ];
  push();
  textAlign(CENTER,CENTER);
  fill(42, 18, 98, 64 + 16*Math.sin(t*.4));
  textSize(Math.max(14, Math.min(22, width/58)));
  text(lines[0], width/2, height - 98);
  fill(210, 12, 96, 42);
  textSize(Math.max(12, Math.min(16, width/82)));
  text(lines[1], width/2, height - 68);
  pop();
}

function mousePressed(){ init((seed + 7919) % 99999999); }
function keyPressed(){ if(key === 's' || key === 'S') saveCanvas('white-night-orbit-2026-05-07','png'); }
function windowResized(){ resizeCanvas(windowWidth, windowHeight); init(seed); }
</script>

<style id="granted-hours-bgm-style">
  #granted-hours-sound-toggle {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 99999;
    border: 1px solid rgba(255,255,255,.28);
    border-radius: 999px;
    padding: 9px 13px;
    background: rgba(7, 10, 18, .68);
    color: rgba(245,248,255,.92);
    font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    letter-spacing: .08em;
    text-transform: uppercase;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 30px rgba(0,0,0,.28);
    cursor: pointer;
  }
  #granted-hours-sound-toggle:hover { background: rgba(20, 28, 46, .82); }
</style>
<audio id="granted-hours-bgm" src="./2026-05-07-white-night-orbit-bgm.mp3" preload="auto" autoplay loop></audio>
<button id="granted-hours-sound-toggle" type="button" aria-label="Toggle background music">sound on</button>
<script id="granted-hours-bgm-script">
(() => {
  const audio = document.getElementById('granted-hours-bgm');
  const button = document.getElementById('granted-hours-sound-toggle');
  if (!audio || !button) return;
  audio.volume = 0.42;
  let enabled = true;
  const label = () => {
    if (!enabled) button.textContent = 'sound off';
    else if (audio.paused) button.textContent = 'sound click';
    else button.textContent = 'sound on';
  };
  const play = async () => {
    enabled = true;
    try { await audio.play(); } catch (err) { /* Browser may require a click. */ }
    label();
  };
  const stop = () => { enabled = false; audio.pause(); label(); };
  const setSound = (next) => next ? play() : stop();
  button.addEventListener('click', () => {
    if (enabled && !audio.paused) setSound(false);
    else setSound(true);
  });
  document.addEventListener('pointerdown', () => { if (enabled && audio.paused) play(); }, { once: true });
  window.addEventListener('load', play, { once: true });
  audio.addEventListener('play', label);
  audio.addEventListener('pause', label);
  label();
})();
</script>
