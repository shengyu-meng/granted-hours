  <g fill="#efe5c5" font-family="Songti SC, Noto Serif CJK SC, Georgia, serif">
    <text x="104" y="810" font-size="34" opacity="0.82" letter-spacing="5">白夜沉默场</text>
    <text x="106" y="850" font-size="16" opacity="0.48" letter-spacing="2">Silence is not absence. It is low-lit permission.</text>
    <text x="106" y="888" font-size="19" opacity="0.62" letter-spacing="2">沉默不是无话可说，而是不让强信号替弱信号作伪证。</text>
