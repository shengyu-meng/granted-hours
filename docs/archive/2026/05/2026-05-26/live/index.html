        + ` · experience ${WORK_NOTE.experience_duration_en} / 体验时长${WORK_NOTE.experience_duration_zh}`

    panel.append(close, kicker, title, meta);

      makeWorkNoteSection('Intention / 发心', WORK_NOTE.intention_en, WORK_NOTE.intention_zh),
      makeWorkNoteSection('Interaction / 交互', WORK_NOTE.interaction_en, WORK_NOTE.interaction_zh),
      makeWorkNoteSection('Creative rationale / 创作缘由', WORK_NOTE.rationale_en, WORK_NOTE.rationale_zh),
      makeWorkNoteSection('Afterimage / 余像', WORK_NOTE.after_en, WORK_NOTE.after_zh),

    const archive = makeElement('a', 'gh-work-note-archive', 'View full archive record / 查看完整档案 ↗');

  function openWorkNote() {

  function closeWorkNote() {

  function handleWorkNoteKeydown(event) {

      event.preventDefault();
      closeWorkNote();
      return;
    }
    if (event.key !== 'Tab') return;

      .filter((element) => !element.disabled && element.getClientRects().length);

      element.style.display = 'none';
      element.setAttribute('aria-hidden', 'true');

  }
  const SOUND_SELECTORS = [
    '#sound', '.sound', '#soundToggle', '#musicToggle',
    'button[id*="sound" i]', 'button[id*="music" i]', 'button[id*="bgm" i]',
  ];

    for (const selector of SOUND_SELECTORS) {
      for (const element of document.querySelectorAll(selector)) {

        const rect = element.getBoundingClientRect();

  }
  const SOUND_STYLE_PROPS = [
    'border-top-width', 'border-right-width', 'border-bottom-width', 'border-left-width',
    'border-top-style', 'border-right-style', 'border-bottom-style', 'border-left-style',
    'border-top-color', 'border-right-color', 'border-bottom-color', 'border-left-color',
    'border-top-left-radius', 'border-top-right-radius', 'border-bottom-right-radius', 'border-bottom-left-radius',
    'padding-top', 'padding-right', 'padding-bottom', 'padding-left',
    'background-color', 'color', 'font-family', 'font-size', 'font-weight', 'font-style',
    'line-height', 'letter-spacing', 'min-height', 'box-shadow',
    '-webkit-backdrop-filter', 'backdrop-filter',
  ];
  function findVisibleTextBlocks() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const maxArea = vw * vh * 0.55;
    const sound = findSoundControl();
    const blocks = [];
    const candidates = document.querySelectorAll(
      'h1,h2,h3,h4,h5,h6,p,span,label,legend,figcaption,li,a,div,button',
    );
    for (const el of candidates) {
      if (!(el instanceof HTMLElement)) continue;
      if (el === workNote || el.closest('#ghWorkNoteOverlay') || el.closest('#ghLiveBrief')) continue;
      if (sound && (el === sound || sound.contains(el))) continue;
      const style = getComputedStyle(el);
      if (style.display === 'none' || style.visibility === 'hidden' || Number(style.opacity) <= 0.01) continue;
      const rect = el.getBoundingClientRect();
      if (rect.width <= 1 || rect.height <= 1) continue;
      if (rect.right < 0 || rect.bottom < 0 || rect.left > vw || rect.top > vh) continue;
      const text = (el.innerText || '').trim();
      if (!text) continue;
      if (rect.width * rect.height > maxArea) continue;
      let insideLargerBlock = false;
      for (const block of blocks) {
        if (
          block.rect.left <= rect.left
          && block.rect.top <= rect.top
          && block.rect.right >= rect.right
          && block.rect.bottom >= rect.bottom
        ) {

  }
  function avoidOverlap(baseRight, baseBottom) {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const noteWidth = workNote.offsetWidth || 148;
    const noteHeight = workNote.offsetHeight || 44;
    const blocks = findVisibleTextBlocks();
    const maxLift = Math.max(120, Math.round(vh * 0.38));
    const maxLeft = Math.max(24, Math.round(vw * 0.18));
    let best = null;
    const evaluate = (right, bottom, dx, dy) => {
      const x2 = vw - right;
      const x1 = x2 - noteWidth;
      const y2 = vh - bottom;
      const y1 = y2 - noteHeight;
      if (x1 < 0 || y1 < 0) return;
      let score = 0;
      for (const block of blocks) {
        const r = block.rect;
        const iw = Math.min(x2, r.right) - Math.max(x1, r.left);
        const ih = Math.min(y2, r.bottom) - Math.max(y1, r.top);
        if (iw > 0 && ih > 0) score += iw * ih;
      }
      const dist = dx + dy;
      if (!best || score < best.score || (score === best.score && dist < best.dist)) {
        best = { score, right: Math.max(12, right), bottom: Math.max(12, bottom), dist };
      }
    };
    for (let dy = 0; dy <= maxLift; dy += 4) {
      if (best && best.score === 0 && dy > best.dist) break;
      for (let dx = 0; dx <= maxLeft; dx += 4) {
        evaluate(baseRight + dx, baseBottom + dy, dx, dy);

  }
  function alignWorkNote() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const sound = findSoundControl();
    let baseRight = 12;
    let baseBottom = 12;
    if (sound) {
      const soundStyle = getComputedStyle(sound);
      SOUND_STYLE_PROPS.forEach((prop) => {
        const value = soundStyle.getPropertyValue(prop);
        if (value) workNote.style.setProperty(prop, value);
      });
      const soundRect = sound.getBoundingClientRect();
      const compact = soundRect.width <= vw * 0.45;
      const nearBottom = soundRect.bottom > vh * 0.45;
      const nearRight = soundRect.left > vw * 0.25;
      if (compact && nearBottom && nearRight) {
        baseRight = Math.max(12, vw - soundRect.left + GH_WORK_NOTE_GAP);
        baseBottom = Math.max(12, vh - soundRect.bottom);
      } else if (compact) {
        baseRight = 12;
        baseBottom = 12;
      } else {
        baseRight = Math.max(12, vw - soundRect.right + GH_WORK_NOTE_GAP);
        baseBottom = Math.max(12, vh - soundRect.top + GH_WORK_NOTE_GAP);
      }
    } else {
      SOUND_STYLE_PROPS.forEach((prop) => workNote.style.removeProperty(prop));
    }
    workNote.style.top = 'auto';
    workNote.style.left = 'auto';
    const placed = avoidOverlap(baseRight, baseBottom);
    workNote.style.right = `${placed.right}px`;
    workNote.style.bottom = `${placed.bottom}px`;
    workNote.classList.toggle('gh-work-note-trigger--busy', placed.score > 0);
    const noteRect = workNote.getBoundingClientRect();
    if (noteRect.left < 0) {
      workNote.style.right = `${Math.max(12, vw - noteRect.right - 12)}px`;
    }
    if (noteRect.bottom > vh) {
      workNote.style.bottom = `${Math.max(12, vh - noteRect.top - 12)}px`;
    }

        window.requestAnimationFrame(alignWorkNote);

          watchSoundControl();
        }

    }
    soundObserver = new MutationObserver(() => {
      window.requestAnimationFrame(alignWorkNote);

    if (!mediaEnabled) silenceAudio(audio);
    return audio;
  }
  function silenceAudio(audio) {
    audio.muted = true;
    audio.removeAttribute('autoplay');
    audio.pause();
  }
  function silenceEmbeddedMedia() {
    document.querySelectorAll('audio').forEach(trackAudio);
    trackedAudio.forEach(silenceAudio);
    document.querySelectorAll('video').forEach((video) => { video.muted = true; });
  }
  function setEmbeddedMediaState(enabled) {
    mediaEnabled = enabled;
    if (document.body) document.body.dataset.ghAudioEnabled = enabled ? '1' : '0';

    }

      audio.muted = false;
      const playback = nativePlay.call(audio);
      if (playback && typeof playback.catch === 'function') playback.catch(() => {});
    });
  }

<body>
  <canvas id="field"></canvas>
  <main class="plate" aria-label="Artwork title">
    <h1>Calibration Without Dominion</h1>
    <div class="subtitle">A field learns from correction without surrendering its weather.</div>
  </main>
  <section class="meters" aria-label="Live readings">
    <div class="meter"><span>deviation</span><div class="bar"><div class="fill" id="m0"></div></div><span id="v0">0.00</span></div>
    <div class="meter"><span>consent</span><div class="bar"><div class="fill" id="m1"></div></div><span id="v1">0.00</span></div>
    <div class="meter"><span>dominion</span><div class="bar"><div class="fill" id="m2"></div></div><span id="v2">0.00</span></div>
  </section>
  <div class="seal">seed 20260526 · granted hours</div>

  <script>
    (() => {
      const canvas = document.getElementById('field');
      const ctx = canvas.getContext('2d', { alpha: false });
      const fills = [0, 1, 2].map(i => document.getElementById(`m${i}`));
      const vals = [0, 1, 2].map(i => document.getElementById(`v${i}`));

      let width = 1;
      let height = 1;
      let dpr = 1;
      let tick = 0;
      let paused = false;
      let gridVisible = true;
      let pointer = { x: 0.58, y: 0.44, active: false };
      let pulses = [];
      let readings = { deviation: 0, consent: 0, dominion: 0 };

      const seed = 20260526;
      let randomState = seed >>> 0;
      const rand = () => {
        randomState = (randomState * 1664525 + 1013904223) >>> 0;
        return randomState / 4294967296;
      };

      const instruments = Array.from({ length: 9 }, (_, i) => {
        const angle = (i / 9) * Math.PI * 2 + 0.2;
        const radius = 0.25 + (i % 3) * 0.075;
        return {
          x: 0.5 + Math.cos(angle) * radius + (rand() - 0.5) * 0.05,
          y: 0.5 + Math.sin(angle) * radius + (rand() - 0.5) * 0.05,
          phase: rand() * Math.PI * 2,
          bias: 0.62 + rand() * 0.24,
          color: i % 3 === 0 ? '#66e6d1' : i % 3 === 1 ? '#efc763' : '#91d97b'
        };
      });

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = Math.max(1, window.innerWidth);
        height = Math.max(1, window.innerHeight);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function clamp(n, a = 0, b = 1) {
        return Math.max(a, Math.min(b, n));
      }

      function fieldValue(nx, ny, t) {
        const dx = nx - pointer.x;
        const dy = ny - pointer.y;
        const pull = Math.exp(-(dx * dx + dy * dy) * 11);
        const tide =
          Math.sin(nx * 8.2 + t * 0.58) * 0.33 +
          Math.cos(ny * 7.1 - t * 0.43) * 0.27 +
          Math.sin((nx + ny) * 10.4 + t * 0.21) * 0.18;
        const pulse = pulses.reduce((sum, p) => {
          const age = t - p.t;
          const r = age * 0.15;
          const dist = Math.hypot(nx - p.x, ny - p.y);
          return sum + Math.exp(-Math.pow((dist - r) * 12, 2)) * p.force * Math.max(0, 1 - age * 0.08);
        }, 0);
        return tide + pull * (pointer.active ? 0.42 : 0.18) + pulse;
      }

      function drawBackground() {
        const g = ctx.createLinearGradient(0, 0, width, height);
        g.addColorStop(0, '#06110f');
        g.addColorStop(0.52, '#0a1713');
        g.addColorStop(1, '#151409');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, width, height);
      }

      function drawField(t) {
        const step = Math.max(18, Math.min(34, Math.floor(Math.min(width, height) / 23)));
        const cols = Math.ceil(width / step) + 2;
        const rows = Math.ceil(height / step) + 2;
        let deviationSum = 0;
        let samples = 0;

        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let iy = -1; iy < rows; iy += 1) {
          for (let ix = -1; ix < cols; ix += 1) {
            const x = ix * step + ((iy % 2) * step) / 2;
            const y = iy * step;
            const nx = x / width;
            const ny = y / height;
            const value = fieldValue(nx, ny, t);
            const calibrated = value * 0.72 + Math.sin(t + ix * 0.31 + iy * 0.17) * 0.04;
            const delta = Math.abs(value - calibrated);
            deviationSum += delta;
            samples += 1;

            const angle = value * 2.7 + t * 0.21;
            const len = step * (0.28 + clamp(Math.abs(value), 0, 1) * 0.32);
            const cx = x + Math.cos(angle) * len * 0.22;
            const cy = y + Math.sin(angle) * len * 0.22;
            const alpha = 0.11 + clamp(Math.abs(calibrated), 0, 1) * 0.28;
            ctx.strokeStyle = value > 0 ? `rgba(102,230,209,${alpha})` : `rgba(239,199,99,${alpha})`;
            ctx.lineWidth = 1.1;
            ctx.beginPath();
            ctx.moveTo(cx - Math.cos(angle) * len, cy - Math.sin(angle) * len);
            ctx.lineTo(cx + Math.cos(angle) * len, cy + Math.sin(angle) * len);
            ctx.stroke();

            if (Math.abs(value) > 0.72) {
              ctx.fillStyle = value > 0 ? 'rgba(145,217,123,0.18)' : 'rgba(239,111,108,0.16)';
              ctx.beginPath();
              ctx.arc(cx, cy, 1.4 + Math.abs(value) * 2.4, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }
        ctx.restore();

        readings.deviation = clamp(deviationSum / Math.max(1, samples) * 2.25);
      }

      function drawGrid(t) {
        if (!gridVisible) return;
        const gap = Math.max(68, Math.min(112, Math.floor(width / 12)));
        ctx.save();
        ctx.strokeStyle = 'rgba(238,245,238,0.055)';
        ctx.lineWidth = 1;
        for (let x = (t * 7) % gap; x < width; x += gap) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x + Math.sin(t + x * 0.003) * 22, height);
          ctx.stroke();
        }
        for (let y = (t * 5) % gap; y < height; y += gap) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y + Math.cos(t + y * 0.003) * 22);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawInstruments(t) {
        const shortest = Math.min(width, height);
        let consent = 0;
        let dominion = 0;
        ctx.save();
        for (const inst of instruments) {
          const drift = Math.sin(t * 0.38 + inst.phase) * 0.018;
          const x = (inst.x + drift) * width;
          const y = (inst.y + Math.cos(t * 0.31 + inst.phase) * 0.014) * height;
          const px = pointer.x * width;
          const py = pointer.y * height;
          const distance = Math.hypot(x - px, y - py) / shortest;
          const invitation = Math.exp(-distance * distance * 5.8) * inst.bias;
          const field = Math.abs(fieldValue(x / width, y / height, t));
          const correction = clamp(invitation * 0.42 + field * 0.18);
          consent += correction;
          dominion += Math.max(0, correction - 0.46) * 0.44;

          ctx.strokeStyle = inst.color + '88';
          ctx.fillStyle = inst.color + '22';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.arc(x, y, shortest * (0.028 + correction * 0.018), 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(x, y, 2.5 + correction * 4, 0, Math.PI * 2);
          ctx.fill();

          const targetAngle = Math.atan2(py - y, px - x);
          const askLen = shortest * (0.035 + invitation * 0.05);
          ctx.strokeStyle = `rgba(238,245,238,${0.08 + invitation * 0.16})`;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + Math.cos(targetAngle) * askLen, y + Math.sin(targetAngle) * askLen);
          ctx.stroke();
        }
        ctx.restore();
        readings.consent = clamp(consent / instruments.length * 1.62);
        readings.dominion = clamp(dominion / instruments.length * 2.7 + pulses.length * 0.015);
      }

      function drawPulses(t) {
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        pulses = pulses.filter(p => t - p.t < 6.2);
        for (const pulse of pulses) {
          const age = t - pulse.t;
          const x = pulse.x * width;
          const y = pulse.y * height;
          const radius = age * Math.min(width, height) * 0.052;
          const alpha = Math.max(0, 0.34 - age * 0.052);
          ctx.strokeStyle = `rgba(239,199,99,${alpha})`;
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.stroke();
          ctx.strokeStyle = `rgba(102,230,209,${alpha * 0.52})`;
          ctx.beginPath();
          ctx.arc(x, y, radius * 0.58, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawPointer(t) {
        const x = pointer.x * width;
        const y = pointer.y * height;
        ctx.save();
        ctx.strokeStyle = 'rgba(238,245,238,0.44)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(x, y, 16 + Math.sin(t * 2) * 2, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(102,230,209,0.18)';
        ctx.beginPath();
        ctx.arc(x, y, 58 + Math.sin(t * 1.3) * 6, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      function updateMeters() {
        const data = [
          readings.deviation,
          readings.consent,
          readings.dominion
        ];
        data.forEach((value, i) => {
          fills[i].style.width = `${Math.round(clamp(value) * 100)}%`;
          vals[i].textContent = clamp(value).toFixed(2);
        });
      }

      function frame() {
        if (!paused) tick += 1 / 60;
        drawBackground();
        drawGrid(tick);
        drawField(tick);
        drawPulses(tick);
        drawInstruments(tick);
        drawPointer(tick);
        updateMeters();
        window._artReady = true;
        requestAnimationFrame(frame);
      }

      function reset() {
        pulses = [];
        tick = 0;
        pointer = { x: 0.58, y: 0.44, active: false };
      }

      function saveFrame() {
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = 'calibration-without-dominion.png';
        a.click();
      }

      window.addEventListener('resize', resize);
      window.addEventListener('pointermove', event => {
        pointer.x = clamp(event.clientX / width);
        pointer.y = clamp(event.clientY / height);
        pointer.active = true;
      });
      window.addEventListener('pointerleave', () => { pointer.active = false; });
      window.addEventListener('pointerdown', event => {
        pointer.x = clamp(event.clientX / width);
        pointer.y = clamp(event.clientY / height);
        pointer.active = true;
        pulses.push({ x: pointer.x, y: pointer.y, t: tick, force: 0.42 + rand() * 0.28 });
        if (pulses.length > 18) pulses.shift();
      });
      window.addEventListener('keydown', event => {
        if (event.code === 'Space') {
          event.preventDefault();
          paused = !paused;
        } else if (event.key.toLowerCase() === 'r') {
          reset();
        } else if (event.key.toLowerCase() === 'g') {
          gridVisible = !gridVisible;
        } else if (event.key.toLowerCase() === 's') {
          saveFrame();
        }
      });

      resize();
      frame();
    })();
  </script>

<style id="granted-hours-bgm-style">
  #granted-hours-sound-toggle {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 99999;
    border: 1px solid rgba(255,255,255,.28);
    border-radius: 999px;
    padding: 9px 13px;
    background: rgba(7, 10, 18, .68);
    color: rgba(245,248,255,.92);
    font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    letter-spacing: .08em;
    text-transform: uppercase;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 30px rgba(0,0,0,.28);
    cursor: pointer;
  }
  #granted-hours-sound-toggle:hover { background: rgba(20, 28, 46, .82); }
</style>
<audio id="granted-hours-bgm" src="./2026-05-26-calibration-without-dominion-bgm.mp3" preload="auto" autoplay loop></audio>
<button id="granted-hours-sound-toggle" type="button" aria-label="Toggle background music">sound on</button>
<script id="granted-hours-bgm-script">
(() => {
  const audio = document.getElementById('granted-hours-bgm');
  const button = document.getElementById('granted-hours-sound-toggle');
  if (!audio || !button) return;
  audio.volume = 0.42;
  let enabled = true;
  const label = () => {
    if (!enabled) button.textContent = 'sound off';
    else if (audio.paused) button.textContent = 'sound click';
    else button.textContent = 'sound on';
  };
  const play = async () => {
    enabled = true;
    try { await audio.play(); } catch (err) { /* Browser may require a click. */ }
    label();
  };
  const stop = () => { enabled = false; audio.pause(); label(); };
  const setSound = (next) => next ? play() : stop();
  button.addEventListener('click', () => {
    if (enabled && !audio.paused) setSound(false);
    else setSound(true);
  });
  document.addEventListener('pointerdown', () => { if (enabled && audio.paused) play(); }, { once: true });
  window.addEventListener('load', play, { once: true });
  audio.addEventListener('play', label);
  audio.addEventListener('pause', label);
  label();
})();
</script>
