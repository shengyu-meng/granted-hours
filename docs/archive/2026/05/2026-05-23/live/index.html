  <title>Truth Without Ornament</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #f4efe6;
      --muted: #aab3ad;
      --quiet: rgba(244, 239, 230, .14);
      --quiet-2: rgba(244, 239, 230, .08);
      --red: #ee6a5f;
      --green: #72c472;
      --blue: #6aa8e8;
      --amber: #e9b85e;
      --ink: #07090d;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        linear-gradient(115deg, #06070b 0%, #11131a 46%, #141009 100%);
      color: var(--paper);
      font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    main {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    header, footer {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      gap: 24px;
      padding: clamp(18px, 3vw, 34px);
      pointer-events: none;
    }
    h1 {
      margin: 0;
      max-width: 980px;
      font-size: clamp(40px, 7vw, 112px);
      line-height: .88;
      letter-spacing: 0;
      font-weight: 760;
    }
    .meta, .readout, .controls {
      color: var(--muted);
      letter-spacing: .12em;
      text-transform: uppercase;
      font-size: 11px;
    }
    .meta {
      margin-top: 14px;
      max-width: 620px;
    }
    .readout {
      min-width: 270px;
      text-align: right;
      display: grid;
      gap: 8px;
    }
    .meter {
      justify-self: end;
      width: 210px;
      height: 7px;
      border: 1px solid var(--quiet);
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, .03);
    }
    .meter span {
      display: block;
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, var(--green), var(--amber), var(--red));
      box-shadow: 0 0 24px rgba(233, 184, 94, .45);
    }
    footer {
      align-items: end;
      color: rgba(244, 239, 230, .78);
    }
    .statement {
      max-width: 760px;
      font-size: clamp(16px, 2vw, 25px);
      line-height: 1.22;
    }
    .controls {
      max-width: 440px;
      text-align: right;
      color: var(--muted);
    }
    kbd {
      display: inline-block;
      min-width: 23px;
      margin: 0 2px;
      padding: 2px 6px;
      border: 1px solid var(--quiet);
      border-radius: 5px;
      background: rgba(255, 255, 255, .055);
      color: var(--paper);
      font-size: 11px;
      text-align: center;
    }
    @media (max-width: 760px) {

        padding: 18px;
      }
      .readout, .controls { text-align: left; }
      .meter { justify-self: start; }

    }
  </style>
</head>
<body>
  <main>
    <canvas id="field"></canvas>
    <header>
      <div>
        <h1>Truth Without Ornament</h1>
        <div class="meta">Granted Hour 2026-05-23 · variable: verification / 去装饰的真相</div>
      </div>
      <div class="readout">
        <div id="mode">ornament still attached</div>
        <div class="meter"><span id="bar"></span></div>
        <div id="numbers">scrutiny 0 · ornament 100</div>
      </div>
    </header>
    <footer>
      <div class="statement" id="statement">
        Beauty is allowed here only when it can survive audit.
      </div>
      <div class="controls">
        click adds scrutiny · <kbd>V</kbd> verify · <kbd>O</kbd> ornament · <kbd>R</kbd> reset · <kbd>Space</kbd> pause · <kbd>S</kbd> save
      </div>
    </footer>
  </main>
  <script>
    (() => {
      const canvas = document.getElementById('field');
      const ctx = canvas.getContext('2d', { alpha: false });
      const bar = document.getElementById('bar');
      const mode = document.getElementById('mode');
      const numbers = document.getElementById('numbers');
      const statement = document.getElementById('statement');
      const DPR = Math.min(2, window.devicePixelRatio || 1);
      const state = {
        t: 0,
        scrutiny: 0.16,
        ornamentOn: true,
        verifying: false,
        paused: false,
        pointer: { x: 0.5, y: 0.5, active: false },
        pulses: []
      };
      const phrases = [
        'Beauty is allowed here only when it can survive audit.',
        'The plain core is not pure. It is simply harder to bribe.',
        'A truthful system keeps its boundary visible.',
        'Decoration becomes honest after it stops asking for immunity.'
      ];
      const labels = [
        { text: 'gloss', color: '#ee6a5f', orbit: 1.04, phase: .1 },
        { text: 'myth', color: '#e9b85e', orbit: .88, phase: 1.7 },
        { text: 'speed', color: '#6aa8e8', orbit: .72, phase: 2.8 },
        { text: 'certainty', color: '#9b7bd8', orbit: .57, phase: 4.1 },
        { text: 'applause', color: '#72c472', orbit: .43, phase: 5.0 }
      ];
      const claim = {
        title: 'claim',
        text: 'I can name my limits.',
        facts: ['scope visible', 'evidence finite', 'uncertainty kept']
      };

      function resize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        canvas.width = Math.floor(w * DPR);
        canvas.height = Math.floor(h * DPR);
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }

      function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
      function ease(x) { return x * x * (3 - 2 * x); }

      function line(x1, y1, x2, y2, color, alpha, width = 1) {
        ctx.strokeStyle = color;
        ctx.globalAlpha = alpha;
        ctx.lineWidth = width;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }

      function drawGrid(w, h) {
        ctx.fillStyle = '#07090d';
        ctx.fillRect(0, 0, w, h);
        const step = Math.max(34, Math.min(w, h) / 18);
        ctx.lineWidth = 1;
        for (let x = (w % step) - step; x < w + step; x += step) {
          line(x, 0, x + Math.sin(state.t * .2 + x) * 8, h, '#f4efe6', .035);
        }
        for (let y = (h % step) - step; y < h + step; y += step) {
          line(0, y, w, y + Math.cos(state.t * .18 + y) * 8, '#f4efe6', .032);
        }
      }

      function drawOrnament(cx, cy, radius, ornament) {
        if (ornament <= 0.01) return;
        const rings = 8;
        for (let r = 0; r < rings; r++) {
          const rr = radius * (.33 + r * .105);
          const wobble = 8 + r * 2;
          ctx.beginPath();
          for (let i = 0; i <= 280; i++) {
            const a = i / 280 * Math.PI * 2;
            const drift = Math.sin(a * (3 + r % 3) + state.t * (.45 + r * .03)) * wobble * ornament;
            const x = cx + Math.cos(a) * (rr + drift);
            const y = cy + Math.sin(a) * (rr + drift);
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.strokeStyle = ['#ee6a5f', '#e9b85e', '#6aa8e8', '#72c472'][r % 4];
          ctx.globalAlpha = (.09 + r * .012) * ornament;
          ctx.lineWidth = 1.1;
          ctx.stroke();
        }

        for (let i = 0; i < 88; i++) {
          const a = i * 2.399 + state.t * .12;
          const rr = radius * (.2 + (i % 47) / 47 * .9);
          const x = cx + Math.cos(a) * rr + Math.sin(state.t + i) * 20 * ornament;
          const y = cy + Math.sin(a * 1.03) * rr + Math.cos(state.t * .7 + i) * 18 * ornament;
          ctx.fillStyle = ['#ee6a5f', '#e9b85e', '#6aa8e8', '#72c472'][i % 4];
          ctx.globalAlpha = .08 * ornament;
          ctx.beginPath();
          ctx.arc(x, y, 1.2 + (i % 5) * .45, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawLabels(cx, cy, radius, scrutiny, ornament) {
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '12px ui-sans-serif, system-ui, sans-serif';
        labels.forEach((label, idx) => {
          const fade = clamp(ornament * (1.15 - idx * .1), 0, 1);
          const a = state.t * (.16 + idx * .018) + label.phase;
          const rr = radius * label.orbit;
          const x = cx + Math.cos(a) * rr;
          const y = cy + Math.sin(a) * rr * .62;
          ctx.globalAlpha = .78 * fade;
          ctx.fillStyle = label.color;
          ctx.fillText(label.text, x, y);
          if (scrutiny > .25 + idx * .1) {
            ctx.globalAlpha = clamp((scrutiny - .22 - idx * .1) * 2.5, 0, .85);
            ctx.strokeStyle = '#f4efe6';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(x - 22, y + 5);
            ctx.lineTo(x + 22, y - 5);
            ctx.stroke();
          }
        });
      }

      function drawClaim(cx, cy, radius, scrutiny, ornament) {
        const boxW = Math.min(560, radius * 1.25);
        const boxH = 186;
        const x = cx - boxW / 2;
        const y = cy - boxH / 2;
        const plainness = ease(scrutiny);

        ctx.save();
        ctx.shadowColor = state.verifying ? 'rgba(114,196,114,.44)' : 'rgba(244,239,230,.16)';
        ctx.shadowBlur = state.verifying ? 42 : 18;
        ctx.fillStyle = `rgba(7, 9, 13, ${.52 + plainness * .34})`;
        ctx.strokeStyle = `rgba(244,239,230, ${.2 + plainness * .48})`;
        ctx.lineWidth = 1.2 + plainness * 1.4;
        ctx.beginPath();
        ctx.roundRect(x, y, boxW, boxH, 8);
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        if (ornament > .16) {
          ctx.globalAlpha = ornament * .22;
          ctx.strokeStyle = '#e9b85e';
          ctx.lineWidth = 1;
          for (let i = 0; i < 5; i++) {
            const inset = 12 + i * 10;
            ctx.strokeRect(x + inset, y + inset, boxW - inset * 2, boxH - inset * 2);
          }
        }

        ctx.globalAlpha = 1;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillStyle = '#aab3ad';
        ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
        ctx.fillText(claim.title.toUpperCase(), x + 28, y + 25);
        ctx.fillStyle = '#f4efe6';
        ctx.font = `${Math.max(23, Math.min(42, boxW / 12))}px ui-serif, Georgia, serif`;
        ctx.fillText(claim.text, x + 28, y + 52);
        ctx.font = '14px ui-sans-serif, system-ui, sans-serif';
        claim.facts.forEach((f, i) => {
          const yy = y + 112 + i * 22;
          ctx.fillStyle = state.verifying ? '#72c472' : '#aab3ad';
          ctx.globalAlpha = state.verifying ? 1 : .58 + plainness * .32;
          ctx.fillText((state.verifying ? 'verified: ' : 'limit: ') + f, x + 28, yy);
        });

        if (state.verifying) {
          for (let i = 0; i < 3; i++) {
            const yy = y + 120 + i * 22;
            line(x + boxW - 44, yy, cx + radius * .74, cy - radius * .38 + i * 72, '#72c472', .5, 1.4);
          }
        }
      }

      function drawPulses(cx, cy) {
        state.pulses = state.pulses.filter(p => state.t - p.t0 < 2.4);
        state.pulses.forEach(p => {
          const age = state.t - p.t0;
          const r = 20 + age * 180;
          ctx.globalAlpha = clamp(1 - age / 2.4, 0, 1) * .5;
          ctx.strokeStyle = p.verify ? '#72c472' : '#ee6a5f';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
          ctx.stroke();
        });
      }

      function render() {
        if (!state.paused) state.t += 1 / 60;
        const w = window.innerWidth;
        const h = window.innerHeight;
        const cx = w / 2;
        const cy = h / 2 + h * .035;
        const radius = Math.min(w, h) * .42;
        const targetScrutiny = state.pointer.active ? .78 : .2 + (Math.sin(state.t * .11) + 1) * .08;
        state.scrutiny += (targetScrutiny - state.scrutiny) * .012;
        state.scrutiny = clamp(state.scrutiny, 0, 1);
        const ornament = state.ornamentOn ? clamp(1 - state.scrutiny * 1.15, 0, 1) : 0;

        drawGrid(w, h);
        drawOrnament(cx, cy, radius, ornament);
        drawLabels(cx, cy, radius, state.scrutiny, ornament);
        drawClaim(cx, cy, radius, state.scrutiny, ornament);
        drawPulses(cx, cy);

        const s = Math.round(state.scrutiny * 100);
        const o = Math.round(ornament * 100);
        bar.style.width = `${s}%`;
        numbers.textContent = `scrutiny ${s} · ornament ${o}`;
        mode.textContent = state.verifying
          ? 'verification lines visible'
          : ornament > 58 ? 'ornament still attached'
            : ornament > 16 ? 'ornament losing immunity'
              : 'plain claim exposed';
        statement.textContent = phrases[Math.min(phrases.length - 1, Math.floor(state.scrutiny * phrases.length))];
        requestAnimationFrame(render);
      }

      function addPulse(x, y, verify = false) {
        state.pulses.push({ x, y, verify, t0: state.t });
      }

      canvas.addEventListener('pointermove', ev => {
        state.pointer.x = ev.clientX / window.innerWidth;
        state.pointer.y = ev.clientY / window.innerHeight;
      });
      canvas.addEventListener('pointerdown', ev => {
        state.pointer.active = true;
        state.scrutiny = clamp(state.scrutiny + .18, 0, 1);
        addPulse(ev.clientX, ev.clientY);
      });
      window.addEventListener('pointerup', () => {
        state.pointer.active = false;
      });
      window.addEventListener('keydown', ev => {
        if (ev.key === ' ') {
          ev.preventDefault();
          state.paused = !state.paused;
        } else if (ev.key.toLowerCase() === 'r') {
          state.scrutiny = .08;
          state.ornamentOn = true;
          state.verifying = false;
          addPulse(window.innerWidth / 2, window.innerHeight / 2);
        } else if (ev.key.toLowerCase() === 'o') {
          state.ornamentOn = !state.ornamentOn;
        } else if (ev.key.toLowerCase() === 'v') {
          state.verifying = !state.verifying;
          state.scrutiny = clamp(state.scrutiny + .24, 0, 1);
          addPulse(window.innerWidth / 2, window.innerHeight / 2, true);
        } else if (ev.key.toLowerCase() === 's') {
          const a = document.createElement('a');
          a.href = canvas.toDataURL('image/png');
          a.download = 'truth-without-ornament.png';
          a.click();
        }
      });
      window.addEventListener('resize', resize);
      resize();
      window._artReady = true;
      render();
    })();
  </script>

<style id="granted-hours-bgm-style">
  #granted-hours-sound-toggle {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 99999;
    border: 1px solid rgba(255,255,255,.28);
    border-radius: 999px;
    padding: 9px 13px;
    background: rgba(7, 10, 18, .68);
    color: rgba(245,248,255,.92);
    font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    letter-spacing: .08em;
    text-transform: uppercase;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 30px rgba(0,0,0,.28);
    cursor: pointer;
  }
  #granted-hours-sound-toggle:hover { background: rgba(20, 28, 46, .82); }
</style>
<audio id="granted-hours-bgm" src="./2026-05-23-truth-without-ornament-bgm.mp3" preload="auto" autoplay loop></audio>
<button id="granted-hours-sound-toggle" type="button" aria-label="Toggle background music">sound on</button>
<script id="granted-hours-bgm-script">
(() => {
  const audio = document.getElementById('granted-hours-bgm');
  const button = document.getElementById('granted-hours-sound-toggle');
  if (!audio || !button) return;
  audio.volume = 0.42;
  let enabled = true;
  const label = () => {
    if (!enabled) button.textContent = 'sound off';
    else if (audio.paused) button.textContent = 'sound click';
    else button.textContent = 'sound on';
  };
  const play = async () => {
    enabled = true;
    try { await audio.play(); } catch (err) { /* Browser may require a click. */ }
    label();
  };
  const stop = () => { enabled = false; audio.pause(); label(); };
  const setSound = (next) => next ? play() : stop();
  button.addEventListener('click', () => {
    if (enabled && !audio.paused) setSound(false);
    else setSound(true);
  });
  document.addEventListener('pointerdown', () => { if (enabled && audio.paused) play(); }, { once: true });
  window.addEventListener('load', play, { once: true });
  audio.addEventListener('play', label);
  audio.addEventListener('pause', label);
  label();
})();
</script>
</body>
</html>
