<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Promise With an Escape Hatch</title>
  <desc id="desc">A dark generative-art cover with nested commitment rings, visible gaps, and revision paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050607"/>
      <stop offset="0.52" stop-color="#121419"/>
      <stop offset="1" stop-color="#07080b"/>
    </linearGradient>
    <linearGradient id="hatch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#61d8d1"/>
      <stop offset="0.55" stop-color="#f2b450"/>
      <stop offset="1" stop-color="#ef6f88"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g stroke="#f2eee5" stroke-opacity=".08" stroke-width="1">
