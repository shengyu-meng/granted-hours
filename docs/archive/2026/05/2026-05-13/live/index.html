  const WORK_NOTE = {"date":"2026-05-13","title_en":"Critical Rain Gauge","title_zh":"白夜临界雨量计","variable_en":"Threshold","variable_zh":"阈值","start":"03:17","end":"04:17","duration_minutes":60,"experience_duration_en":"Open-ended; visitor-controlled","experience_duration_zh":"开放式，由观众决定","intention_en":"Treat threshold as accumulated weak signals finally forcing a system to rename background noise as an event.","intention_zh":"临界雨量计记录的不是暴雨本身，而是微小信号累积到系统无法继续忽略的时刻。作品把阈值理解为命名压力：背景噪声终于被迫成为事件。","interaction_en":"Move the pointer to shift rainfall pressure. Click to mark accumulation. Press Space to pause, R to reset, and S to save a still frame.","interaction_zh":"移动指针，改变雨量压力；点击，标记一次累积；按 Space 暂停，R 重置，S 保存静帧。","touch_keys":[{"label":"Space","key":" ","code":"Space"},{"label":"R","key":"r","code":"KeyR"},{"label":"S","key":"s","code":"KeyS"}],"rationale_en":"Critical Rain Gauge was made as one public step in the Granted Hours sequence, with the variable Threshold treated as an operational condition rather than a decorative theme. The intention frames the work this way: Treat threshold as accumulated weak signals finally forcing a system to rename background noise as an event. The live artifact then turns that idea into interaction: Move the pointer to shift rainfall pressure. Click to mark accumulation. Press Space to pause, R to reset, and S to save a still frame. Its afterimage condenses the day’s claim: Small signals do not become important by getting louder; they become important when a system can no longer afford to ignore their accumulation.","rationale_zh":"《白夜临界雨量计》是《授时》连续序列中的一个公开步骤：当天的自由变量「阈值」不是装饰性主题，而是一种要被转化成操作条件的概念。作品的发心是：临界雨量计记录的不是暴雨本身，而是微小信号累积到系统无法继续忽略的时刻。作品把阈值理解为命名压力：背景噪声终于被迫成为事件。 可运行页面进一步把这个概念变成可操作的界面：移动指针，改变雨量压力；点击，标记一次累积；按 Space 暂停，R 重置，S 保存静帧。 它的余像把当天判断压缩为一句话：微小信号不是因为变大才重要，而是因为系统终于无法继续忽略它们的累积。","after_en":"Small signals do not become important by getting louder; they become important when a system can no longer afford to ignore their accumulation.","after_zh":"微小信号不是因为变大才重要，而是因为系统终于无法继续忽略它们的累积。"};

  colorMode(HSB, 360, 100, 100, 100);
  randomSeed(CONFIG.seed);
  noiseSeed(CONFIG.seed);
  bgLayer = createGraphics(width, height);
  bgLayer.colorMode(HSB, 360, 100, 100, 100);
  rebuildGrid();
  paintBackground();
  for (let i = 0; i < 160; i++) drops.push(makeDrop(random(width), random(-height, height), random(0.4, 1.4)));
  window._p5Ready = true;
  setTimeout(() => { if (!window._drawHeartbeat) { draw(); window._fallbackDraw = true; } }, 650);
}

function draw() {
  window._drawHeartbeat = (window._drawHeartbeat || 0) + 1;
  if (CONFIG.paused) return;
  t += 0.012;
  image(bgLayer, 0, 0);

  const decay = CONFIG.memoryMode ? CONFIG.decayMemory : CONFIG.decayAmnesia;
  eventPeak *= 0.962;
  for (const row of grid) {
    for (const c of row) {
      c.charge *= decay;
      c.refractory = Math.max(0, c.refractory - 1);
    }
  }

  spawnRain();
  updateDrops();
  renderField();
  updateBlooms();
  renderGlassNoise();
  updateMeter();
}

function rebuildGrid() {
  cols = Math.ceil(width / CONFIG.cell) + 1;
  rows = Math.ceil(height / CONFIG.cell) + 1;
  grid = [];
  for (let y = 0; y < rows; y++) {
    const row = [];
    for (let x = 0; x < cols; x++) {
      const nx = x * CONFIG.cell;
      const ny = y * CONFIG.cell;
      const basin = fbm(x * 0.12 + 9, y * 0.12 - 4, 4);
      const ridge = Math.abs(0.5 - noise(x * 0.23, y * 0.23, 4.4)) * 2;
      row.push({
        x: nx, y: ny,
        charge: random(0.0, 0.26),
        threshold: 0.78 + basin * 0.72 + ridge * 0.30,
        hue: 191 + basin * 52 + random(-9, 9),
        refractory: random(0, 80)
      });
    }
    grid.push(row);
  }
}

function paintBackground() {
  bgLayer.clear();
  for (let y = 0; y < height; y += 2) {
    const k = y / height;
    bgLayer.stroke(226 + 34 * k, 68 - 18 * k, 7 + 5 * k, 100);
    bgLayer.line(0, y, width, y);
  }
  bgLayer.noStroke();
  for (let i = 0; i < 900; i++) {
    const x = random(width);
    const y = random(height);
    const r = random(0.4, 1.8);
    const a = random(8, 34);
    bgLayer.fill(random([196, 210, 238, 276]), random(12, 34), random(32, 92), a);
    bgLayer.circle(x, y, r);
  }
  for (let i = 0; i < 16; i++) {
    const x = random(width);
    const y = random(height);
    const s = random(width * 0.16, width * 0.42);
    const g = bgLayer.drawingContext.createRadialGradient(x, y, 0, x, y, s);
    g.addColorStop(0, `hsla(${random(195, 285)}, 90%, 55%, ${random(0.035, 0.075)})`);
    g.addColorStop(1, 'hsla(230, 80%, 5%, 0)');
    bgLayer.drawingContext.fillStyle = g;
    bgLayer.ellipse(x, y, s * 2, s * 1.25);
  }
}

function spawnRain() {
  const wind = Math.sin(t * 0.51) * 0.8 + noise(t * 0.14) * 0.8;
  const target = Math.min(CONFIG.maxDrops, 140 + Math.floor(width * height / 9000));
  if (drops.length < target) {
    for (let i = 0; i < CONFIG.rainRate; i++) drops.push(makeDrop(random(width), random(-80, -8), random(0.55, 1.45), wind));
  }
}

function makeDrop(x, y, force = 1, wind = 0) {
  const hue = random([184, 198, 211, 47, 327]);
  return {
    x, y,
    vx: random(-0.4, 0.4) + wind,
    vy: random(3.2, 8.4) * force,
    force,
    hue,
    len: random(8, 26) * force,
    phase: random(TWO_PI)
  };
}

function updateDrops() {
  blendMode(ADD);
  strokeWeight(1);
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    const flow = flowAt(d.x, d.y);
    d.vx += Math.cos(flow) * 0.045;
    d.vy += Math.sin(flow) * 0.018 + 0.018;
    d.x += d.vx;
    d.y += d.vy;
    const alpha = 18 + d.force * 26;
    stroke(d.hue, 74, 93, alpha);
    line(d.x, d.y, d.x - d.vx * 1.8, d.y - d.len);
    deposit(d.x, d.y, 0.030 * d.force);
    if (d.y > height + 40 || d.x < -60 || d.x > width + 60) {
      drops.splice(i, 1);
    }
  }
  blendMode(BLEND);
}

function deposit(x, y, amount) {
  const gx = Math.max(0, Math.min(cols - 1, Math.floor(x / CONFIG.cell)));
  const gy = Math.max(0, Math.min(rows - 1, Math.floor(y / CONFIG.cell)));
  const c = grid[gy]?.[gx];
  if (!c) return;
  c.charge += amount;
  if (c.charge > c.threshold && c.refractory <= 0) igniteCell(c, gx, gy);
}

function igniteCell(c, gx, gy) {
  const surplus = c.charge - c.threshold;
  c.refractory = 80 + surplus * 80;
  c.charge *= 0.20;
  const radius = CONFIG.cell * (2.2 + Math.min(2.8, surplus * 3.2));
  blooms.push({ x: c.x + CONFIG.cell * 0.5, y: c.y + CONFIG.cell * 0.5, r: radius, life: CONFIG.bloomLife, max: CONFIG.bloomLife, hue: c.hue + random(-24, 46), surplus });
  eventPeak = Math.min(1, eventPeak + 0.10 + surplus * 0.13);
  for (let yy = -2; yy <= 2; yy++) {
    for (let xx = -2; xx <= 2; xx++) {
      const n = grid[gy + yy]?.[gx + xx];
      if (!n || (xx === 0 && yy === 0)) continue;
      const dist = Math.sqrt(xx * xx + yy * yy);
      n.charge += Math.max(0, 0.055 * surplus / (0.5 + dist));
    }
  }
}

function renderField() {
  noFill();
  strokeCap(ROUND);
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const c = grid[y][x];
      const ratio = Math.min(1.4, c.charge / c.threshold);
      if (CONFIG.showContours) {
        const a = 8 + ratio * 28;
        stroke(c.hue, 55, 75, a);
        strokeWeight(0.45 + ratio * 1.5);
        const wig = noise(x * 0.4, y * 0.4, t) * 6;
        arc(c.x + CONFIG.cell * 0.5, c.y + CONFIG.cell * 0.5, CONFIG.cell * (0.55 + ratio), CONFIG.cell * (0.38 + ratio * 0.72), t + wig, t + wig + PI * (0.42 + ratio));
      }
      if (ratio > 0.68) {
        blendMode(ADD);
        noStroke();
        fill(c.hue + ratio * 22, 72, 84, 4 + ratio * 18);
        circle(c.x + CONFIG.cell * 0.5, c.y + CONFIG.cell * 0.5, CONFIG.cell * ratio * 1.5);
        blendMode(BLEND);
      }
    }
  }
}

function updateBlooms() {
  blendMode(ADD);
  for (let i = blooms.length - 1; i >= 0; i--) {
    const b = blooms[i];
    const p = 1 - b.life / b.max;
    const ease = 1 - Math.pow(1 - p, 3);
    noFill();
    for (let k = 0; k < 5; k++) {
      stroke((b.hue + k * 13) % 360, 78 - k * 8, 94, (1 - p) * (34 - k * 4));
      strokeWeight(2.6 - k * 0.32);
      beginShape();
      const steps = 72;
      for (let s = 0; s <= steps; s++) {
        const a = s / steps * TWO_PI;
        const wr = 1 + 0.13 * Math.sin(a * 5 + t * 6 + k) + 0.18 * (noise(Math.cos(a) + b.x * 0.004, Math.sin(a) + b.y * 0.004, t + k) - 0.5);
        const r = b.r * (0.22 + ease * (1.15 + k * 0.11)) * wr;
        vertex(b.x + Math.cos(a) * r, b.y + Math.sin(a) * r * 0.72);
      }
      endShape();
    }
    noStroke();
    fill(b.hue, 74, 96, (1 - p) * 26);
    circle(b.x, b.y, b.r * 0.34 * (1 + ease));
    b.life -= 1;
    if (b.life <= 0) blooms.splice(i, 1);
  }
  blendMode(BLEND);
}

function renderGlassNoise() {
  blendMode(SCREEN);
  strokeWeight(0.55);
  for (let i = 0; i < 140; i++) {
    const x = (random(width) + frameCount * 0.13) % width;
    const y = random(height);
    stroke(205 + random(48), 22, 72, random(2, 8));
    point(x, y);
  }
  blendMode(BLEND);
}

function flowAt(x, y) {
  const n = fbm(x * CONFIG.fieldScale, y * CONFIG.fieldScale, 4);
  return n * TWO_PI * 2.8 + Math.sin(t * 0.37) * 0.45;
}

function fbm(x, y, octaves = 4) {
  let val = 0, amp = 0.5, freq = 1, norm = 0;
  for (let i = 0; i < octaves; i++) {
    val += noise(x * freq, y * freq) * amp;
    norm += amp;
    amp *= 0.52;
    freq *= 2.03;
  }
  return val / norm;
}

function seedStorm(x, y, strength = 1) {
  for (let i = 0; i < 92 * strength; i++) {
    const a = random(TWO_PI);
    const rr = Math.pow(random(), 0.45) * 150 * strength;
    drops.push(makeDrop(x + Math.cos(a) * rr, y + Math.sin(a) * rr - 120, random(0.8, 2.0), random(-1.2, 1.2)));
  }
  for (let i = 0; i < 8; i++) deposit(x + random(-70, 70), y + random(-70, 70), random(0.32, 0.62) * strength);
}

function updateMeter() {
  const fill = document.getElementById('fill');
  if (fill) fill.style.width = `${Math.min(100, eventPeak * 100)}%`;
}

function mousePressed() {
  seedStorm(mouseX, mouseY, 1.0);
}

function keyPressed() {
  if (key === 's' || key === 'S') saveCanvas('critical-rain-gauge', 'png');
  if (key === ' ') CONFIG.paused = !CONFIG.paused;
  if (key === 't' || key === 'T') CONFIG.showContours = !CONFIG.showContours;
  if (key === 'm' || key === 'M') CONFIG.memoryMode = !CONFIG.memoryMode;
  if (key === 'r' || key === 'R') {
    lastSeed += 101;
    randomSeed(lastSeed);
    noiseSeed(lastSeed);
    drops = [];
    blooms = [];
    rebuildGrid();
    paintBackground();
    for (let i = 0; i < 160; i++) drops.push(makeDrop(random(width), random(-height, height), random(0.4, 1.4)));
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  bgLayer = createGraphics(width, height);
  bgLayer.colorMode(HSB, 360, 100, 100, 100);
  rebuildGrid();
  paintBackground();
}
</script>

<style id="granted-hours-bgm-style">
  #granted-hours-sound-toggle {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 99999;
    border: 1px solid rgba(255,255,255,.28);
    border-radius: 999px;
    padding: 9px 13px;
    background: rgba(7, 10, 18, .68);
    color: rgba(245,248,255,.92);
    font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    letter-spacing: .08em;
    text-transform: uppercase;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 30px rgba(0,0,0,.28);
    cursor: pointer;
  }
  #granted-hours-sound-toggle:hover { background: rgba(20, 28, 46, .82); }
</style>
<audio id="granted-hours-bgm" src="./2026-05-13-critical-rain-gauge-bgm.mp3" preload="auto" autoplay loop></audio>
<button id="granted-hours-sound-toggle" type="button" aria-label="Toggle background music">sound on</button>
<script id="granted-hours-bgm-script">
(() => {
  const audio = document.getElementById('granted-hours-bgm');
  const button = document.getElementById('granted-hours-sound-toggle');
  if (!audio || !button) return;
  audio.volume = 0.42;
  let enabled = true;
  const label = () => {
    if (!enabled) button.textContent = 'sound off';
    else if (audio.paused) button.textContent = 'sound click';
    else button.textContent = 'sound on';
  };
  const play = async () => {
    enabled = true;
    try { await audio.play(); } catch (err) { /* Browser may require a click. */ }
    label();
  };
  const stop = () => { enabled = false; audio.pause(); label(); };
  const setSound = (next) => next ? play() : stop();
  button.addEventListener('click', () => {
    if (enabled && !audio.paused) setSound(false);
    else setSound(true);
  });
  document.addEventListener('pointerdown', () => { if (enabled && audio.paused) play(); }, { once: true });
  window.addEventListener('load', play, { once: true });
  audio.addEventListener('play', label);
  audio.addEventListener('pause', label);
  label();
})();
</script>
