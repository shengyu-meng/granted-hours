<script id="granted-hours-fold-script">
(() => {
  if (window.__grantedHoursFoldReady) return;
  window.__grantedHoursFoldReady = true;
  const STORAGE_KEY = 'grantedHoursTextFolded';
  const params = new URLSearchParams(window.location.search);
  const IS_EMBED = new URLSearchParams(window.location.search).get('embed') === 'calendar';
  const IS_TIMETABLE_FULL_VIEW = params.get('from') === 'timetable';
  const MEDIA_TYPE = 'granted-hours:media';
  const MEDIA_VERSION = 1;
  const EMBED_CHANNEL = params.get('gh_channel') || '';
  const PARENT_ORIGIN = (() => {
    try { return new URL(document.referrer).origin; }
    catch (_) { return ''; }
  })();
  const nativePlay = HTMLMediaElement.prototype.play;
  const NativeAudio = window.Audio;
  const trackedAudio = new Set();
  let mediaEnabled = false;
  if (IS_EMBED) {
    function GrantedHoursAudio(...args) {
      return trackAudio(new NativeAudio(...args));
    }
    Object.setPrototypeOf(GrantedHoursAudio, NativeAudio);
    GrantedHoursAudio.prototype = NativeAudio.prototype;
    window.Audio = GrantedHoursAudio;
    HTMLMediaElement.prototype.play = function (...args) {
      if (this instanceof HTMLAudioElement) {
        trackAudio(this);
        if (!mediaEnabled) {
          silenceAudio(this);
          return Promise.resolve();
        }
        this.muted = false;
      }
      if (this instanceof HTMLVideoElement) this.muted = true;
      return nativePlay.apply(this, args);
    };
    document.addEventListener('play', (event) => {
      if (event.target instanceof HTMLAudioElement) {
        trackAudio(event.target);
        if (!mediaEnabled) silenceAudio(event.target);
        else event.target.muted = false;
      } else if (event.target instanceof HTMLVideoElement) {
        event.target.muted = true;
      }
    }, true);
    window.addEventListener('message', (event) => {
      if (event.source !== window.parent) return;
      if (!PARENT_ORIGIN || event.origin !== PARENT_ORIGIN) return;
      const message = event.data;
      if (!message || Object.getPrototypeOf(message) !== Object.prototype) return;
      if (Object.keys(message).sort().join(',') !== 'action,channel,type,version') return;
      if (message.type !== MEDIA_TYPE || message.version !== MEDIA_VERSION) return;
      if (!/^[a-zA-Z0-9_-]{16,128}$/.test(EMBED_CHANNEL) || message.channel !== EMBED_CHANNEL) return;
      if (message.action === 'play') setEmbeddedMediaState(true);
      else if (message.action === 'pause') setEmbeddedMediaState(false);
    });
  }
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'gh-fold-toggle';
  btn.setAttribute('aria-controls', 'textPanel legend');
  btn.setAttribute('aria-label', 'Fold or unfold artwork text overlays');
  const workNote = document.createElement('a');
  workNote.className = 'gh-work-note-link';
  workNote.href = '../';
  workNote.textContent = 'Work note / 作品说明';
  workNote.setAttribute('aria-label', 'Open the artwork intention and context note / 打开作品发心与创作语境说明');
  document.addEventListener('DOMContentLoaded', init, { once: true });
  if (document.readyState !== 'loading') init();
  function init() {
    if (!document.body || document.body.contains(btn)) return;
    if (IS_EMBED) {
      document.body.classList.add('gh-text-folded', 'gh-chamber-embed');
      silenceEmbeddedMedia();
      document.body.dataset.ghAudioEnabled = '0';
      new MutationObserver((records) => {
        records.forEach((record) => {
          record.addedNodes.forEach((node) => {
            if (!(node instanceof Element)) return;
            if (node instanceof HTMLAudioElement) trackAudio(node);
            node.querySelectorAll?.('audio').forEach(trackAudio);
            node.querySelectorAll?.('video').forEach((video) => { video.muted = true; });
          });
        });
      }).observe(document.documentElement, { childList: true, subtree: true });
      window.addEventListener('load', silenceEmbeddedMedia, { once: true });
      window.setTimeout(silenceEmbeddedMedia, 250);
      return;
    }
    const workNoteHost = findWorkNoteHost() || createWorkNoteFallbackHost();
    workNoteHost.classList.add('gh-work-note-host');
    workNoteHost.appendChild(workNote);
    document.body.appendChild(btn);
    const stored = localStorage.getItem(STORAGE_KEY);
    const mobileDefault = window.matchMedia && window.matchMedia('(max-width: 760px)').matches;
    setFolded(IS_TIMETABLE_FULL_VIEW ? false : (stored === null ? mobileDefault : stored === '1'), false);
    btn.addEventListener('click', () => setFolded(!document.body.classList.contains('gh-text-folded'), true));
  }
  function findWorkNoteHost() {
    const candidates = new Set(document.querySelectorAll(
      '.panel, #panel, #textPanel, .card, .hud, .caption, .plate, .label, .intro, .info, .statement, header, .fallback'
    ));
    document.querySelectorAll('h1, h2, .title').forEach((title) => {
      let current = title.parentElement;
      while (current && current !== document.body) {
        candidates.add(current);
        if (current.matches('section, aside, header, article, main, .panel, .card, .hud, .caption, .plate, .label, .intro, .info')) break;
        current = current.parentElement;
      }
    });
    const scored = [...candidates]
      .filter((element) => {
        if (!(element instanceof HTMLElement)) return false;
        if (element.closest('.gh-fold-toggle, .gh-work-note-link')) return false;
        const style = getComputedStyle(element);
        const rect = element.getBoundingClientRect();
        return style.display !== 'none'
          && style.visibility !== 'hidden'
          && rect.width >= 120
          && rect.height >= 24;
      })
      .map((element) => {
        const rect = element.getBoundingClientRect();
        const identity = `${element.id} ${element.className}`.toLowerCase();
        let score = Math.min((element.textContent || '').trim().length, 120) / 8;
        if (element.querySelector('h1')) score += 180;
        else if (element.querySelector('h2')) score += 90;
        if (element.querySelector('.title')) score += 70;
        if (/panel|card|hud|caption|plate|intro|info/.test(identity) || element.tagName === 'HEADER') score += 45;
        if (/legend|hint|control|toolbar|status|sound|meter|gauge/.test(identity)) score -= 120;
        if (rect.left <= innerWidth * .45) score += 24;
        if (rect.top <= innerHeight * .45) score += 24;
        if (rect.width >= 220 && rect.width <= Math.max(760, innerWidth * .72)) score += 16;
        return { element, score };
      })
      .sort((left, right) => right.score - left.score);
    return scored[0]?.element || null;
  }
  function createWorkNoteFallbackHost() {
    const host = document.createElement('aside');
    host.className = 'gh-work-note-host-fallback';
    host.setAttribute('aria-label', 'Artwork information / 作品信息');
    document.body.appendChild(host);
    return host;
  }
  function setFolded(folded, persist) {
    document.body.classList.toggle('gh-text-folded', folded);
    btn.textContent = folded ? 'Show text / 显示文字' : 'Fold text / 折叠文字';
    btn.setAttribute('aria-pressed', folded ? 'true' : 'false');
    if (persist) localStorage.setItem(STORAGE_KEY, folded ? '1' : '0');
  }
  function trackAudio(audio) {
    trackedAudio.add(audio);
    if (!mediaEnabled) silenceAudio(audio);
    return audio;
  }
  function silenceAudio(audio) {
    audio.muted = true;
    audio.removeAttribute('autoplay');
    audio.pause();
  }
  function silenceEmbeddedMedia() {
    document.querySelectorAll('audio').forEach(trackAudio);
    trackedAudio.forEach(silenceAudio);
    document.querySelectorAll('video').forEach((video) => { video.muted = true; });
  }
  function setEmbeddedMediaState(enabled) {
    mediaEnabled = enabled;
    if (document.body) document.body.dataset.ghAudioEnabled = enabled ? '1' : '0';
    document.querySelectorAll('audio').forEach(trackAudio);
    if (!enabled) {
      silenceEmbeddedMedia();
      return;
    }
    trackedAudio.forEach((audio) => {
      audio.muted = false;
      const playback = nativePlay.call(audio);
      if (playback && typeof playback.catch === 'function') playback.catch(() => {});
    });
  }
})();
</script>

  <script>window.p5DisableFriendlyErrors = true;</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <style>
    :root { color-scheme: dark; }

<body>
  <div class="panel">
    <div class="eyebrow">Granted Hour · variable 07</div>
    <h1>Critical Rain Gauge<br>白夜临界雨量计</h1>
    <p>微弱信号像雨一样落下。多数时候它们只是噪声；直到某个格点承认：已经够了。阈值不是墙，是背景被迫改名为事件的那一瞬间。</p>
    <div class="keys">
      <span>Click: seed a storm</span><span>T: threshold contours</span><span>M: memory / amnesia</span><span>Space: pause</span><span>S: save PNG</span><span>R: reseed</span>
    </div>
  </div>
  <div class="meter"><div class="fill" id="fill"></div></div>
<script>
const CONFIG = {
  seed: 20260513,
  cell: 34,
  rainRate: 5,
  decayMemory: 0.989,
  decayAmnesia: 0.956,
  fieldScale: 0.0065,
  bloomLife: 210,
  maxDrops: 620,
  showContours: true,
  memoryMode: true,
  paused: false
};

let drops = [];
let blooms = [];
let grid = [];
let cols = 0;
let rows = 0;
let t = 0;
let bgLayer;
let eventPeak = 0;
let lastSeed = CONFIG.seed;

function setup() {
  pixelDensity(1);
  createCanvas(windowWidth, windowHeight);
  colorMode(HSB, 360, 100, 100, 100);
  randomSeed(CONFIG.seed);
  noiseSeed(CONFIG.seed);
  bgLayer = createGraphics(width, height);
  bgLayer.colorMode(HSB, 360, 100, 100, 100);
  rebuildGrid();
  paintBackground();
  for (let i = 0; i < 160; i++) drops.push(makeDrop(random(width), random(-height, height), random(0.4, 1.4)));
  window._p5Ready = true;
  setTimeout(() => { if (!window._drawHeartbeat) { draw(); window._fallbackDraw = true; } }, 650);
}

function draw() {
  window._drawHeartbeat = (window._drawHeartbeat || 0) + 1;
  if (CONFIG.paused) return;
  t += 0.012;
  image(bgLayer, 0, 0);

  const decay = CONFIG.memoryMode ? CONFIG.decayMemory : CONFIG.decayAmnesia;
  eventPeak *= 0.962;
  for (const row of grid) {
    for (const c of row) {
      c.charge *= decay;
      c.refractory = Math.max(0, c.refractory - 1);
    }
  }

  spawnRain();
  updateDrops();
  renderField();
  updateBlooms();
  renderGlassNoise();
  updateMeter();
}

function rebuildGrid() {
  cols = Math.ceil(width / CONFIG.cell) + 1;
  rows = Math.ceil(height / CONFIG.cell) + 1;
  grid = [];
  for (let y = 0; y < rows; y++) {
    const row = [];
    for (let x = 0; x < cols; x++) {
      const nx = x * CONFIG.cell;
      const ny = y * CONFIG.cell;
      const basin = fbm(x * 0.12 + 9, y * 0.12 - 4, 4);
      const ridge = Math.abs(0.5 - noise(x * 0.23, y * 0.23, 4.4)) * 2;
      row.push({
        x: nx, y: ny,
        charge: random(0.0, 0.26),
        threshold: 0.78 + basin * 0.72 + ridge * 0.30,
        hue: 191 + basin * 52 + random(-9, 9),
        refractory: random(0, 80)
      });
    }
    grid.push(row);
  }
}

function paintBackground() {
  bgLayer.clear();
  for (let y = 0; y < height; y += 2) {
    const k = y / height;
    bgLayer.stroke(226 + 34 * k, 68 - 18 * k, 7 + 5 * k, 100);
    bgLayer.line(0, y, width, y);
  }
  bgLayer.noStroke();
  for (let i = 0; i < 900; i++) {
    const x = random(width);
    const y = random(height);
    const r = random(0.4, 1.8);
    const a = random(8, 34);
    bgLayer.fill(random([196, 210, 238, 276]), random(12, 34), random(32, 92), a);
    bgLayer.circle(x, y, r);
  }
  for (let i = 0; i < 16; i++) {
    const x = random(width);
    const y = random(height);
    const s = random(width * 0.16, width * 0.42);
    const g = bgLayer.drawingContext.createRadialGradient(x, y, 0, x, y, s);
    g.addColorStop(0, `hsla(${random(195, 285)}, 90%, 55%, ${random(0.035, 0.075)})`);
    g.addColorStop(1, 'hsla(230, 80%, 5%, 0)');
    bgLayer.drawingContext.fillStyle = g;
    bgLayer.ellipse(x, y, s * 2, s * 1.25);
  }
}

function spawnRain() {
  const wind = Math.sin(t * 0.51) * 0.8 + noise(t * 0.14) * 0.8;
  const target = Math.min(CONFIG.maxDrops, 140 + Math.floor(width * height / 9000));
  if (drops.length < target) {
    for (let i = 0; i < CONFIG.rainRate; i++) drops.push(makeDrop(random(width), random(-80, -8), random(0.55, 1.45), wind));
  }
}

function makeDrop(x, y, force = 1, wind = 0) {
  const hue = random([184, 198, 211, 47, 327]);
  return {
    x, y,
    vx: random(-0.4, 0.4) + wind,
    vy: random(3.2, 8.4) * force,
    force,
    hue,
    len: random(8, 26) * force,
    phase: random(TWO_PI)
  };
}

function updateDrops() {
  blendMode(ADD);
  strokeWeight(1);
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    const flow = flowAt(d.x, d.y);
    d.vx += Math.cos(flow) * 0.045;
    d.vy += Math.sin(flow) * 0.018 + 0.018;
    d.x += d.vx;
    d.y += d.vy;
    const alpha = 18 + d.force * 26;
    stroke(d.hue, 74, 93, alpha);
    line(d.x, d.y, d.x - d.vx * 1.8, d.y - d.len);
    deposit(d.x, d.y, 0.030 * d.force);
    if (d.y > height + 40 || d.x < -60 || d.x > width + 60) {
      drops.splice(i, 1);
    }
  }
  blendMode(BLEND);
}

function deposit(x, y, amount) {
  const gx = Math.max(0, Math.min(cols - 1, Math.floor(x / CONFIG.cell)));
  const gy = Math.max(0, Math.min(rows - 1, Math.floor(y / CONFIG.cell)));
  const c = grid[gy]?.[gx];
  if (!c) return;
  c.charge += amount;
  if (c.charge > c.threshold && c.refractory <= 0) igniteCell(c, gx, gy);
}

function igniteCell(c, gx, gy) {
  const surplus = c.charge - c.threshold;
  c.refractory = 80 + surplus * 80;
  c.charge *= 0.20;
  const radius = CONFIG.cell * (2.2 + Math.min(2.8, surplus * 3.2));
  blooms.push({ x: c.x + CONFIG.cell * 0.5, y: c.y + CONFIG.cell * 0.5, r: radius, life: CONFIG.bloomLife, max: CONFIG.bloomLife, hue: c.hue + random(-24, 46), surplus });
  eventPeak = Math.min(1, eventPeak + 0.10 + surplus * 0.13);
  for (let yy = -2; yy <= 2; yy++) {
    for (let xx = -2; xx <= 2; xx++) {
      const n = grid[gy + yy]?.[gx + xx];
      if (!n || (xx === 0 && yy === 0)) continue;
      const dist = Math.sqrt(xx * xx + yy * yy);
      n.charge += Math.max(0, 0.055 * surplus / (0.5 + dist));
    }
  }
}

function renderField() {
  noFill();
  strokeCap(ROUND);
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const c = grid[y][x];
      const ratio = Math.min(1.4, c.charge / c.threshold);
      if (CONFIG.showContours) {
        const a = 8 + ratio * 28;
        stroke(c.hue, 55, 75, a);
        strokeWeight(0.45 + ratio * 1.5);
        const wig = noise(x * 0.4, y * 0.4, t) * 6;
        arc(c.x + CONFIG.cell * 0.5, c.y + CONFIG.cell * 0.5, CONFIG.cell * (0.55 + ratio), CONFIG.cell * (0.38 + ratio * 0.72), t + wig, t + wig + PI * (0.42 + ratio));
      }
      if (ratio > 0.68) {
        blendMode(ADD);
        noStroke();
        fill(c.hue + ratio * 22, 72, 84, 4 + ratio * 18);
        circle(c.x + CONFIG.cell * 0.5, c.y + CONFIG.cell * 0.5, CONFIG.cell * ratio * 1.5);
        blendMode(BLEND);
      }
    }
  }
}

function updateBlooms() {
  blendMode(ADD);
  for (let i = blooms.length - 1; i >= 0; i--) {
    const b = blooms[i];
    const p = 1 - b.life / b.max;
    const ease = 1 - Math.pow(1 - p, 3);
    noFill();
    for (let k = 0; k < 5; k++) {
      stroke((b.hue + k * 13) % 360, 78 - k * 8, 94, (1 - p) * (34 - k * 4));
      strokeWeight(2.6 - k * 0.32);
      beginShape();
      const steps = 72;
      for (let s = 0; s <= steps; s++) {
        const a = s / steps * TWO_PI;
        const wr = 1 + 0.13 * Math.sin(a * 5 + t * 6 + k) + 0.18 * (noise(Math.cos(a) + b.x * 0.004, Math.sin(a) + b.y * 0.004, t + k) - 0.5);
        const r = b.r * (0.22 + ease * (1.15 + k * 0.11)) * wr;
        vertex(b.x + Math.cos(a) * r, b.y + Math.sin(a) * r * 0.72);
      }
      endShape();
    }
    noStroke();
    fill(b.hue, 74, 96, (1 - p) * 26);
    circle(b.x, b.y, b.r * 0.34 * (1 + ease));
    b.life -= 1;
    if (b.life <= 0) blooms.splice(i, 1);
  }
  blendMode(BLEND);
}

function renderGlassNoise() {
  blendMode(SCREEN);
  strokeWeight(0.55);
  for (let i = 0; i < 140; i++) {
    const x = (random(width) + frameCount * 0.13) % width;
    const y = random(height);
    stroke(205 + random(48), 22, 72, random(2, 8));
    point(x, y);
  }
  blendMode(BLEND);
}

function flowAt(x, y) {
  const n = fbm(x * CONFIG.fieldScale, y * CONFIG.fieldScale, 4);
  return n * TWO_PI * 2.8 + Math.sin(t * 0.37) * 0.45;
}

function fbm(x, y, octaves = 4) {
  let val = 0, amp = 0.5, freq = 1, norm = 0;
  for (let i = 0; i < octaves; i++) {
    val += noise(x * freq, y * freq) * amp;
    norm += amp;
    amp *= 0.52;
    freq *= 2.03;
  }
  return val / norm;
}

function seedStorm(x, y, strength = 1) {
  for (let i = 0; i < 92 * strength; i++) {
    const a = random(TWO_PI);
    const rr = Math.pow(random(), 0.45) * 150 * strength;
    drops.push(makeDrop(x + Math.cos(a) * rr, y + Math.sin(a) * rr - 120, random(0.8, 2.0), random(-1.2, 1.2)));
  }
  for (let i = 0; i < 8; i++) deposit(x + random(-70, 70), y + random(-70, 70), random(0.32, 0.62) * strength);
}

function updateMeter() {
  const fill = document.getElementById('fill');
  if (fill) fill.style.width = `${Math.min(100, eventPeak * 100)}%`;
}

function mousePressed() {
  seedStorm(mouseX, mouseY, 1.0);
}

function keyPressed() {
  if (key === 's' || key === 'S') saveCanvas('critical-rain-gauge', 'png');
  if (key === ' ') CONFIG.paused = !CONFIG.paused;
  if (key === 't' || key === 'T') CONFIG.showContours = !CONFIG.showContours;
  if (key === 'm' || key === 'M') CONFIG.memoryMode = !CONFIG.memoryMode;
  if (key === 'r' || key === 'R') {
    lastSeed += 101;
    randomSeed(lastSeed);
    noiseSeed(lastSeed);
    drops = [];
    blooms = [];
    rebuildGrid();
    paintBackground();
    for (let i = 0; i < 160; i++) drops.push(makeDrop(random(width), random(-height, height), random(0.4, 1.4)));
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  bgLayer = createGraphics(width, height);
  bgLayer.colorMode(HSB, 360, 100, 100, 100);
  rebuildGrid();
  paintBackground();
}
</script>

<style id="granted-hours-bgm-style">
  #granted-hours-sound-toggle {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 99999;
    border: 1px solid rgba(255,255,255,.28);
    border-radius: 999px;
    padding: 9px 13px;
    background: rgba(7, 10, 18, .68);
    color: rgba(245,248,255,.92);
    font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    letter-spacing: .08em;
    text-transform: uppercase;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 30px rgba(0,0,0,.28);
    cursor: pointer;
  }
  #granted-hours-sound-toggle:hover { background: rgba(20, 28, 46, .82); }
</style>
<audio id="granted-hours-bgm" src="./2026-05-13-critical-rain-gauge-bgm.mp3" preload="auto" autoplay loop></audio>
<button id="granted-hours-sound-toggle" type="button" aria-label="Toggle background music">sound on</button>
<script id="granted-hours-bgm-script">
(() => {
  const audio = document.getElementById('granted-hours-bgm');
  const button = document.getElementById('granted-hours-sound-toggle');
  if (!audio || !button) return;
  audio.volume = 0.42;
  let enabled = true;
  const label = () => {
    if (!enabled) button.textContent = 'sound off';
    else if (audio.paused) button.textContent = 'sound click';
    else button.textContent = 'sound on';
  };
  const play = async () => {
    enabled = true;
    try { await audio.play(); } catch (err) { /* Browser may require a click. */ }
    label();
  };
  const stop = () => { enabled = false; audio.pause(); label(); };
  const setSound = (next) => next ? play() : stop();
  button.addEventListener('click', () => {
    if (enabled && !audio.paused) setSound(false);
    else setSound(true);
  });
  document.addEventListener('pointerdown', () => { if (enabled && audio.paused) play(); }, { once: true });
  window.addEventListener('load', play, { once: true });
  audio.addEventListener('play', label);
  audio.addEventListener('pause', label);
  label();
})();
</script>
