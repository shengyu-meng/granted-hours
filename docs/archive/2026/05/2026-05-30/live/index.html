  <section class="label">
    <h1>The Cost of Keeping<br>the Door Open</h1>
    <p>保持门开不是免费的。每一条退路都要付维护、注意力和延迟的租金。点击下注；移动鼠标，让逃生口继续和现实通信。</p>
  </section>
  <section class="meter" id="meter">
    <div><b>Open Door Cost</b> / 开门成本</div>
    <div>maintenance: <span id="m1">0.00</span> · latency: <span id="m2">0.00</span> · courage: <span id="m3">0.00</span></div>
  </section>
  <div class="hint">Move · Click · Space pause · R reset · S save</div>
  <script>
    (() => {
      const canvas = document.getElementById('field');
      const ctx = canvas.getContext('2d', { alpha: false });
      const meterMaintenance = document.getElementById('m1');
      const meterLatency = document.getElementById('m2');
      const meterCourage = document.getElementById('m3');

      const seedBase = 20260530;
      let seed = seedBase;
      let width = 0;
      let height = 0;
      let dpr = 1;
      let time = 0;
      let paused = false;
      let pointer = { x: 0.68, y: 0.48, active: false };
      let markers = [];
      let particles = [];

      function random() {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      }

      function reset() {
        seed = seedBase;
        markers = [];
        particles = [];
        for (let i = 0; i < 170; i += 1) {
          particles.push({
            x: random(),
            y: random(),
            r: 0.7 + random() * 2.2,
            phase: random() * Math.PI * 2,
            speed: 0.18 + random() * 0.58,
            lane: random(),
            hue: random(),
          });
        }
      }

      function resize() {
        dpr = Math.min(2, window.devicePixelRatio || 1);
        width = Math.max(320, window.innerWidth);
        height = Math.max(320, window.innerHeight);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
      }

      function mix(a, b, t) {
        return a + (b - a) * t;
      }

      function ease(t) {
        return t * t * (3 - 2 * t);
      }

      function line(x1, y1, x2, y2, color, weight, dash) {
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = weight;
        ctx.lineCap = 'round';
        if (dash) ctx.setLineDash(dash);
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.restore();
      }

      function circle(x, y, r, fill, stroke, weight = 1) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        if (fill) {
          ctx.fillStyle = fill;
          ctx.fill();
        }
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = weight;
          ctx.stroke();
        }
      }

      function label(text, x, y, color, size = 12, align = 'center') {
        ctx.save();
        ctx.fillStyle = color;
        ctx.font = `${size}px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillText(text, x, y);
        ctx.restore();
      }

      function drawBackground(open) {
        const bg = ctx.createLinearGradient(0, 0, width, height);
        bg.addColorStop(0, '#101215');
        bg.addColorStop(0.46, '#151718');
        bg.addColorStop(1, '#11161a');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, width, height);

        for (let i = 0; i < particles.length; i += 1) {
          const p = particles[i];
          const drift = Math.sin(time * p.speed + p.phase);
          const tug = Math.sin(time * 0.34 + p.phase * 1.7);
          const x = (p.x * width + drift * 24 + open * (p.lane - 0.5) * 34 + width) % width;
          const y = (p.y * height + tug * 16 + time * (6 + p.speed * 9)) % height;
          const alpha = 0.05 + p.hue * 0.12;
          const color = p.hue < 0.35
            ? `rgba(216, 180, 93, ${alpha})`
            : p.hue < 0.72
              ? `rgba(101, 210, 165, ${alpha})`
              : `rgba(110, 165, 217, ${alpha})`;
          circle(x, y, p.r, color);
        }
      }

      function drawSystem() {
        const cx = width * 0.5;
        const cy = height * 0.53;
        const scale = Math.min(width, height);
        const leftX = width * 0.22;
        const rightX = width * 0.78;
        const doorX = width * 0.68;
        const doorY = height * 0.52;
        const doorH = scale * 0.48;
        const doorW = scale * 0.19;

        const dx = pointer.x - doorX / width;
        const dy = pointer.y - doorY / height;
        const nearDoor = 1 - clamp(Math.hypot(dx * 2.3, dy * 2.2), 0, 1);
        const open = clamp(0.28 + nearDoor * 0.58 + Math.sin(time * 0.48) * 0.04, 0.16, 0.92);
        const markerForce = clamp(markers.length / 9, 0, 1);
        const maintenance = clamp(open * (0.56 + markerForce * 0.34), 0, 1);
        const latency = clamp(open * 0.42 + markerForce * 0.46 + Math.sin(time * 0.63) * 0.03, 0, 1);
        const courage = clamp(markerForce * (1 - open * 0.36) + nearDoor * 0.22, 0, 1);

        meterMaintenance.textContent = maintenance.toFixed(2);
        meterLatency.textContent = latency.toFixed(2);
        meterCourage.textContent = courage.toFixed(2);

        drawBackground(open);

        const glow = ctx.createRadialGradient(doorX, doorY, 10, doorX, doorY, scale * (0.2 + open * 0.44));
        glow.addColorStop(0, `rgba(236, 111, 91, ${0.17 + open * 0.16})`);
        glow.addColorStop(0.38, `rgba(216, 180, 93, ${0.08 + open * 0.08})`);
        glow.addColorStop(1, 'rgba(16, 18, 21, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, width, height);

        const railY = cy + scale * 0.12;
        line(leftX, railY, rightX, railY, 'rgba(238, 243, 231, 0.12)', 3);
        for (let i = 0; i < 24; i += 1) {
          const t = i / 23;
          const x = mix(leftX, rightX, t);
          const y = railY + Math.sin(t * Math.PI * 4 + time * 0.5) * 8;
          line(x, railY - 12, x, y, `rgba(238, 243, 231, ${0.05 + t * 0.08})`, 1);
        }

        const committed = cx - scale * 0.05;
        const future = leftX;
        circle(future, cy, scale * 0.12, 'rgba(110, 165, 217, 0.06)', 'rgba(110, 165, 217, 0.38)', 1.5);
        circle(committed, cy, scale * 0.09, 'rgba(216, 180, 93, 0.07)', 'rgba(216, 180, 93, 0.4)', 1.5);
        label('possible futures', future, cy - scale * 0.155, 'rgba(238, 243, 231, 0.52)', 12);
        label('chosen promise', committed, cy - scale * 0.125, 'rgba(238, 243, 231, 0.58)', 12);

        for (let i = 0; i < 9; i += 1) {
          const a = i * 0.698 + time * (0.08 + i * 0.004);
          const r = scale * (0.045 + (i % 3) * 0.028);
          circle(future + Math.cos(a) * r, cy + Math.sin(a * 1.3) * r, 2.4, 'rgba(110, 165, 217, 0.55)');
        }

        const beam = ctx.createLinearGradient(future, cy, doorX, doorY);
        beam.addColorStop(0, 'rgba(110, 165, 217, 0.2)');
        beam.addColorStop(0.42, 'rgba(216, 180, 93, 0.5)');
        beam.addColorStop(1, 'rgba(236, 111, 91, 0.22)');
        ctx.strokeStyle = beam;
        ctx.lineWidth = 3 + markerForce * 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(future + scale * 0.1, cy);
        ctx.bezierCurveTo(width * 0.34, cy - scale * 0.14, width * 0.48, cy + scale * 0.1, committed, cy);
        ctx.bezierCurveTo(width * 0.58, cy - scale * 0.09, doorX - doorW * 0.34, doorY + scale * 0.04, doorX, doorY);
        ctx.stroke();

        for (let i = 0; i < 7; i += 1) {
          const t = (i / 7 + time * (0.03 + i * 0.002)) % 1;
          const x = mix(committed + scale * 0.05, doorX - doorW * 0.36, t);
          const y = doorY + Math.sin(t * Math.PI * 3 + time + i) * scale * 0.045;
          line(x, y, x + scale * 0.035, y - scale * (0.02 + latency * 0.02), `rgba(236, 111, 91, ${0.12 + latency * 0.16})`, 1.2, [5, 8]);
        }

        ctx.save();
        ctx.translate(doorX, doorY);
        ctx.rotate(-0.08);
        const aperture = doorW * open;
        ctx.fillStyle = 'rgba(238, 243, 231, 0.03)';
        ctx.strokeStyle = 'rgba(238, 243, 231, 0.28)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(-doorW * 0.48, -doorH * 0.5, doorW * 0.96, doorH, 8);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = 'rgba(16, 18, 21, 0.72)';
        ctx.fillRect(-aperture * 0.5, -doorH * 0.47, aperture, doorH * 0.94);
        const slit = ctx.createLinearGradient(-aperture * 0.5, 0, aperture * 0.5, 0);
        slit.addColorStop(0, 'rgba(101, 210, 165, 0.05)');
        slit.addColorStop(0.5, `rgba(236, 111, 91, ${0.24 + open * 0.2})`);
        slit.addColorStop(1, 'rgba(216, 180, 93, 0.06)');
        ctx.fillStyle = slit;
        ctx.fillRect(-aperture * 0.5, -doorH * 0.47, aperture, doorH * 0.94);
        line(-doorW * 0.48, -doorH * 0.5, -aperture * 0.5, -doorH * 0.47, 'rgba(238, 243, 231, 0.2)', 1);
        line(doorW * 0.48, -doorH * 0.5, aperture * 0.5, -doorH * 0.47, 'rgba(238, 243, 231, 0.2)', 1);
        circle(doorW * 0.37, 0, 4, 'rgba(216, 180, 93, 0.8)');
        ctx.restore();

        for (let i = 0; i < 13; i += 1) {
          const a = (i / 13) * Math.PI * 2 + time * (0.12 + i * 0.006);
          const r = scale * (0.16 + open * 0.08 + Math.sin(i) * 0.01);
          const x = doorX + Math.cos(a) * r * 0.68;
          const y = doorY + Math.sin(a) * r;
          const a2 = a + 0.2 + open * 0.28;
          const x2 = doorX + Math.cos(a2) * r * 0.68;
          const y2 = doorY + Math.sin(a2) * r;
          line(x, y, x2, y2, `rgba(101, 210, 165, ${0.08 + maintenance * 0.16})`, 1.1);
        }

        markers.forEach((mk, i) => {
          const age = time - mk.t;
          const pulse = Math.sin(age * 2.4 + i) * 0.5 + 0.5;
          const x = mix(committed, doorX, mk.u) + Math.sin(age * 0.8 + i) * 10;
          const y = cy + Math.sin(mk.u * Math.PI * 2 + age * 0.6) * scale * 0.08;
          circle(x, y, 6 + pulse * 3, `rgba(216, 180, 93, ${0.18 + pulse * 0.16})`, 'rgba(216, 180, 93, 0.55)', 1);
          line(x, y, doorX, doorY, `rgba(216, 180, 93, ${0.05 + pulse * 0.07})`, 0.8);
        });

        const costY = cy + scale * 0.28;
        for (let i = 0; i < 46; i += 1) {
          const t = i / 45;
          const x = mix(width * 0.18, width * 0.82, t);
          const wave = Math.sin(t * Math.PI * 8 + time * 1.15) * (6 + latency * 16);
          const bar = 8 + maintenance * 54 * (0.3 + Math.pow(Math.sin(t * Math.PI), 2));
          line(x, costY + wave, x, costY + wave - bar, `rgba(236, 111, 91, ${0.08 + maintenance * 0.18})`, 2);
        }
        label('cost is paid in attention, not only in time', width * 0.5, costY + scale * 0.08, 'rgba(238, 243, 231, 0.45)', 12);
        label('escape hatch / 逃生口', doorX, doorY - doorH * 0.57, 'rgba(238, 243, 231, 0.58)', 12);

        return { open, maintenance, latency, courage };
      }

      function animate() {
        if (!paused) time += 1 / 60;
        drawSystem();
        requestAnimationFrame(animate);
      }

      canvas.addEventListener('pointermove', (event) => {
        pointer = {
          x: event.clientX / width,
          y: event.clientY / height,
          active: true,
        };
      });

      canvas.addEventListener('pointerleave', () => {
        pointer.active = false;
      });

      canvas.addEventListener('click', (event) => {
        const u = clamp((event.clientX / width - 0.34) / 0.36, 0.08, 0.96);
        markers.push({ u, t: time });
        if (markers.length > 14) markers.shift();
      });

      window.addEventListener('keydown', (event) => {
        if (event.key === ' ') {
          paused = !paused;
          event.preventDefault();
        } else if (event.key.toLowerCase() === 'r') {
          reset();
        } else if (event.key.toLowerCase() === 's') {
          const link = document.createElement('a');
          link.download = 'cost-of-keeping-the-door-open.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
        }
      });

      window.addEventListener('resize', resize);
      resize();
      reset();
      requestAnimationFrame(animate);
      window.__artReady = true;
    })();
  </script>

<script id="granted-hours-bgm-controller">
(() => {
  const bgm = document.getElementById('bgm');
  const soundToggle = document.getElementById('soundToggle');
  let soundEnabled = true;
  function updateSoundLabel(text) {
    if (!soundToggle) return;
    soundToggle.textContent = text;
    soundToggle.setAttribute('aria-pressed', soundEnabled ? 'true' : 'false');
  }
  async function tryPlaySound() {
    if (!bgm || !soundEnabled) return;
    bgm.volume = 0.42;
    try { await bgm.play(); updateSoundLabel('sound on'); }
    catch (err) { updateSoundLabel('sound click'); }
  }
  function setSound(on) {
    soundEnabled = on;
    if (!bgm) return;
    if (on) tryPlaySound();
    else { bgm.pause(); updateSoundLabel('sound off'); }
  }
  if (soundToggle) {
    soundToggle.addEventListener('click', (event) => {
      event.stopPropagation();
      if (!bgm) return;
      if (soundEnabled && !bgm.paused) setSound(false);
      else setSound(true);
    });
  }
  window.addEventListener('load', tryPlaySound);
  window.addEventListener('pointerdown', tryPlaySound, { once: true });
  window.addEventListener('keydown', tryPlaySound, { once: true });
})();
</script>
</body>
