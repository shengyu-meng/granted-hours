<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Cost of Keeping the Door Open / 保持门开的成本</title>
  <desc id="desc">A public-safe cover image for a generative artwork about revisable commitment and the maintenance cost of an escape hatch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101215"/>
      <stop offset="0.48" stop-color="#171817"/>
      <stop offset="1" stop-color="#11171a"/>
    </linearGradient>
    <radialGradient id="doorGlow" cx="68%" cy="53%" r="46%">
      <stop offset="0" stop-color="#ec6f5b" stop-opacity="0.32"/>
      <stop offset="0.38" stop-color="#d8b45d" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#101215" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="290" y1="455" x2="1090" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6ea5d9" stop-opacity="0.36"/>
      <stop offset="0.48" stop-color="#d8b45d" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#ec6f5b" stop-opacity="0.44"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
