  .hint{position:fixed;right:clamp(18px,4vw,58px);top:clamp(18px,4vw,48px);color:#c9c2b4;font:11px/1.55 ui-monospace,SFMono-Regular,monospace;letter-spacing:.12em;text-align:right;pointer-events:none;opacity:.8}
  #sound{position:fixed;right:clamp(18px,4vw,58px);bottom:clamp(18px,4vw,48px);min-width:44px;min-height:44px;padding:0 14px;border:1px solid rgba(230,205,154,.62);border-radius:999px;background:rgba(7,9,14,.42);color:var(--gold);font:11px/1 ui-monospace,SFMono-Regular,monospace;letter-spacing:.12em;cursor:pointer}
  #sound:hover,#sound:focus-visible{background:rgba(230,205,154,.16);outline:1px solid #f4dfa9;outline-offset:3px}
  body.visual .caption,body.visual .hint,body.visual #sound,
  body.embed .caption,body.embed .hint,body.embed #sound{display:none}
</style>
</head>
<body>
<canvas id="field" aria-label="A mineral day-cut whose compressed idle gap refuses a gold placeholder"></canvas>
<div class="caption">
  <h1>缺席比占位诚实 <span lang="en">/ Absence Is More Honest Than a Placeholder</span></h1>
  <p>空着，比假装发生过更干净。</p>
  <p lang="en">Empty is cleaner than pretending something happened.</p>
</div>
<div class="hint">TAP MASK — densify, never reveal<br>DRAG FILLER — refused<br>TAP STONE — leave</div>
<button id="sound" type="button" aria-pressed="true">SOUND ON</button>
<audio id="bgm" loop autoplay preload="auto"><source src="2026-09-12-absence-is-more-honest-than-a-placeholder-bgm.mp3" type="audio/mpeg"></audio>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const visual = params.get('preview') === 'visual';
  const embed = params.get('embed') === 'calendar';
  if (visual) document.body.classList.add('visual');
  if (embed) document.body.classList.add('embed');
  const canvas = document.querySelector('#field');
  const ctx = canvas.getContext('2d', {alpha: false});
  const bgm = document.querySelector('#bgm');
  const sound = document.querySelector('#sound');
  let w = 0, h = 0, dpr = 1, t0 = performance.now();
  let refuse = 0, audioWanted = true, leave = 0, densify = [0, 0, 0];
  let dragging = false, dragX = 0, dragY = 0, restX = 0, restY = 0;
  let fillerX = 0, fillerY = 0, spring = 0;
  const dust = Array.from({length: 120}, (_, i) => ({
    x: ((i * 41) % 100) / 100,
    y: ((i * 67) % 100) / 100,
    p: i * 0.17,
    s: 0.2 + (i % 8) * 0.1
  }));
  const sentences = [
    {y: 0.22, bars: [0.18, 0.42, 0.16]},
    {y: 0.48, bars: [0.28, 0.22, 0.34]},
    {y: 0.72, bars: [0.14, 0.38, 0.24]}
  ];
  const resize = () => {
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth;
    h = innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const L = layout();
    restX = L.filler.x;
    restY = L.filler.y;
    if (!dragging && spring < 0.08) {
      fillerX = restX;
      fillerY = restY;
    }
  };
  addEventListener('resize', resize);
  const layout = () => {
    const cutX = w * 0.27;
    const cutW = w * 0.16;
    const gap = {
      x: cutX,
      y: h * 0.46,
      bw: cutW,
      bh: Math.max(7, h * 0.018)
    };
    const occupied = [
      {x: cutX, y: h * 0.16, bw: cutW * 0.58, bh: h * 0.028, kind: 'climate'},
      {x: cutX, y: h * 0.28, bw: cutW, bh: h * 0.055, kind: 'event'},
      {x: cutX, y: h * 0.62, bw: cutW * 0.7, bh: h * 0.022, kind: 'climate'},
      {x: cutX, y: h * 0.74, bw: cutW, bh: h * 0.07, kind: 'gold'}
    ];
    const cards = sentences.map((s, i) => ({
      x: w * 0.52,
      y: h * s.y,
      bw: w * 0.32,
      bh: Math.min(h * 0.14, 118),
      bars: s.bars,
      i
    }));
    const filler = {
      x: w * 0.54,
      y: h * 0.455,
      bw: Math.min(w * 0.18, 168),
      bh: Math.min(h * 0.09, 72)
    };
    return {cutX, cutW, gap, occupied, cards, filler};
  };
  const hit = (px, py, r) =>
    px >= r.x && px <= r.x + r.bw && py >= r.y && py <= r.y + r.bh;
  canvas.addEventListener('pointerdown', (e) => {
    if (visual) { requestSound(); return; }
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    const L = layout();
    const fx = spring > 0.05 ? fillerX : restX;
    const fy = spring > 0.05 ? fillerY : restY;
    const fillerHit = {x: fx, y: fy, bw: L.filler.bw, bh: L.filler.bh};
    if (hit(px, py, fillerHit)) {
      dragging = true;
      dragX = px - fx;
      dragY = py - fy;
      leave = 0;
      canvas.setPointerCapture(e.pointerId);
    } else {
      const card = L.cards.find((c) => hit(px, py, c));
      if (card) {
        densify[card.i] = 1;
        leave = 0;
      } else {
        leave = 1;
        refuse *= 0.35;
      }
    }
    requestSound();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (visual || !dragging) return;
    const rect = canvas.getBoundingClientRect();
    fillerX = e.clientX - rect.left - dragX;
    fillerY = e.clientY - rect.top - dragY;
    spring = 1;
    const L = layout();
    const cx = fillerX + L.filler.bw / 2;
    const cy = fillerY + L.filler.bh / 2;
    if (hit(cx, cy, {x: L.gap.x - 10, y: L.gap.y - 18, bw: L.gap.bw + 20, bh: L.gap.bh + 36})) {
      refuse = 0.95;
    }
  });
  const endDrag = () => {
    if (!dragging) return;
    dragging = false;
    spring = 1;
    const L = layout();
    const cx = fillerX + L.filler.bw / 2;
    const cy = fillerY + L.filler.bh / 2;
    if (hit(cx, cy, {x: L.gap.x - 16, y: L.gap.y - 22, bw: L.gap.bw + 32, bh: L.gap.bh + 44})) {
      refuse = 1;
    }
  };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  function setSound(on) {
    sound.setAttribute('aria-pressed', String(on));
    sound.textContent = on ? 'SOUND ON' : (audioWanted ? 'SOUND ON' : 'SOUND OFF');
  }
  function requestSound() {
    if (!audioWanted) return;
    bgm.play().then(() => setSound(true)).catch(() => setSound(false));
  }
  sound.addEventListener('click', () => {
    if (audioWanted && !bgm.paused) {
      audioWanted = false;
      bgm.pause();
      setSound(false);
    } else {
      audioWanted = true;
      requestSound();
    }
  });
  bgm.addEventListener('playing', () => setSound(true));
  bgm.addEventListener('pause', () => { if (audioWanted) setSound(false); });
  requestSound();
  function roundRect(x, y, bw, bh, r) {
    const rr = Math.min(r, bw / 2, bh / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + bw, y, x + bw, y + bh, rr);
    ctx.arcTo(x + bw, y + bh, x, y + bh, rr);
    ctx.arcTo(x, y + bh, x, y, rr);
    ctx.arcTo(x, y, x + bw, y, rr);
    ctx.closePath();
  }
  function draw(now) {
    refuse *= 0.93;
    leave *= 0.92;
    densify = densify.map((v) => v * 0.96);
    const u = ((now - t0) / 4000) % 1;
    const L = layout();
    if (visual) {
      const wave = Math.sin(u * Math.PI);
      fillerX = restX - wave * w * 0.16;
      fillerY = restY + Math.sin(u * Math.PI * 2) * 6;
      spring = wave;
      refuse = 0.15 + 0.7 * Math.pow(Math.max(0, Math.sin(u * Math.PI * 2 - 0.4)), 2);
      densify = [0.35 + 0.45 * Math.sin(u * Math.PI * 2), 0.2 + 0.5 * Math.sin(u * Math.PI * 2 + 1.1), 0.28 + 0.4 * Math.cos(u * Math.PI * 2)];
    } else if (!dragging) {
      fillerX += (restX - fillerX) * 0.14;
      fillerY += (restY - fillerY) * 0.14;
      spring *= 0.9;
    }
    ctx.fillStyle = '#07090e';
    ctx.fillRect(0, 0, w, h);
    const g = ctx.createRadialGradient(w * 0.38, h * 0.48, 16, w * 0.42, h * 0.52, Math.max(w, h) * 0.84);
    g.addColorStop(0, '#12141c');
    g.addColorStop(1, '#07090e');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    for (const d of dust) {
      const dx = (d.x + Math.sin((now - t0) * 0.00005 + d.p) * 0.005) * w;
      const dy = (d.y + Math.cos((now - t0) * 0.00004 + d.p) * 0.004) * h;
      ctx.fillStyle = `rgba(138,132,150,${0.018 + (d.s % 1) * 0.028})`;
      ctx.fillRect(dx, dy, d.s, d.s);
    }
    ctx.fillStyle = 'rgba(16, 19, 27, 0.94)';
    ctx.fillRect(L.cutX - w * 0.045, h * 0.08, L.cutW + w * 0.09, h * 0.84);
    ctx.strokeStyle = 'rgba(142,197,207,0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(L.cutX - w * 0.025, h * 0.08);
    ctx.lineTo(L.cutX - w * 0.025, h * 0.92);
    ctx.stroke();
    for (let i = 0; i < 25; i++) {
      const y = h * (0.10 + i / 24 * 0.80);
      ctx.strokeStyle = 'rgba(142,197,207,0.12)';
      ctx.beginPath();
      ctx.moveTo(L.cutX - w * 0.058, y);
      ctx.lineTo(L.cutX - w * 0.058 + (i % 5 === 0 ? 13 : 6), y);
      ctx.stroke();
      if (i > 0) {
        const prev = h * (0.10 + (i - 1) / 24 * 0.80);
        const mid = (prev + y) / 2;
        const inGap = Math.abs(mid - (L.gap.y + L.gap.bh / 2)) < L.gap.bh * 2.2;
        ctx.fillStyle = inGap ? 'rgba(18,20,28,0.2)' : 'rgba(90,96,108,0.16)';
        ctx.fillRect(L.cutX, prev + 1, L.cutW, Math.max(1, y - prev - 2));
      }
    }
    for (const s of L.occupied) {
      if (s.kind === 'gold') {
        ctx.fillStyle = 'rgba(230,205,154,0.2)';
        ctx.fillRect(s.x, s.y, s.bw, s.bh);
        ctx.strokeStyle = 'rgba(244,223,169,0.55)';
        ctx.lineWidth = 1.1;
        ctx.strokeRect(s.x + 0.5, s.y + 0.5, s.bw - 1, s.bh - 1);
      } else if (s.kind === 'event') {
        ctx.fillStyle = 'rgba(142,197,207,0.32)';
        ctx.fillRect(s.x, s.y, s.bw, s.bh);
      } else {
        ctx.fillStyle = 'rgba(142,197,207,0.14)';
        ctx.fillRect(s.x, s.y, s.bw, s.bh);
      }
    }
    ctx.fillStyle = `rgba(18, 16, 24, ${0.86 + refuse * 0.08})`;
    ctx.fillRect(L.gap.x, L.gap.y, L.gap.bw, L.gap.bh);
    ctx.strokeStyle = `rgba(138,132,150,${0.38 + refuse * 0.35})`;
    ctx.lineWidth = 1.2;
    ctx.strokeRect(L.gap.x + 0.5, L.gap.y + 0.5, L.gap.bw - 1, L.gap.bh - 1);
    if (refuse > 0.12) {
      ctx.strokeStyle = `rgba(164,72,68,${refuse * 0.7})`;
      ctx.strokeRect(L.gap.x - 4, L.gap.y - 4, L.gap.bw + 8, L.gap.bh + 8);
    }
    for (const card of L.cards) {
      const d = densify[card.i];
      ctx.save();
      ctx.shadowColor = `rgba(239,232,216,${0.06 + d * 0.12})`;
      ctx.shadowBlur = 14;
      roundRect(card.x, card.y, card.bw, card.bh, 16);
      ctx.fillStyle = 'rgba(239,232,216,0.12)';
      ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = `rgba(230,205,154,${0.2 + d * 0.18})`;
      ctx.lineWidth = 1;
      ctx.stroke();
      let x = card.x + 16;
      const barY = card.y + card.bh * 0.42;
      const barH = 11 + d * 4;
      for (let i = 0; i < card.bars.length; i++) {
        const bw = card.bw * card.bars[i];
        if (i === 1) {
          ctx.fillStyle = `rgba(12,13,18,${0.55 + d * 0.32})`;
          roundRect(x, barY - 2, bw * 0.92, barH + 4, 3);
          ctx.fill();
        } else {
          ctx.fillStyle = `rgba(239,232,216,${0.18 + d * 0.12})`;
          ctx.fillRect(x, barY, bw * 0.86, 2.4);
        }
        x += bw;
      }
      ctx.restore();
    }
    const fx = fillerX || restX;
    const fy = fillerY || restY;
    ctx.save();
    ctx.globalAlpha = 0.92;
    ctx.shadowColor = 'rgba(230,205,154,0.16)';
    ctx.shadowBlur = 16;
    roundRect(fx, fy, L.filler.bw, L.filler.bh, 12);
    ctx.fillStyle = 'rgba(230,205,154,0.13)';
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.strokeStyle = `rgba(244,223,169,${0.45 + spring * 0.25})`;
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.fillStyle = 'rgba(230,205,154,0.28)';
    ctx.fillRect(fx + 14, fy + L.filler.bh * 0.32, L.filler.bw * 0.42, 2.2);
    ctx.fillRect(fx + 14, fy + L.filler.bh * 0.52, L.filler.bw * 0.28, 2);
    ctx.fillStyle = 'rgba(164,72,68,0.35)';
    ctx.fillRect(fx + L.filler.bw - 22, fy + 12, 8, 8);
    ctx.restore();
    ctx.strokeStyle = `rgba(164,72,68,${0.08 + refuse * 0.22})`;
    ctx.setLineDash([3, 7]);
    ctx.beginPath();
    ctx.moveTo(fx, fy + L.filler.bh / 2);
    ctx.lineTo(L.gap.x + L.gap.bw, L.gap.y + L.gap.bh / 2);
    ctx.stroke();
    ctx.setLineDash([]);
    if (refuse > 0.1) {
      ctx.fillStyle = `rgba(164,72,68,${refuse * 0.08})`;
      ctx.fillRect(0, 0, w, h);
    }
    if (leave > 0.08) {
      ctx.fillStyle = `rgba(7,9,14,${leave * 0.2})`;
      ctx.fillRect(0, 0, w, h);
    }
    requestAnimationFrame(draw);
  }
  resize();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
