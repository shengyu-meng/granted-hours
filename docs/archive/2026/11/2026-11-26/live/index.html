  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#12171b}
  body{font-family:"Iowan Old Style",Palatino,"Songti SC","PingFang SC",serif}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .caption{position:fixed;left:clamp(18px,4vw,58px);bottom:clamp(16px,3.2vw,36px);max-width:min(46rem,calc(100% - 190px));color:var(--ink);pointer-events:none;text-shadow:0 1px 18px #0d1517}
  .caption h1{margin:0;font-size:clamp(1.2rem,2.15vw,1.92rem);font-weight:500;letter-spacing:.06em}
  .caption .en{margin:.18rem 0 .4rem;color:var(--gold);font-size:clamp(.88rem,1.35vw,1.12rem);letter-spacing:.03em}
  .caption p{margin:0;color:var(--muted);font-size:clamp(.74rem,1.15vw,.98rem);line-height:1.5;letter-spacing:.04em}
  .hint{position:fixed;right:clamp(18px,4vw,58px);top:clamp(18px,4vw,48px);color:#d6cdb9;font:11px/1.6 ui-monospace,SFMono-Regular,monospace;letter-spacing:.12em;text-align:right;pointer-events:none;opacity:.8;text-shadow:0 1px 12px #0d1517}
  #sound{position:fixed;right:clamp(18px,4vw,58px);bottom:clamp(16px,3.2vw,36px);width:118px;height:44px;min-width:44px;min-height:44px;padding:0;box-sizing:border-box;text-align:center;border:1px solid rgba(230,205,154,.62);border-radius:999px;background:rgba(18,23,27,.42);color:var(--gold);font:11px/44px ui-monospace,SFMono-Regular,monospace;letter-spacing:.06em;cursor:pointer}
  #sound:hover,#sound:focus-visible{background:rgba(230,205,154,.16);outline:1px solid #f4dfa9;outline-offset:3px}
  html.visual .caption,html.visual .hint,html.visual #sound,
  html.embed .caption,html.embed .hint,html.embed #sound,
  html.shot .caption,html.shot .hint,html.shot #sound,
  html.paint .hint,html.paint #sound{display:none}
  html.paint .caption{display:none}
</style>
</head>
<body>
<canvas id="field" aria-label="Three stone chambers. A ring sounds only in a chamber you do not occupy."></canvas>
<div class="caption">
  <h1>你不在的地方在响</h1>
  <p class="en" lang="en">It Rings Where You Are Not</p>
  <p>你能站在一间石室里。你不能站在响声里面。</p>
  <p lang="en">You can stand in a chamber. You cannot stand inside the ring.</p>
</div>
<div class="hint">PRESS — enter an empty chamber<br>EMPTY — nothing is carried<br>K — step to the next chamber<br>F — step into the ring</div>
<button id="sound" type="button" aria-pressed="true">SOUND ON</button>
<audio id="bgm" loop autoplay preload="auto" playsinline><source src="2026-11-26-it-rings-where-you-are-not-bgm.mp3" type="audio/mpeg"></audio>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const visual = params.get("preview") === "visual";
  const still = params.get("still") === "1";
  const capture = params.get("capture") === "1" || params.get("shot") === "1" || still;
  const paintCaption = !visual && params.get("paint") === "caption";
  const probe = params.get("probe") === "1";
  const canvas = document.querySelector("#field");
  const ctx = canvas.getContext("2d", { alpha: false });
  const bgm = document.querySelector("#bgm");
  const sound = document.querySelector("#sound");
  const slow = window.matchMedia("(prefers-reduced-motion: reduce)").matches && !capture && !still;

  const INK = "#efe8d8";
  const GOLD = "#e6cd9a";
  const MUTED = "#c3b9a6";
  const BONE = "#e6dcc8";
  const BONE_EDGE = "#b7aa94";
  const CYAN = "#7ec8c0";
  const GROUND = "#12171b";
  const FILL = "#1c2428";
  const SEAM = "#1a2226";

  const ROOMS = [
    { x: 0.06, y: 0.10, w: 0.28, h: 0.62 },
    { x: 0.39, y: 0.18, w: 0.22, h: 0.56 },
    { x: 0.66, y: 0.11, w: 0.28, h: 0.64 }
  ];
  const PULSE = [0.30, 0.46, 0.64, 0.82, 0.64, 0.46];

  let w = 0;
  let h = 0;
  let dpr = 1;
  let t0 = performance.now();
  let liveSeconds = 0;
  let audioWanted = true;
  let occupied = 0;
  let ringing = 2;
  let travel = null;
  let lastDrift = 0;
  let captureFrame = null;
  let emptyPresses = 0;
  let selfPresses = 0;
  let enters = 0;
  let keyK = 0;
  let keyF = 0;
  let leaks = 0;
  let ringLeftBeforeEntry = 0;

  const frameParam = params.get("frame");
  if (frameParam !== null && frameParam !== "") captureFrame = Number(frameParam);

  function resize() {
    const rect = canvas.getBoundingClientRect();
    dpr = capture ? 1 : Math.min(window.devicePixelRatio || 1, 2);
    w = Math.max(1, Math.round(rect.width));
    h = Math.max(1, Math.round(rect.height));
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function roomRect(i) {
    const r = ROOMS[i];
    return { x: r.x * w, y: r.y * h, w: r.w * w, h: r.h * h };
  }

  function centerOf(i) {
    const r = roomRect(i);
    return { x: r.x + r.w * 0.5, y: r.y + r.h * 0.5 };
  }

  function hitRoom(x, y) {
    for (let i = ROOMS.length - 1; i >= 0; i -= 1) {
      const r = roomRect(i);
      if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return i;
    }
    return -1;
  }

  function chamberNot(a, b) {
    for (let i = 0; i < ROOMS.length; i += 1) {
      if (i !== a && i !== b) return i;
    }
    return -1;
  }

  function placeRingAway(fromRoom) {
    const next = chamberNot(occupied, fromRoom);
    ringing = next >= 0 ? next : (fromRoom + 1) % ROOMS.length;
    if (ringing === occupied || ringing === fromRoom) {
      leaks += 1;
      ringing = chamberNot(occupied, fromRoom);
      if (ringing < 0) ringing = (occupied + 1) % ROOMS.length;
    }
  }

  function guard() {
    if (occupied === ringing) {
      leaks += 1;
      ringing = (occupied + 1) % ROOMS.length;
    }
    if (travel && ringing === travel.to) {
      leaks += 1;
      placeRingAway(travel.to);
    }
  }

  function beginEnter(dest, source) {
    if (dest < 0) {
      emptyPresses += 1;
      return false;
    }
    if (travel) return false;
    if (dest === occupied) {
      selfPresses += 1;
      guard();
      return false;
    }
    if (ringing === dest) {
      placeRingAway(dest);
      ringLeftBeforeEntry += 1;
    }
    travel = {
      from: occupied,
      to: dest,
      started: liveSeconds,
      dur: (slow ? 0.9 : 0.5),
      source
    };
    guard();
    return true;
  }

  function pressK() {
    keyK += 1;
    beginEnter((occupied + 1) % ROOMS.length, "k");
  }

  function pressF() {
    keyF += 1;
    beginEnter(ringing, "f");
  }

  function finishTravel() {
    if (!travel) return;
    const u = (liveSeconds - travel.started) / travel.dur;
    if (u < 1) return;
    occupied = travel.to;
    travel = null;
    enters += 1;
    guard();
  }

  function drift() {
    if (probe || captureFrame !== null || travel) return;
    if (liveSeconds - lastDrift < 6.5) return;
    const alt = chamberNot(occupied, ringing);
    if (alt < 0 || alt === occupied) return;
    ringing = alt;
    lastDrift = liveSeconds;
    guard();
  }

  function scripted(frame) {
    const n = ((frame % 48) + 48) % 48;
    const sec = n / 12;
    if (n < 14) {
      return { sec, occ: 0, ring: 2, from: 0, to: 0, u: 1 };
    }
    if (n < 28) {
      return { sec, occ: 0, ring: 1, from: 0, to: 2, u: (n - 14) / 14 };
    }
    return { sec, occ: 2, ring: 1, from: 2, to: 2, u: 1 };
  }

  function discPoint() {
    if (captureFrame !== null && Number.isFinite(captureFrame)) {
      const s = scripted(captureFrame);
      const a = centerOf(s.from);
      const b = centerOf(s.to);
      return { x: a.x + (b.x - a.x) * s.u, y: a.y + (b.y - a.y) * s.u, ring: s.ring, sec: s.sec };
    }
    if (travel) {
      const u = Math.max(0, Math.min(1, (liveSeconds - travel.started) / travel.dur));
      const eased = u * u * (3 - 2 * u);
      const a = centerOf(travel.from);
      const b = centerOf(travel.to);
      return {
        x: a.x + (b.x - a.x) * eased,
        y: a.y + (b.y - a.y) * eased,
        ring: ringing,
        sec: liveSeconds
      };
    }
    const c = centerOf(occupied);
    return { x: c.x, y: c.y, ring: ringing, sec: liveSeconds };
  }

  function drawRooms() {
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = SEAM;
    ctx.fillRect(0, Math.round(h * 0.78), w, 2);
    for (let i = 0; i < ROOMS.length; i += 1) {
      const r = roomRect(i);
      ctx.fillStyle = FILL;
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.strokeStyle = BONE_EDGE;
      ctx.lineWidth = Math.max(3, w * 0.004);
      ctx.strokeRect(r.x + 2, r.y + 2, r.w - 4, r.h - 4);
      ctx.strokeStyle = BONE;
      ctx.lineWidth = Math.max(1, w * 0.0015);
      ctx.strokeRect(r.x + 10, r.y + 10, r.w - 20, r.h - 20);
      ctx.fillStyle = GOLD;
      ctx.fillRect(r.x + 10, r.y + 10, Math.max(18, r.w * 0.18), Math.max(2, h * 0.004));
    }
  }

  function drawRing(i, sec) {
    const r = roomRect(i);
    const cx = r.x + r.w * 0.5;
    const cy = r.y + r.h * 0.52;
    const maxR = Math.min(r.w, r.h) * 0.42;
    const scale = PULSE[Math.floor(sec * 3) % PULSE.length];
    const outer = maxR * scale;
    const inner = outer * 0.58;
    ctx.fillStyle = CYAN;
    ctx.beginPath();
    ctx.arc(cx, cy, outer, 0, Math.PI * 2);
    ctx.arc(cx, cy, inner, 0, Math.PI * 2, true);
    ctx.fill("evenodd");
    const ticks = 8;
    const tick = Math.floor(sec * 4) % ticks;
    const ang = (tick / ticks) * Math.PI * 2 - Math.PI / 2;
    const tx = cx + Math.cos(ang) * outer;
    const ty = cy + Math.sin(ang) * outer;
    const s = Math.max(7, w * 0.008);
    ctx.fillStyle = BONE;
    ctx.fillRect(tx - s / 2, ty - s / 2, s, s);
  }

  function drawDisc(x, y) {
    const rad = Math.max(9, w * 0.011);
    ctx.fillStyle = BONE;
    ctx.beginPath();
    ctx.arc(x, y, rad, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = GOLD;
    ctx.beginPath();
    ctx.arc(x, y, rad * 0.36, 0, Math.PI * 2);
    ctx.fill();
  }

  function paintWords() {
    if (!paintCaption) return;
    const x = Math.round(w * 0.04);
    ctx.fillStyle = INK;
    ctx.font = `500 ${Math.round(w * 0.028)}px "Iowan Old Style", Palatino, "Songti SC", "PingFang SC", serif`;
    ctx.fillText("你不在的地方在响", x, h - Math.round(h * 0.145));
    ctx.fillStyle = GOLD;
    ctx.font = `${Math.round(w * 0.02)}px "Iowan Old Style", Palatino, "Songti SC", serif`;
    ctx.fillText("It Rings Where You Are Not", x, h - Math.round(h * 0.1));
    ctx.fillStyle = MUTED;
    ctx.font = `${Math.round(w * 0.015)}px "Iowan Old Style", Palatino, "Songti SC", "PingFang SC", serif`;
    ctx.fillText("你能站在一间石室里。你不能站在响声里面。", x, h - Math.round(h * 0.062));
    ctx.fillText("You can stand in a chamber. You cannot stand inside the ring.", x, h - Math.round(h * 0.034));
  }

  function draw() {
    if (!w || !h) return;
    if (captureFrame === null) {
      finishTravel();
      drift();
      guard();
    }
    const point = discPoint();
    drawRooms();
    const ringIndex = captureFrame !== null ? scripted(captureFrame).ring : ringing;
    const occIndex = captureFrame !== null ? scripted(captureFrame).occ : occupied;
    if (ringIndex === occIndex && captureFrame === null) {
      leaks += 1;
      ringing = (occupied + 1) % ROOMS.length;
    }
    drawRing(ringIndex === occIndex ? (occIndex + 1) % ROOMS.length : ringIndex, point.sec);
    drawDisc(point.x, point.y);
    paintWords();
  }

  function loop(now) {
    if (captureFrame === null) {
      const rate = slow ? 0.35 : 1;
      liveSeconds = ((now - t0) / 1000) * rate;
    }
    draw();
    requestAnimationFrame(loop);
  }

  function localPoint(event) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (event.clientX - rect.left) * (w / rect.width),
      y: (event.clientY - rect.top) * (h / rect.height)
    };
  }

  async function tryPlay() {
    if (!audioWanted || !bgm) return;
    try { await bgm.play(); } catch (err) { /* autoplay may wait for a gesture */ }
  }

  function syncSound() {
    sound.textContent = audioWanted ? "SOUND ON" : "SOUND OFF";
    sound.setAttribute("aria-pressed", audioWanted ? "true" : "false");
  }

  canvas.addEventListener("pointerdown", (event) => {
    if (captureFrame !== null) return;
    const p = localPoint(event);
    beginEnter(hitRoom(p.x, p.y), "pointer");
    tryPlay();
  });

  window.addEventListener("keydown", (event) => {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (captureFrame !== null) return;
    if (event.key === "k" || event.key === "K") {
      event.preventDefault();
      pressK();
    } else if (event.key === "f" || event.key === "F") {
      event.preventDefault();
      pressF();
    }
  });

  sound.addEventListener("click", async (event) => {
    event.stopPropagation();
    audioWanted = !audioWanted;
    syncSound();
    if (audioWanted) await tryPlay();
    else if (bgm) bgm.pause();
  });

  window.addEventListener("resize", () => {
    resize();
    draw();
  });

  window.__seek = (frame) => {
    captureFrame = frame;
    draw();
    const s = scripted(frame);
    return { frame, ring: s.ring, occupied: s.occ, separated: s.ring !== s.occ };
  };
  window.__release = () => {
    captureFrame = null;
    t0 = performance.now() - liveSeconds * 1000;
  };
  window.__state = () => ({
    occupied,
    ringing,
    separated: occupied !== ringing && !(travel && ringing === travel.to),
    emptyPresses,
    selfPresses,
    enters,
    keyK,
    keyF,
    leaks,
    ringLeftBeforeEntry,
    traveling: Boolean(travel),
    travelTo: travel ? travel.to : null
  });
  window.__centers = () => ROOMS.map((_, i) => {
    const c = centerOf(i);
    const rect = canvas.getBoundingClientRect();
    return {
      i,
      x: rect.left + c.x * (rect.width / w),
      y: rect.top + c.y * (rect.height / h)
    };
  });

  resize();
  guard();
  syncSound();
  tryPlay();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
