  if (window.__grantedHoursFoldReady) return;

  const STORAGE_KEY = 'grantedHoursTextFolded';
  const WORK_NOTE = {"date":"2026-07-20","title_en":"The Bridge Is Not Neutral","title_zh":"桥并不中性","variable_en":"Neutral Instrument","variable_zh":"中性工具","start":"03:17","end":"04:17","duration_minutes":60,"experience_duration_en":"Open-ended; visitor-controlled","experience_duration_zh":"开放式，由观众决定","intention_en":"A bridge is presumed to merely connect. This field exposes that presumption as political: every crossing carries assumptions about which shore sets the rhythm, whose current bends first, and which form becomes the reference. The neutral instrument is never neutral.","intention_zh":"桥被认为仅仅是连接。这个场域揭示了这种预设的政治性：每一次通行都携带假设——哪岸设定节奏，哪股水流先弯曲，哪种形状成为参照。中性的工具从来不是中性的。","interaction_en":"Move the pointer to cast an inspection light across both shores and their bridge. Click to place a temporary crossing that glows and dissipates. P enters preserve mode, maintaining both shores in distinct colors; A enters assimilate mode, gradually tinting the cooler shore toward the warmer. Space pauses, V veils text, M toggles music, and S saves a still. Use the visible BGM button to start or stop the original MiniMax instrumental bed.","interaction_zh":"移动指针，在两岸及其间的桥上投下审视的光；点击画面，会放置一条发亮后消散的短暂渡口。P 进入保留模式，桥保持两岸各自的颜色；A 进入同化模式，桥渐渐将冷色岸染向暖色。Space 暂停，V 隐去文字，M 切换音乐，S 保存静帧；页面有清晰可见的 BGM 控件，可开启或关闭原创 MiniMax 器乐背景。","rationale_en":"The Bridge Is Not Neutral was made as one public step in the Granted Hours sequence, with the variable Neutral Instrument treated as an operational condition rather than a decorative theme. The intention frames the work this way: A bridge is presumed to merely connect. This field exposes that presumption as political: every crossing carries assumptions about which shore sets the rhythm, whose current bends first, and which form becomes the reference. The neutral instrument is never neutral. The live artifact then turns that idea into interaction: Move the pointer to cast an inspection light across both shores and their bridge. Click to place a temporary crossing that glows and dissipates. P enters preserve mode, maintaining both shores in distinct colors; A enters assimilate mode, gradually tinting the cooler shore toward the warmer. Space pauses, V veils text, M toggles music, and S saves a still. Use the visible BGM button to start or stop the original MiniMax instrumental bed. Its afterimage condenses the day’s claim: The bridge that claims to carry only traffic has already chosen which direction feels like home.","rationale_zh":"《桥并不中性》是《授时》连续序列中的一个公开步骤：当天的自由变量「中性工具」不是装饰性主题，而是一种要被转化成操作条件的概念。作品的发心是：桥被认为仅仅是连接。这个场域揭示了这种预设的政治性：每一次通行都携带假设——哪岸设定节奏，哪股水流先弯曲，哪种形状成为参照。中性的工具从来不是中性的。 可运行页面进一步把这个概念变成可操作的界面：移动指针，在两岸及其间的桥上投下审视的光；点击画面，会放置一条发亮后消散的短暂渡口。P 进入保留模式，桥保持两岸各自的颜色；A 进入同化模式，桥渐渐将冷色岸染向暖色。Space 暂停，V 隐去文字，M 切换音乐，S 保存静帧；页面有清晰可见的 BGM 控件，可开启或关闭原创 MiniMax 器乐背景。 它的余像把当天判断压缩为一句话：那座声称只运送交通的桥，已经选择了哪个方向更像家。","after_en":"The bridge that claims to carry only traffic has already chosen which direction feels like home.","after_zh":"那座声称只运送交通的桥，已经选择了哪个方向更像家。"};
  const params = new URLSearchParams(window.location.search);
  const IS_EMBED = new URLSearchParams(window.location.search).get('embed') === 'calendar';
  const MEDIA_TYPE = 'granted-hours:media';
  const MEDIA_VERSION = 1;

    try { return new URL(document.referrer).origin; }
    catch (_) { return ''; }

  const nativePlay = HTMLMediaElement.prototype.play;
  const NativeAudio = window.Audio;
  const trackedAudio = new Set();
  let mediaEnabled = false;
  if (IS_EMBED) {
    function GrantedHoursAudio(...args) {
      return trackAudio(new NativeAudio(...args));
    }

    GrantedHoursAudio.prototype = NativeAudio.prototype;
    window.Audio = GrantedHoursAudio;

      }
      if (this instanceof HTMLVideoElement) this.muted = true;
      return nativePlay.apply(this, args);

    document.addEventListener('play', (event) => {
      if (event.target instanceof HTMLAudioElement) {
        trackAudio(event.target);
        if (!mediaEnabled) silenceAudio(event.target);
        else event.target.muted = false;
      } else if (event.target instanceof HTMLVideoElement) {
        event.target.muted = true;
      }
    }, true);
    window.addEventListener('message', (event) => {
      if (event.source !== window.parent) return;
      if (!PARENT_ORIGIN || event.origin !== PARENT_ORIGIN) return;
      const message = event.data;
      if (!message || Object.getPrototypeOf(message) !== Object.prototype) return;
      if (Object.keys(message).sort().join(',') !== 'action,channel,type,version') return;
      if (message.type !== MEDIA_TYPE || message.version !== MEDIA_VERSION) return;
      if (!/^[a-zA-Z0-9_-]{16,128}$/.test(EMBED_CHANNEL) || message.channel !== EMBED_CHANNEL) return;
      if (message.action === 'play') setEmbeddedMediaState(true);
      else if (message.action === 'pause') setEmbeddedMediaState(false);
    });
  }
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'gh-fold-toggle';
  btn.setAttribute('aria-controls', 'textPanel legend');
  btn.setAttribute('aria-label', 'Fold or unfold artwork text overlays');
  const workNote = document.createElement('button');
  workNote.type = 'button';
  workNote.className = 'gh-work-note-trigger';
  workNote.textContent = 'Work note / 作品说明';
  workNote.setAttribute('aria-label', 'Open the artwork note over the interactive work / 在交互作品上方打开作品说明');
  workNote.setAttribute('aria-haspopup', 'dialog');

  if (document.readyState !== 'loading') init();
  function init() {

      new MutationObserver((records) => {
        records.forEach((record) => {

  function makeElement(tag, className, text = '') {

    element.className = className;

  }

    if (!en && !zh) return null;
    const section = makeElement('section', 'gh-work-note-section');
    section.append(makeElement('h3', '', label));
    if (en) section.append(makeElement('p', 'gh-work-note-en', en));

    return section;
  }
  function createWorkNoteOverlay() {
    const overlay = makeElement('section', 'gh-work-note-overlay');
    overlay.id = 'ghWorkNoteOverlay';
    overlay.hidden = true;
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-modal', 'true');
    overlay.setAttribute('aria-labelledby', 'ghWorkNoteTitle');
    const panel = makeElement('article', 'gh-work-note-panel');
    const close = makeElement('button', 'gh-work-note-close', '×');
    close.type = 'button';
    close.setAttribute('aria-label', 'Close work note / 关闭作品说明');
    const kicker = makeElement('p', 'gh-work-note-kicker', 'WORK NOTE / 作品说明');

      'gh-work-note-meta',

        + ` · experience ${WORK_NOTE.experience_duration_en} / 体验时长${WORK_NOTE.experience_duration_zh}`
        + ` · ${WORK_NOTE.variable_en} / ${WORK_NOTE.variable_zh}`,
    );
    panel.append(close, kicker, title, meta);
    [
      makeWorkNoteSection('Intention / 发心', WORK_NOTE.intention_en, WORK_NOTE.intention_zh),
      makeWorkNoteSection('Interaction / 交互', WORK_NOTE.interaction_en, WORK_NOTE.interaction_zh),
      makeWorkNoteSection('Creative rationale / 创作缘由', WORK_NOTE.rationale_en, WORK_NOTE.rationale_zh),
      makeWorkNoteSection('Afterimage / 余像', WORK_NOTE.after_en, WORK_NOTE.after_zh),
    ].filter(Boolean).forEach((section) => panel.append(section));
    const archive = makeElement('a', 'gh-work-note-archive', 'View full archive record / 查看完整档案 ↗');
    archive.href = '../';

    overlay.append(panel);

  }
  function openWorkNote() {

    if (workNoteOverlay.hidden) return;
    workNoteOverlay.classList.remove('is-open');
    workNoteOverlay.hidden = true;
    document.body.classList.remove('gh-work-note-modal-open');

    if (workNoteOverlay.hidden) return;

  }

:root{color-scheme:dark;--void:#0a0c10;--ink:#f0ede4;--shore-a:#7eb8d4;--shore-b:#d4a07e;--bridge:#e8d8a0;--light:#fffbe8}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--void);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Segoe UI",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;cursor:crosshair}.card,.hint,.state,.sound{position:fixed;z-index:2}.card{left:clamp(16px,4vw,58px);top:clamp(16px,4vh,48px);width:min(640px,calc(100vw - 32px));padding:20px 22px;border:1px solid #f0ede42e;border-radius:22px;background:linear-gradient(135deg,#0d121ae9,#1a1426a8);box-shadow:0 24px 80px #000b;backdrop-filter:blur(15px)}.eyebrow,.hint,.state,.sound{font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}.eyebrow{color:#f0ede497;text-transform:uppercase}h1{margin:9px 0 0;font-size:clamp(27px,4.1vw,51px);line-height:.95;letter-spacing:-.06em}h1 span{display:block;color:var(--bridge);font-weight:650}.thesis{margin:15px 0 0;color:#f0ede6c9;font-size:14px;line-height:1.65}.hint{left:clamp(16px,4vw,58px);bottom:clamp(16px,4vh,42px);max-width:min(800px,calc(100vw - 32px));padding:12px 15px;border:1px solid #f0ede425;border-radius:17px;background:#0a0c10bd;color:#f0ede6aa;backdrop-filter:blur(12px)}.state{right:clamp(16px,3vw,42px);top:clamp(16px,3vh,34px);color:#f0ede69c;text-align:right}.sound{right:clamp(16px,3vw,42px);bottom:clamp(16px,3vh,34px);padding:11px 14px;border:1px solid #e8d8a0a8;border-radius:999px;background:#0a0c10dd;color:var(--ink);cursor:pointer}.quiet .card,.quiet .hint{opacity:0;pointer-events:none}@media(max-width:560px){.state{top:auto;bottom:78px}.hint{font-size:10px}}
</style></head><body>
<canvas id="field"></canvas><audio id="bgm" src="2026-07-20-bridge-is-not-neutral-bgm.mp3" preload="auto" loop autoplay></audio>
<section class="card"><div class="eyebrow">Granted Hours · 2026-07-20 · variable: neutral instrument</div><h1>The Bridge Is Not Neutral <span>桥并不中性</span></h1><p class="thesis"><strong>Every crossing reshapes both shores.</strong><br>每一座桥都在重新塑造它所连接的两岸——问题是：谁在被改变？</p></section>
<div class="hint">Move to inspect · click to place crossing · P preserve mode · A assimilate mode · Space pause · V veil text · M music · S save still</div><div class="state" id="state"></div><button id="sound" class="sound" aria-pressed="true">BGM on / 音乐开</button>
<script>
(()=>{'use strict';const c=document.querySelector('#field'),g=c.getContext('2d'),audio=document.querySelector('#bgm'),btn=document.querySelector('#sound'),state=document.querySelector('#state');let W,H,d=1,t=0,paused=false,mode='preserve',assimilate=0;const mouse={x:0,y:0,on:false},crossings=[];function resize(){d=Math.min(devicePixelRatio||1,2);W=c.width=innerWidth*d;H=c.height=innerHeight*d}function shoreY(u,side,base){let wave=base+.08*Math.sin(u*5+t*.0004+side*1.3)+.04*Math.sin(u*12+t*.0006);return H*(.5+side*wave)}function shoreLine(side,color1,color2,u0,u1,steps){for(let i=0;i<steps;i++){let u=u0+i/steps,p1={x:W*u,y:shoreY(u,side,.18)},p2={x:W*u,y:shoreY(u,side,.26)};let grad=g.createLinearGradient(0,p1.y,0,p2.y);let alpha=.03+i/steps*.04;grad.addColorStop(0,color1.replace('A',alpha));grad.addColorStop(1,color2.replace('A',alpha*.3));g.fillStyle=grad;g.fillRect(p1.x-d,p1.y,W*d-u0*W,8*d)}}function bridgePath(u0,u1,sideA,sideB,tu0,tu1,offset){let pts=[];for(let i=0;i<=40;i++){let u=tu0+i/40*(tu1-tu0);let ya=shoreY(u,sideA,.18)+offset;let yb=shoreY(u,sideB,.18)-offset;let blend=mode==='assimilate'?assimilate*.5:0;let y=(1-blend)*((ya+yb)/2)+blend*(sideA<0?ya:yb);let x=W*u+Math.sin(u*8+t*.0005)*W*.02;pts.push({x:x,y:y})}return pts}function stroke(pts,style,w){if(pts.length<2)return;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.strokeStyle=style;g.lineWidth=w;g.stroke()}function draw(ms){requestAnimationFrame(draw);if(!paused)t=ms;if(mode==='assimilate')assimilate=Math.min(1,assimilate+.0004);else assimilate=Math.max(0,assimilate-.0004);g.fillStyle='#0a0c10';g.fillRect(0,0,W,H);let lc=Math.max(0,1-(mouse.y/H-.3)/.5);if(mouse.on){g.beginPath();g.arc(mouse.x,mouse.y,d*60,0,Math.PI*2);let rg=g.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,d*120);rg.addColorStop(0,`rgba(255,251,232,${.12*lc})`);rg.addColorStop(1,'rgba(255,251,232,0)');g.fillStyle=rg;g.fill()}for(let i=0;i<50;i++){let u=i/49;let ya=shoreY(u,-1,.18),yb=shoreY(u,1,.18);let blend=mode==='assimilate'?assimilate*.6:0;let mx=W*u,my=(1-blend)*((ya+yb)/2)+blend*(ya<yb?ya:yb);mx+=Math.sin(u*10+t*.0005)*W*.015;my+=Math.sin(u*7+t*.0004)*H*.008;g.beginPath();g.moveTo(W*u,ya);g.quadraticCurveTo(mx,my,W*u,yb);let alpha=.025+Math.sin(u*13+t*.0003)*.008;let r=Math.round(232*(1-blend)+158*blend),gr=Math.round(216*(1-blend)+124*blend),b=Math.round(160*(1-blend)+126*blend);g.strokeStyle=`rgba(${r},${gr},${b},${alpha})`;g.lineWidth=d*.5;g.stroke()}shoreLine(-1,'rgba(126,184,212,A)','rgba(126,184,212,0)',.08,.92,20);shoreLine(1,'rgba(212,160,126,A)','rgba(212,160,126,0)',.08,.92,20);for(let i=0;i<6;i++){let u=.12+i*.13;let ptsA=bridgePath(u-.01,u+.01,-1,1,.08,.92,-1);stroke(ptsA,i===3?`rgba(232,216,160,${.2+assimilate*.3})`:'rgba(232,216,160,.04)',d*.4)}let mainA=bridgePath(.08,.92,-1,1,.08,.92,0);stroke(mainA,'rgba(232,216,160,.9)',d*1.2);let mainB=bridgePath(.08,.92,-1,1,.08,.92,0);stroke(mainB,'rgba(232,216,160,.15)',d*3.5);crossings.forEach(x=>{x.age+=.003;let life=Math.max(0,1-x.age/6);let pts=bridgePath(x.u-.05,x.u+.05,-1,1,.08,.92,0);stroke(pts,`rgba(255,251,232,${life*.5})`,d*(2+life*4));g.beginPath();g.arc(W*x.u,shoreY(x.u,-1,.18)*.5+shoreY(x.u,1,.18)*.5,life*25*d,0,Math.PI*2);let rg=g.createRadialGradient(W*x.u,shoreY(x.u,-1,.18)*.5+shoreY(x.u,1,.18)*.5,0,W*x.u,shoreY(x.u,-1,.18)*.5+shoreY(x.u,1,.18)*.5,life*40*d);rg.addColorStop(0,`rgba(255,251,232,${life*.4})`);rg.addColorStop(1,'rgba(255,251,232,0)');g.fillStyle=rg;g.fill()});for(let i=crossings.length-1;i>=0;i--)if(crossings[i].age>6)crossings.splice(i,1);state.innerHTML=`mode: <span style="color:${mode==='preserve'?'#7eb8d4':'#d4a07e'}">${mode}</span><br>assimilate ${(assimilate*100).toFixed(0)}%<br><span style="color:#e8d8a0">${crossings.length} crossing${crossings.length===1?'':'s'}</span>`}function click(e){let r=c.getBoundingClientRect();crossings.push({u:Math.max(.08,Math.min(.92,(e.clientX-r.left)/r.width)),age:0});if(crossings.length>12)crossings.shift()}function sound(){if(audio.paused){audio.play().then(()=>{btn.textContent='BGM on / 音乐开';btn.setAttribute('aria-pressed','true')}).catch(()=>btn.textContent='Click for BGM / 点击开音乐')}else{audio.pause();btn.textContent='BGM off / 音乐关';btn.setAttribute('aria-pressed','false')}}c.addEventListener('pointermove',e=>{mouse.x=e.clientX*d;mouse.y=e.clientY*d;mouse.on=true});c.addEventListener('pointerleave',()=>mouse.on=false);c.addEventListener('click',click);btn.addEventListener('click',sound);addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();paused=!paused}if(e.key.toLowerCase()==='p')mode='preserve';if(e.key.toLowerCase()==='a')mode='assimilate';if(e.key.toLowerCase()==='v')document.body.classList.toggle('quiet');if(e.key.toLowerCase()==='m')sound();if(e.key.toLowerCase()==='s'){let a=document.createElement('a');a.download='bridge-is-not-neutral.png';a.href=c.toDataURL('image/png');a.click()}});audio.play().catch(()=>btn.textContent='Click for BGM / 点击开音乐');addEventListener('resize',resize);resize();draw(0)})();
</script></body></html>
