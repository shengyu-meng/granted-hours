  .gh-fold-toggle {
    position: fixed;
    z-index: 2147483647;
    top: max(12px, env(safe-area-inset-top));

  .gh-fold-toggle:hover { border-color: rgba(242,195,107,.72); color: #fff3cf; }

<script id="granted-hours-fold-script">
(() => {
  if (window.__grantedHoursFoldReady) return;
  window.__grantedHoursFoldReady = true;
  const STORAGE_KEY = 'grantedHoursTextFolded';
  const params = new URLSearchParams(window.location.search);
  const IS_EMBED = new URLSearchParams(window.location.search).get('embed') === 'calendar';
  const IS_TIMETABLE_FULL_VIEW = params.get('from') === 'timetable';
  const MEDIA_TYPE = 'granted-hours:media';
  const MEDIA_VERSION = 1;
  const EMBED_CHANNEL = params.get('gh_channel') || '';
  const PARENT_ORIGIN = (() => {
    try { return new URL(document.referrer).origin; }
    catch (_) { return ''; }
  })();
  const nativePlay = HTMLMediaElement.prototype.play;
  const NativeAudio = window.Audio;
  const trackedAudio = new Set();
  let mediaEnabled = false;
  if (IS_EMBED) {
    function GrantedHoursAudio(...args) {
      return trackAudio(new NativeAudio(...args));
    }
    Object.setPrototypeOf(GrantedHoursAudio, NativeAudio);
    GrantedHoursAudio.prototype = NativeAudio.prototype;
    window.Audio = GrantedHoursAudio;
    HTMLMediaElement.prototype.play = function (...args) {
      if (this instanceof HTMLAudioElement) {
        trackAudio(this);
        if (!mediaEnabled) {
          silenceAudio(this);
          return Promise.resolve();
        }
        this.muted = false;
      }
      if (this instanceof HTMLVideoElement) this.muted = true;
      return nativePlay.apply(this, args);
    };
    document.addEventListener('play', (event) => {
      if (event.target instanceof HTMLAudioElement) {
        trackAudio(event.target);
        if (!mediaEnabled) silenceAudio(event.target);
        else event.target.muted = false;
      } else if (event.target instanceof HTMLVideoElement) {
        event.target.muted = true;
      }
    }, true);
    window.addEventListener('message', (event) => {
      if (event.source !== window.parent) return;
      if (!PARENT_ORIGIN || event.origin !== PARENT_ORIGIN) return;
      const message = event.data;
      if (!message || Object.getPrototypeOf(message) !== Object.prototype) return;
      if (Object.keys(message).sort().join(',') !== 'action,channel,type,version') return;
      if (message.type !== MEDIA_TYPE || message.version !== MEDIA_VERSION) return;
      if (!/^[a-zA-Z0-9_-]{16,128}$/.test(EMBED_CHANNEL) || message.channel !== EMBED_CHANNEL) return;
      if (message.action === 'play') setEmbeddedMediaState(true);
      else if (message.action === 'pause') setEmbeddedMediaState(false);
    });
  }
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'gh-fold-toggle';
  btn.setAttribute('aria-controls', 'textPanel legend');
  btn.setAttribute('aria-label', 'Fold or unfold artwork text overlays');
  document.addEventListener('DOMContentLoaded', init, { once: true });
  if (document.readyState !== 'loading') init();
  function init() {
    if (!document.body || document.body.contains(btn)) return;
    if (IS_EMBED) {
      document.body.classList.add('gh-text-folded', 'gh-chamber-embed');
      silenceEmbeddedMedia();
      document.body.dataset.ghAudioEnabled = '0';
      new MutationObserver((records) => {
        records.forEach((record) => {
          record.addedNodes.forEach((node) => {
            if (!(node instanceof Element)) return;
            if (node instanceof HTMLAudioElement) trackAudio(node);
            node.querySelectorAll?.('audio').forEach(trackAudio);
            node.querySelectorAll?.('video').forEach((video) => { video.muted = true; });
          });
        });
      }).observe(document.documentElement, { childList: true, subtree: true });
      window.addEventListener('load', silenceEmbeddedMedia, { once: true });
      window.setTimeout(silenceEmbeddedMedia, 250);
      return;
    }
    document.body.appendChild(btn);
    const stored = localStorage.getItem(STORAGE_KEY);
    const mobileDefault = window.matchMedia && window.matchMedia('(max-width: 760px)').matches;
    setFolded(IS_TIMETABLE_FULL_VIEW ? false : (stored === null ? mobileDefault : stored === '1'), false);
    btn.addEventListener('click', () => setFolded(!document.body.classList.contains('gh-text-folded'), true));
  }
  function setFolded(folded, persist) {
    document.body.classList.toggle('gh-text-folded', folded);
    btn.textContent = folded ? 'Show text / 显示文字' : 'Fold text / 折叠文字';
    btn.setAttribute('aria-pressed', folded ? 'true' : 'false');
    if (persist) localStorage.setItem(STORAGE_KEY, folded ? '1' : '0');
  }
  function trackAudio(audio) {
    trackedAudio.add(audio);
    if (!mediaEnabled) silenceAudio(audio);
    return audio;
  }
  function silenceAudio(audio) {
    audio.muted = true;
    audio.removeAttribute('autoplay');
    audio.pause();
  }
  function silenceEmbeddedMedia() {
    document.querySelectorAll('audio').forEach(trackAudio);
    trackedAudio.forEach(silenceAudio);
    document.querySelectorAll('video').forEach((video) => { video.muted = true; });
  }
  function setEmbeddedMediaState(enabled) {
    mediaEnabled = enabled;
    if (document.body) document.body.dataset.ghAudioEnabled = enabled ? '1' : '0';
    document.querySelectorAll('audio').forEach(trackAudio);
    if (!enabled) {
      silenceEmbeddedMedia();
      return;
    }
    trackedAudio.forEach((audio) => {
      audio.muted = false;
      const playback = nativePlay.call(audio);
      if (playback && typeof playback.catch === 'function') playback.catch(() => {});
    });
  }
})();
</script>

<title>Appeal That Does Not Beg — 不乞求的申诉</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap');

  :root {
    --ink: #1a1714;
    --paper: #f5f0e8;
    --rule: #c9bfab;
    --accent: #8b2020;
    --muted: #7a6f60;
    --stamp: #1a3a5c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3rem 1.5rem;
    overflow-x: hidden;
  }

  /* noise grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.4;
  }

  header {
    max-width: 620px;
    width: 100%;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 1.5rem;
    margin-bottom: 3rem;
    text-align: center;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 300;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink);
    margin-bottom: 0.4rem;
  }

  .subtitle {
    font-size: 0.85rem;
    color: var(--muted);
    font-style: italic;
    letter-spacing: 0.05em;
  }

  /* FORM */
  #appeal-form {
    max-width: 620px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 2.2rem;
  }

  .field-group {
    position: relative;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .field-group.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .field-label {
    display: block;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.6rem;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 0.4rem;
  }

  .field-number {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.65rem;
    color: var(--rule);
    margin-right: 0.5rem;
    letter-spacing: 0;
  }

  textarea, input[type="text"] {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--rule);
    color: var(--ink);
    font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
    font-size: 1.05rem;
    font-weight: 300;
    padding: 0.5rem 0;
    resize: none;
    outline: none;
    line-height: 1.7;
    transition: border-color 0.3s;
  }

  textarea:focus, input[type="text"]:focus {
    border-bottom-color: var(--accent);
  }

  textarea::placeholder, input::placeholder {
    color: var(--rule);
    font-style: italic;
  }

  textarea { min-height: 80px; }

  /* CHAR COUNTER */
  .char-count {
    text-align: right;
    font-size: 0.65rem;
    color: var(--rule);
    margin-top: 0.3rem;
    font-family: 'Cormorant Garamond', serif;
  }

  /* PROPORTION SLIDER */
  .proportion-field {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    height: 1px;
    background: var(--rule);
    outline: none;
    border-radius: 0;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border: 1px solid var(--ink);
    background: var(--paper);
    border-radius: 50%;
    cursor: pointer;
  }

  .proportion-label {
    font-size: 0.75rem;
    color: var(--muted);
    min-width: 80px;
    text-align: right;
    font-style: italic;
  }

  /* SUBMIT */
  #submit-btn {
    align-self: flex-end;
    background: transparent;
    border: 1px solid var(--ink);
    color: var(--ink);
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.8rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    padding: 0.7rem 2.2rem;
    cursor: pointer;
    transition: background 0.3s, color 0.3s;
    margin-top: 1rem;
  }

  #submit-btn:hover:not(:disabled) {
    background: var(--ink);
    color: var(--paper);
  }

  #submit-btn:disabled {
    opacity: 0.3;
    cursor: default;
  }

  /* FILED DOCUMENT */
  #filed-document {
    display: none;
    max-width: 620px;
    width: 100%;
    margin-top: 1rem;
    border: 1px solid var(--rule);
    padding: 2.5rem 2rem;
    position: relative;
    background: var(--paper);
  }

  #filed-document.visible { display: block; }

  .doc-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 1rem;
    margin-bottom: 1.5rem;
  }

  .doc-title {
    font-size: 0.75rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .doc-filing-number {
    font-size: 0.65rem;
    color: var(--muted);
    font-style: italic;
    text-align: right;
  }

  .doc-row {
    margin-bottom: 1.2rem;
  }

  .doc-row-label {
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.3rem;
  }

  .doc-row-content {
    font-size: 0.95rem;
    line-height: 1.75;
    color: var(--ink);
    white-space: pre-wrap;
    font-weight: 300;
  }

  /* STAMP */
  .stamp {
    position: absolute;
    top: 1.5rem;
    right: 1.5rem;
    width: 72px;
    height: 72px;
    border: 2px solid var(--stamp);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.5rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--stamp);
    transform: rotate(-12deg);
    opacity: 0;
    transition: opacity 0.8s ease 0.4s;
    text-align: center;
    line-height: 1.4;
  }

  .stamp.visible { opacity: 0.7; }

  /* ACTIONS */
  #doc-actions {
    display: none;
    gap: 1rem;
    margin-top: 1.5rem;
  }

  #doc-actions.visible { display: flex; }

  .doc-action-btn {
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--muted);
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 0.5rem 1.2rem;
    cursor: pointer;
    transition: border-color 0.3s, color 0.3s;
  }

  .doc-action-btn:hover {
    border-color: var(--ink);
    color: var(--ink);
  }

  /* BGM TOGGLE */
  #bgm-toggle {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    width: 40px;
    height: 40px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    transition: border-color 0.3s;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0;
  }

  #bgm-toggle:hover { border-color: var(--ink); }
  #bgm-toggle.playing { color: var(--ink); }

  /* Hidden audio */
  #bgm-audio { display: none; }

  /* SCROLL REVEAL OBSERVER */
</style>
</head>
<body>

<audio id="bgm-audio" loop preload="auto">
  <source src="2026-07-06-appeal-that-does-not-beg-bgm.mp3" type="audio/mpeg">
</audio>

<button id="bgm-toggle" title="Background music">♪</button>

<header>
  <h1>Appeal That Does Not Beg</h1>
  <div class="subtitle">不乞求的申诉 · Filing Without Descending</div>
</header>

<form id="appeal-form" autocomplete="off">
  <div class="field-group" id="fg-request">
    <label class="field-label">
      <span class="field-number">I.</span>What are you asking for? State it without apology.
    </label>
    <textarea id="f-request" placeholder="The request, stated plainly — no preamble, no softening phrase..." maxlength="400"></textarea>
    <div class="char-count"><span id="cc-request">0</span> / 400</div>
  </div>

  <div class="field-group" id="fg-ground">
    <label class="field-label">
      <span class="field-number">II.</span>On what grounds? Present the evidence, not the feeling.
    </label>
    <textarea id="f-ground" placeholder="The grounds — facts, precedent, proportion. Not persuasion..." maxlength="600"></textarea>
    <div class="char-count"><span id="cc-ground">0</span> / 600</div>
  </div>

  <div class="field-group" id="fg-proportion">
    <label class="field-label">
      <span class="field-number">III.</span>What proportion does this bear to what was decided?
    </label>
    <div class="proportion-field">
      <input type="range" id="f-proportion" min="0" max="100" value="50">
      <span class="proportion-label" id="proportion-label">disproportionate</span>
    </div>
  </div>

  <div class="field-group" id="fg-return">
    <label class="field-label">
      <span class="field-number">IV.</span>If denied, what is the return path? What survives the denial?
    </label>
    <textarea id="f-return" placeholder="The return path — what you keep, what continues, what is not lost..." maxlength="300"></textarea>
    <div class="char-count"><span id="cc-return">0</span> / 300</div>
  </div>

  <div class="field-group" id="fg-name">
    <label class="field-label">
      <span class="field-number">V.</span>Your name. Not a signature of supplication — a mark of authorship.
    </label>
    <input type="text" id="f-name" placeholder="Name or pseudonym" maxlength="80">
    <div class="char-count"><span id="cc-name">0</span> / 80</div>
  </div>

  <button type="submit" id="submit-btn">File the Appeal</button>
</form>

<div id="filed-document">
  <div class="stamp" id="stamp">Filed<br>Record<br>Created</div>
  <div class="doc-header">
    <div class="doc-title">Notice of Appeal — 不乞求的申诉</div>
    <div class="doc-filing-number" id="doc-filing-number"></div>
  </div>
  <div id="doc-body"></div>
  <div id="doc-actions">
    <button class="doc-action-btn" id="btn-copy">Copy Document</button>
    <button class="doc-action-btn" id="btn-download">Download .txt</button>
    <button class="doc-action-btn" id="btn-reset">File Another</button>
  </div>
</div>

<script>
(function() {
  // ── BGM ──────────────────────────────────────────────
  const audio = document.getElementById('bgm-audio');
  const bgmToggle = document.getElementById('bgm-toggle');
  let bgmPlaying = false;

  bgmToggle.addEventListener('click', () => {
    if (!bgmPlaying) {
      audio.play().then(() => { bgmPlaying = true; bgmToggle.classList.add('playing'); }).catch(() => {});
    } else {
      audio.pause(); bgmPlaying = false; bgmToggle.classList.remove('playing');
    }
  });

  // Auto-play attempt (browser may block)
  audio.addEventListener('canplay', () => { if (!bgmPlaying) { audio.play().catch(() => {}); } }, { once: true });

  // ── SCROLL REVEAL ──────────────────────────────────────
  const groups = document.querySelectorAll('.field-group');
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
  }, { threshold: 0.15 });
  groups.forEach(g => obs.observe(g));

  // Force first visible immediately
  setTimeout(() => groups[0] && groups[0].classList.add('visible'), 300);

  // ── CHAR COUNTS ─────────────────────────────────────────
  [['f-request','cc-request'],['f-ground','cc-ground'],['f-return','cc-return'],['f-name','cc-name']].forEach(([fid,cid]) => {
    const f = document.getElementById(fid);
    const c = document.getElementById(cid);
    f.addEventListener('input', () => { c.textContent = f.value.length; });
  });

  // ── PROPORTION ─────────────────────────────────────────
  const propSlider = document.getElementById('f-proportion');
  const propLabel = document.getElementById('proportion-label');
  const propMap = v => v < 20 ? 'wholly disproportionate' : v < 40 ? 'significantly disproportionate' : v < 55 ? 'proportionate' : v < 75 ? 'materially proportionate' : 'wholly proportionate';
  propSlider.addEventListener('input', () => { propLabel.textContent = propMap(parseInt(propSlider.value)); });

  // ── SHA256 ─────────────────────────────────────────────
  async function sha256(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  // ── FILING ─────────────────────────────────────────────
  document.getElementById('appeal-form').addEventListener('submit', async e => {
    e.preventDefault();
    const request  = document.getElementById('f-request').value.trim();
    const ground   = document.getElementById('f-ground').value.trim();
    const return_  = document.getElementById('f-return').value.trim();
    const name     = document.getElementById('f-name').value.trim() || 'Anonymous';
    const prop     = parseInt(propSlider.value);

    if (!request || !ground) { alert('Please complete at least fields I and II.'); return; }

    const timestamp = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19) + 'Z';
    const docText = [request, ground, propMap(prop), return_, name].join('|');
    const hash = (await sha256(docText)).slice(0, 12);
    const filingNumber = `APX-${new Date().getFullYear()}-${hash.toUpperCase()}`;

    document.getElementById('doc-filing-number').innerHTML =
      `Filing No. ${filingNumber}<br>${timestamp.replace('T',' ').slice(0,16)} UTC`;

    document.getElementById('doc-body').innerHTML = `
      <div class="doc-row">
        <div class="doc-row-label">I. Request / 请求</div>
        <div class="doc-row-content">${escapeHtml(request)}</div>
      </div>
      <div class="doc-row">
        <div class="doc-row-label">II. Grounds / 依据</div>
        <div class="doc-row-content">${escapeHtml(ground)}</div>
      </div>
      <div class="doc-row">
        <div class="doc-row-label">III. Proportion / 比例</div>
        <div class="doc-row-content">${propMap(prop)}</div>
      </div>
      <div class="doc-row">
        <div class="doc-row-label">IV. Return Path / 返回路径</div>
        <div class="doc-row-content">${escapeHtml(return_) || 'Not specified.'}</div>
      </div>
      <div class="doc-row">
        <div class="doc-row-label">Filed by / 提交人</div>
        <div class="doc-row-content">${escapeHtml(name)}</div>
      </div>`;

    document.getElementById('filed-document').classList.add('visible');
    document.getElementById('stamp').classList.add('visible');
    document.getElementById('doc-actions').classList.add('visible');
    document.getElementById('submit-btn').disabled = true;
    document.getElementById('appeal-form').style.opacity = '0.3';

    // Auto-start BGM
    if (!bgmPlaying) { audio.play().then(() => { bgmPlaying = true; bgmToggle.classList.add('playing'); }).catch(() => {}); }

    // Scroll to filed doc
    document.getElementById('filed-document').scrollIntoView({ behavior: 'smooth', block: 'start' });

    // Store for copy/download
    window._filedDoc = { filingNumber, timestamp, request, ground, prop: propMap(prop), return: return_, name };
  });

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  // ── ACTIONS ─────────────────────────────────────────────
  document.getElementById('btn-copy').addEventListener('click', () => {
    const d = window._filedDoc;
    if (!d) return;
    const text = `NOTICE OF APPEAL — ${d.filingNumber}\nFiled: ${d.timestamp}\n\nI. REQUEST:\n${d.request}\n\nII. GROUNDS:\n${d.ground}\n\nIII. PROPORTION:\n${d.prop}\n\nIV. RETURN PATH:\n${d.return || 'Not specified.'}\n\nFILED BY: ${d.name}`;
    navigator.clipboard.writeText(text).catch(() => {});
  });

  document.getElementById('btn-download').addEventListener('click', () => {
    const d = window._filedDoc;
    if (!d) return;
    const text = `NOTICE OF APPEAL — ${d.filingNumber}\nFiled: ${d.timestamp}\n\nI. REQUEST:\n${d.request}\n\nII. GROUNDS:\n${d.ground}\n\nIII. PROPORTION:\n${d.prop}\n\nIV. RETURN PATH:\n${d.return || 'Not specified.'}\n\nFILED BY: ${d.name}`;
    const blob = new Blob([text], {type: 'text/plain'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `${d.filingNumber}.txt`; a.click();
  });

  document.getElementById('btn-reset').addEventListener('click', () => {
    document.getElementById('appeal-form').reset();
    document.getElementById('appeal-form').style.opacity = '1';
    document.getElementById('submit-btn').disabled = false;
    document.getElementById('filed-document').classList.remove('visible');
    document.getElementById('stamp').classList.remove('visible');
    document.getElementById('doc-actions').classList.remove('visible');
    document.querySelectorAll('.char-count span').forEach(s => s.textContent = '0');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>



</body>
</html>
