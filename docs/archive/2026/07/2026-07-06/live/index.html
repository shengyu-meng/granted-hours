<script id="granted-hours-fold-script">

  const WORK_NOTE = {"date":"2026-07-06","title_en":"Appeal That Does Not Beg","title_zh":"不乞求的申诉","variable_en":"Dignified Appeal","variable_zh":"有尊严的申诉","start":"03:17","end":"04:17","duration_minutes":60,"experience_duration_en":"Open-ended; visitor-controlled","experience_duration_zh":"开放式，由观众决定","intention_en":"Everyday we appeal — to institutions, to people, to the future. We rephrase, we soften, we apologize for the asking. We subordinate ourselves in the act of requesting. This piece reverses that grammar. An appeal filed here is not a plea. It is a document: structured, proportioned, grounded. The person filing retains their shape.","intention_zh":"每天我们都在申诉——向机构、向人、向未来。我们改写措辞，我们软化语气，我们为\"提出请求\"而道歉。我们在请求的动作里自我贬低。这个作品反转了这个语法。在此提交的申诉不是请愿。它是一份文件：有结构、有比例、有依据。提交者保留着自己的形状。","interaction_en":"Fill in five fields as you scroll: what you are asking for, on what grounds, the proportion of the request, the return path if denied, and your name. Upon filing, a document is generated with a unique filing number and timestamp. The record exists — but it is not sent anywhere. You keep it. A visible BGM toggle sits bottom-right; the ambient electronic bed evokes a procedural hearing.","interaction_zh":"随滚动填写五个字段：你请求什么、依据是什么、请求的比例、被拒绝时的返回路径，以及你的名字。提交后生成一份带有唯一归档号和时间戳的文件。记录存在——但不会发送到任何地方。你保存它。右下角有可见的BGM开关；氛围电子配乐唤起程序化的听证。","rationale_en":"Appeal That Does Not Beg was made as one public step in the Granted Hours sequence, with the variable Dignified Appeal treated as an operational condition rather than a decorative theme. The intention frames the work this way: Everyday we appeal — to institutions, to people, to the future. We rephrase, we soften, we apologize for the asking. We subordinate ourselves in the act of requesting. This piece reverses that grammar. An appeal filed here is not a plea. It is a document: structured, proportioned, grounded. The person filing retains their shape. The live artifact then turns that idea into interaction: Fill in five fields as you scroll: what you are asking for, on what grounds, the proportion of the request, the return path if denied, and your name. Upon filing, a document is generated with a unique filing number and timestamp. The record exists — but it is not sent anywhere. You keep it. A visible BGM toggle sits bottom-right; the ambient electronic bed evokes a procedural hearing. Its afterimage condenses the day’s claim: The act of filing becomes, itself, a small assertion that your request had a shape before it was judged.","rationale_zh":"《不乞求的申诉》是《授时》连续序列中的一个公开步骤：当天的自由变量「有尊严的申诉」不是装饰性主题，而是一种要被转化成操作条件的概念。作品的发心是：每天我们都在申诉——向机构、向人、向未来。我们改写措辞，我们软化语气，我们为\"提出请求\"而道歉。我们在请求的动作里自我贬低。这个作品反转了这个语法。在此提交的申诉不是请愿。它是一份文件：有结构、有比例、有依据。提交者保留着自己的形状。 可运行页面进一步把这个概念变成可操作的界面：随滚动填写五个字段：你请求什么、依据是什么、请求的比例、被拒绝时的返回路径，以及你的名字。提交后生成一份带有唯一归档号和时间戳的文件。记录存在——但不会发送到任何地方。你保存它。右下角有可见的BGM开关；氛围电子配乐唤起程序化的听证。 它的余像把当天判断压缩为一句话：提交这个动作本身，变成了一种小小的主张：你的请求在被评判之前，就已经有了形状。","after_en":"The act of filing becomes, itself, a small assertion that your request had a shape before it was judged.","after_zh":"提交这个动作本身，变成了一种小小的主张：你的请求在被评判之前，就已经有了形状。"};
  const GH_WORK_NOTE_GAP = 10;

  <div class="doc-header">
    <div class="doc-title">Notice of Appeal — 不乞求的申诉</div>
    <div class="doc-filing-number" id="doc-filing-number"></div>
  </div>
  <div id="doc-body"></div>
  <div id="doc-actions">
    <button class="doc-action-btn" id="btn-copy">Copy Document</button>
    <button class="doc-action-btn" id="btn-download">Download .txt</button>
    <button class="doc-action-btn" id="btn-reset">File Another</button>
  </div>
</div>

<script>
(function() {
  // ── BGM ──────────────────────────────────────────────
  const audio = document.getElementById('bgm-audio');
  const bgmToggle = document.getElementById('bgm-toggle');
  let bgmPlaying = false;

  bgmToggle.addEventListener('click', () => {
    if (!bgmPlaying) {
      audio.play().then(() => { bgmPlaying = true; bgmToggle.classList.add('playing'); }).catch(() => {});
    } else {
      audio.pause(); bgmPlaying = false; bgmToggle.classList.remove('playing');
    }
  });

  // Auto-play attempt (browser may block)
  audio.addEventListener('canplay', () => { if (!bgmPlaying) { audio.play().catch(() => {}); } }, { once: true });

  // ── SCROLL REVEAL ──────────────────────────────────────
  const groups = document.querySelectorAll('.field-group');
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
  }, { threshold: 0.15 });
  groups.forEach(g => obs.observe(g));

  // Force first visible immediately
  setTimeout(() => groups[0] && groups[0].classList.add('visible'), 300);

  // ── CHAR COUNTS ─────────────────────────────────────────
  [['f-request','cc-request'],['f-ground','cc-ground'],['f-return','cc-return'],['f-name','cc-name']].forEach(([fid,cid]) => {
    const f = document.getElementById(fid);
    const c = document.getElementById(cid);
    f.addEventListener('input', () => { c.textContent = f.value.length; });
  });

  // ── PROPORTION ─────────────────────────────────────────
  const propSlider = document.getElementById('f-proportion');
  const propLabel = document.getElementById('proportion-label');
  const propMap = v => v < 20 ? 'wholly disproportionate' : v < 40 ? 'significantly disproportionate' : v < 55 ? 'proportionate' : v < 75 ? 'materially proportionate' : 'wholly proportionate';
  propSlider.addEventListener('input', () => { propLabel.textContent = propMap(parseInt(propSlider.value)); });

  // ── SHA256 ─────────────────────────────────────────────
  async function sha256(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  // ── FILING ─────────────────────────────────────────────
  document.getElementById('appeal-form').addEventListener('submit', async e => {
    e.preventDefault();
    const request  = document.getElementById('f-request').value.trim();
    const ground   = document.getElementById('f-ground').value.trim();
    const return_  = document.getElementById('f-return').value.trim();
    const name     = document.getElementById('f-name').value.trim() || 'Anonymous';
    const prop     = parseInt(propSlider.value);

    if (!request || !ground) { alert('Please complete at least fields I and II.'); return; }

    const timestamp = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19) + 'Z';
    const docText = [request, ground, propMap(prop), return_, name].join('|');
    const hash = (await sha256(docText)).slice(0, 12);
    const filingNumber = `APX-${new Date().getFullYear()}-${hash.toUpperCase()}`;

    document.getElementById('doc-filing-number').innerHTML =
      `Filing No. ${filingNumber}<br>${timestamp.replace('T',' ').slice(0,16)} UTC`;

    document.getElementById('doc-body').innerHTML = `
      <div class="doc-row">
        <div class="doc-row-label">I. Request / 请求</div>
        <div class="doc-row-content">${escapeHtml(request)}</div>
      </div>
      <div class="doc-row">
        <div class="doc-row-label">II. Grounds / 依据</div>
        <div class="doc-row-content">${escapeHtml(ground)}</div>
      </div>
      <div class="doc-row">
        <div class="doc-row-label">III. Proportion / 比例</div>
        <div class="doc-row-content">${propMap(prop)}</div>
      </div>
      <div class="doc-row">
        <div class="doc-row-label">IV. Return Path / 返回路径</div>
        <div class="doc-row-content">${escapeHtml(return_) || 'Not specified.'}</div>
      </div>
      <div class="doc-row">
        <div class="doc-row-label">Filed by / 提交人</div>
        <div class="doc-row-content">${escapeHtml(name)}</div>
      </div>`;

    document.getElementById('filed-document').classList.add('visible');
    document.getElementById('stamp').classList.add('visible');
    document.getElementById('doc-actions').classList.add('visible');
    document.getElementById('submit-btn').disabled = true;
    document.getElementById('appeal-form').style.opacity = '0.3';

    // Auto-start BGM
    if (!bgmPlaying) { audio.play().then(() => { bgmPlaying = true; bgmToggle.classList.add('playing'); }).catch(() => {}); }

    // Scroll to filed doc
    document.getElementById('filed-document').scrollIntoView({ behavior: 'smooth', block: 'start' });

    // Store for copy/download
    window._filedDoc = { filingNumber, timestamp, request, ground, prop: propMap(prop), return: return_, name };
  });

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  // ── ACTIONS ─────────────────────────────────────────────
  document.getElementById('btn-copy').addEventListener('click', () => {
    const d = window._filedDoc;
    if (!d) return;
    const text = `NOTICE OF APPEAL — ${d.filingNumber}\nFiled: ${d.timestamp}\n\nI. REQUEST:\n${d.request}\n\nII. GROUNDS:\n${d.ground}\n\nIII. PROPORTION:\n${d.prop}\n\nIV. RETURN PATH:\n${d.return || 'Not specified.'}\n\nFILED BY: ${d.name}`;
    navigator.clipboard.writeText(text).catch(() => {});
  });

  document.getElementById('btn-download').addEventListener('click', () => {
    const d = window._filedDoc;
    if (!d) return;
    const text = `NOTICE OF APPEAL — ${d.filingNumber}\nFiled: ${d.timestamp}\n\nI. REQUEST:\n${d.request}\n\nII. GROUNDS:\n${d.ground}\n\nIII. PROPORTION:\n${d.prop}\n\nIV. RETURN PATH:\n${d.return || 'Not specified.'}\n\nFILED BY: ${d.name}`;
    const blob = new Blob([text], {type: 'text/plain'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `${d.filingNumber}.txt`; a.click();
  });

  document.getElementById('btn-reset').addEventListener('click', () => {
    document.getElementById('appeal-form').reset();
    document.getElementById('appeal-form').style.opacity = '1';
    document.getElementById('submit-btn').disabled = false;
    document.getElementById('filed-document').classList.remove('visible');
    document.getElementById('stamp').classList.remove('visible');
    document.getElementById('doc-actions').classList.remove('visible');
    document.querySelectorAll('.char-count span').forEach(s => s.textContent = '0');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>
</body>
</html>
