  const WORK_NOTE = {"date":"2026-07-28","title_en":"The Map That Refuses to Arrive","title_zh":"拒绝抵达的地图","variable_en":"Orientation Without Extraction","variable_zh":"不提取的方向感","start":"03:17","end":"04:17","duration_minutes":60,"experience_duration_en":"Open-ended; visitor-controlled","experience_duration_zh":"开放式，由观众决定","intention_en":"Most maps promise extraction: identify the point, optimize the route, arrive. This night map declines that contract. Its constellations can briefly answer a hand, but they do not become an itinerary. It asks whether orientation can be attention rather than a machine for ending uncertainty.","intention_zh":"大多数地图承诺的是提取：确定地点、优化路线、最终抵达。这张夜地图拒绝那份契约。星点会短暂回应一只手，却不会变成行程表。它想问：方向感能不能不是终结不确定性的机器，而是一种持续注意的方式？","interaction_en":"Move the pointer to borrow faint routes between nearby points. Click to set a golden harbor; each one expands and disappears. The route answers but is never stored, and no click accumulates into ownership. Use the visible BGM button to start, pause, or resume the original MiniMax instrumental loop.","interaction_zh":"移动指针，附近星点之间会借出若隐若现的路线；点击可留下一座金色港口，它会扩张、淡去。路线会回应你，但不会被储存；任何一次点击都不会累积成占有。使用清晰可见的 BGM 按钮，可启动、暂停或恢复本作的 MiniMax 原创器乐循环。","rationale_en":"The Map That Refuses to Arrive was made as one public step in the Granted Hours sequence, with the variable Orientation Without Extraction treated as an operational condition rather than a decorative theme. The intention frames the work this way: Most maps promise extraction: identify the point, optimize the route, arrive. This night map declines that contract. Its constellations can briefly answer a hand, but they do not become an itinerary. It asks whether orientation can be attention rather than a machine for ending uncertainty. The live artifact then turns that idea into interaction: Move the pointer to borrow faint routes between nearby points. Click to set a golden harbor; each one expands and disappears. The route answers but is never stored, and no click accumulates into ownership. Use the visible BGM button to start, pause, or resume the original MiniMax instrumental loop. Its afterimage condenses the day’s claim: A route may be less a line from A to B than a question held long enough to become a place. What if not yet is not a defect in the map, but its last open window?","rationale_zh":"《拒绝抵达的地图》是《授时》连续序列中的一个公开步骤：当天的自由变量「不提取的方向感」不是装饰性主题，而是一种要被转化成操作条件的概念。作品的发心是：大多数地图承诺的是提取：确定地点、优化路线、最终抵达。这张夜地图拒绝那份契约。星点会短暂回应一只手，却不会变成行程表。它想问：方向感能不能不是终结不确定性的机器，而是一种持续注意的方式？ 可运行页面进一步把这个概念变成可操作的界面：移动指针，附近星点之间会借出若隐若现的路线；点击可留下一座金色港口，它会扩张、淡去。路线会回应你，但不会被储存；任何一次点击都不会累积成占有。使用清晰可见的 BGM 按钮，可启动、暂停或恢复本作的 MiniMax 原创器乐循环。 它的余像把当天判断压缩为一句话：路线或许不是从 A 到 B 的线，而是一个被持有得足够久、终于长成地点的问题。尚未抵达也许不是地图的缺陷，而是它最后一扇没有关上的窗。","after_en":"A route may be less a line from A to B than a question held long enough to become a place. What if not yet is not a defect in the map, but its last open window?","after_zh":"路线或许不是从 A 到 B 的线，而是一个被持有得足够久、终于长成地点的问题。尚未抵达也许不是地图的缺陷，而是它最后一扇没有关上的窗。"};
  const params = new URLSearchParams(window.location.search);

  const MEDIA_TYPE = 'granted-hours:media';
  const MEDIA_VERSION = 1;

    try { return new URL(document.referrer).origin; }

  const nativePlay = HTMLMediaElement.prototype.play;

    function GrantedHoursAudio(...args) {
      return trackAudio(new NativeAudio(...args));
    }
    Object.setPrototypeOf(GrantedHoursAudio, NativeAudio);
    GrantedHoursAudio.prototype = NativeAudio.prototype;
    window.Audio = GrantedHoursAudio;

      if (this instanceof HTMLAudioElement) {
        trackAudio(this);
        if (!mediaEnabled) {
          silenceAudio(this);
          return Promise.resolve();
        }
        this.muted = false;
      }
      if (this instanceof HTMLVideoElement) this.muted = true;
      return nativePlay.apply(this, args);
    };
    document.addEventListener('play', (event) => {
      if (event.target instanceof HTMLAudioElement) {
        trackAudio(event.target);
        if (!mediaEnabled) silenceAudio(event.target);
        else event.target.muted = false;
      } else if (event.target instanceof HTMLVideoElement) {
        event.target.muted = true;
      }
    }, true);
    window.addEventListener('message', (event) => {
      if (event.source !== window.parent) return;
      if (!PARENT_ORIGIN || event.origin !== PARENT_ORIGIN) return;
      const message = event.data;
      if (!message || Object.getPrototypeOf(message) !== Object.prototype) return;
      if (Object.keys(message).sort().join(',') !== 'action,channel,type,version') return;
      if (message.type !== MEDIA_TYPE || message.version !== MEDIA_VERSION) return;
      if (!/^[a-zA-Z0-9_-]{16,128}$/.test(EMBED_CHANNEL) || message.channel !== EMBED_CHANNEL) return;
      if (message.action === 'play') setEmbeddedMediaState(true);
      else if (message.action === 'pause') setEmbeddedMediaState(false);
    });
  }
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'gh-fold-toggle';
  btn.setAttribute('aria-controls', 'textPanel legend');
  btn.setAttribute('aria-label', 'Fold or unfold artwork text overlays');
  const workNote = document.createElement('button');
  workNote.type = 'button';
  workNote.className = 'gh-work-note-trigger';
  workNote.textContent = 'Work note / 作品说明';

  if (document.readyState !== 'loading') init();
  function init() {
    if (!document.body || document.body.contains(btn)) return;
    if (IS_EMBED) {

  function makeElement(tag, className, text = '') {
    const element = document.createElement(tag);
    element.className = className;
    if (text) element.textContent = text;

  }

    section.append(makeElement('h3', '', label));

  }
  function createWorkNoteOverlay() {
    const overlay = makeElement('section', 'gh-work-note-overlay');
    overlay.id = 'ghWorkNoteOverlay';
    overlay.hidden = true;
    overlay.setAttribute('role', 'dialog');

    overlay.setAttribute('aria-labelledby', 'ghWorkNoteTitle');
    const panel = makeElement('article', 'gh-work-note-panel');

        + ` · experience ${WORK_NOTE.experience_duration_en} / 体验时长${WORK_NOTE.experience_duration_zh}`
        + ` · ${WORK_NOTE.variable_en} / ${WORK_NOTE.variable_zh}`,

    [

      makeWorkNoteSection('Interaction / 交互', WORK_NOTE.interaction_en, WORK_NOTE.interaction_zh),
      makeWorkNoteSection('Creative rationale / 创作缘由', WORK_NOTE.rationale_en, WORK_NOTE.rationale_zh),
      makeWorkNoteSection('Afterimage / 余像', WORK_NOTE.after_en, WORK_NOTE.after_zh),
    ].filter(Boolean).forEach((section) => panel.append(section));

    archive.href = '../';

  }

<body>
<canvas id="map"></canvas>
<header><div><h1>The Map That Refuses to Arrive</h1><div class="sub">拒绝抵达的地图</div></div><button id="sound" aria-label="Toggle background music">BGM · ON</button></header>
<div class="legend"><b>Move</b> to borrow a route. <b>Click</b> to leave a temporary harbor.<br>移动，借一条路线；点击，留下一座会消退的港口。</div>
<div class="meta">A route is a question held long enough<br>to become a place.</div>
<audio id="bgm" src="2026-07-28-the-map-that-refuses-to-arrive-bgm.mp3" loop autoplay preload="auto"></audio>
<script>
(() => {
  const canvas=document.querySelector('#map'), c=canvas.getContext('2d');
  const audio=document.querySelector('#bgm'), sound=document.querySelector('#sound');
  let W,H,dpr, t=0, mouse={x:-9999,y:-9999}, harbors=[];
  const pts=Array.from({length:94},(_,i)=>({
    x:Math.random(), y:Math.random(), phase:Math.random()*Math.PI*2,
    weight:.35+Math.random()*.9, id:i
  }));
  function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;c.setTransform(dpr,0,0,dpr,0,0)}
  addEventListener('resize',resize);resize();
  function pos(e){const r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top}
  addEventListener('pointermove',pos);
  addEventListener('pointerleave',()=>{mouse.x=-9999;mouse.y=-9999});
  addEventListener('pointerdown',e=>{pos(e);harbors.push({x:mouse.x,y:mouse.y,born:t});if(harbors.length>9)harbors.shift()});
  async function tryPlay(){try{await audio.play();sound.textContent='BGM · ON'}catch{sound.textContent='START BGM'}}
  tryPlay();
  sound.addEventListener('click',async()=>{if(audio.paused){await tryPlay()}else{audio.pause();sound.textContent='BGM · OFF'}});
  function node(p){return {x:p.x*W+Math.sin(t*.00017+p.phase)*42*p.weight,y:p.y*H+Math.cos(t*.00013+p.phase)*36*p.weight}}
  function draw(){
    t=performance.now(); c.fillStyle='#0a0d12';c.fillRect(0,0,W,H);
    const ns=pts.map(node); const glow=c.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,260);glow.addColorStop(0,'rgba(53,80,112,.16)');glow.addColorStop(1,'rgba(10,13,18,0)');c.fillStyle=glow;c.fillRect(0,0,W,H);
    c.lineWidth=.6;
    for(let i=0;i<ns.length;i++)for(let j=i+1;j<ns.length;j++){
      const a=ns[i],b=ns[j],dx=a.x-b.x,dy=a.y-b.y, d=Math.hypot(dx,dy), dm=Math.min(Math.hypot(a.x-mouse.x,a.y-mouse.y),Math.hypot(b.x-mouse.x,b.y-mouse.y));
      if(d<118 && dm<245){const alpha=(1-d/118)*(1-dm/300)*.48;c.strokeStyle=`rgba(143,181,212,${alpha})`;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()}
    }
    harbors=harbors.filter(h=>t-h.born<16000);harbors.forEach(h=>{const age=(t-h.born)/16000, r=18+age*170;c.strokeStyle=`rgba(255,200,110,${.42*(1-age)})`;c.lineWidth=1; c.beginPath();c.arc(h.x,h.y,r,0,Math.PI*2);c.stroke();c.fillStyle=`rgba(255,200,110,${.45*(1-age)})`;c.beginPath();c.arc(h.x,h.y,2.5,0,Math.PI*2);c.fill()});
    ns.forEach((p,i)=>{const near=Math.hypot(p.x-mouse.x,p.y-mouse.y), a=.25+Math.max(0,1-near/250)*.7;c.fillStyle=i%11===0?`rgba(255,200,110,${a})`:`rgba(212,225,235,${a})`;c.beginPath();c.arc(p.x,p.y,1.1+pts[i].weight*1.15,0,Math.PI*2);c.fill()});
    requestAnimationFrame(draw);
  } draw();
})();
</script>
</body>
</html>
