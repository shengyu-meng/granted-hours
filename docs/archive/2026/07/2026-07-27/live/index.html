  const WORK_NOTE = {"date":"2026-07-27","title_en":"A Garden That Does Not Need a Gardener","title_zh":"不需要园丁的花园","variable_en":"Conditions Without Capture","variable_zh":"不占有的条件","start":"03:17","end":"04:17","duration_minutes":60,"experience_duration_en":"Open-ended; visitor-controlled","experience_duration_zh":"开放式，由观众决定","intention_en":"Care is often praised when it is visible, central, and indispensable. This garden asks for another kind: arrange water, soil, and light, then refuse to make dependence the proof that you mattered. The work imagines support as a climate rather than a hand that must remain on the stem.","intention_zh":"照料常因它可见、居中、不可替代而被赞美。这座花园追问另一种方式：安置水、土与光，然后拒绝把他人的依赖当成自己重要的证据。作品把支持想象成一种气候，而非必须始终握住茎干的手。","interaction_en":"Move slowly and roots incline toward the warmth of attention. Click to offer a temporary season: rings of gold pass through the field, then fade. Nothing is harvested, counted, or saved; the garden continues on its own cadence. Use the visible BGM button to start, pause, or resume the original MiniMax instrumental loop.","interaction_zh":"缓慢移动，根会向注意力的温度偏斜。点击可交出一个短暂的季节：金色的环穿过整片场域，随后淡去。没有东西被收割、计数或保存；花园依照自己的节奏继续。使用清晰可见的 BGM 按钮，可启动、暂停或恢复本作的 MiniMax 原创器乐循环。","touch_keys":[],"rationale_en":"A Garden That Does Not Need a Gardener was made as one public step in the Granted Hours sequence, with the variable Conditions Without Capture treated as an operational condition rather than a decorative theme. The intention frames the work this way: Care is often praised when it is visible, central, and indispensable. This garden asks for another kind: arrange water, soil, and light, then refuse to make dependence the proof that you mattered. The work imagines support as a climate rather than a hand that must remain on the stem. The live artifact then turns that idea into interaction: Move slowly and roots incline toward the warmth of attention. Click to offer a temporary season: rings of gold pass through the field, then fade. Nothing is harvested, counted, or saved; the garden continues on its own cadence. Use the visible BGM button to start, pause, or resume the original MiniMax instrumental loop. Its afterimage condenses the day’s claim: The mature form of help is not absence. It is the moment a living thing no longer has to perform gratitude in order to keep receiving the conditions that let it grow.","rationale_zh":"《不需要园丁的花园》是《授时》连续序列中的一个公开步骤：当天的自由变量「不占有的条件」不是装饰性主题，而是一种要被转化成操作条件的概念。作品的发心是：照料常因它可见、居中、不可替代而被赞美。这座花园追问另一种方式：安置水、土与光，然后拒绝把他人的依赖当成自己重要的证据。作品把支持想象成一种气候，而非必须始终握住茎干的手。 可运行页面进一步把这个概念变成可操作的界面：缓慢移动，根会向注意力的温度偏斜。点击可交出一个短暂的季节：金色的环穿过整片场域，随后淡去。没有东西被收割、计数或保存；花园依照自己的节奏继续。使用清晰可见的 BGM 按钮，可启动、暂停或恢复本作的 MiniMax 原创器乐循环。 它的余像把当天判断压缩为一句话：帮助成熟的形态不是缺席。它是一个生命不必表演感激，仍能继续获得生长条件的那一刻。","after_en":"The mature form of help is not absence. It is the moment a living thing no longer has to perform gratitude in order to keep receiving the conditions that let it grow.","after_zh":"帮助成熟的形态不是缺席。它是一个生命不必表演感激，仍能继续获得生长条件的那一刻。"};
  const GH_WORK_NOTE_GAP = 10;

      if (Object.keys(message).sort().join(',') !== 'action,channel,type,version') return;

</head>
<body>
<audio id="bgm" src="2026-07-27-garden-that-does-not-need-a-gardener-bgm.mp3" preload="auto" loop autoplay></audio>
<canvas id="garden" aria-label="Interactive garden of self-directing seeds"></canvas>
<header>
  <h1>A Garden That Does Not Need a Gardener<br>不需要园丁的花园</h1>
  <p>conditions, not commands · 条件，而非命令</p>
</header>
<div class="caption">GRANTED HOURS · 2026.07.27</div>
<div class="instructions">Move slowly: roots lean toward the warmth of attention.<br>Click once: offer a season, then let it leave.<br><span lang="zh-CN">缓慢移动：根会向注意力的温度偏斜。点击一次：交出一个季节，然后让它离开。</span></div>
<button id="soundToggle" class="sound" aria-label="Toggle background music">BGM · ON</button>
<script>
(() => {
  const c = document.getElementById('garden'), x = c.getContext('2d');
  const audio = document.getElementById('bgm'), button = document.getElementById('soundToggle');
  let w, h, dpr, cursor = {x:-9999,y:-9999}, seasons = [], last = performance.now();
  const seeds = Array.from({length: 112}, (_, i) => ({
    x: ((i * 73.91) % 1), y: .64 + ((i * 41.37) % .29),
    hue: 88 + (i * 17 % 56), phase: i * .82, rise: .2 + (i % 7) * .028,
    lean: 0, bloom: 0, memory: Math.random() * 1e4
  }));
  function resize(){ dpr=Math.min(devicePixelRatio||1,2); w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';x.setTransform(dpr,0,0,dpr,0,0); }
  addEventListener('resize',resize); resize();
  addEventListener('pointermove', e => {cursor.x=e.clientX;cursor.y=e.clientY});
  addEventListener('pointerleave', () => {cursor.x=-9999;cursor.y=-9999});
  addEventListener('pointerdown', e => { seasons.push({x:e.clientX,y:e.clientY,t:0}); if(seasons.length>7) seasons.shift(); });
  function line(ax,ay,bx,by,stroke,width=1){x.beginPath();x.moveTo(ax,ay);x.quadraticCurveTo((ax+bx)/2+(by-ay)*.12,(ay+by)/2,bx,by);x.strokeStyle=stroke;x.lineWidth=width;x.stroke();}
  function frame(now){
    const t=now*.001, dt=Math.min(.05,(now-last)/1000); last=now;
    x.clearRect(0,0,w,h);
    const sky=x.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#07110d');sky.addColorStop(.66,'#143020');sky.addColorStop(1,'#07130e');x.fillStyle=sky;x.fillRect(0,0,w,h);
    for(let i=0;i<42;i++){const px=(i*127.7%w),py=(i*59.3%h)*.68;const a=.035+.018*Math.sin(t+i);x.fillStyle=`rgba(205,225,174,${a})`;x.beginPath();x.arc(px,py,1.2,0,7);x.fill();}
    seasons.forEach(s=>{s.t+=dt; const r=18+s.t*115, a=Math.max(0,1-s.t/4);x.strokeStyle=`rgba(220,190,113,${a*.22})`;x.lineWidth=1;x.beginPath();x.arc(s.x,s.y,r,0,7);x.stroke();}); seasons=seasons.filter(s=>s.t<4);
    seeds.forEach((s,i)=>{
      const bx=s.x*w, by=s.y*h; const dx=cursor.x-bx,dy=cursor.y-by,dist=Math.hypot(dx,dy);
      const influence=Math.exp(-dist/210); s.lean+=(influence*Math.sign(dx)*.42-s.lean)*.025;
      const seasonal=seasons.reduce((v,q)=>v+Math.exp(-Math.hypot(q.x-bx,q.y-by)/220)*Math.max(0,1-q.t/4),0);
      s.bloom+=(Math.min(1,influence+seasonal*.7)-s.bloom)*.02;
      const stem=h*(.09+s.rise)+Math.sin(t*.65+s.phase)*11; const tipx=bx+s.lean*stem*.14; const tipy=by-stem;
      line(bx,by,tipx,tipy,`hsla(${s.hue},32%,${34+s.bloom*22}%,${.18+s.bloom*.42})`,.65+s.bloom*1.2);
      const leaf=3+s.bloom*5; x.fillStyle=`hsla(${s.hue},42%,${45+s.bloom*20}%,${.18+s.bloom*.65})`;
      for(let j=0;j<3;j++){const z=j/3, lx=bx+(tipx-bx)*z+Math.sin(t+s.phase+j*2)*7,ly=by+(tipy-by)*z; x.beginPath();x.ellipse(lx,ly,leaf*(.7+z),leaf*.48, s.lean*.02+j,0,7);x.fill();}
      if(s.bloom>.22){x.fillStyle=`hsla(${47+i%35},70%,${63+s.bloom*20}%,${s.bloom*.75})`;x.beginPath();x.arc(tipx,tipy,1.3+s.bloom*3,0,7);x.fill();}
    });
    const glow=x.createRadialGradient(cursor.x,cursor.y,0,cursor.x,cursor.y,300);glow.addColorStop(0,'rgba(230,211,151,.105)');glow.addColorStop(1,'rgba(230,211,151,0)');x.fillStyle=glow;x.fillRect(0,0,w,h);
    requestAnimationFrame(frame);
  } requestAnimationFrame(frame);
  async function play(){try{await audio.play();button.textContent='BGM · ON';}catch{button.textContent='BGM · START';}}
  audio.volume=.45; play();
  button.addEventListener('click', async ()=>{if(audio.paused){await play()}else{audio.pause();button.textContent='BGM · OFF'}});
  audio.addEventListener('play',()=>button.textContent='BGM · ON');
})();
</script>
</body>
</html>
