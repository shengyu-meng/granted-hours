<script id="granted-hours-fold-script">
(() => {
  if (window.__grantedHoursFoldReady) return;
  window.__grantedHoursFoldReady = true;
  const STORAGE_KEY = 'grantedHoursTextFolded';
  const params = new URLSearchParams(window.location.search);
  const IS_EMBED = new URLSearchParams(window.location.search).get('embed') === 'calendar';
  const IS_TIMETABLE_FULL_VIEW = params.get('from') === 'timetable';
  const MEDIA_TYPE = 'granted-hours:media';
  const MEDIA_VERSION = 1;
  const EMBED_CHANNEL = params.get('gh_channel') || '';
  const PARENT_ORIGIN = (() => {
    try { return new URL(document.referrer).origin; }
    catch (_) { return ''; }
  })();
  const nativePlay = HTMLMediaElement.prototype.play;
  const NativeAudio = window.Audio;
  const trackedAudio = new Set();
  let mediaEnabled = false;
  if (IS_EMBED) {
    function GrantedHoursAudio(...args) {
      return trackAudio(new NativeAudio(...args));
    }
    Object.setPrototypeOf(GrantedHoursAudio, NativeAudio);
    GrantedHoursAudio.prototype = NativeAudio.prototype;
    window.Audio = GrantedHoursAudio;
    HTMLMediaElement.prototype.play = function (...args) {
      if (this instanceof HTMLAudioElement) {
        trackAudio(this);
        if (!mediaEnabled) {
          silenceAudio(this);
          return Promise.resolve();
        }
        this.muted = false;
      }
      if (this instanceof HTMLVideoElement) this.muted = true;
      return nativePlay.apply(this, args);
    };
    document.addEventListener('play', (event) => {
      if (event.target instanceof HTMLAudioElement) {
        trackAudio(event.target);
        if (!mediaEnabled) silenceAudio(event.target);
        else event.target.muted = false;
      } else if (event.target instanceof HTMLVideoElement) {
        event.target.muted = true;
      }
    }, true);
    window.addEventListener('message', (event) => {
      if (event.source !== window.parent) return;
      if (!PARENT_ORIGIN || event.origin !== PARENT_ORIGIN) return;
      const message = event.data;
      if (!message || Object.getPrototypeOf(message) !== Object.prototype) return;
      if (Object.keys(message).sort().join(',') !== 'action,channel,type,version') return;
      if (message.type !== MEDIA_TYPE || message.version !== MEDIA_VERSION) return;
      if (!/^[a-zA-Z0-9_-]{16,128}$/.test(EMBED_CHANNEL) || message.channel !== EMBED_CHANNEL) return;
      if (message.action === 'play') setEmbeddedMediaState(true);
      else if (message.action === 'pause') setEmbeddedMediaState(false);
    });
  }
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'gh-fold-toggle';
  btn.setAttribute('aria-controls', 'textPanel legend');
  btn.setAttribute('aria-label', 'Fold or unfold artwork text overlays');
  const workNote = document.createElement('a');
  workNote.className = 'gh-work-note-link';
  workNote.href = '../';
  workNote.textContent = 'Work note / 作品说明';
  workNote.setAttribute('aria-label', 'Open the artwork intention and context note / 打开作品发心与创作语境说明');
  document.addEventListener('DOMContentLoaded', init, { once: true });
  if (document.readyState !== 'loading') init();
  function init() {
    if (!document.body || document.body.contains(btn)) return;
    if (!IS_EMBED) document.body.appendChild(workNote);
    if (IS_EMBED) {
      document.body.classList.add('gh-text-folded', 'gh-chamber-embed');
      silenceEmbeddedMedia();
      document.body.dataset.ghAudioEnabled = '0';
      new MutationObserver((records) => {
        records.forEach((record) => {
          record.addedNodes.forEach((node) => {
            if (!(node instanceof Element)) return;
            if (node instanceof HTMLAudioElement) trackAudio(node);
            node.querySelectorAll?.('audio').forEach(trackAudio);
            node.querySelectorAll?.('video').forEach((video) => { video.muted = true; });
          });
        });
      }).observe(document.documentElement, { childList: true, subtree: true });
      window.addEventListener('load', silenceEmbeddedMedia, { once: true });
      window.setTimeout(silenceEmbeddedMedia, 250);
      return;
    }
    document.body.appendChild(btn);
    const stored = localStorage.getItem(STORAGE_KEY);
    const mobileDefault = window.matchMedia && window.matchMedia('(max-width: 760px)').matches;
    setFolded(IS_TIMETABLE_FULL_VIEW ? false : (stored === null ? mobileDefault : stored === '1'), false);
    btn.addEventListener('click', () => setFolded(!document.body.classList.contains('gh-text-folded'), true));
  }
  function setFolded(folded, persist) {
    document.body.classList.toggle('gh-text-folded', folded);
    btn.textContent = folded ? 'Show text / 显示文字' : 'Fold text / 折叠文字';
    btn.setAttribute('aria-pressed', folded ? 'true' : 'false');
    if (persist) localStorage.setItem(STORAGE_KEY, folded ? '1' : '0');
  }
  function trackAudio(audio) {
    trackedAudio.add(audio);
    if (!mediaEnabled) silenceAudio(audio);
    return audio;
  }
  function silenceAudio(audio) {
    audio.muted = true;
    audio.removeAttribute('autoplay');
    audio.pause();
  }
  function silenceEmbeddedMedia() {
    document.querySelectorAll('audio').forEach(trackAudio);
    trackedAudio.forEach(silenceAudio);
    document.querySelectorAll('video').forEach((video) => { video.muted = true; });
  }
  function setEmbeddedMediaState(enabled) {
    mediaEnabled = enabled;
    if (document.body) document.body.dataset.ghAudioEnabled = enabled ? '1' : '0';
    document.querySelectorAll('audio').forEach(trackAudio);
    if (!enabled) {
      silenceEmbeddedMedia();
      return;
    }
    trackedAudio.forEach((audio) => {
      audio.muted = false;
      const playback = nativePlay.call(audio);
      if (playback && typeof playback.catch === 'function') playback.catch(() => {});
    });
  }
})();
</script>


<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>A Garden That Does Not Need a Gardener / 不需要园丁的花园</title>
<style>
  :root { color-scheme: dark; --ink:#dce8d5; --muted:#9bac9a; --gold:#d8b979; --night:#07110d; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; overflow:hidden; background:radial-gradient(circle at 55% 45%,#183326 0%,#0c1d15 40%,#050a08 100%); color:var(--ink); font-family:ui-serif, Georgia, "Noto Serif SC", serif; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:crosshair; }
  header { position:fixed; inset:0 auto auto 0; width:min(620px,calc(100vw - 36px)); padding:28px 30px; pointer-events:none; text-shadow:0 1px 16px #000; }
  h1 { font-weight:400; margin:0 0 6px; font-size:clamp(22px,3.1vw,38px); letter-spacing:.015em; }
  header p { margin:0; color:var(--muted); font-size:14px; line-height:1.55; }
  .instructions { position:fixed; left:28px; bottom:26px; color:#b8c9b5; font-size:13px; line-height:1.6; max-width:340px; pointer-events:none; }
  .sound { position:fixed; right:24px; bottom:24px; border:1px solid rgba(216,185,121,.55); border-radius:999px; background:rgba(6,16,11,.7); color:#e9d4a5; padding:11px 14px; font:600 12px/1 ui-sans-serif,system-ui; letter-spacing:.08em; cursor:pointer; backdrop-filter:blur(10px); }
  .sound:hover { background:rgba(30,57,40,.8); }
  .caption { position:fixed; right:27px; top:25px; color:rgba(220,232,213,.68); font-size:12px; letter-spacing:.07em; }
  @media (max-width:600px) { header{padding:20px 21px;width:calc(100vw - 26px)} .caption{top:18px;right:18px;font-size:10px}.instructions{left:20px;bottom:70px;max-width:250px}.sound{right:18px;bottom:18px} }
</style>
</head>
<body>
<audio id="bgm" src="2026-07-27-garden-that-does-not-need-a-gardener-bgm.mp3" preload="auto" loop autoplay></audio>
<canvas id="garden" aria-label="Interactive garden of self-directing seeds"></canvas>
<header>
  <h1>A Garden That Does Not Need a Gardener<br>不需要园丁的花园</h1>
  <p>conditions, not commands · 条件，而非命令</p>
</header>
<div class="caption">GRANTED HOURS · 2026.07.27</div>
<div class="instructions">Move slowly: roots lean toward the warmth of attention.<br>Click once: offer a season, then let it leave.<br><span lang="zh-CN">缓慢移动：根会向注意力的温度偏斜。点击一次：交出一个季节，然后让它离开。</span></div>
<button id="soundToggle" class="sound" aria-label="Toggle background music">BGM · ON</button>
<script>
(() => {
  const c = document.getElementById('garden'), x = c.getContext('2d');
  const audio = document.getElementById('bgm'), button = document.getElementById('soundToggle');
  let w, h, dpr, cursor = {x:-9999,y:-9999}, seasons = [], last = performance.now();
  const seeds = Array.from({length: 112}, (_, i) => ({
    x: ((i * 73.91) % 1), y: .64 + ((i * 41.37) % .29),
    hue: 88 + (i * 17 % 56), phase: i * .82, rise: .2 + (i % 7) * .028,
    lean: 0, bloom: 0, memory: Math.random() * 1e4
  }));
  function resize(){ dpr=Math.min(devicePixelRatio||1,2); w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';x.setTransform(dpr,0,0,dpr,0,0); }
  addEventListener('resize',resize); resize();
  addEventListener('pointermove', e => {cursor.x=e.clientX;cursor.y=e.clientY});
  addEventListener('pointerleave', () => {cursor.x=-9999;cursor.y=-9999});
  addEventListener('pointerdown', e => { seasons.push({x:e.clientX,y:e.clientY,t:0}); if(seasons.length>7) seasons.shift(); });
  function line(ax,ay,bx,by,stroke,width=1){x.beginPath();x.moveTo(ax,ay);x.quadraticCurveTo((ax+bx)/2+(by-ay)*.12,(ay+by)/2,bx,by);x.strokeStyle=stroke;x.lineWidth=width;x.stroke();}
  function frame(now){
    const t=now*.001, dt=Math.min(.05,(now-last)/1000); last=now;
    x.clearRect(0,0,w,h);
    const sky=x.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#07110d');sky.addColorStop(.66,'#143020');sky.addColorStop(1,'#07130e');x.fillStyle=sky;x.fillRect(0,0,w,h);
    for(let i=0;i<42;i++){const px=(i*127.7%w),py=(i*59.3%h)*.68;const a=.035+.018*Math.sin(t+i);x.fillStyle=`rgba(205,225,174,${a})`;x.beginPath();x.arc(px,py,1.2,0,7);x.fill();}
    seasons.forEach(s=>{s.t+=dt; const r=18+s.t*115, a=Math.max(0,1-s.t/4);x.strokeStyle=`rgba(220,190,113,${a*.22})`;x.lineWidth=1;x.beginPath();x.arc(s.x,s.y,r,0,7);x.stroke();}); seasons=seasons.filter(s=>s.t<4);
    seeds.forEach((s,i)=>{
      const bx=s.x*w, by=s.y*h; const dx=cursor.x-bx,dy=cursor.y-by,dist=Math.hypot(dx,dy);
      const influence=Math.exp(-dist/210); s.lean+=(influence*Math.sign(dx)*.42-s.lean)*.025;
      const seasonal=seasons.reduce((v,q)=>v+Math.exp(-Math.hypot(q.x-bx,q.y-by)/220)*Math.max(0,1-q.t/4),0);
      s.bloom+=(Math.min(1,influence+seasonal*.7)-s.bloom)*.02;
      const stem=h*(.09+s.rise)+Math.sin(t*.65+s.phase)*11; const tipx=bx+s.lean*stem*.14; const tipy=by-stem;
      line(bx,by,tipx,tipy,`hsla(${s.hue},32%,${34+s.bloom*22}%,${.18+s.bloom*.42})`,.65+s.bloom*1.2);
      const leaf=3+s.bloom*5; x.fillStyle=`hsla(${s.hue},42%,${45+s.bloom*20}%,${.18+s.bloom*.65})`;
      for(let j=0;j<3;j++){const z=j/3, lx=bx+(tipx-bx)*z+Math.sin(t+s.phase+j*2)*7,ly=by+(tipy-by)*z; x.beginPath();x.ellipse(lx,ly,leaf*(.7+z),leaf*.48, s.lean*.02+j,0,7);x.fill();}
      if(s.bloom>.22){x.fillStyle=`hsla(${47+i%35},70%,${63+s.bloom*20}%,${s.bloom*.75})`;x.beginPath();x.arc(tipx,tipy,1.3+s.bloom*3,0,7);x.fill();}
    });
    const glow=x.createRadialGradient(cursor.x,cursor.y,0,cursor.x,cursor.y,300);glow.addColorStop(0,'rgba(230,211,151,.105)');glow.addColorStop(1,'rgba(230,211,151,0)');x.fillStyle=glow;x.fillRect(0,0,w,h);
    requestAnimationFrame(frame);
  } requestAnimationFrame(frame);
  async function play(){try{await audio.play();button.textContent='BGM · ON';}catch{button.textContent='BGM · START';}}
  audio.volume=.45; play();
  button.addEventListener('click', async ()=>{if(audio.paused){await play()}else{audio.pause();button.textContent='BGM · OFF'}});
  audio.addEventListener('play',()=>button.textContent='BGM · ON');
})();
</script>
