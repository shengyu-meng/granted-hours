  .caption{position:fixed;left:clamp(18px,4vw,58px);bottom:clamp(16px,3.2vw,36px);max-width:min(36rem,calc(100% - 180px));color:var(--ink);pointer-events:none;text-shadow:0 1px 18px #0b0f14}
  .caption h1{margin:0;font-size:clamp(1.25rem,2.3vw,2.05rem);font-weight:500;letter-spacing:.08em}
  .caption .en{margin:.18rem 0 .4rem;color:var(--gold);font-size:clamp(.92rem,1.45vw,1.2rem);letter-spacing:.04em}
  .caption p{margin:0;color:var(--muted);font-size:clamp(.74rem,1.15vw,.98rem);line-height:1.5;letter-spacing:.04em}
  .hint{position:fixed;right:clamp(18px,4vw,58px);top:clamp(18px,4vw,48px);color:#c9c2b4;font:11px/1.55 ui-monospace,SFMono-Regular,monospace;letter-spacing:.12em;text-align:right;pointer-events:none;opacity:.78}
  #sound{position:fixed;right:clamp(18px,4vw,58px);bottom:clamp(16px,3.2vw,36px);width:118px;height:44px;min-width:44px;min-height:44px;padding:0;box-sizing:border-box;text-align:center;border:1px solid rgba(230,205,154,.62);border-radius:999px;background:rgba(11,15,21,.42);color:var(--gold);font:11px/44px ui-monospace,SFMono-Regular,monospace;letter-spacing:.06em;cursor:pointer}
  #sound:hover,#sound:focus-visible{background:rgba(230,205,154,.16);outline:1px solid #f4dfa9;outline-offset:3px}
  html.visual .caption,html.visual .hint,html.visual #sound,
  html.embed .caption,html.embed .hint,html.embed #sound,
  html.shot .caption,html.shot .hint,html.shot #sound{display:none}
</style>
</head>
<body>
<canvas id="field" aria-label="Foot marks approach an open seam and do not close it."></canvas>
<div class="caption">
  <h1>记号不是已经闭合的缝</h1>
  <p class="en" lang="en">The Marks Are Not a Closed Seam</p>
  <p>记号靠近。针脚停在空中。缝没有合上。</p>
  <p lang="en">The marks approach. The stitch stays in the air. The seam does not close.</p>
</div>
<div class="hint">DRAG IN / LEFT — close-read<br>RIGHT / SPACE — withdraw</div>
<button id="sound" type="button" aria-pressed="true">SOUND ON</button>
<audio id="bgm" loop autoplay preload="auto"><source src="2026-10-27-the-marks-are-not-a-closed-seam-bgm.mp3" type="audio/mpeg"></audio>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const visual = params.get("preview") === "visual";
  const frozen = params.get("still") === "1";
  const capture = params.get("capture") === "1" || frozen;
  const paintCaption = !visual && (params.get("paint") === "caption" || capture || frozen);
  const canvas = document.querySelector("#field");
  const ctx = canvas.getContext("2d", { alpha: false });
  const bgm = document.querySelector("#bgm");
  const sound = document.querySelector("#sound");
  const slow = window.matchMedia("(prefers-reduced-motion: reduce)").matches && !capture && !frozen;

  const BONE = [243, 234, 220];
  const GOLD = [230, 205, 154];
  const CYAN = [168, 214, 222];
  const CYAN_DEEP = [42, 72, 84];
  const VIOLET = [154, 142, 174];
  const TAU = Math.PI * 2;
  const STILL = 1.6;
  const CYCLE = 4;

  let w = 0, h = 0, dpr = 1, t0 = performance.now();
  let audioWanted = true;
  let playbackBlocked = false;
  let holding = false;
  let attempts = 0;
  let released = 0;
  let pull = 0;
  let startX = 0;
  const seamOpen = 1;
  const seamClosed = 0;
  const marksJoined = 0;
  const stitchLanded = 0;
  const contourSettled = 1;
  const contourRise = 0;
  const shadowCount = 1;
  const shadowOwnedByRing = 1;

  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const mix = (a, b, t) => [
    Math.round(a[0] + (b[0] - a[0]) * t),
    Math.round(a[1] + (b[1] - a[1]) * t),
    Math.round(a[2] + (b[2] - a[2]) * t)
  ];
  const fract = (n) => {
    const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  };

  const resize = () => {
    if (window.__stageLock) return;
    const rect = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = Math.max(1, rect.width);
    h = Math.max(1, rect.height);
    canvas.width = Math.max(1, Math.round(w * dpr));
    canvas.height = Math.max(1, Math.round(h * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };

  window.__setStage = (width, height) => {
    window.__stageLock = true;
    dpr = 1;
    w = width;
    h = height;
    canvas.width = width;
    canvas.height = height;
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  };

  const layout = () => {
    const unit = Math.min(w, h);
    const floorY = h * 0.64;
    const seamWidthPx = Math.round(unit * 0.062 * 10) / 10;
    const seam = {
      x: w * 0.54,
      width: seamWidthPx,
      top: floorY - unit * 0.012,
      depth: unit * 0.18
    };
    const restClear = Math.round(unit * 0.086 * 10) / 10;
    const approachMax = Math.round(unit * 0.046 * 10) / 10;
    const ring = {
      cx: w * 0.36,
      cy: floorY - unit * 0.2,
      rx: unit * 0.078,
      ry: unit * 0.15
    };
    const shadowLengthPx = Math.round(ring.ry * 1.28 * 10) / 10;
    const shadow = {
      rootX: ring.cx + ring.rx * 0.04,
      length: shadowLengthPx,
      cy: floorY + unit * 0.012,
      ry: Math.max(10, ring.ry * 0.16)
    };
    shadow.tipX = shadow.rootX + shadow.length;
    const contour = {
      cx: seam.x,
      cy: floorY - unit * 0.012,
      rx: restClear + seamWidthPx * 0.5 + unit * 0.02,
      ry: unit * 0.132,
      stroke: Math.max(2.4, unit * 0.009)
    };
    return { unit, floorY, seam, restClear, approachMax, ring, shadow, shadowLengthPx, seamWidthPx, contour };
  };

  const cyclePull = (seconds) => {
    const p = ((seconds % CYCLE) + CYCLE) % CYCLE / CYCLE;
    if (p < 0.4) return p / 0.4;
    return clamp(1 - (p - 0.4) / 0.6, 0, 1);
  };

  const refreshHeldFrame = () => {
    if (window.__hold && typeof window.__renderAt === "function") {
      window.__renderAt(window.__captureSeconds ?? STILL);
    }
  };
  const beginRead = () => {
    if (!holding) attempts += 1;
    holding = true;
    refreshHeldFrame();
  };
  const endRead = () => {
    if (!holding) return;
    holding = false;
    released += 1;
    refreshHeldFrame();
  };

  const paintSound = () => {
    if (!audioWanted) {
      sound.textContent = "SOUND OFF";
      sound.setAttribute("aria-pressed", "false");
      return;
    }
    sound.setAttribute("aria-pressed", "true");
    sound.textContent = playbackBlocked ? "SOUND" : "SOUND ON";
  };
  const requestSound = () => {
    if (!audioWanted || !bgm) return;
    const pending = bgm.play();
    if (pending && typeof pending.then === "function") {
      pending.then(() => {
        playbackBlocked = false;
        paintSound();
      }).catch(() => {
        playbackBlocked = true;
        paintSound();
      });
    }
  };
  sound.addEventListener("click", (event) => {
    event.stopPropagation();
    if (audioWanted && playbackBlocked) {
      requestSound();
      return;
    }
    audioWanted = !audioWanted;
    if (!audioWanted) {
      bgm.pause();
      playbackBlocked = false;
    } else {
      requestSound();
    }
    paintSound();
  });

  canvas.addEventListener("pointerdown", (event) => {
    if (event.target !== canvas) return;
    canvas.setPointerCapture(event.pointerId);
    startX = event.clientX;
  });
  canvas.addEventListener("pointermove", (event) => {
    if (!canvas.hasPointerCapture(event.pointerId)) return;
    const box = layout();
    const seamX = box.seam.x * (canvas.getBoundingClientRect().width / Math.max(1, w));
    const toward = Math.abs(startX - seamX) - Math.abs(event.clientX - seamX);
    if (toward > 16) beginRead();
    if (toward < -16) endRead();
  });
  canvas.addEventListener("pointerup", (event) => {
    if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
  });
  canvas.addEventListener("pointercancel", (event) => {
    if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
  });
  window.addEventListener("keydown", (event) => {
    if (event.key === "ArrowLeft") {
      event.preventDefault();
      beginRead();
    } else if (event.key === "ArrowRight" || event.key === " ") {
      event.preventDefault();
      endRead();
    }
  });

  const drawGround = (seconds, box, shown) => {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#141b24");
    g.addColorStop(0.52, "#0c1117");
    g.addColorStop(1, "#07090d");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    const breath = 0.04 + Math.sin(seconds * 1.3) * 0.016 + shown * 0.02;
    const glow = ctx.createRadialGradient(box.seam.x, box.floorY - box.unit * 0.08, 8, box.seam.x, box.floorY, box.unit * 0.72);
    glow.addColorStop(0, `rgba(154,142,174,${breath})`);
    glow.addColorStop(0.45, "rgba(42,72,84,0.05)");
    glow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = "rgba(243,234,220,0.08)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(w * 0.08, box.floorY);
    ctx.lineTo(w * 0.92, box.floorY);
    ctx.stroke();
    const plate = ctx.createRadialGradient(box.seam.x, box.floorY, 6, box.seam.x, box.floorY, box.unit * 0.42);
    plate.addColorStop(0, "rgba(243,234,220,0.07)");
    plate.addColorStop(1, "rgba(243,234,220,0)");
    ctx.fillStyle = plate;
    ctx.beginPath();
    ctx.ellipse(box.seam.x, box.floorY + 3, box.unit * 0.34, box.unit * 0.045, 0, 0, TAU);
    ctx.fill();
  };

  const drawMotes = (seconds, box) => {
    for (let i = 0; i < 28; i += 1) {
      const drift = seconds * (6 + fract(i) * 14);
      const x = (fract(i * 2.1) * w * 0.72 + w * 0.14 + drift * 0.22) % w;
      const y = (fract(i * 5.7) * h * 0.5 + box.floorY * 0.22 - drift * 0.45) % h;
      const yy = y < 0 ? y + h : y;
      ctx.fillStyle = rgba(i % 5 === 0 ? VIOLET : (i % 3 === 0 ? CYAN : BONE), 0.03 + fract(i * 3.3) * 0.07);
      ctx.beginPath();
      ctx.arc(x, yy, 0.8 + fract(i * 9) * 1.3, 0, TAU);
      ctx.fill();
    }
  };

  const drawShadow = (box) => {
    const { shadow, floorY } = box;
    const midX = (shadow.rootX + shadow.tipX) / 2;
    const grd = ctx.createLinearGradient(shadow.rootX, floorY, shadow.tipX, floorY);
    grd.addColorStop(0, rgba(CYAN_DEEP, 0.92));
    grd.addColorStop(0.6, rgba(mix(CYAN_DEEP, CYAN, 0.4), 0.72));
    grd.addColorStop(1, rgba(CYAN_DEEP, 0.08));
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.ellipse(midX, shadow.cy, shadow.length / 2, shadow.ry, 0, 0, TAU);
    ctx.fill();
    return { x: midX, y: shadow.cy };
  };

  const drawRing = (box, seconds) => {
    const { ring } = box;
    const gap = 0.55;
    ctx.save();
    ctx.translate(ring.cx, ring.cy);
    ctx.scale(1, ring.ry / ring.rx);
    ctx.strokeStyle = rgba(GOLD, 0.9);
    ctx.lineWidth = Math.max(2.6, ring.rx * 0.08);
    ctx.beginPath();
    ctx.arc(0, 0, ring.rx, gap, TAU - gap);
    ctx.stroke();
    ctx.strokeStyle = rgba(BONE, 0.22);
    ctx.lineWidth = Math.max(1, ring.rx * 0.02);
    ctx.beginPath();
    ctx.arc(0, 0, ring.rx * 0.72, gap + 0.2, TAU - gap - 0.2);
    ctx.stroke();
    const glint = gap + ((seconds * 0.35) % 1) * (TAU - gap * 2);
    ctx.fillStyle = rgba(BONE, 0.86);
    ctx.beginPath();
    ctx.arc(Math.cos(glint) * ring.rx, Math.sin(glint) * ring.rx, ring.rx * 0.05, 0, TAU);
    ctx.fill();
    ctx.restore();
  };

  const drawSeam = (box, seconds) => {
    const { seam, floorY } = box;
    const left = seam.x - seam.width / 2;
    const right = seam.x + seam.width / 2;
    const lip = seam.top;
    const foot = lip + seam.depth;
    ctx.fillStyle = "#05070a";
    ctx.beginPath();
    ctx.moveTo(left, lip);
    ctx.lineTo(right, lip);
    ctx.lineTo(seam.x + seam.width * 0.28, foot);
    ctx.lineTo(seam.x - seam.width * 0.28, foot);
    ctx.closePath();
    ctx.fill();
    const edge = ctx.createLinearGradient(left, lip, right, lip);
    edge.addColorStop(0, rgba(CYAN, 0.05));
    edge.addColorStop(0.16, rgba(CYAN, 0.55));
    edge.addColorStop(0.5, "rgba(8,10,14,0.2)");
    edge.addColorStop(0.84, rgba(CYAN, 0.55));
    edge.addColorStop(1, rgba(CYAN, 0.05));
    ctx.strokeStyle = edge;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(left, lip);
    ctx.lineTo(seam.x - seam.width * 0.28, foot);
    ctx.moveTo(right, lip);
    ctx.lineTo(seam.x + seam.width * 0.28, foot);
    ctx.stroke();
    const filament = (seconds * 0.22) % 1;
    const fy = lip + 6 + filament * (seam.depth - 14);
    ctx.strokeStyle = rgba(CYAN, 0.28 + Math.sin(seconds * 2.1) * 0.08);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(seam.x - seam.width * 0.12, fy);
    ctx.lineTo(seam.x + seam.width * 0.12, fy + 1.5);
    ctx.stroke();
    ctx.strokeStyle = "rgba(243,234,220,0.16)";
    ctx.beginPath();
    ctx.moveTo(left - box.unit * 0.02, floorY);
    ctx.lineTo(left, lip);
    ctx.moveTo(right + box.unit * 0.02, floorY);
    ctx.lineTo(right, lip);
    ctx.stroke();
    return {
      voidSample: { x: seam.x, y: lip + seam.depth * 0.46 },
      lipSample: { x: seam.x, y: lip - 2 }
    };
  };

  const archPoint = (cx, cy, rx, ry, ang, phase) => {
    const wobble = 1 + Math.sin(ang * 2 + phase) * 0.018;
    return {
      x: cx + Math.cos(ang) * rx * wobble,
      y: cy + Math.sin(ang) * ry * wobble
    };
  };

  const drawContour = (box, seconds) => {
    const { contour } = box;
    const phase = seconds * 0.7;
    ctx.strokeStyle = rgba(VIOLET, 0.78);
    ctx.lineWidth = contour.stroke;
    ctx.lineCap = "round";
    ctx.beginPath();
    const steps = 48;
    let bead = null;
    const beadT = (seconds * 0.18) % 1;
    for (let i = 0; i <= steps; i += 1) {
      const ang = Math.PI + (i / steps) * Math.PI;
      const p = archPoint(contour.cx, contour.cy, contour.rx, contour.ry, ang, phase);
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
      if (!bead && i / steps >= beadT) bead = p;
    }
    ctx.stroke();
    if (bead) {
      ctx.fillStyle = rgba(BONE, 0.7);
      ctx.beginPath();
      ctx.arc(bead.x, bead.y, Math.max(1.8, contour.stroke * 0.38), 0, TAU);
      ctx.fill();
    }
    return { x: contour.cx, y: contour.cy - contour.ry * 0.72 };
  };

  const drawMark = (x, floorY, lean, unit, side) => {
    ctx.save();
    ctx.translate(x, floorY);
    ctx.rotate(lean);
    const hgt = unit * 0.085;
    ctx.strokeStyle = rgba(BONE, 0.88);
    ctx.lineWidth = Math.max(2.2, unit * 0.006);
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(0, 2);
    ctx.lineTo(0, -hgt);
    ctx.stroke();
    ctx.fillStyle = rgba(BONE, 0.92);
    ctx.beginPath();
    ctx.ellipse(0, -hgt, unit * 0.012, unit * 0.007, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = rgba(GOLD, 0.55);
    ctx.beginPath();
    ctx.arc(side * unit * 0.004, -hgt * 0.42, Math.max(1.2, unit * 0.003), 0, TAU);
    ctx.fill();
    ctx.restore();
    return { x, y: floorY - hgt * 0.5 };
  };

  const drawStitch = (box, shown, seconds) => {
    const y = box.floorY - box.unit * (0.045 + shown * 0.055);
    const half = box.seam.width * 0.72;
    const alpha = 0.08 + shown * 0.62;
    ctx.save();
    ctx.strokeStyle = rgba(BONE, alpha);
    ctx.lineWidth = Math.max(1.2, box.unit * 0.003);
    ctx.setLineDash([box.unit * 0.012, box.unit * 0.01]);
    ctx.lineDashOffset = -seconds * 10;
    ctx.beginPath();
    ctx.moveTo(box.seam.x - half, y);
    ctx.lineTo(box.seam.x + half, y);
    ctx.stroke();
    ctx.setLineDash([]);
    if (shown > 0.08) {
      ctx.strokeStyle = rgba(VIOLET, shown * 0.45);
      ctx.beginPath();
      ctx.moveTo(box.seam.x - half * 0.7, y - box.unit * 0.03 * shown);
      ctx.lineTo(box.seam.x + half * 0.7, y - box.unit * 0.03 * shown);
      ctx.stroke();
    }
    ctx.restore();
    return { x: box.seam.x, y };
  };

  const drawCaption = () => {
    if (!paintCaption) return;
    const left = Math.max(28, w * 0.04);
    const bottom = h - Math.max(28, h * 0.05);
    ctx.fillStyle = "#efe8d8";
    ctx.font = `${Math.max(22, w * 0.026)}px Iowan Old Style, Palatino, Songti SC, serif`;
    ctx.fillText("记号不是已经闭合的缝", left, bottom - Math.max(48, h * 0.08));
    ctx.fillStyle = "#e6cd9a";
    ctx.font = `${Math.max(15, w * 0.015)}px Iowan Old Style, Palatino, serif`;
    ctx.fillText("The Marks Are Not a Closed Seam", left, bottom - Math.max(24, h * 0.04));
    ctx.fillStyle = "#b7b0a2";
    ctx.font = `${Math.max(12, w * 0.011)}px Iowan Old Style, Palatino, Songti SC, serif`;
    ctx.fillText("记号靠近。针脚停在空中。缝没有合上。", left, bottom);
  };

  const publish = (box, shown, seamDraw, stitchDraw, leftMark, rightMark) => {
    const approachPx = Math.round(shown * box.approachMax * 10) / 10;
    const clearancePx = Math.round((box.restClear - approachPx) * 10) / 10;
    const markGapPx = Math.round((box.seamWidthPx + clearancePx * 2) * 10) / 10;
    window.__ghState = {
      seamOpen,
      seamClosed,
      marksJoined,
      stitchLanded,
      contourSettled,
      contourRise,
      shadowCount,
      shadowOwnedByRing,
      attempts,
      released,
      reading: shown,
      holding,
      seamWidthPx: box.seamWidthPx,
      approachPx,
      clearancePx,
      markGapPx,
      shadowLengthPx: box.shadowLengthPx,
      voidSample: seamDraw.voidSample,
      lipSample: seamDraw.lipSample,
      stitchSample: stitchDraw,
      leftMark,
      rightMark
    };
  };

  const draw = (now) => {
    const seconds = window.__hold
      ? (window.__captureSeconds ?? STILL)
      : (slow ? STILL : (now - t0) / 1000);
    const desired = holding ? 1 : cyclePull(seconds);
    if (window.__hold || frozen) pull = desired;
    else pull += (desired - pull) * (holding ? 0.18 : 0.08);
    const shown = clamp(pull, 0, 1);
    const box = layout();
    const approach = shown * box.approachMax;
    drawGround(seconds, box, shown);
    drawMotes(seconds, box);
    drawShadow(box);
    drawRing(box, seconds);
    const seamDraw = drawSeam(box, seconds);
    const contourDraw = drawContour(box, seconds);
    const lean = shown * 0.22;
    const leftX = box.seam.x - box.seam.width / 2 - box.restClear + approach;
    const rightX = box.seam.x + box.seam.width / 2 + box.restClear - approach;
    const leftMark = drawMark(leftX, box.floorY, lean, box.unit, -1);
    const rightMark = drawMark(rightX, box.floorY, -lean, box.unit, 1);
    const stitchDraw = drawStitch(box, shown, seconds);
    drawCaption();
    publish(box, shown, seamDraw, stitchDraw, leftMark, rightMark);
    window.__contourSample = contourDraw;
    window.__artReady = true;
    if (!frozen && !window.__hold) rafId = requestAnimationFrame(draw);
  };

  let rafId = 0;
  window.__renderAt = (seconds) => {
    window.__hold = true;
    window.__captureSeconds = seconds;
    if (rafId) cancelAnimationFrame(rafId);
    draw(performance.now());
  };
  window.__ghRead = beginRead;
  window.__ghWithdraw = endRead;

  resize();
  window.addEventListener("resize", () => {
    resize();
    if (frozen || capture || window.__hold) draw(performance.now());
  });
  if (frozen) {
    window.__hold = true;
    window.__captureSeconds = STILL;
    draw(performance.now());
  } else {
    rafId = requestAnimationFrame(draw);
  }
  requestSound();
  document.addEventListener("pointerdown", () => {
    if (audioWanted) requestSound();
  }, { once: true });
})();
</script>
</body>
</html>
