  .caption .en{margin:.18rem 0 .4rem;color:var(--gold);font-size:clamp(.92rem,1.45vw,1.2rem);letter-spacing:.04em}
  .caption p{margin:0;color:var(--muted);font-size:clamp(.74rem,1.15vw,.98rem);line-height:1.5;letter-spacing:.04em}
  .hint{position:fixed;right:clamp(18px,4vw,58px);top:clamp(18px,4vw,48px);color:#c9c2b4;font:11px/1.55 ui-monospace,SFMono-Regular,monospace;letter-spacing:.12em;text-align:right;pointer-events:none;opacity:.78}
  #sound{position:fixed;right:clamp(18px,4vw,58px);bottom:clamp(16px,3.2vw,36px);height:44px;min-width:44px;min-height:44px;padding:0 14px;border:1px solid rgba(230,205,154,.62);border-radius:999px;background:rgba(11,15,21,.42);color:var(--gold);font:11px/1 ui-monospace,SFMono-Regular,monospace;letter-spacing:.12em;cursor:pointer}
  #sound:hover,#sound:focus-visible{background:rgba(230,205,154,.16);outline:1px solid #f4dfa9;outline-offset:3px}
  html.visual .caption,html.visual .hint,html.visual #sound,
  html.embed .caption,html.embed .hint,html.embed #sound,
  html.shot .caption,html.shot .hint,html.shot #sound{display:none}
</style>
</head>
<body>
<canvas id="field" aria-label="A bone bead stays outside an open ring while a wax misreading tries to look like an accepted seal."></canvas>
<div class="caption">
  <h1>珠不是印</h1>
  <p class="en" lang="en">The Bead Is Not a Seal</p>
  <p>蜡色浮起。缝还开着。珠仍在唇外。</p>
  <p lang="en">The wax rises. The seam stays open. The bead remains outside.</p>
</div>
<div class="hint">DRAG IN / DOWN — misread<br>UP / SPACE — withdraw</div>
<button id="sound" type="button" aria-pressed="true">SOUND ON</button>
<audio id="bgm" loop autoplay preload="auto"><source src="2026-10-23-the-bead-is-not-a-seal-bgm.mp3" type="audio/mpeg"></audio>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const visual = params.get("preview") === "visual";
  const frozen = params.get("still") === "1";
  const capture = params.get("capture") === "1" || frozen;
  const paintCaption = !visual && (params.get("paint") === "caption" || capture || frozen);
  const canvas = document.querySelector("#field");
  const ctx = canvas.getContext("2d", { alpha: false });
  const bgm = document.querySelector("#bgm");
  const sound = document.querySelector("#sound");
  const slow = window.matchMedia("(prefers-reduced-motion: reduce)").matches && !capture && !frozen;

  const BONE = [243, 234, 220];
  const GOLD = [230, 205, 154];
  const WAX = [214, 164, 112];
  const WAX_DEEP = [138, 86, 54];
  const VIOLET = [154, 142, 174];
  const TAU = Math.PI * 2;
  const STILL = 1.6;
  const CYCLE = 4;
  const GAP = 0.46;

  let w = 0, h = 0, dpr = 1, t0 = performance.now();
  let audioWanted = true;
  let playbackBlocked = false;
  let holding = false;
  let attempts = 0;
  let released = 0;
  let pull = 0;
  let anchorDist = 0;
  const accepted = 0;
  const sealed = 0;
  const crossed = 0;
  const seamOpen = 1;

  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const fract = (n) => {
    const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  };

  const resize = () => {
    const rect = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = Math.max(1, rect.width);
    h = Math.max(1, rect.height);
    canvas.width = Math.max(1, Math.round(w * dpr));
    canvas.height = Math.max(1, Math.round(h * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };

  const layout = () => {
    const cx = w * 0.43;
    const cy = h * 0.54;
    const lipR = Math.min(w, h) * 0.2;
    const beadR = lipR * 0.28;
    const beadDist = lipR + beadR + Math.max(14, lipR * 0.1);
    return {
      cx,
      cy,
      lipR,
      beadR,
      beadDist,
      seamGapPx: 2 * lipR * Math.sin(GAP)
    };
  };

  const cyclePull = (seconds) => {
    const p = ((seconds % CYCLE) + CYCLE) % CYCLE / CYCLE;
    if (p < 0.28) return p / 0.28;
    if (p < 0.62) return 1;
    return clamp(1 - (p - 0.62) / 0.38, 0, 1);
  };

  const refreshHeldFrame = () => {
    if (window.__hold && typeof window.__renderAt === "function") {
      window.__renderAt(window.__captureSeconds ?? STILL);
    }
  };
  const beginRead = () => {
    if (!holding) attempts += 1;
    holding = true;
    refreshHeldFrame();
  };
  const endRead = () => {
    if (!holding) return;
    holding = false;
    released += 1;
    refreshHeldFrame();
  };

  const paintSound = () => {
    if (!audioWanted) {
      sound.textContent = "SOUND OFF";
      sound.setAttribute("aria-pressed", "false");
      return;
    }
    sound.setAttribute("aria-pressed", "true");
    sound.textContent = playbackBlocked ? "SOUND" : "SOUND ON";
  };
  const requestSound = () => {
    if (!audioWanted || !bgm) return;
    const pending = bgm.play();
    if (pending && typeof pending.then === "function") {
      pending.then(() => {
        playbackBlocked = false;
        paintSound();
      }).catch(() => {
        playbackBlocked = true;
        paintSound();
      });
    }
  };
  sound.addEventListener("click", () => {
    if (audioWanted && playbackBlocked) {
      requestSound();
      return;
    }
    audioWanted = !audioWanted;
    if (!audioWanted) {
      bgm.pause();
      playbackBlocked = false;
    } else {
      requestSound();
    }
    paintSound();
  });

  const pointerDistance = (event, box) => {
    const rect = canvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    return Math.hypot(x - box.cx, y - box.cy);
  };
  canvas.addEventListener("pointerdown", (event) => {
    canvas.setPointerCapture(event.pointerId);
    anchorDist = pointerDistance(event, layout());
  });
  canvas.addEventListener("pointermove", (event) => {
    if (!canvas.hasPointerCapture(event.pointerId)) return;
    const dist = pointerDistance(event, layout());
    if (anchorDist - dist > 12) beginRead();
    if (dist - anchorDist > 12) endRead();
  });
  const releasePointer = (event) => {
    if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
    endRead();
  };
  canvas.addEventListener("pointerup", releasePointer);
  canvas.addEventListener("pointercancel", releasePointer);
  window.addEventListener("keydown", (event) => {
    if (event.target === sound || event.repeat) return;
    if (event.key === "ArrowDown") {
      event.preventDefault();
      beginRead();
    } else if (event.key === "ArrowUp" || event.key === " ") {
      event.preventDefault();
      endRead();
    }
  });

  const drawGround = (seconds) => {
    ctx.fillStyle = "#0b0f14";
    ctx.fillRect(0, 0, w, h);
    const vx = w * (0.46 + 0.02 * Math.sin(seconds * 0.31));
    const vy = h * (0.38 + 0.02 * Math.cos(seconds * 0.27));
    const glow = ctx.createRadialGradient(vx, vy, h * 0.02, w * 0.48, h * 0.52, w * 0.62);
    glow.addColorStop(0, "rgba(58,42,34,0.28)");
    glow.addColorStop(0.42, "rgba(18,22,28,0.16)");
    glow.addColorStop(1, "rgba(6,8,11,0.82)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = "rgba(230,205,154,0.04)";
    ctx.lineWidth = 1;
    for (let i = 1; i < 4; i += 1) {
      const x = w * (0.06 + i * 0.018);
      ctx.beginPath();
      ctx.moveTo(x, h * 0.1);
      ctx.lineTo(x, h * 0.9);
      ctx.stroke();
    }
  };

  const drawMotes = (seconds) => {
    for (let i = 0; i < 28; i += 1) {
      const px = fract(i + 3) * w;
      const py = (fract(i + 11) * h + seconds * (6 + fract(i) * 10)) % h;
      ctx.fillStyle = rgba(i % 4 === 0 ? WAX : BONE, 0.035 + fract(i + 5) * 0.04);
      ctx.beginPath();
      ctx.arc(px, py, 1 + fract(i + 2), 0, TAU);
      ctx.fill();
    }
  };

  const drawRing = (box, seconds) => {
    const { cx, cy, lipR } = box;
    ctx.strokeStyle = "rgba(230,205,154,0.22)";
    ctx.lineWidth = Math.max(10, lipR * 0.09);
    ctx.beginPath();
    ctx.arc(cx, cy, lipR, GAP, TAU - GAP);
    ctx.stroke();
    ctx.strokeStyle = rgba(GOLD, 0.92);
    ctx.lineWidth = Math.max(2, lipR * 0.018);
    ctx.beginPath();
    ctx.arc(cx, cy, lipR, GAP, TAU - GAP);
    ctx.stroke();

    const ticks = 42;
    for (let i = 0; i < ticks; i += 1) {
      const a = GAP + 0.08 + (i / ticks) * (TAU - GAP * 2 - 0.16);
      const pulse = 0.16 + 0.1 * Math.sin(seconds * 1.6 + i * 0.45);
      const inner = lipR * 0.72;
      const outer = lipR * 0.9;
      ctx.strokeStyle = rgba(VIOLET, pulse);
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner);
      ctx.lineTo(cx + Math.cos(a) * outer, cy + Math.sin(a) * outer);
      ctx.stroke();
    }

    const sparkT = (seconds * 0.42) % 1;
    const sparkA = GAP + sparkT * (TAU - GAP * 2);
    const fade = sparkT > 0.86 ? (1 - sparkT) / 0.14 : 1;
    ctx.fillStyle = rgba(BONE, 0.9 * fade);
    ctx.beginPath();
    ctx.arc(cx + Math.cos(sparkA) * lipR, cy + Math.sin(sparkA) * lipR, Math.max(2.4, lipR * 0.028), 0, TAU);
    ctx.fill();

    for (const edge of [-1, 1]) {
      const a = edge * GAP;
      ctx.strokeStyle = rgba(GOLD, 0.95);
      ctx.lineWidth = Math.max(3, lipR * 0.028);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * (lipR - lipR * 0.08), cy + Math.sin(a) * (lipR - lipR * 0.08));
      ctx.lineTo(cx + Math.cos(a) * (lipR + lipR * 0.08), cy + Math.sin(a) * (lipR + lipR * 0.08));
      ctx.stroke();
    }
  };

  const drawBead = (box, seconds) => {
    const { cx, cy, beadR, beadDist } = box;
    const breathe = 1 + Math.sin(seconds * 3.1) * 0.08;
    const r = beadR * breathe;
    const x = cx + beadDist;
    const y = cy;
    const bead = ctx.createRadialGradient(x - r * 0.28, y - r * 0.32, r * 0.08, x, y, r);
    bead.addColorStop(0, "rgba(255,250,242,0.98)");
    bead.addColorStop(0.42, rgba(BONE, 0.94));
    bead.addColorStop(1, "rgba(176,154,122,0.96)");
    ctx.fillStyle = bead;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = rgba(GOLD, 0.8);
    ctx.lineWidth = Math.max(1.5, r * 0.06);
    ctx.beginPath();
    ctx.arc(x, y, r * 0.62, 0.5, Math.PI * 1.55);
    ctx.stroke();
    return {
      x,
      y,
      r,
      sample: { x: x - r * 0.15, y: y - r * 0.15 }
    };
  };

  const drawMisreading = (box, shown, seconds) => {
    const { cx, cy, lipR } = box;
    const stampR = lipR * 0.56;
    const minGap = lipR * 0.2;
    const lift = lipR * 0.92 * (1 - shown);
    const wobble = Math.sin(seconds * 2.4) * lipR * 0.015 * shown;
    const stampX = cx - lipR * 0.04 + wobble;
    const stampY = cy - lipR - stampR - minGap - lift;
    const disc = ctx.createRadialGradient(stampX - stampR * 0.22, stampY - stampR * 0.24, stampR * 0.08, stampX, stampY, stampR);
    disc.addColorStop(0, rgba(WAX, 0.08 + shown * 0.62));
    disc.addColorStop(0.68, rgba(WAX_DEEP, 0.05 + shown * 0.34));
    disc.addColorStop(1, rgba(WAX_DEEP, 0));
    ctx.fillStyle = disc;
    ctx.beginPath();
    ctx.arc(stampX, stampY, stampR * (0.72 + shown * 0.28), 0, TAU);
    ctx.fill();
    ctx.strokeStyle = rgba(WAX_DEEP, 0.2 + shown * 0.55);
    ctx.lineWidth = Math.max(2, stampR * 0.045);
    ctx.beginPath();
    ctx.arc(stampX, stampY, stampR * 0.46, 0.35, Math.PI * 1.62);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(stampX, stampY, stampR * 0.46, Math.PI * 1.9, TAU + 0.15);
    ctx.stroke();

    const reach = shown * (1 - 0.08 * Math.sin(seconds * 5.5));
    const stubTop = stampY + stampR * 0.72;
    const ringTop = cy - lipR;
    const stopY = stubTop + (ringTop - minGap * 0.65 - stubTop) * reach;
    ctx.strokeStyle = rgba(WAX, 0.15 + shown * 0.7);
    ctx.lineWidth = Math.max(2, lipR * 0.02);
    ctx.beginPath();
    ctx.moveTo(stampX, stubTop);
    ctx.lineTo(stampX, stopY);
    ctx.stroke();
    ctx.fillStyle = rgba(WAX, 0.3 + shown * 0.5);
    ctx.beginPath();
    ctx.arc(stampX, stopY, Math.max(2.2, lipR * 0.02), 0, TAU);
    ctx.fill();

    const drip = (seconds * 0.7) % 1;
    const dripY = stubTop + (stopY - stubTop) * drip;
    ctx.fillStyle = rgba(BONE, (1 - drip) * shown * 0.55);
    ctx.beginPath();
    ctx.arc(stampX + Math.sin(seconds * 3) * 3, dripY, 2.4 + (1 - drip) * 2.2, 0, TAU);
    ctx.fill();

    return {
      stamp: { x: stampX, y: stampY },
      stopY,
      ringTop
    };
  };

  const drawCaption = () => {
    if (!paintCaption) return;
    const left = Math.max(24, w * 0.04);
    const bottom = h - Math.max(22, h * 0.045);
    ctx.fillStyle = "#efe8d8";
    ctx.font = `${Math.max(18, w * 0.024)}px Iowan Old Style, Palatino, Songti SC, serif`;
    ctx.fillText("珠不是印", left, bottom - Math.max(42, h * 0.075));
    ctx.fillStyle = "#e6cd9a";
    ctx.font = `${Math.max(13, w * 0.014)}px Iowan Old Style, Palatino, serif`;
    ctx.fillText("The Bead Is Not a Seal", left, bottom - Math.max(22, h * 0.038));
    ctx.fillStyle = "#b7b0a2";
    ctx.font = `${Math.max(11, w * 0.011)}px Iowan Old Style, Palatino, Songti SC, serif`;
    ctx.fillText("蜡色浮起。缝还开着。珠仍在唇外。", left, bottom);
  };

  const publish = (box, shown, bead) => {
    const gapX = box.cx + box.lipR;
    const gapY = box.cy;
    const beadInside = bead.x - bead.r < box.cx + box.lipR ? 1 : 0;
    window.__ghState = {
      accepted,
      sealed,
      crossed,
      seamOpen,
      beadInside,
      attempts,
      released,
      reading: shown,
      seamGapPx: box.seamGapPx,
      lipR: box.lipR,
      holding,
      beadSample: bead.sample,
      interiorSample: { x: box.cx, y: box.cy },
      gapSample: { x: gapX, y: gapY },
      ringSample: { x: box.cx, y: box.cy - box.lipR }
    };
  };

  const draw = (now) => {
    const seconds = window.__hold
      ? (window.__captureSeconds ?? STILL)
      : (slow ? STILL : (now - t0) / 1000);
    const desired = window.__hold ? cyclePull(seconds) : (holding ? 1 : cyclePull(seconds));
    if (window.__hold || frozen) pull = desired;
    else pull += (desired - pull) * (holding ? 0.18 : 0.06);
    const shown = clamp(pull, 0, 1);
    const box = layout();
    drawGround(seconds);
    drawMotes(seconds);
    drawRing(box, seconds);
    const bead = drawBead(box, seconds);
    drawMisreading(box, shown, seconds);
    drawCaption();
    publish(box, shown, bead);
    window.__artReady = true;
    if (!frozen && !window.__hold) rafId = requestAnimationFrame(draw);
  };

  let rafId = 0;
  window.__renderAt = (seconds) => {
    window.__hold = true;
    window.__captureSeconds = seconds;
    if (rafId) cancelAnimationFrame(rafId);
    draw(performance.now());
  };
  window.__ghRead = beginRead;
  window.__ghWithdraw = endRead;

  resize();
  window.addEventListener("resize", () => {
    resize();
    if (frozen || capture || window.__hold) draw(performance.now());
  });
  if (frozen) {
    window.__hold = true;
    window.__captureSeconds = STILL;
    draw(performance.now());
  } else {
    rafId = requestAnimationFrame(draw);
  }
  requestSound();
  document.addEventListener("pointerdown", () => {
    if (audioWanted) requestSound();
  }, { once: true });
})();
</script>
</body>
</html>
